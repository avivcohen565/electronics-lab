theory:[
{t:'מבוא: מבנה מגבר השרת',h:R`
<p>מגבר שרת (Operational Amplifier) הוא רכיב עם <b>שתי כניסות, יציאה אחת ושני מתחי הזנה</b>. הסימונים בסיכום:</p>
<ul><li>\(V_{CC}\): מתח ההזנה החיובי (Supply voltage).</li>
<li>\(V_{EE}\): מתח ההזנה השלילי (בשרטוט \(-V_{EE}\)).</li>
<li>\(V_{in}^{+}\): הכניסה <b>הלא מהפכת</b> (noninverting), מסומנת +.</li>
<li>\(V_{in}^{-}\): הכניסה <b>המהפכת</b> (inverting), מסומנת −.</li>
<li>\(V_{out}\): מתח המוצא ביחס לאדמה.</li></ul>
<p>הקשר הבסיסי בין הכניסות למוצא: המגבר מגביר את <b>ההפרש</b> בין שתי הכניסות בהגבר החוג הפתוח \(A_{OL}\):</p>
\[V_{out}=A_{OL}\left(V_{in}^{+}-V_{in}^{-}\right)\]
<p>בשרטוט החיבורים המלא, שני ספקים (חיובי ושלילי) מחוברים בטור, ונקודת החיבור ביניהם היא <b>האדמה המשותפת</b> (Common node). ממנה נמדדים כל המתחים, כולל \(V_{out}\).</p>
`+co('key','🔑','שני ספקים, אדמה אחת','<p>בדרך כלל לא מציירים את ההזנות בכל מעגל, אבל הן תמיד שם: הן קובעות את גבולות המוצא, והאדמה שביניהן היא ה-0V שאליו מחברים את הכניסה הלא-מהפכת במעגלים רבים.</p>')},
{t:'המודל המעשי והמגבר האידיאלי',h:R`
<p><b>מאחורי הקלעים:</b> המודל המעשי לאות קטן הוא מעגל הגבר מוכר. בתוך המשולש יש:</p>
<ul><li>התנגדות כניסה \(R_{in}\) בין \(v_+\) ל-\(v_-\) (עליה נופל \(v_{in}=v_+-v_-\)),</li><li>מקור מתח תלוי \(G\cdot v_{in}\),</li><li>התנגדות מוצא \(R_{out}\) בטור למוצא.</li></ul>
<p><b>המגבר האידיאלי</b> מתקבל כשמניחים:</p>
\[R_{in}\to\infty,\qquad R_{out}=0\,\Omega,\qquad A_{OL}\to\infty\]
\[v_{out}=A_{OL}\left(v_+-v_-\right)=A_{OL}\cdot v_{in}\]
<p>כיוון שמקובל לחבר מתחי הזנה נגדיים, המוצא כלוא ביניהם:</p>
\[-V_{CC}\le v_{out}\le V_{CC}\]
`+co('why','💡','למה זה חשוב?','<p>אם \\(A_{OL}\\to\\infty\\) והמוצא סופי (בין \\(-V_{CC}\\) ל-\\(V_{CC}\\)), אז ההפרש \\(v_+-v_-=v_{out}/A_{OL}\\) חייב להיות אפסי. מכאן נולד כלל הזהב הראשון. ומ-\\(R_{in}\\to\\infty\\) נולד הכלל השני: אין זרם לכניסות.</p>')},
{t:'כללי הזהב',h:R`
<p>כשעוסקים במגבר אידיאלי (ואם לא נאמר אחרת, כל המגברים בשיעור אידיאליים) מניחים שלושה כללים:</p>
<ol><li><b>המתחים בשתי הכניסות שווים:</b> \(V_{in}^{+}=V_{in}^{-}\) ("קצר וירטואלי").</li>
<li><b>לא נכנסים זרמים לכניסות:</b> \(I_{in}^{+}=I_{in}^{-}=0\,\text{A}\).</li>
<li><b>לעולם לא כותבים משוואת זרמים (KCL) בצומת המוצא</b> של המגבר.</li></ol>
`+co('analogy','🎛️','אנלוגיה: שומר סף שמתקן בעצמו','<p>המגבר "מסתכל" על שתי הכניסות ומזיז את המוצא עד שהן שוות. הוא עושה את זה בלי למשוך זרם מהכניסות (כמו מד מתח אידיאלי), אבל מהמוצא הוא מסוגל לספק כל זרם שצריך מההזנות.</p>')+co('warn','⚠️','למה אסור KCL במוצא?','<p>המוצא מקבל זרם מהספקים דרך הדקי ההזנה, שבדרך כלל לא מצוירים. לכן זרם לא ידוע נכנס לצומת המוצא, ומשוואת צומת שם תהיה שגויה. כותבים KCL רק בצמתי הכניסה.</p>')+golab(9,'l9-gal','גלריית מעגלים עם זרם חי')},
{t:'מגבר בחיבור הופך מופע',h:R`
<p>האות נכנס דרך \(R_1\) לכניסה המהפכת, \(R_f\) מחבר את המוצא חזרה אליה, והכניסה + באדמה. לפי כלל 1: \(v_-=v_+=0\text{V}\). לפי כלל 2: כל הזרם דרך \(R_1\) ממשיך ל-\(R_f\):</p>
\[\frac{v_{in}}{R_1}=\frac{0-v_{out}}{R_f}\ \Rightarrow\ \boxed{\frac{v_{out}}{v_{in}}=-\frac{R_f}{R_1}}\]
<p><b>בדוגמה מהסיכום:</b> \(R_1=1\text{k}\Omega,\ R_f=3\text{k}\Omega\Rightarrow A=-3\). עבור \(v_{in}=4\text{V}\): \(v_{out}=-12\text{V}\). שימו לב להיפוך הסימן.</p>
`+co('key','🔑','כלל אצבע מהסיכום','<p>אם \\(v_{in}\\) מחובר (דרך נגד) לכניסה המהפכת, המעגל הוא הופך מופע.</p>')+R`
<p><b>גרסה עם רשת T במשוב:</b> במקום \(R_f\) יחיד יש \(R_2\) מהכניסה המהפכת לצומת \(V_A\), משם \(R_3\) לאדמה ו-\(R_4\) למוצא. בסיכום מניחים \(V_A=V_{out}\frac{R_3}{R_3+R_4}\), כותבים KCL בכניסה המהפכת ומקבלים:</p>
\[\frac{v_{out}}{v_{in}}=-\frac{R_2}{R_1}\left(1+\frac{R_4}{R_3}\right)\]
`+co('warn','⚠️','הערה על רשת ה-T','<p>המחלק \\(V_A=V_{out}R_3/(R_3+R_4)\\) מתעלם מהזרם \\(v_{in}/R_1\\) שנכנס לצומת \\(V_A\\) דרך \\(R_2\\). ניתוח מלא (KCL גם בצומת \\(V_A\\)) נותן איבר נוסף: \\(\\frac{v_{out}}{v_{in}}=-\\frac{R_2}{R_1}\\left(1+\\frac{R_4}{R_3}\\right)-\\frac{R_4}{R_1}\\). הנוסחה שבסיכום מדויקת כש-\\(R_2\\gg R_3\\parallel R_4\\). ראו תרגיל 2.</p>')},
{t:'מגבר לא-הופך מופע ומגבר חוצץ',h:R`
<p><b>לא-הופך מופע:</b> האות נכנס ישירות לכניסה +, ולכן \(v_-=v_{in}\). \(R_1\) מהכניסה המהפכת לאדמה, \(R_f\) מהמוצא אליה. KCL בכניסה המהפכת:</p>
\[\frac{v_{out}-v_{in}}{R_f}=\frac{v_{in}-0}{R_1}\ \Rightarrow\ \boxed{\frac{v_{out}}{v_{in}}=1+\frac{R_f}{R_1}}\]
<p>ההגבר חיובי ותמיד לפחות 1.</p>
<p><b>חוצץ (buffer):</b> המוצא מחובר ישירות לכניסה המהפכת, והאות ל-+. לפי כלל 1:</p>
\[v_{out}=v_{in}\ \Rightarrow\ A=1\]
`+co('why','💡','בשביל מה הגבר 1?','<p>החוצץ לא מגביר מתח, אבל הוא לא מושך זרם מהמקור (כלל 2) ומספק זרם מהמוצא. כך אפשר לחבר עומס בלי "להעמיס" את המקור. זה גם מקרה פרטי של הלא-הופך: \\(R_f=0\\), \\(R_1\\to\\infty\\).</p>')},
{t:'מגבר הפרש ומגבר מסכם',h:R`
<p><b>מגבר הפרש (Differential Amplifier):</b> \(v_1\) דרך \(R_1\) לכניסה המהפכת עם משוב \(R_3\); \(v_2\) דרך מחלק \(R_2,R_4\) לכניסה +. שלבי הפתרון בסיכום:</p>
<ol><li>מחלק מתח בכניסה +: \(V_+=v_2\frac{R_4}{R_4+R_2}\).</li>
<li>KCL בכניסה המהפכת: \(\frac{v_{out}-V_-}{R_3}=\frac{V_--v_1}{R_1}\), ומכאן \(V_-=\frac{R_1}{R_1+R_3}v_{out}+\frac{R_3}{R_1+R_3}v_1\).</li>
<li>משווים \(V_-=V_+\) ומבודדים:</li></ol>
\[\boxed{v_{out}=\left(1+\frac{R_3}{R_1}\right)\left(\frac{R_4}{R_2+R_4}v_2-\frac{R_3}{R_1+R_3}v_1\right)}\]
<p>(פתיחת הסוגריים נותנת \(v_{out}=\left(1+\frac{R_3}{R_1}\right)\frac{R_4}{R_2+R_4}v_2-\frac{R_3}{R_1}v_1\).)</p>
<p><b>מגבר מסכם:</b> \(N\) כניסות \(v_1\dots v_N\), כל אחת דרך \(R_k\) לכניסה המהפכת (שנמצאת ב-0V), ומשוב \(R_f\). KCL בכניסה המהפכת:</p>
\[\frac{v_1}{R_1}+\frac{v_2}{R_2}+\dots+\frac{v_N}{R_N}+\frac{v_{out}}{R_f}=0\ \Rightarrow\ \boxed{v_{out}=-R_f\sum_{k=1}^{N}\frac{v_k}{R_k}}\]
`+co('analogy','🧮','אנלוגיה: קופה רושמת','<p>הצומת המהפכת נמצאת תמיד ב-0V, ולכן כל כניסה "מפקידה" זרם \\(v_k/R_k\\) בלי להפריע לאחרות. \\(R_f\\) צריך להחזיר את סך כל ההפקדות, והמוצא מתכוונן בדיוק לזה.</p>')},
{t:'מגבר מכשור (IA) ושינוי מתח CM במוצא',h:R`
<p>מעגל עם <b>שלושה מגברי שרת</b>. בשלב הראשון \(v_1\) ו-\(v_2\) נכנסים ישירות לכניסות + של שני מגברים, ובין מוצאיהם יש שרשרת \(R_1-R_3-R_1\) (בשרטוט השני בסיכום: \(R_3-R_G-R_3\)).</p>
<ol><li>כלל 1: מתחי הכניסות המהפכות הם \(v_1\) ו-\(v_2\), לכן על נגד האמצע נופל \(V_3=v_1-v_2\).</li>
<li>כלל 2: אין זרם לכניסות, לכן אותו זרם \(I=\frac{v_1-v_2}{R_3}\) עובר בכל השרשרת.</li>
<li>\(V_{o1}-V_{o2}=I(R_1+R_3+R_1)\).</li></ol>
\[\boxed{A_{id}=\frac{V_{o1}-V_{o2}}{v_1-v_2}=\frac{2R_1}{R_3}+1}\]
<p><b>השלב השני (מגבר הפרש, \(OA_3\)):</b> \(V_{o1}\) דרך \(R_1\) לכניסה המהפכת עם משוב \(R_2\), ו-\(V_{o2}\) דרך \(R_1\) לכניסה + עם \(R_2\) אל \(V_{REF}\):</p>
\[V_3^{+}=\frac{R_2}{R_1+R_2}\left(V_{o2}-V_{REF}\right)+V_{REF}\]
<p>עם \(V_{REF}=0\) ו-KCL בכניסה המהפכת: \(v_O=\frac{R_2}{R_1}\left(V_{o2}-V_{o1}\right)\). הגבר ה-single-ended מוגדר \(A_{d,single-ended}=\frac{v_O}{v_1-v_2}\).</p>
\[v_O=\frac{R_2}{R_1}\left(V_{o2}-V_{o1}\right)=-\frac{R_2}{R_1}\left(\frac{2R_3}{R_G}+1\right)\left(v_1-v_2\right)\]
`+co('warn','⚠️','סימן בנוסחה הממוסגרת','<p>בסיכום הנוסחה הממוסגרת כתובה \\(v_O=\\frac{R_2}{R_1}\\left(\\frac{2R_3}{R_G}+1\\right)(v_1-v_2)\\), בלי מינוס. אבל מהשורה שלפניה, \\(v_O=\\frac{R_2}{R_1}(V_{o2}-V_{o1})\\), ומ-\\(V_{o1}-V_{o2}=(v_1-v_2)(\\dots)\\), יוצא סימן מינוס (או לחלופין \\((v_2-v_1)\\)). הגודל זהה.</p>')+co('key','🔑','\\(V_{REF}\\): הזזת מתח ה-CM במוצא','<p>אם \\(V_{REF}\\ne0\\), מתווסף ל-\\(V_3^{+}\\) האיבר \\(\\frac{R_1}{R_1+R_2}V_{REF}\\), ובמוצא הוא מופיע כ-\\(+V_{REF}\\): \\(v_O=\\frac{R_2}{R_1}(V_{o2}-V_{o1})+V_{REF}\\). כך \\(V_{REF}\\) (בסיכום: מחלק 24k-100k-24k בין ±15V דרך חוצץ \\(OA_4\\)) נותן למוצא BIAS.</p>')+golab(9,'l9-ia','מעבדה: מגבר מכשור')},
{t:'אינטגרטור וגוזר',h:R`
<p><b>אינטגרטור אידיאלי:</b> קבל \(C\) במשוב ו-\(R\) בכניסה. הכניסה המהפכת ב-0V, ולכן \(v_C=v_{out}\). KCL:</p>
\[i_C(t)=\frac{0-v_{in}(t)}{R},\qquad i_C(t)=C\frac{d}{dt}v_C(t)=C\frac{d}{dt}v_{out}(t)\]
\[\boxed{v_{out}(t)=-\frac{1}{RC}\int_0^t v_{in}(\tau)\,d\tau+v_C(0)}\]
`+co('key','🔑','מהסיכום','<p>קבל ברשת המשוב = אינטגרטור.</p>')+R`
<p><b>אינטגרטור מעשי:</b> מוסיפים \(R_f\) במקביל ל-\(C\). נוח לעבור לתחום התדר (פאזורים):</p>
\[Z_f=Z_C\parallel R_f=\frac{R_f}{1+j\omega R_fC},\qquad \boxed{A_v=\frac{v_{out}}{v_{in}}=-\frac{Z_f}{R}=-\frac{R_f}{R\left(1+j\omega R_fC\right)}}\]
<p>מהנוסחה: ב-\(\omega=0\) ההגבר סופי, \(-R_f/R\) (באידיאלי הוא אינסופי). בתדרים גבוהים \(\omega R_fC\gg1\) ומקבלים \(A_v\approx-\frac{1}{j\omega RC}\), כלומר שוב אינטגרציה.</p>
<p><b>גוזר (Differentiator):</b> מחליפים תפקידים: \(C\) בכניסה ו-\(R\) במשוב. \(v_C=v_{in}\), ו-KCL:</p>
\[\frac{v_{out}-0}{R}=-C\frac{d}{dt}v_{in}\ \Rightarrow\ \boxed{v_{out}(t)=-RC\,\dot v_{in}(t)}\]
`+co('analogy','🪣','אנלוגיה: דלי מים','<p>באינטגרטור הקבל הוא דלי שמתמלא בזרם הקבוע \\(v_{in}/R\\), ומפלס המים (המתח) עולה בהתמדה כל עוד יש זרם. בגוזר הזרם תלוי רק בקצב השינוי של הכניסה: כניסה קבועה, אפס זרם, אפס מוצא.</p>')},
{t:'מעגל לוגריתמי ואנטי-לוגריתמי',h:R`
<p>מכניסים טרנזיסטור BJT למעגל, ומנצלים את הקשר המעריכי שלו: \(I_C=I_S\,e^{V_{BE}/V_T}\).</p>
<div class="cols2"><div>
<p><b>לוגריתמי:</b> \(R\) בכניסה, הטרנזיסטור במשוב (קולט בכניסה המהפכת, פולט במוצא, בסיס באדמה).</p>
<ul><li>\(v_{out}=-V_{BE}\)</li><li>\(I_C=I_E=I_S\,e^{V_{BE}/V_T}\)</li><li>\(I_C=v_{in}/R\)</li></ul>
<p>מציבים: \(\frac{v_{in}}{R}=I_S\,e^{-v_{out}/V_T}\), ומוציאים \(\ln\):</p>
\[\boxed{v_{out}(t)=-V_T\ln\!\left(\frac{v_{in}}{I_SR}\right)}\]
</div><div>
<p><b>אנטי-לוגריתמי:</b> הטרנזיסטור בכניסה (פולט ב-\(v_{in}\), קולט בכניסה המהפכת), ו-\(R\) במשוב.</p>
<ul><li>\(v_{in}=V_{BE}\)</li><li>\(I_C=I_S\,e^{V_{BE}/V_T}\)</li><li>\(I_C=v_{out}/R\)</li></ul>
\[\boxed{v_{out}(t)=I_SR\,e^{v_{in}/V_T}}\]
</div></div>
`+co('warn','⚠️','שימו לב לכיווני המתחים','<p>בסיכום ליד האנטי-לוגריתמי מופיעה ההערה "לבדוק כיווני מתחים": הסימנים של \\(V_{BE}\\) ושל הזרם תלויים באיך הטרנזיסטור מחובר. בלוגריתמי, הארגומנט של \\(\\ln\\) חייב להיות חיובי, כלומר המעגל עובד רק לקוטביות אחת של \\(v_{in}\\).</p>')+golab(9,'l9-log','מעבדה: לוג ואנטי-לוג')},
{t:'מעגלים מיישרי גל עם מגברי שרת',h:R`
<p>מיישרים מיועדים לאותות מחזוריים. נניח \(v_{in}(t)\) מחזורי במחזור \(T\) עם מתח היסט \(V_{BIAS}=V_{AVG}\). בחלק מהמחזור \(v_{in}>V_{BIAS}\) ובחלק \(v_{in}\lt V_{BIAS}\). בכל חלק דיודות אחרות חוסמות, לכן, כמו במיישרים ובמעגלי קטימה:</p>
<ol><li>מחלקים את הניתוח לפי חלקי האות.</li><li>לכל חלק מציירים מעגל שקול ומוצאים \(v_{out}=f(v_{in})\).</li><li>משרטטים את אופיין המעבר (VTC) ועונים על שאלות: רוויית המגבר, תחומי כניסה/מוצא.</li></ol>
<p><b>מיישר חצי גל מדויק:</b> \(R_1\) בכניסה המהפכת, \(D_1\) מהכניסה המהפכת למוצא המגבר, \(D_2\) ממוצא המגבר אל \(V_o\), \(R_2\) מהכניסה המהפכת אל \(V_o\) ו-\(R_L\) עומס. בסיכום \(V_D=0.7\text{V}\) והכניסה סינוס. לפי השיטה (ניתוח מלא בתרגיל 4):</p>
\[V_o=\begin{cases}0, & v_{in}>0\\ -\dfrac{R_2}{R_1}v_{in}, & v_{in}\lt 0\end{cases}\]
<p>ה-0.7V של הדיודה לא מופיע ב-\(V_o\): המגבר "מסתיר" אותו במוצא שלו. לכן "מדויק".</p>
<p><b>מיישר גל שלם מדויק:</b> שלב ראשון \(A_1\) הוא מיישר חצי גל הופך (\(R\), \(R\), \(D_1\), \(D_2\)), והשלב השני \(A_2\) הוא מסכם: מקבל את מוצא השלב הראשון דרך \(R_1\) ואת \(v_{in}\) ישירות דרך \(2R_1\), עם משוב \(R_2\). באותה שיטה:</p>
<ul><li>\(v_{in}>0\): \(D_1\) מוליכה, מוצא השלב הראשון \(-v_{in}\), ולכן \(V_o=-R_2\left(\frac{v_{in}}{2R_1}-\frac{v_{in}}{R_1}\right)=\frac{R_2}{2R_1}v_{in}\).</li>
<li>\(v_{in}\lt 0\): \(D_2\) מוליכה, מוצא השלב הראשון 0, ולכן \(V_o=-\frac{R_2}{2R_1}v_{in}\).</li></ul>
\[V_o=\frac{R_2}{2R_1}\left|v_{in}\right|\]
`+co('analogy','🚪','אנלוגיה: שוער עם מנוף','<p>דיודה רגילה היא דלת כבדה שצריך 0.7V כדי לפתוח. כאן המגבר, עם הגבר עצום, דוחף את הדלת בשבילך: מספיק הפרש מיקרוסקופי בכניסות כדי שהמוצא יזנק ב-0.7V ויפתח אותה.</p>')+golab(9,'l9-rect','מעבדה: מיישר מדויק')}
],

const LET='אבגדהו';
function quiz2(root,n,qs,key,opt){
  opt=opt||{};const box=document.createElement('div');box.className='quiz';root.appendChild(box);
  const all=store.get('ans',{});const state=all[key]||{};
  const sc=document.createElement('div');sc.className='score';
  function save(){all[key]=state;store.set('ans',all);refreshProgress();}
  function upd(){const d=Object.keys(state).length,c=Object.keys(state).filter(i=>qs[+i]&&state[i]===qs[+i].a).length;
    sc.innerHTML=pill(c+' / '+qs.length+' נכונות',c===qs.length?'ok':'mute')+'<span class="muted">'+(d<qs.length?'ענית על '+d+' מתוך '+qs.length:'סיימת את הבוחן של השיעור')+'</span><button type="button" class="btn">התחל מחדש</button>';
    sc.querySelector('button').onclick=()=>{Object.keys(state).forEach(k=>delete state[k]);save();box.innerHTML='';render();};}
  function explain(q,j){let h='<p>'+(j===q.a?'<b class="ok-t">נכון.</b> ':'<b class="bad-t">לא בדיוק.</b> ')+q.e+'</p>';
    if(q.x){h+='<ul class="why">'+q.o.map((o,k)=>k===q.a?'':'<li><b>'+LET[k]+'</b><span>'+(q.x[k]||'')+'</span></li>').join('')+'</ul>';}return h;}
  function render(){
    qs.forEach((q,i)=>{
      const d=document.createElement('div');d.className='q';
      d.innerHTML='<div class="qn"><span>שאלה '+(i+1)+'</span>'+(opt.tag?opt.tag(q,i):'')+'</div><p class="qt">'+q.q+'</p><div class="opts">'+q.o.map((o,j)=>'<button type="button" data-j="'+j+'"><span class="L">'+LET[j]+'</span><span>'+o+'</span></button>').join('')+'</div>';
      const btns=[...d.querySelectorAll('.opts button')];
      const reveal=j=>{btns.forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add('good');else if(k===j)b.classList.add('badc');});
        const ex=document.createElement('div');ex.className='ex';ex.innerHTML=explain(q,j);d.appendChild(ex);typeset(ex);};
      btns.forEach(b=>b.addEventListener('click',()=>{const j=+b.dataset.j;state[i]=j;reveal(j);upd();save();}));
      if(state[i]!==undefined)reveal(state[i]);
      box.appendChild(d);
    });
    box.appendChild(sc);upd();typeset(box);
  }
  render();
}

function q1Solve(vin){
  // ניסיון של ארבעת המצבים; דיודות אידיאליות. מחזיר את המצב העקבי היחיד.
  const R1=1e3,R2=1e3,R3=1e3,R4=2e3,V1=-3,V2=10;
  const combos=[[false,false],[true,false],[false,true],[true,true]];
  for(const [d1,d2] of combos){
    let VA,VO;
    if(d1){VA=V1;
      // KCL ב-O: (VO-VA)/R2 + VO/R3 + [d2:(VO-V2)/R4] = 0
      const g=1/R2+1/R3+(d2?1/R4:0);VO=(VA/R2+(d2?V2/R4:0))/g;}
    else{
      // KCL ב-A: (VA-vin)/R1+(VA-VO)/R2=0 ; KCL ב-O: (VO-VA)/R2+VO/R3+[d2:(VO-V2)/R4]=0
      const a11=1/R1+1/R2,a12=-1/R2,b1=vin/R1;
      const a21=-1/R2,a22=1/R2+1/R3+(d2?1/R4:0),b2=(d2?V2/R4:0);
      const det=a11*a22-a12*a21;VA=(b1*a22-a12*b2)/det;VO=(a11*b2-a21*b1)/det;}
    const I1=(vin-VA)/R1,I2=(VA-VO)/R2,I3=VO/R3,ID2=d2?(VO-V2)/R4:0;
    const ID1=d1?((VA-vin)/R1+(VA-VO)/R2):0; // זרם מהאנודה (−3V) אל הקתודה (A)
    const ok1=d1?ID1>=-1e-12:VA>=V1-1e-9, ok2=d2?ID2>=-1e-12:VO<=V2+1e-9;
    if(ok1&&ok2)return {d1,d2,VA,VO,I1,I2,I3,ID1,ID2,mode:d1?3:d2?2:1};
  }
  return null;
}

/* ---------------- Q2: משוב מקבילי-מקבילי במגבר רב-דרגתי ---------------- */
function q2Calc(p){
  const {Rs,Rf,Rc2,Rc3,rpi,rpi3,beta}=p;
  const Rc2L=par(Rc2,rpi3);            // Rc2 בטעינת כניסת T3
  const A2=beta*Rc2L/(2*rpi);           // מזוג ההפרש (בסיס T1 → קולט T2), חיובי
  const Rss=par(Rc3,Rf);                // R** : Rf מעמיס את המוצא
  const A3=-beta*Rss/rpi3;              // T3 (pnp, CE) שלילי
  const Rin=par(Rs,2*rpi);              // כפי שבפתרון הרשמי (בלי R*=Rf בכניסה)
  const RinX=par(par(Rs,Rf),2*rpi);     // גרסה מדויקת: כולל Rf
  const Az=Rin*A2*A3;                   // Vo/is [Ω]
  const bf=1/Rf;                        // |β_f| = if/Vo
  const D=1+Az*(-bf);                   // A_z<0 ו-β_f=−1/R_f<0 → המכפלה חיובית
  const Azf=Az/D,Rinf=Rin/D,Rof=Rss/D,Avf=Azf/Rs;
  const Rinf_noRs=1/(1/Rinf-1/Rs),RinfSrc=Rs+Rinf_noRs;
  return {Rc2L,A2,Rss,A3,Rin,RinX,Az,bf,D,Azf,Rinf,Rof,Avf,Rinf_noRs,RinfSrc};
}

/* ---------------- Q3: CS (NMOS depletion) → CE → CB ---------------- */
function q3Calc(p){
  const {ICS,RE,RC,beta,rpi,k,Vt,VDD,RD,RSS,RB}=p;
  const VOV=Math.sqrt(ICS/k);           // ID = k·(VGS−Vt)²  (k = ½kn'W/L)
  const VGS=Vt+VOV,VA=-VGS,VDS=VDD-RD*ICS-VA,gm=2*k*VOV;
  const Ri3=rpi/(beta+1);               // כניסת CB (Q2) מהפולט
  const Ri4=rpi+(beta+1)*RE;            // כניסת CE עם ניוון (Q3)
  const RL1=par(par(RD,RB),Ri4);        // RD ∥ 60k∥60k ∥ Ri4
  const A1=-gm*RL1,A2=-beta*Ri3/Ri4,A3=beta*RC/rpi,Av=A1*A2*A3,Ro=RC;
  return {VOV,VGS,VA,VDS,gm,Ri3,Ri4,RL1,A1,A2,A3,Av,Ro,sat:VDS>=VOV};
}

/* ---------------- Q4: רשת של שלושה מגברי שרת ---------------- */
function q4Solve(p){
  const {V1,V2,R}=p,R2=2*R;
  const Vm2=V2,Vo2=2*V2;               // A2 לא הופך עם 2R/2R
  const Vp1=V2,Vm1=V2,Vo1=2*V2-V1;     // A1: KCL בקצר המדומה
  const Vp3=V2,Vm3=V2,Vo3=V1-V2;       // A3: ארבעה נגדי 2R על הקצר המדומה
  const i_in1=(V1-Vm1)/R,i_f1=(Vo1-Vm1)/R,i_2a=(Vo2-Vm2)/R2,i_2b=Vm2/R2,i_mid=(Vo2-Vm3)/R2,i_o1=(Vo1-Vm3)/R2,i_f3=(Vm3-Vo3)/R2,i_top=(Vm1-Vm3)/R2;
  return {Vm1,Vp1,Vo1,Vm2,Vo2,Vp3,Vm3,Vo3,i_in1,i_f1,i_2a,i_2b,i_mid,i_o1,i_f3,i_top,iA1:i_f1,iA2:i_2a+i_mid,iA3:-i_f3};
}

const INTRO=[
{t:'איך קוראים את המבחן הזה',h:RX`
<p>ארבע שאלות, 100 נקודות, וכל שאלה היא נושא אחד מהקורס בתחפושת של מעגל "גדול". הסוד: אף שאלה לא דורשת רעיון חדש. כל אחת היא שרשרת של <b>צעדים קטנים שכבר למדת</b>, ורק צריך לדעת באיזה סדר לעשות אותם.</p>
<div class="cols2"><div><p><b>שאלה 1 (20 נק') · דיודות אידיאליות.</b> "מי דולקת ומתי". שיטת הנחה-ובדיקה: מניחים שכל הדיודות כבויות, מוצאים מתי ההנחה נשברת, ופותחים תחום חדש.</p><p><b>שאלה 2 (30 נק') · משוב שלילי.</b> מגבר של חמישה טרנזיסטורים שמפחיד בציור, אבל השאלה כולה היא "חשב את המגבר בלי המשוב, ואז חלק ב-D".</p></div>
<div><p><b>שאלה 3 (30 נק') · מגבר רב-דרגתי.</b> נקודת עבודה של MOSFET אחד, ואז מכפלה של שלושה הגברים. הנקודה הקשה: להבין מה כל דרגה "רואה" כעומס.</p><p><b>שאלה 4 (20 נק') · מגברי שרת.</b> אין חישוב הגבר בכלל. רק שני כללי זהב וחוק אוהם, נגד אחרי נגד.</p></div></div>
`+co('key','⏱️','חלוקת זמן מומלצת (3 שעות)',RX`<p>שאלה 1: 30 דק' · שאלה 2: 55 דק' · שאלה 3: 55 דק' · שאלה 4: 25 דק' · 15 דק' לבדיקה. הבדיקה הכי משתלמת: להציב את התשובה הסופית חזרה במעגל ולראות שחוקי קירכהוף מתקיימים (בשאלה 4 זה לוקח דקה ומגלה כל טעות).</p>`)},
{t:'הכלים שחוזרים בכל השאלות',h:RX`
<p>לפני שנצלול, הנה ארבעת הכלים שאתה הולך להשתמש בהם שוב ושוב. אם משהו כאן לא ברור, עצור וקרא את שיעור התיאוריה המתאים.</p>
<ul>
<li><b>מחלק מתח.</b> שני נגדים בטור בין מתח לאדמה: המתח באמצע הוא \(V\cdot\frac{R_2}{R_1+R_2}\). זה מופיע בשאלה 1 שלוש פעמים ובשאלה 4 פעם אחת.</li>
<li><b>KCL בצומת.</b> סכום הזרמים שנכנסים לצומת שווה לסכום היוצאים. כשיש יותר משני ענפים, כותבים \(\sum\frac{V_{node}-V_k}{R_k}=0\) ופותרים. ככה פותרים את "המצב השני" בשאלה 1 ואת \(V_{o3}\) בשאלה 4.</li>
<li><b>מודל אות קטן.</b> טרנזיסטור הוא מקור זרם נשלט: \(g_m v_{gs}\) ב-MOSFET, \(\beta i_b\) ב-BJT. ההגבר של דרגה הוא תמיד "\(-g_m\) כפול מה שמחובר לקולט/שפך". שאלות 2 ו-3 הן רק זה.</li>
<li><b>התנגדות שנראית מהדק.</b> להדק של BJT יש שלוש תשובות: מהבסיס רואים \(r_\pi+(\beta+1)R_E\); מהפולט רואים \(\frac{r_\pi+R_B}{\beta+1}\); מהקולט רואים \(\infty\) (כש-\(V_A=\infty\)). שאלה 3 משתמשת בשלושתן.</li>
</ul>`+co('analogy','🧭','הכלל שמונע 80% מהטעויות',RX`<p>לפני כל חישוב, כתוב ליד כל הדק את המתח שאתה <b>יודע בוודאות</b>: אדמה, מקורות, בסיס של op-amp שמחובר לצומת ידוע. רק אז תתחיל להניח. רוב הטעויות במבחן הזה נובעות מחישוב לפני שמסמנים את מה שידוע.</p>`)}

const PROBS=[
/* ================= שאלה 1 ================= */
{t:'שאלה 1 · מעגל קטימה עם שתי דיודות ושני מקורות',pts:20,lvl:'20 נק\'',tags:['dc'],w:440,h:232,
fig(C){q1Circuit(C).set(12);},
st:RX`עבור המעגל באיור, הנח דיודות אידיאליות. <b>(א · 10 נק')</b> ציין מצבי הולכה ואי הולכה של כל דיודה ושרטט מעגל שקול עבור כל אחד מהמצבים, לכל \(-\infty\lt v_{in}\lt\infty\). <b>(ב · 5 נק')</b> חשב ושרטט את אופיין המעבר \(v_O=f(v_{in})\) עם ערכים ושיפועים. <b>(ג · 5 נק')</b> \(v_{in}\) הוא גל משולש סימטרי באמפליטודה 50V ובתדר 1kHz: שרטט את הכניסה והמוצא בתלות בזמן, עם ערכים.`,
given:RX`\(v_{in}\) דרך \(1\text{k}\Omega\) לצומת A. מ-A: \(D_1\) (אנודה ב-\(-3\text{V}\), קתודה ב-A) ונגד \(1\text{k}\Omega\) לצומת המוצא. מהמוצא: \(2\text{k}\Omega\) בטור ל-\(D_2\) (אנודה בצד הנגד, קתודה ב-\(10\text{V}\)) ו-\(1\text{k}\Omega\) לאדמה.`,
ask:RX`מצבי הדיודות לכל תחום · אופיין המעבר · צורת המוצא לגל משולש \(\pm50\text{V}\)`,
live:(host,px)=>mountQ1(host,px),
steps:[
{t:'לפני הכול: מה זו "דיודה אידיאלית" ומה אנחנו באמת מחפשים',b:RX`<p>דיודה אידיאלית היא מתג. אם המתח על האנודה גבוה מהמתח על הקתודה היא <b>קצר</b> (מוליכה, ON): אין עליה מפל מתח וזרם יכול לעבור. אחרת היא <b>נתק</b> (OFF): לא עובר בה זרם, ואפשר פשוט למחוק אותה מהציור.</p>
<p>לכן כל השאלה היא: <b>לאילו ערכי \(v_{in}\) כל דיודה היא קצר, ולאילו היא נתק?</b> ברגע שיודעים את זה, לכל תחום נשאר מעגל של נגדים בלבד, וזה חשמל 1.</p>
<p>הדרך הבטוחה: <b>מניחים שכל הדיודות OFF</b> (המעגל הכי פשוט), מחשבים את המתחים, ובודקים מתי ההנחה נשברת. בכל דיודה יש הדק שאנחנו יודעים את המתח שלו בוודאות: האנודה של \(D_1\) יושבת על \(-3\text{V}\), הקתודה של \(D_2\) יושבת על \(10\text{V}\). הדיודה "מרגישה" רק את ההדק השני, שתלוי ב-\(v_{in}\).</p>`},
{t:'סעיף א · מצב 1: שתי הדיודות OFF',b:RX`<p>מוחקים את שתי הדיודות. מה נשאר? מ-\(v_{in}\) שני נגדים של \(1\text{k}\Omega\) בטור ואז \(1\text{k}\Omega\) לאדמה. הענף של \(2\text{k}\Omega\) תלוי באוויר (הדיודה שאחריו נתק) ולכן לא זורם בו זרם ואפשר להתעלם ממנו.</p>
<p>זה מחלק מתח של שלושה נגדים שווים. אותו זרם עובר בשלושתם: \(I=\frac{v_{in}}{3\text{k}}\). המתח בכל נקודה הוא "כמה נגדים נשארו עד האדמה":</p>
\[v_O=I\cdot1\text{k}=\frac{v_{in}}{3},\qquad V_A=I\cdot2\text{k}=\frac{2v_{in}}{3}\]
<p><b>מתי ההנחה נשברת?</b></p>
<ul><li>\(D_2\): הקתודה שלה על \(10\text{V}\). האנודה מחוברת דרך \(2\text{k}\Omega\) למוצא, ובלי זרם אין מפל על הנגד, אז האנודה נמצאת ב-\(v_O\). היא תיפתח כש-\(v_O>10\text{V}\), כלומר \(\frac{v_{in}}{3}>10\Rightarrow v_{in}>30\text{V}\).</li>
<li>\(D_1\): האנודה שלה על \(-3\text{V}\), הקתודה ב-A. היא תיפתח כשהקתודה יורדת מתחת לאנודה: \(V_A\lt-3\Rightarrow\frac{2v_{in}}{3}\lt-3\Rightarrow v_{in}\lt-4.5\text{V}\).</li></ul>
<p>אז <b>מצב 1</b> (שתיהן OFF) תקף ב-\(-4.5\text{V}\le v_{in}\le30\text{V}\), ושם \(v_O=v_{in}/3\). שים לב ששתי נקודות המפנה יצאו במחיר של חישוב אחד פשוט.</p>`},
{t:'סעיף א · מצב 2: \\(v_{in}>30\\text{V}\\), \\(D_2\\) ON ו-\\(D_1\\) OFF',b:RX`<p>עכשיו \(D_2\) היא קצר: הענף של \(2\text{k}\Omega\) מחובר ישירות מהמוצא למקור \(10\text{V}\). \(D_1\) עדיין נתק (נבדוק בסוף). המעגל: \(v_{in}\) דרך \(1\text{k}\Omega\) ל-A, מ-A דרך \(1\text{k}\Omega\) למוצא, ומהמוצא יוצאים שני ענפים: \(1\text{k}\Omega\) לאדמה ו-\(2\text{k}\Omega\) ל-\(10\text{V}\).</p>
<p>יש שני צמתים לא ידועים (A ו-O), אז כותבים KCL בשניהם. בצומת A נכנס זרם מ-\(v_{in}\) ויוצא זרם למוצא, ואין ענף שלישי (הדיודה נתק):</p>
\[\frac{v_{in}-V_A}{1\text{k}}=\frac{V_A-v_O}{1\text{k}}\ \Rightarrow\ V_A=\frac{v_{in}+v_O}{2}\]
<p>בצומת O נכנס זרם מ-A ויוצאים שניים:</p>
\[\frac{V_A-v_O}{1\text{k}}=\frac{v_O}{1\text{k}}+\frac{v_O-10}{2\text{k}}\]
<p>מציבים את \(V_A\), כופלים ב-\(2\text{k}\) ומסדרים:</p>
\[v_{in}+v_O-2v_O=2v_O+v_O-10\ \Rightarrow\ v_{in}+10=4v_O\ \Rightarrow\ \boxed{v_O=\tfrac{1}{4}v_{in}+2.5}\]
<p><b>בדיקות.</b> ב-\(v_{in}=30\): \(v_O=7.5+2.5=10\text{V}\), בדיוק כמו במצב 1. האופיין רציף <span class="ok-t">✓</span>. הזרם ב-\(D_2\) הוא \(\frac{v_O-10}{2\text{k}}\), חיובי כש-\(v_O>10\), כלומר לכל \(v_{in}>30\) <span class="ok-t">✓</span>. ו-\(D_1\)? \(V_A=\frac{v_{in}+v_O}{2}=\frac{5}{8}v_{in}+1.25\), שהוא גדול מ-\(-3\) לכל \(v_{in}>30\), אז היא באמת OFF <span class="ok-t">✓</span>.</p>
<p>למה השיפוע ירד מ-\(1/3\) ל-\(1/4\)? כי נפתח ענף נוסף שמושך זרם מהמוצא: מה שהמקור \(v_{in}\) "דוחף" מתחלק עכשיו בין יותר צרכנים, והמוצא עולה לאט יותר.</p>`},
{t:'סעיף א · מצב 3: \\(v_{in}\\lt-4.5\\text{V}\\), \\(D_1\\) ON ו-\\(D_2\\) OFF',b:RX`<p>עכשיו \(D_1\) קצר, כלומר הצומת A מחובר ישירות למקור \(-3\text{V}\). <b>המקור מחזיק את A ב-\(-3\text{V}\) לא משנה מה \(v_{in}\) עושה.</b> מהצומת A ימינה יש רק מחלק מתח פשוט: \(1\text{k}\Omega\) ואז \(1\text{k}\Omega\) לאדמה (הענף של \(2\text{k}\Omega\) שוב באוויר).</p>
\[v_O=-3\cdot\frac{1\text{k}}{1\text{k}+1\text{k}}=\boxed{-1.5\text{V}}\]
<p>קבוע! לא תלוי ב-\(v_{in}\). לכן השיפוע כאן הוא אפס: ככל שנוריד את \(v_{in}\), המקור \(-3\text{V}\) פשוט יבלע יותר זרם דרך \(D_1\), והמוצא לא יזוז.</p>
<p><b>בדיקה</b> (חובה במבחן, זה מה שמראה לבודק שהבנת): הזרם ב-\(D_1\) הוא כל מה שנכנס ל-A פחות מה שיוצא למוצא. נכנס מ-\(v_{in}\): \(\frac{v_{in}-(-3)}{1\text{k}}\) (שלילי, כלומר יוצא), יוצא למוצא: \(\frac{-3-(-1.5)}{1\text{k}}=-1.5\text{mA}\). הזרם דרך \(D_1\) מהאנודה לקתודה: \(I_{D1}=\frac{-3-v_{in}}{1\text{k}}-1.5\text{mA}=-(v_{in}+4.5)\text{ mA}\), חיובי בדיוק כש-\(v_{in}\lt-4.5\) <span class="ok-t">✓</span>. עקבי.</p>
<p>ומה עם המצב הרביעי, שתיהן ON? הוא דורש גם \(v_{in}\lt-4.5\) וגם \(v_{in}>30\) בו-זמנית. בלתי אפשרי, ולכן במעגל הזה הוא לא קיים.</p>`},
{t:'סעיף ב · אופיין המעבר \\(v_O=f(v_{in})\\)',b:RX`<p>עכשיו רק מדביקים את שלושת התחומים:</p>
\[v_O=\begin{cases}-1.5\text{V} & v_{in}\lt-4.5\text{V}\quad(\text{שיפוע }0)\\[3pt] \dfrac{v_{in}}{3} & -4.5\le v_{in}\le30\text{V}\quad(\text{שיפוע }1/3)\\[3pt] \dfrac{v_{in}}{4}+2.5 & v_{in}>30\text{V}\quad(\text{שיפוע }1/4)\end{cases}\]
<p>מה מציינים על הגרף (ככה מקבלים את כל הנקודות): נקודת המפנה \((-4.5,-1.5)\), נקודת המפנה \((30,10)\), המעבר דרך הראשית, ושלושת השיפועים. באפיון החי למעלה אפשר לגרור את הנקודה ולראות שהיא נצמדת לקו.</p>
`+co('warn','⚠️','הטעות הנפוצה',RX`<p>לסמן את המפנה של \(D_2\) ב-\(v_{in}=10\text{V}\) במקום \(30\text{V}\). הקתודה על 10V, נכון, אבל האנודה נמצאת על \(v_O\) ולא על \(v_{in}\), ו-\(v_O\) הוא רק שליש. תמיד תשאל: <b>איזה הדק של הדיודה תלוי בכניסה, ומה היחס ביניהם?</b></p>`)},
{t:'סעיף ג · כניסה משולשת \\(\\pm50\\text{V}\\) ב-1kHz',b:RX`<p>גל משולש הוא קו ישר שעולה מ-\(-50\) ל-\(+50\) בחצי מחזור (0.5ms) ויורד חזרה בחצי השני. את המוצא בונים <b>נקודה-נקודה מהאופיין</b>: לכל רגע לוקחים את \(v_{in}\) ומעבירים דרך \(f\).</p>
<ul>
<li>כל עוד \(v_{in}\lt-4.5\text{V}\): המוצא שטוח על \(-1.5\text{V}\). זה קורה בכל פעם שהמשולש נמצא בתחתית, וזה נמשך כמעט חצי מהזמן (מ-\(-50\) עד \(-4.5\) זה \(45.5/100=45.5\%\) מהטווח).</li>
<li>בין \(-4.5\) ל-\(30\): המוצא הוא משולש קטן יותר, בשיפוע \(1/3\): עולה מ-\(-1.5\) ל-\(10\text{V}\).</li>
<li>מעל \(30\): המוצא ממשיך לעלות, אבל לאט יותר (שיפוע \(1/4\)), עד השיא \(v_O(50)=12.5+2.5=15\text{V}\).</li>
</ul>
<p>אז המוצא הוא גל באותו תדר (1kHz, כי המעגל לא זוכר כלום, אין קבלים), עם <b>תחתית קטומה ב-\(-1.5\text{V}\)</b>, עלייה בשיפוע \(1/3\), ו"שבירה" עדינה ב-\(10\text{V}\) שממנה השיפוע קטן ל-\(1/4\) עד שיא של \(15\text{V}\). הערכים שחובה לכתוב על הגרף: \(-1.5\text{V}\), \(10\text{V}\), \(15\text{V}\), והזמנים שבהם \(v_{in}\) חוצה את \(-4.5\) ואת \(30\): המשולש עולה ב-\(200\text{V/ms}\), אז מ-\(-50\) הוא מגיע ל-\(-4.5\) אחרי \(0.2275\text{ms}\) ול-\(30\) אחרי \(0.4\text{ms}\).</p>
<p>הפעל את "גל משולש" במעגל החי למעלה ותראה בדיוק את הצורה הזו נבנית.</p>`}
],
ans:RX`\(D_1\) ON ל-\(v_{in}\lt-4.5\text{V}\): \(v_O=-1.5\text{V}\) (שיפוע 0)<br>שתיהן OFF ל-\(-4.5\le v_{in}\le30\): \(v_O=v_{in}/3\)<br>\(D_2\) ON ל-\(v_{in}>30\text{V}\): \(v_O=v_{in}/4+2.5\) (שיפוע 1/4)<br>למשולש \(\pm50\text{V}\): מוצא ב-1kHz בין \(-1.5\text{V}\) ל-\(15\text{V}\), קטום מלמטה`},

/* ================= שאלה 2 ================= */
{t:'שאלה 2 · מגבר עם משוב שלילי: זוג הפרשי, PNP ומראה זרם',pts:30,lvl:'30 נק\'',tags:['ac'],w:440,h:270,
fig(C){q2Circuit(C).set(0.8,{});},
st:RX`נתון מגבר עם משוב שלילי. נתוני הטרנזיסטורים: \(\beta=100\), \(|V_{BE}|=0.7\text{V}\), \(r_{\pi1}=r_{\pi2}=4\text{k}\Omega\), \(r_{\pi3}=8\text{k}\Omega\). <b>(א · 8)</b> זהה את סוג המשוב וחשב את פרמטרי רשת המשוב. <b>(ב · 10)</b> שרטט מעגל הגברה ללא משוב כולל העמסות רשת המשוב וחשב את כמות המשוב D. <b>(ג · 4)</b> חשב את הגבר המתח \(A_{vf}=V_o/V_s\) כולל משוב. <b>(ד · 4)</b> חשב את התנגדות הכניסה \(R_{inf}\) כולל המשוב, כלפי מקור המתח \(V_s\). <b>(ה · 4)</b> חשב את התנגדות המוצא \(R_{of}\).`,
given:RX`\(R_s=0.1\text{k}\Omega\), \(R_{c1}=R_{c2}=1\text{k}\Omega\), \(R_{c3}=3\text{k}\Omega\), \(R_f=10\text{k}\Omega\), \(R=4.7\text{k}\Omega\), ספקים \(\pm9\text{V}\). \(T_1,T_2\) זוג הפרשי npn שהזנב שלו הוא מראה הזרם \(T_4/T_5\). \(T_3\) pnp שהבסיס שלו מחובר לקולט \(T_2\). \(R_f\) מחבר את המוצא לבסיס \(T_1\).`,
ask:RX`סוג המשוב ו-\(\beta_f\) · \(D\) · \(A_{vf}\) · \(R_{inf}\) · \(R_{of}\)`,
live:(host,px)=>mountQ2(host,px),
steps:[
{t:'לפני הכול: להפסיק לפחד מהציור',b:RX`<p>חמישה טרנזיסטורים, אבל רק שניים "עובדים" על האות. בוא נחלק את הציור לקופסאות:</p>
<ul>
<li><b>\(T_4,T_5\) + R:</b> מראה זרם. הוא רק מספק זרם DC קבוע לפולטים של הזוג ההפרשי. ל-AC הוא נראה כמו מקור זרם אידיאלי, כלומר <b>נתק</b>. אפשר למחוק אותו מניתוח האות.</li>
<li><b>\(T_1,T_2\) + \(R_{c1},R_{c2}\):</b> זוג הפרשי. האות נכנס לבסיס \(T_1\), הבסיס של \(T_2\) מקורקע. אנחנו לוקחים את המוצא מהקולט של \(T_2\) (שם מחובר \(T_3\)). \(R_{c1}\) לא משתתף בכלום, כי אף אחד לא לוקח ממנו מוצא.</li>
<li><b>\(T_3\) + \(R_{c3}\):</b> דרגת pnp בתצורת פולט משותף: הפולט על הספק (אדמת AC), הכניסה בבסיס, המוצא בקולט. זו הדרגה שנותנת את רוב ההגבר.</li>
<li><b>\(R_f\):</b> נגד אחד שמחבר את המוצא חזרה לכניסה. זה כל המשוב.</li>
</ul>
<p>שים לב שהשאלה נותנת לך \(r_\pi\) של כל טרנזיסטור. זה אומר: <b>אין ניתוח DC</b>. נקודות העבודה כבר חושבו בשבילך. ישר לאות קטן.</p>`},
{t:'סעיף א · זיהוי סוג המשוב: מה דוגמים ומה מחזירים',b:RX`<p>לזיהוי שואלים שתי שאלות בלבד, ולכל אחת יש מבחן מכני:</p>
<p><b>1. מה דוגמים במוצא?</b> \(R_f\) מחובר <b>לצומת המוצא עצמו</b> (במקביל לעומס). אם נקצר את המוצא לאדמה, לא יגיע כלום ל-\(R_f\). זה סימן שדוגמים <b>מתח</b>: חיבור <b>מקבילי</b> במוצא (shunt).</p>
<p><b>2. איך מחזירים לכניסה?</b> \(R_f\) מגיע <b>לאותו צומת</b> שבו נכנס האות (בסיס \(T_1\)), לא לפולט או לצומת נפרד. הזרם שחוזר דרך \(R_f\) מתחבר לזרם מהמקור בצומת אחד. זו החזרת <b>זרם</b>: חיבור <b>מקבילי</b> בכניסה (shunt).</p>
<p>לכן: <b>משוב מקבילי-מקבילי (shunt-shunt)</b>. במשוב כזה המגבר ה"טבעי" הוא <b>מגבר טרנס-התנגדות</b>: כניסה זרם, מוצא מתח, ההגבר \(A_z=V_o/i_s\) ביחידות של אוהם. ורשת המשוב הופכת מתח מוצא לזרם:</p>
\[\beta_f=\frac{i_f}{V_o}=-\frac{1}{R_f}=-\frac{1}{10\text{k}}=-0.1\ \tfrac{\text{mA}}{\text{V}}\]
<p>הסימן השלילי: כש-\(V_o\) חיובי, הזרם ב-\(R_f\) זורם <i>מהמוצא אל הכניסה</i>, כלומר נכנס לצומת הכניסה, ומחסר מהזרם שהמקור מזריק לבסיס (בכיוון ההפוך להגדרה של \(i_f\) שיוצא מהצומת). זה מה שעושה את המשוב <b>שלילי</b>. תיכף נראה שגם \(A_z\) יוצא שלילי, ואז \(\beta_f A_z>0\) כנדרש.</p>
<p><b>העמסות רשת המשוב</b> (שיטת ה"מגבר העמוס"): כדי לחשב את המגבר בלי משוב אבל בצורה הוגנת, מכניסים את \(R_f\) פעמיים כנגד רגיל: פעם בכניסה ופעם במוצא.</p>
\[R^{*}=R_f=10\text{k}\Omega\ \ (\text{בכניסה, במקביל}),\qquad R^{**}=R_f\parallel R_{c3}=10\text{k}\parallel3\text{k}=2.31\text{k}\Omega\ \ (\text{במוצא})\]`},
{t:'סעיף ב · המגבר ללא משוב, דרגה אחר דרגה',b:RX`<p>עכשיו מוחקים את \(R_f\) כמשוב, שמים \(R^*\) בכניסה ו-\(R^{**}\) במוצא, ומחשבים <b>מגבר טרנס-התנגדות</b> \(A_z=V_o/i_s\). המקור הוא מקור זרם \(i_s\) (מקור נורטון: \(V_s/R_s\)) במקביל ל-\(R_s\). נלך משמאל לימין.</p>
<p><b>צעד 1 · התנגדות הכניסה של הזוג ההפרשי.</b> נכנסים לבסיס \(T_1\); הזרם עובר דרך \(r_{\pi1}\), יוצא בפולט, ומאחר שהזנב הוא מקור זרם (נתק ל-AC), הוא חייב להיכנס לפולט \(T_2\) ולצאת מהבסיס שלו (שמקורקע) דרך \(r_{\pi2}\). כלומר ההתנגדות מהבסיס היא פשוט:</p>
\[R_{i,pair}=r_{\pi1}+r_{\pi2}=8\text{k}\Omega\]
<p>(זה נכון כי הזרם באותם שני נגדים שווה, ובגלל ש-\(\beta\) שווה בשניהם, הפולטים לא "מגבירים" את ההתנגדות אחד לשני. בשיעור 7 זה \(R_{id}=2r_\pi\).)</p>
<p><b>צעד 2 · מתח הכניסה.</b> מקור הזרם \(i_s\) רואה \(R_s\) במקביל ל-\(8\text{k}\):</p>
\[R_{in}=R_s\parallel(r_{\pi1}+r_{\pi2})=0.1\text{k}\parallel8\text{k}=98.76\ \Omega,\qquad v_{b1}=i_s\cdot R_{in}\]
<p>(הפתרון הרשמי מזניח כאן את \(R^*=10\text{k}\) שבמקביל, כי \(0.1\text{k}\parallel10\text{k}\approx0.1\text{k}\). אם תכלול אותו תקבל \(97.8\ \Omega\), הבדל של 1%. שתי הדרכים מתקבלות.)</p>
<p><b>צעד 3 · הגבר הזוג ההפרשי אל הקולט של \(T_2\).</b> זרם הבסיס של \(T_1\) הוא \(i_{b1}=v_{b1}/8\text{k}\). אותו זרם (בסימן הפוך) הוא זרם הבסיס של \(T_2\): \(i_{b2}=-i_{b1}\). הקולט של \(T_2\) מושך \(\beta i_{b2}\) דרך \(R_{c2}\), אבל \(R_{c2}\) מועמס בכניסה של \(T_3\), שהיא \(r_{\pi3}=8\text{k}\):</p>
\[R_{c2}\parallel r_{\pi3}=1\text{k}\parallel8\text{k}=0.889\text{k}\Omega\]
\[\frac{v_{c2}}{v_{b1}}=-\beta\,i_{b2}\cdot\frac{(R_{c2}\parallel r_{\pi3})}{v_{b1}}=+\frac{100\cdot0.889\text{k}}{8\text{k}}=+11.11\]
<p>חיובי! כי הכניסה ל-\(T_1\) והמוצא מ-\(T_2\) הם "צד שני" של הזוג. זו בדיוק התכונה של מגבר הפרשי: אפשר לבחור מאיזה קולט לוקחים ולקבל סימן חיובי או שלילי.</p>
<p><b>צעד 4 · דרגת \(T_3\).</b> pnp בתצורת CE: הכניסה בבסיס (\(v_{c2}\)), העומס בקולט הוא \(R^{**}=2.31\text{k}\). ההגבר של CE הוא תמיד "מינוס \(\beta\) כפול העומס חלקי \(r_\pi\)":</p>
\[\frac{V_o}{v_{c2}}=-\frac{\beta R^{**}}{r_{\pi3}}=-\frac{100\cdot2.31\text{k}}{8\text{k}}=-28.875\]
<p><b>צעד 5 · הכול ביחד.</b></p>
\[A_z=\frac{V_o}{i_s}=R_{in}\cdot11.11\cdot(-28.875)=98.76\cdot11.11\cdot(-28.875)=\boxed{-31.69\ \text{k}\Omega}\ (=\text{kV/A})\]
<p>ההתנגדויות של המגבר העמוס: \(R_{in}=98.76\ \Omega\) (חישבנו), ו-\(R_o=R^{**}=2.31\text{k}\Omega\) (הקולט של \(T_3\) הוא מקור זרם אידיאלי כי לא נתון \(V_A\), אז רואים רק את הנגדים).</p>
<p><b>כמות המשוב:</b></p>
\[D=1+\beta_fA_z=1+\left(-\tfrac{1}{10\text{k}}\right)(-31.69\text{k})=1+3.169=\boxed{4.169}\]
<p>מכפלה חיובית, כלומר המשוב באמת שלילי, וכל מה שנשאר הוא לחלק ב-4.169.</p>`},
{t:'סעיף ג · הגבר המתח כולל משוב',b:RX`<p>קודם ההגבר הטבעי (טרנס-התנגדות) עם משוב:</p>
\[A_{zf}=\frac{A_z}{D}=\frac{-31.69\text{k}}{4.169}=-7.6\ \text{k}\Omega\]
<p>אבל שואלים על הגבר <b>מתח</b> \(V_o/V_s\). המקור האמיתי הוא מקור מתח \(V_s\) בטור ל-\(R_s\), ומקור הנורטון השקול הוא \(i_s=V_s/R_s\). לכן:</p>
\[A_{vf}=\frac{V_o}{V_s}=\frac{V_o}{i_s R_s}=\frac{A_{zf}}{R_s}=\frac{-7.6\text{k}}{0.1\text{k}}=\boxed{-76}\]
<p>בדיקת שפיות: במשוב חזק מאוד (\(D\gg1\)) היה יוצא \(A_{zf}\to1/\beta_f=-R_f\), כלומר \(A_{vf}\to-R_f/R_s=-100\). קיבלנו \(-76\), קרוב ומתחת: הגיוני, כי \(D\) הוא רק 4 ולא אינסוף. גרור את \(R_f\) במעגל החי ותראה את העקומה מתקרבת לקו \(-R_f/R_s\).</p>`},
{t:'סעיף ד · התנגדות הכניסה כלפי \\(V_s\\)',b:RX`<p>במשוב מקבילי בכניסה, ההתנגדות שהמקור רואה <b>קטנה</b> פי D (הצומת "נאחז" על ידי הזרם החוזר):</p>
\[R_{inf}=\frac{R_{in}}{D}=\frac{98.76}{4.169}=23.69\ \Omega\]
<p>אבל זה כולל את \(R_s\) בפנים (כי \(R_{in}\) חושב עם \(R_s\) במקביל, כחלק ממקור הנורטון). השאלה מבקשת את ההתנגדות <b>שמקור המתח \(V_s\) רואה</b>, כלומר \(R_s\) בטור למה שנמצא אחריו. אז קודם "מוציאים" את \(R_s\) מהמקביל:</p>
\[R'_{inf}=\left(\frac{1}{23.69}-\frac{1}{100}\right)^{-1}=31.04\ \Omega\]
<p>ואז מוסיפים אותו בטור:</p>
\[R_{inf}\big|_{V_s}=R_s+R'_{inf}=100+31.04=\boxed{131.04\ \Omega}\]
<p>הפירוש: מבחינת \(V_s\), כמעט כל ההתנגדות היא \(R_s\) עצמו. הבסיס של \(T_1\) הפך לצומת "כמעט אדמה" בזכות המשוב, בדיוק כמו הכניסה ההופכת של מגבר שרת.</p>`},
{t:'סעיף ה · התנגדות המוצא',b:RX`<p>דוגמים מתח במוצא, ולכן המשוב <b>מקטין</b> את התנגדות המוצא פי D (מגבר שדוגם מתח רוצה להיות מקור מתח טוב, כלומר \(R_o\) קטן):</p>
\[R_{of}=\frac{R_o}{D}=\frac{R^{**}}{D}=\frac{2.31\text{k}}{4.169}=\boxed{554\ \Omega}\]
<p>שים לב ש-\(R_o\) של המגבר העמוס כבר כולל את \(R_f\) (זה \(R^{**}\)). זו הסיבה שעובדים עם המגבר העמוס: אחרי החלוקה ב-D לא צריך להוסיף כלום.</p>
`+co('key','🎯','הסיכום שכדאי לזכור',RX`<p>כל שאלת משוב היא אותם שלושה שלבים: (1) לזהות מה דוגמים ומה מחזירים, (2) לחשב את המגבר <b>העמוס</b> בלי משוב, (3) לחלק ב-\(D=1+\beta A\): את ההגבר תמיד, את ההתנגדות בצד המקבילי, ולהכפיל בצד הטורי. כאן שני הצדדים מקביליים, אז שתי ההתנגדויות קטנות.</p>`)}
],
ans:RX`מקבילי-מקבילי, \(\beta_f=-1/R_f=-0.1\ \text{mA/V}\), \(R^{**}=2.31\text{k}\Omega\)<br>\(A_z=-31.69\ \text{kV/A}\), \(R_{in}=98.8\ \Omega\), \(R_o=2.31\text{k}\Omega\), \(D=4.169\)<br>\(A_{vf}=-76\)<br>\(R_{inf}\) כלפי \(V_s\): \(131\ \Omega\)<br>\(R_{of}=554\ \Omega\)`},

/* ================= שאלה 3 ================= */
{t:'שאלה 3 · CS עם NMOS depletion, ואחריו CE ו-CB',pts:30,lvl:'30 נק\'',tags:['dc','ac'],w:440,h:284,
fig(C){q3Circuit(C).set(0.8,{ICS:0.477e-3,sat:true});},
st:RX`נתוני הטרנזיסטורים: \(Q_1\) NMOS depletion עם \(\tfrac12k_n'\tfrac{W}{L}=10\ \text{mA/V}^2\), \(\lambda=0\). \(Q_2,Q_3\) npn עם \(\beta=100\), \(r_\pi=1\text{k}\Omega\), \(V_A=\infty\). הפוטנציאל \(V_A\) המסומן במעגל הוא \(2\text{V}\) ב-DC, ו-\(I_{CS}\) הוא מקור זרם DC של \(0.477\text{mA}\). <b>(א · 5)</b> חשב את נקודת העבודה של \(Q_1\): \(V_{DS},V_{GS},I_D\). <b>(ב · 3)</b> חשב את \(g_{m1}\). <b>(ג · 2)</b> שרטט מעגל חשמלי שקול לניתוח AC וציין את סוג החיבור של כל דרגה. <b>(ד · 5)</b> חשב את התנגדות המוצא \(R_O\). <b>(ה · 15)</b> חשב את הגבר המתח \(v_O/v_{in}\).`,
given:RX`\(Q_1\): שער דרך \(1\text{M}\Omega\) לאדמה (וקבל צימוד מ-\(v_{in}\)), שפך דרך \(10\text{k}\Omega\) ל-\(+15\text{V}\), מקור בצומת \(V_A\) שממנו \(I_{CS}\) דרך \(30\text{k}\Omega\) ל-\(-15\text{V}\), וקבל עוקף לאדמה. מהשפך קבל צימוד לצומת עם מחלק \(60\text{k}/60\text{k}\), שמזין את בסיס \(Q_3\). פולט \(Q_3\) דרך \(100\ \Omega\) לאדמה, קולט \(Q_3\) לפולט \(Q_2\). בסיס \(Q_2\) ממותג ב-\(60\text{k}/60\text{k}\) עם קבל לאדמה. קולט \(Q_2\) דרך \(25\text{k}\Omega\) ל-\(V_{cc}\), ושם \(v_O\).`,
ask:RX`\(V_{GS1},V_{DS1},I_{D1}\) · \(g_{m1}\) · תצורות · \(R_O\) · \(v_O/v_{in}\)`,
live:(host,px)=>mountQ3(host,px),
steps:[
{t:'לפני הכול: מה זה depletion ולמה זה משנה',b:RX`<p>ב-NMOS רגיל (enhancement) התעלה לא קיימת עד שמעלים את השער מעל \(V_t>0\). ב-<b>depletion</b> התעלה כבר קיימת מהייצור, ו-\(V_t\) הוא <b>שלילי</b>: הטרנזיסטור מוליך גם עם \(V_{GS}=0\), וצריך שער שלילי כדי לסגור אותו. <b>הנוסחה של הרוויה לא משתנה:</b></p>
\[I_D=\tfrac12k_n'\tfrac{W}{L}\,(V_{GS}-V_t)^2=k\,(V_{GS}-V_t)^2,\qquad k=10\ \text{mA/V}^2\]
<p>רק שעכשיו \(V_{GS}\) יכול להיות שלילי ועדיין \(V_{GS}-V_t\) חיובי. וזה בדיוק מה שקורה כאן.</p>
<p>הטריק של המעגל: השאלה לא נותנת \(V_t\)! במקום זה היא נותנת את <b>נקודת העבודה</b> (\(V_A=2\text{V}\) ו-\(I_{CS}=0.477\text{mA}\)) ומצפה שתחלץ ממנה את \(V_t\). זה "הפוך" ממה שרגילים, אז בוא נעשה את זה לאט.</p>`},
{t:'סעיף א · נקודת העבודה של \\(Q_1\\)',b:RX`<p><b>\(I_D\):</b> המקור של \(Q_1\) מחובר לצומת \(V_A\), ומשם יוצא רק מקור הזרם \(I_{CS}\) (הקבל לא מעביר DC, ה-\(30\text{k}\) הוא כבר "בתוך" הענף של מקור הזרם). לשער אין זרם. לכן כל זרם המקור הוא זרם השפך:</p>
\[I_{D1}=I_{CS}=0.477\ \text{mA}\]
<p><b>\(V_{GS}\):</b> השער מחובר דרך \(1\text{M}\Omega\) לאדמה, ובלי זרם שער אין מפל על הנגד: \(V_G=0\). המקור נמצא ב-\(V_A=2\text{V}\):</p>
\[V_{GS1}=V_G-V_S=0-2=-2\ \text{V}\]
<p>שער שלילי ביחס למקור, ובכל זאת הטרנזיסטור מוליך 0.477mA. זה אפשרי רק כי הוא depletion.</p>
<p><b>\(V_t\)</b> (לא נשאל, אבל חובה בשביל \(g_m\)): מציבים בנוסחת הרוויה:</p>
\[0.477=10\,(V_{GS}-V_t)^2\ \Rightarrow\ (V_{GS}-V_t)^2=0.0477\ \Rightarrow\ V_{GS}-V_t=\pm0.218\]
<p>איזה סימן? כדי שתהיה תעלה צריך \(V_{GS}-V_t=V_{OV}>0\). לכן \(+0.218\):</p>
\[V_t=V_{GS}-0.218=-2-0.218=\boxed{-2.218\ \text{V}}\]
<p><b>\(V_{DS}\):</b> KVL מ-\(+15\text{V}\) דרך \(10\text{k}\) לשפך, ואז מהשפך למקור (2V):</p>
\[V_{DS1}=15-10\text{k}\cdot0.477\text{m}-2=15-4.77-2=\boxed{8.23\ \text{V}}\]
<p><b>בדיקת רוויה:</b> צריך \(V_{DS}\ge V_{OV}\): \(8.23\ge0.218\) <span class="ok-t">✓</span>. עמוק ברוויה, טוב למגבר.</p>`},
{t:'סעיף ב · \\(g_{m1}\\)',b:RX`<p>הטרנס-מוליכות היא הנגזרת של \(I_D\) לפי \(V_{GS}\) בנקודת העבודה. מהנוסחה \(I_D=k(V_{GS}-V_t)^2\):</p>
\[g_m=\frac{dI_D}{dV_{GS}}=2k\,(V_{GS}-V_t)=2\cdot10\text{m}\cdot0.218=\boxed{4.36\ \text{mA/V}}\]
<p>דרך שנייה לאותו מספר: \(g_m=2I_D/V_{OV}=2\cdot0.477/0.218=4.38\ \text{mS}\) (ההפרש הקטן הוא עיגול של \(V_{OV}\)). באפיון \(I_D(V_{GS})\) למעלה, \(g_m\) הוא השיפוע של הפרבולה בנקודה האדומה. שים לב כמה הנקודה קרובה לתחתית (\(V_t\)): \(V_{OV}\) קטן, ולכן \(g_m\) צנוע.</p>`},
{t:'סעיף ג · מעגל AC ותצורות: מה כל טרנזיסטור עושה',b:RX`<p>ל-AC: כל קבל קצר, כל ספק DC ומקור זרם DC הם אדמה/נתק. עכשיו מסתכלים על כל טרנזיסטור ושואלים <b>מאיפה נכנס האות ומאיפה יוצא</b>. ההדק השלישי הוא "המשותף".</p>
<table class="tbl"><thead><tr><th>טרנזיסטור</th><th>כניסה</th><th>מוצא</th><th>ההדק המשותף</th><th>תצורה</th></tr></thead><tbody>
<tr><td>\(Q_1\)</td><td>שער</td><td>שפך</td><td>המקור מקורקע דרך הקבל העוקף</td><td><b>CS</b> (מקור משותף)</td></tr>
<tr><td>\(Q_3\)</td><td>בסיס</td><td>קולט</td><td>הפולט, דרך \(100\ \Omega\) (ניוון)</td><td><b>CE</b> (פולט משותף, עם \(R_E\))</td></tr>
<tr><td>\(Q_2\)</td><td>פולט (מהקולט של \(Q_3\))</td><td>קולט</td><td>הבסיס מקורקע ב-AC דרך הקבל</td><td><b>CB</b> (בסיס משותף)</td></tr>
</tbody></table>
<p>מה נשאר מהנגדים? ה-\(10\text{k}\) של \(Q_1\) הופך למקביל לאדמה (הספק הוא אדמה). המחלק \(60\text{k}/60\text{k}\) שמזין את \(Q_3\) הופך ל-\(30\text{k}\) לאדמה, במקביל לכניסת \(Q_3\). ה-\(30\text{k}\) של מקור הזרם ומקור הזרם עצמו: נתק (ובכל מקרה הקבל העוקף מקצר את המקור לאדמה). ה-\(25\text{k}\) של \(Q_2\) הופך לעומס לאדמה. הצימוד CE→CB הוא <b>קסקודה</b>: הקולט של \(Q_3\) מחובר ישירות לפולט של \(Q_2\).</p>`},
{t:'סעיף ד · התנגדות המוצא',b:RX`<p>מסתכלים מהמוצא פנימה. רואים שני דברים במקביל: את \(25\text{k}\Omega\) לאדמה, ואת הקולט של \(Q_2\). מה רואים כשמסתכלים לתוך קולט? כש-\(V_A=\infty\) אין \(r_o\), והקולט הוא מקור זרם אידיאלי, כלומר <b>נתק</b>. (זה נכון גם ב-CB וגם עם התנגדות בפולט. אינסוף במקביל לכל דבר לא משנה.)</p>
\[R_O=25\text{k}\parallel\infty=\boxed{25\ \text{k}\Omega}\]
<p>זה בדיוק היתרון של CB/קסקודה: התנגדות מוצא ענקית, מוגבלת רק על ידי הנגד החיצוני.</p>`},
{t:'סעיף ה · ההגבר: הכנת שלוש "התנגדויות כניסה"',b:RX`<p>הגבר של שרשרת הוא מכפלה של הגברי הדרגות, אבל כל דרגה מוגברת "אל תוך" הכניסה של הבאה. אז לפני שמחשבים הגבר, מחשבים <b>מה כל דרגה רואה</b>. נעבוד מהסוף להתחלה.</p>
<p><b>כניסת \(Q_2\) (CB), מהפולט.</b> מסתכלים לתוך פולט של BJT שהבסיס שלו מקורקע: רואים \(r_e=\frac{r_\pi}{\beta+1}\):</p>
\[R_{i3}=\frac{1\text{k}}{101}=9.9\ \Omega\]
<p>קטן מאוד. זה העומס של \(Q_3\), וזה מה שעומד להרוג את ההגבר של \(Q_3\).</p>
<p><b>כניסת \(Q_3\) (CE עם \(R_E\)), מהבסיס.</b> נגד בפולט "נראה" מהבסיס גדול פי \(\beta+1\):</p>
\[R_{i4}=r_\pi+(\beta+1)R_E=1\text{k}+101\cdot0.1\text{k}=11.1\ \text{k}\Omega\]
<p><b>העומס של \(Q_1\).</b> בשפך של \(Q_1\) מחוברים במקביל: \(10\text{k}\) (לספק=אדמה), \(60\text{k}\parallel60\text{k}=30\text{k}\) (המחלק), וכניסת \(Q_3\):</p>
\[R'_{L1}=10\text{k}\parallel30\text{k}\parallel11.1\text{k}=7.5\text{k}\parallel11.1\text{k}=4.48\ \text{k}\Omega\]`},
{t:'סעיף ה · ההגבר: שלוש דרגות, מכפלה אחת',b:RX`<p>נסמן: \(v_{in4}\) המתח בבסיס \(Q_3\), \(v_{in3}\) המתח בפולט \(Q_2\) (= קולט \(Q_3\)). אז</p>
\[\frac{v_O}{v_{in}}=\underbrace{\frac{v_{in4}}{v_{in}}}_{CS}\cdot\underbrace{\frac{v_{in3}}{v_{in4}}}_{CE}\cdot\underbrace{\frac{v_O}{v_{in3}}}_{CB}\]
<p><b>דרגה 1, CS:</b> "מינוס \(g_m\) כפול העומס":</p>
\[\frac{v_{in4}}{v_{in}}=-g_{m1}R'_{L1}=-4.36\text{m}\cdot4.48\text{k}=-19.5\]
<p><b>דרגה 2, CE עם ניוון:</b> ההגבר של CE עם \(R_E\) הוא \(-\frac{\beta R_L}{r_\pi+(\beta+1)R_E}=-\frac{\beta R_L}{R_{i4}}\), והעומס \(R_L\) הוא הכניסה של \(Q_2\), כלומר \(9.9\ \Omega\):</p>
\[\frac{v_{in3}}{v_{in4}}=-\frac{100\cdot9.9}{11.1\text{k}}=-0.0892\]
<p>הדרגה הזו <b>מקטינה</b> את המתח פי 11! זה לא באג, זו קסקודה: \(Q_3\) עובד כממיר מתח-לזרם, ו-\(Q_2\) מעביר את הזרם הזה (כמעט אחד לאחד, \(\alpha\approx1\)) אל \(25\text{k}\). המתח בין השניים קטן כי ההתנגדות שם קטנה, אבל <b>הזרם</b> נשמר.</p>
<p><b>דרגה 3, CB:</b> הגבר CB חיובי, \(g_mR_C=\frac{\beta R_C}{r_\pi}\):</p>
\[\frac{v_O}{v_{in3}}=\frac{100\cdot25\text{k}}{1\text{k}}=+2500\]
<p><b>המכפלה:</b></p>
\[\frac{v_O}{v_{in}}=(-19.5)\cdot(-0.0892)\cdot2500=\boxed{+4351}\]
<p>חיובי: שני היפוכים (CS ו-CE) מבטלים זה את זה, ו-CB לא הופך. גרור את \(R_E\) במעגל החי: ככל שהניוון קטן, \(R_{i4}\) יורד, \(Q_1\) מועמס יותר (הגבר 1 יורד) אבל הגבר 2 עולה. הסכום הכולל בקושי זז, וזו עוד תכונה של קסקודה.</p>
`+co('warn','⚠️','שתי הטעויות שעולות הכי הרבה נקודות',RX`<p>(1) לשכוח את \(30\text{k}\) של המחלק כעומס ל-\(Q_1\): מקבלים \(R'_{L1}=5.26\text{k}\) והגבר גדול פי 1.2. (2) לחשב את ההגבר של \(Q_3\) עם \(25\text{k}\) כעומס, כאילו \(Q_2\) לא קיים: זה נותן \(-225\) במקום \(-0.089\), ובסוף הגבר כולל שגוי פי 2500. הכלל: העומס של דרגה הוא <b>מה שמחובר להדק המוצא שלה</b>, וזה כאן פולט של טרנזיסטור, לא נגד.</p>`)}
],

steps:[
{t:'לפני הכול: שני כללי הזהב, ומה הם עושים לנגדים',b:RX`<p>מגבר שרת אידיאלי במשוב שלילי מקיים שני דברים, ורק שניים:</p>
<ol><li><b>\(V_+=V_-\)</b> ("קצר מדומה"): המגבר מזיז את המוצא שלו עד ששני הדקי הכניסה באותו מתח.</li>
<li><b>\(I_+=I_-=0\)</b>: לתוך הדקי הכניסה לא זורם זרם. אף פעם.</li></ol>
<p>הכלל השני הוא הכוכב של השאלה הזו. חשוב על נגד שקצה אחד שלו מחובר <i>רק</i> להדק כניסה של מגבר. הזרם שיוצא ממנו חייב להיכנס להדק, אבל ההדק לא מקבל זרם. אז <b>הזרם בנגד הזה אפס</b>, ולפי חוק אוהם \(V=IR=0\): <b>שני קצותיו באותו פוטנציאל</b>. הנגד הזה הוא בעצם חוט.</p>
<p>ברגע שרואים את זה, השאלה מתפרקת: מסמנים את הצמתים ה"קלים", ואז כל מגבר בנפרד.</p>`},
{t:'סעיף א · \\(A_2\\) קודם, כי הוא הכי פשוט',b:RX`<p>\(V_{in2}=2\text{V}\) מגיע דרך R להדק החיובי של \(A_2\). בנגד הזה אין זרם (הוא מסתיים בהדק כניסה), אז ההדק החיובי נמצא ב-<b>\(2\text{V}\)</b>. קצר מדומה: גם ההדק השלילי ב-\(2\text{V}\).</p>
<p>ההדק השלילי מחובר לאמצע מחלק \(2R/2R\) בין \(V_{o2}\) לאדמה. אין זרם לתוך ההדק, אז אותו זרם עובר בשני הנגדים: זה מחלק מתח רגיל, והאמצע שלו הוא חצי מהמוצא:</p>
\[\frac{V_{o2}}{2}=2\ \Rightarrow\ \boxed{V_{o2}=4\ \text{V}}\]
<p>(זה מגבר לא-הופך עם הגבר \(1+\frac{2R}{2R}=2\).) הזרם במחלק: \(\frac{4-2}{2R}=\frac{2}{10\text{k}}=0.2\ \text{mA}\), זורם מ-\(V_{o2}\) למטה דרך שני הנגדים אל האדמה. \(A_2\) מספק אותו מהמוצא שלו.</p>`},
{t:'סעיף א · \\(A_1\\): לגלות את ה-2V המוסתר',b:RX`<p>עכשיו הצעד שרוב הנבחנים מפספסים. ההדק החיובי של \(A_1\) מחובר דרך R (למטה) לצומת, ומשם דרך R נוסף לצומת השלילי של \(A_2\), שכבר מצאנו שהוא \(2\text{V}\). באותה שרשרת מחובר גם ההדק החיובי של \(A_3\). מי מושך זרם מהשרשרת הזו? אף אחד: קצותיה הם הדקי כניסה. <b>לכן אין זרם בשני נגדי ה-R האלה, וכל השרשרת נמצאת ב-\(2\text{V}\).</b></p>
<p>אז ההדק החיובי של \(A_1\) הוא \(2\text{V}\), וקצר מדומה: ההדק השלילי שלו גם \(2\text{V}\).</p>
<p>KCL בהדק השלילי (שוב: אין זרם לתוך ההדק, אז מה שנכנס מהמשוב יוצא לכיוון \(V_{in1}\)):</p>
\[\frac{V_{in1}-2}{R}+\frac{V_{o1}-2}{R}=0\ \Rightarrow\ \frac{1-2}{R}+\frac{V_{o1}-2}{R}=0\ \Rightarrow\ \boxed{V_{o1}=3\ \text{V}}\]
<p>הזרמים: בנגד הכניסה \(\frac{1-2}{5\text{k}}=-0.2\ \text{mA}\), כלומר \(0.2\text{mA}\) זורם <i>מהצומת (2V) החוצה אל \(V_{in1}\) (1V)</i>, מגבוה לנמוך. בנגד המשוב \(\frac{3-2}{5\text{k}}=0.2\ \text{mA}\) מ-\(V_{o1}\) אל הצומת. נכנס 0.2, יוצא 0.2 <span class="ok-t">✓</span>.</p>
<p>הזיהוי בדיעבד: \(A_1\) הוא מגבר הפרש עם הגבר 1: \(V_{o1}=2V_{ref}-V_{in1}=2\cdot2-1\).</p>`},
{t:'סעיף א · \\(A_3\\): ארבעה זרמים בצומת אחד',b:RX`<p>ההדק החיובי של \(A_3\) הוא חלק מהשרשרת שמצאנו: \(2\text{V}\). קצר מדומה: ההדק השלילי \(2\text{V}\). לצומת הזה מגיעים ארבעה נגדי \(2R=10\text{k}\):</p>
<ul><li>מ-\(V_{o1}=3\text{V}\): \(\frac{3-2}{10\text{k}}=0.1\ \text{mA}\) נכנס.</li>
<li>מ-\(V_{o2}=4\text{V}\): \(\frac{4-2}{10\text{k}}=0.2\ \text{mA}\) נכנס.</li>
<li>מהצומת השלילי של \(A_1\) (הנגד \(2R\) העליון): שני הקצוות ב-\(2\text{V}\). \(\frac{2-2}{10\text{k}}=0\). אפס זרם.</li>
<li>אל \(V_{o3}\): כל מה שנכנס חייב לצאת דרכו (אין זרם לתוך ההדק).</li></ul>
\[\frac{2-V_{o3}}{10\text{k}}=0.1+0.2=0.3\ \text{mA}\ \Rightarrow\ 2-V_{o3}=3\ \Rightarrow\ \boxed{V_{o3}=-1\ \text{V}}\]
<p>\(0.3\text{mA}\) זורם מהצומת (2V) דרך נגד המשוב אל המוצא \((-1\text{V})\); \(A_3\) בולע אותו. שים לב לתוצאה הכללית: \(V_{o3}=V_{in1}-V_{in2}\). כל הרשת הזו היא מגבר הפרש אחד גדול. במעגל החי, שנה את הכניסות ותראה שזה תמיד מתקיים.</p>
<p><b>סיכום הפוטנציאלים:</b> כל ששת הדקי הכניסה: \(2\text{V}\). \(V_{o1}=3\), \(V_{o2}=4\), \(V_{o3}=-1\text{V}\). <b>הזרמים:</b> 0.2mA בשני הנגדים של \(A_1\); 0.2mA בשני ה-2R של \(A_2\); 0.2mA ב-2R מ-\(V_{o2}\); 0.1mA ב-2R מ-\(V_{o1}\); 0.3mA בנגד המשוב של \(A_3\); אפס ב-2R העליון ובשני נגדי R של השרשרת החיובית.</p>`},
{t:'סעיף ב · אילו נגדים אפשר לקצר',b:RX`<p>לקצר נגד פירושו להחליף אותו בחוט. אם דרך הנגד ממילא לא עובר זרם, אז שני קצותיו כבר באותו מתח, והחלפתו בחוט לא משנה שום מתח ושום זרם במעגל. לכן התשובה: <b>כל הנגדים שהזרם בהם אפס</b>:</p>
<ul><li>הנגד \(2R\) העליון (בין הצומת השלילי של \(A_1\) לצומת השלילי של \(A_3\)).</li>
<li>הנגד R בין ההדק החיובי של \(A_1\) לשרשרת.</li>
<li>הנגד R בין השרשרת לצומת השלילי של \(A_2\) / ההדק החיובי של \(A_3\).</li></ul>
<p>ולמה <i>לא</i> את נגד ה-R שבין \(V_{in2}\) להדק החיובי של \(A_2\)? גם בו אין זרם, וגם אותו אפשר לקצר בלי שינוי, כל עוד \(V_{in2}\) הוא מקור מתח אידיאלי. הפתרון הרשמי מנסח: "את כל הנגדים שדרכם לא זורם זרם", וזה כולל אותו. במעגל החי, הנגדים האלה מצוירים כהים, ואפשר לראות שהם נשארים כהים לכל ערך של הכניסות.</p>
`+co('key','🎯','למה זו השאלה הכי "זולה" במבחן',RX`<p>20 נקודות בלי אף נוסחה מעבר לחוק אוהם. מה שנבדק זה משמעת: לסמן קודם את הידוע, לזכור ש-\(I_\pm=0\), ולבדוק KCL בכל צומת בסוף. אם סימנת 2V על שישה הדקים לפני שהתחלת לחשב, השאלה נפתרת בעשר דקות.</p>`)}
],
ans:RX`כל הדקי הכניסה ב-2V · \(V_{o1}=3\text{V}\), \(V_{o2}=4\text{V}\), \(V_{o3}=-1\text{V}\)<br>זרמים: 0.2mA (נגדי \(A_1\), נגדי \(A_2\), 2R מ-\(V_{o2}\)), 0.1mA (2R מ-\(V_{o1}\)), 0.3mA (משוב \(A_3\)), 0 בשאר<br>אפשר לקצר: כל הנגדים ללא זרם (2R העליון ונגדי ה-R של ההדקים החיוביים)`}

      (pr.live?'<div class="xlive"><div class="eyebrow">🔬 מעגל חי לשאלה</div><div id="'+lid+'"></div></div>':'')+
      '<div class="sbar"><button type="button" class="btn solid" data-a="next">הצג את השלב הבא</button><button type="button" class="btn line" data-a="all">הצג הכול</button><button type="button" class="btn" data-a="hide">הסתר</button><span class="cnt"></span></div><div class="steps">'+

      '<div class="stp ans locked" data-open="false"><button type="button" aria-expanded="false"><span class="k">✓</span><span>תשובה סופית</span><span class="chev">▾</span></button><div class="sb" hidden>'+pr.ans+'</div></div></div></div>';
    host.appendChild(s);
    if(pr.fig){const Cc=Circuit(fid,pr.w||440,pr.h||240);pr.fig(Cc);}
    if(pr.live)pr.live(document.getElementById(lid),lid);
    const stps=[...s.querySelectorAll('.stp')],cnt=s.querySelector('.cnt');let shown=0;
    const setOpen=(el,o)=>{el.dataset.open=o?'true':'false';el.querySelector('.sb').hidden=!o;el.querySelector('button').setAttribute('aria-expanded',o?'true':'false');};
    const upd=()=>{stps.forEach((el,i)=>el.classList.toggle('locked',i>shown));cnt.textContent=Math.min(shown,stps.length)+' / '+stps.length;};
    const reveal=k=>{for(let i=0;i<k&&i<stps.length;i++)setOpen(stps[i],true);shown=Math.max(shown,Math.min(k,stps.length));upd();};
    stps.forEach((el,i)=>el.querySelector('button').onclick=()=>{if(i>shown)return;if(i===shown){reveal(i+1);return;}setOpen(el,el.dataset.open!=='true');});
    s.querySelector('[data-a="next"]').onclick=()=>{reveal(shown+1);const el=stps[shown-1];if(el)el.scrollIntoView({block:'nearest',behavior:reduced?'auto':'smooth'});};
    s.querySelector('[data-a="all"]').onclick=()=>reveal(stps.length);
    s.querySelector('[data-a="hide"]').onclick=()=>{stps.forEach(el=>setOpen(el,false));shown=0;upd();};
    upd();});
}

/* ---------- formula sheet (LaTeX) ---------- */
function copyText(t,btn){const done=()=>{const o=btn.textContent;btn.textContent='הועתק ✓';setTimeout(()=>btn.textContent=o,1400);};
  const fb=()=>{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){}ta.remove();};
  try{navigator.clipboard.writeText(t).then(done,fb);}catch(e){fb();}}
function texDoc(){return FORMULAS.map(L=>'% ===== שיעור '+L.n+': '+L.title+' =====\n'+L.groups.map(g=>'% --- '+g.h+' ---\n'+g.items.map(i=>(i.l?'% '+i.l.replace(/<[^>]+>/g,'')+'\n':'')+'\\['+i.t+'\\]').join('\n')).join('\n')).join('\n\n');}
function buildFormulas(d){
  d.innerHTML='<div class="lhead"><div class="kicker">דף נוסחאות · LaTeX</div><h1>כל הנוסחאות של הקורס</h1><p class="sub">'+FORMULAS.reduce((a,L)=>a+L.groups.reduce((b,g)=>b+g.items.length,0),0)+' נוסחאות מ-9 השיעורים. ליד כל נוסחה יש כפתור להעתקת קוד ה-LaTeX. גרסה מקוצרת פתוחה תמיד בכפתור Σ בפינה.</p>'+
    '<input class="search" id="fsearch" type="search" placeholder="חיפוש: זנר, CMRR, g_m, \\\\frac…" aria-label="חיפוש נוסחה">'+
    '<div class="presets" style="margin-top:10px"><button type="button" id="fcode">הצג קוד לכל הנוסחאות</button><button type="button" id="fall">העתק את כל הקוד</button></div>'+
    '<div class="chips" id="fchips"></div></div><div id="flist"></div>';
  const list=d.querySelector('#flist');let k=0;
  list.innerHTML=FORMULAS.map(L=>'<section class="fgroup" id="fl-'+L.n+'"><h2 style="font-size:22px">שיעור '+L.n+' · '+L.title+'</h2>'+L.groups.map(g=>'<h3 class="fh">'+g.h+'</h3>'+g.items.map(i=>{k++;
      return '<div class="frow2" data-t="'+(g.h+' '+i.l+' '+i.t).replace(/<[^>]+>/g,'').replace(/"/g,'').toLowerCase()+'">'+(i.l?'<div class="fn">'+i.l+'</div>':'')+
      '<div class="fmath" dir="ltr">\\['+i.t.replace(/</g,'&lt;')+'\\]</div><div class="fbar"><button type="button" class="btn fcopy" data-k="'+k+'">העתק LaTeX</button><button type="button" class="btn ftog">קוד</button></div><pre class="fcode" dir="ltr" hidden>'+i.t.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</pre></div>';}).join('')).join('')+'</section>').join('');
  const all=[];FORMULAS.forEach(L=>L.groups.forEach(g=>g.items.forEach(i=>all.push(i.t))));
  list.querySelectorAll('.fcopy').forEach(b=>b.onclick=()=>copyText(all[+b.dataset.k-1],b));
  list.querySelectorAll('.ftog').forEach(b=>b.onclick=()=>{const pre=b.closest('.frow2').querySelector('pre');pre.hidden=!pre.hidden;});
  let shown=false;d.querySelector('#fcode').onclick=e=>{shown=!shown;list.querySelectorAll('pre.fcode').forEach(p=>p.hidden=!shown);e.target.textContent=shown?'הסתר את הקוד':'הצג קוד לכל הנוסחאות';};
  d.querySelector('#fall').onclick=e=>copyText(texDoc(),e.target);
  const ch=d.querySelector('#fchips');FORMULAS.forEach(L=>{const b=document.createElement('button');b.type='button';b.textContent=L.n+'. '+L.title;b.onclick=()=>document.getElementById('fl-'+L.n).scrollIntoView({behavior:reduced?'auto':'smooth'});ch.appendChild(b);});
  d.querySelector('#fsearch').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();
    list.querySelectorAll('.fgroup').forEach(g=>{let any=false;g.querySelectorAll('.frow2').forEach(r=>{const ok=!q||r.dataset.t.includes(q);r.hidden=!ok;any=any||ok;});g.querySelectorAll('.fh').forEach(h=>{let n=h.nextElementSibling,vis=false;while(n&&n.classList.contains('frow2')){if(!n.hidden)vis=true;n=n.nextElementSibling;}h.hidden=!vis;});g.hidden=!any;});});
  typeset(list);
}

/* ---------- mock exam ---------- */
const EXAM_N=20,EXAM_T=60*60;
let examTimer=0;
function buildExam(d){d.innerHTML='<div id="exhost"></div>';examRender();}
function examState(){return store.get('exam',null);}
function examRender(){
  clearInterval(examTimer);const host=document.getElementById('exhost');if(!host)return;const S=examState();
  if(!S)return examIntro(host);if(S.done)return examReport(host,S);return examRun(host,S);}
function examIntro(host){
  const hist=store.get('examHist',[]);
  host.innerHTML='<div class="lhead"><div class="kicker">מצב מבחן</div><h1>סימולטור מבחן מסכם</h1><p class="sub">'+EXAM_N+' שאלות אקראיות מכל 9 השיעורים (לפחות שתיים מכל שיעור), 60 דקות. בזמן המבחן אין משוב. בסיום מקבלים ציון, פירוק לפי נושאים, רשימת נושאים חלשים וסקירה של כל שאלה עם ההסבר.</p></div>'+
    '<div class="notes"><div class="note"><h3>כללים</h3><ul><li>אפשר לדלג, לחזור ולסמן שאלה לבדיקה חוזרת (🚩).</li><li>המבחן נשמר בדפדפן, כך שרענון הדף לא מאפס אותו.</li><li>כשהזמן נגמר, המבחן מוגש אוטומטית.</li></ul><div class="cta"><button type="button" class="btn solid" id="exstart">התחל מבחן ⏱️</button></div></div>'+
    '<div class="note fx-box"><h3>מבחנים קודמים</h3>'+(hist.length?'<div class="hist">'+hist.slice(-8).reverse().map(h=>'<span class="pill '+(h.p>=80?'ok':h.p>=60?'warn':'bad')+'">'+h.p+'% · '+new Date(h.t).toLocaleDateString('he-IL')+'</span>').join('')+'</div>':'<p class="muted">עוד לא עשית מבחן. זה הזמן.</p>')+'</div></div>';
  host.querySelector('#exstart').onclick=examStart;}
function examStart(){
  const by={};ORDER.forEach(n=>{by[n]=quizOf(n).map((q,i)=>[n,i]);for(let i=by[n].length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[by[n][i],by[n][j]]=[by[n][j],by[n][i]];}});
  let ids=[];ORDER.forEach(n=>ids.push(...by[n].splice(0,2)));
  const rest=[];ORDER.forEach(n=>rest.push(...by[n]));for(let i=rest.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[rest[i],rest[j]]=[rest[j],rest[i]];}
  ids=ids.concat(rest.slice(0,EXAM_N-ids.length));for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]];}
  store.set('exam',{ids,ans:{},flag:{},cur:0,start:Date.now(),done:false});examRender();}
const fmtT=s=>{s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
function examRun(host,S){
  const left=()=>EXAM_T-(Date.now()-S.start)/1000;
  if(left()<=0)return examFinish();
  const q=i=>quizOf(S.ids[i][0])[S.ids[i][1]];
  host.innerHTML='<div class="exhead"><span class="timer" id="extimer">'+fmtT(left())+'</span><div class="qgrid" id="exgrid"></div><span style="flex:1"></span><button type="button" class="btn solid" id="exsubmit">הגש מבחן</button></div><div id="exq"></div>';
  const grid=host.querySelector('#exgrid'),qh=host.querySelector('#exq');
  function drawGrid(){grid.innerHTML=S.ids.map((_,i)=>'<button type="button" class="'+(S.ans[i]!==undefined?'ans ':'')+(S.flag[i]?'flag ':'')+(i===S.cur?'cur':'')+'" data-i="'+i+'" aria-label="שאלה '+(i+1)+'">'+(i+1)+'</button>').join('');
    grid.querySelectorAll('button').forEach(b=>b.onclick=()=>{S.cur=+b.dataset.i;save();drawQ();drawGrid();});}
  function save(){store.set('exam',S);}
  function drawQ(){const i=S.cur,Q=q(i),n=S.ids[i][0];
    qh.innerHTML='<div class="q" style="margin-top:16px"><div class="qn"><span>שאלה '+(i+1)+' מתוך '+S.ids.length+'</span><span class="badge gray">שיעור '+n+' · '+LESSONS[n].title+'</span></div><p class="qt">'+Q.q+'</p><div class="opts">'+Q.o.map((o,j)=>'<button type="button" data-j="'+j+'" class="'+(S.ans[i]===j?'pick':'')+'"><span class="L">'+LET[j]+'</span><span>'+o+'</span></button>').join('')+'</div></div>'+
      '<div class="pnav" style="margin-top:14px"><button type="button" class="btn line" id="exprev" '+(i===0?'disabled':'')+'>→ הקודמת</button><button type="button" class="btn" id="exflag">'+(S.flag[i]?'🚩 הסר סימון':'🚩 סמן לבדיקה')+'</button><button type="button" class="btn solid" id="exnext">'+(i===S.ids.length-1?'סיום וסקירה':'הבאה ←')+'</button></div>';
    qh.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{S.ans[i]=+b.dataset.j;save();drawQ();drawGrid();});
    qh.querySelector('#exprev').onclick=()=>{if(S.cur>0){S.cur--;save();drawQ();drawGrid();}};
    qh.querySelector('#exnext').onclick=()=>{if(S.cur<S.ids.length-1){S.cur++;save();drawQ();drawGrid();}else confirmSubmit();};
    qh.querySelector('#exflag').onclick=()=>{S.flag[i]=!S.flag[i];save();drawQ();drawGrid();};
    typeset(qh);}
  function confirmSubmit(){const un=S.ids.length-Object.keys(S.ans).length;const b=host.querySelector('#exsubmit');
    if(un>0&&b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='יש '+un+' שאלות בלי תשובה. להגיש בכל זאת?';setTimeout(()=>{b.dataset.sure='';b.textContent='הגש מבחן';},4000);return;}examFinish();}
  host.querySelector('#exsubmit').onclick=confirmSubmit;
  drawGrid();drawQ();
  const tEl=host.querySelector('#extimer');
  examTimer=setInterval(()=>{const l=left();if(!document.body.contains(tEl)){clearInterval(examTimer);return;}tEl.textContent=fmtT(l);tEl.classList.toggle('low',l<300);if(l<=0){clearInterval(examTimer);examFinish();}},1000);
}
function examFinish(){const S=examState();if(!S)return;S.done=true;S.end=Math.min(Date.now(),S.start+EXAM_T*1000);
  const c=S.ids.filter((id,i)=>S.ans[i]===quizOf(id[0])[id[1]].a).length;S.pct=Math.round(c/S.ids.length*100);
  store.set('exam',S);const h=store.get('examHist',[]);h.push({p:S.pct,t:Date.now()});store.set('examHist',h.slice(-20));examRender();}
function examReport(host,S){
  const per={};S.ids.forEach((id,i)=>{const n=id[0];per[n]=per[n]||{c:0,t:0};per[n].t++;if(S.ans[i]===quizOf(n)[id[1]].a)per[n].c++;});
  const c=S.ids.filter((id,i)=>S.ans[i]===quizOf(id[0])[id[1]].a).length,dur=(S.end-S.start)/1000;
  const weak=Object.keys(per).filter(n=>per[n].c/per[n].t<0.6).map(Number);
  const col=r=>r>=0.8?'var(--ok)':r>=0.6?'var(--warn)':'var(--bad)';
  host.innerHTML='<div class="lhead"><div class="kicker">דוח מבחן</div><h1>התוצאה שלך</h1></div>'+
    '<div class="bigscore"><span class="sc" style="color:'+col(c/S.ids.length)+'">'+S.pct+'%</span><div><b>'+c+' מתוך '+S.ids.length+' נכונות</b><div class="muted">זמן: '+fmtT(dur)+' מתוך 60:00 · '+(S.pct>=80?'מוכן למבחן בנושאים האלה':S.pct>=60?'בסיס טוב, יש מה לחזק':'כדאי לחזור על הנושאים החלשים')+'</div></div><span style="flex:1"></span><button type="button" class="btn solid" id="exagain">מבחן חדש</button></div>'+
    '<div class="notes"><div class="note"><h3>פירוק לפי נושאים</h3><div class="tbars">'+ORDER.filter(n=>per[n]).map(n=>{const r=per[n].c/per[n].t;return '<div class="tbar"><span>'+n+'. '+LESSONS[n].title+'</span><span class="tb"><span style="width:'+(r*100)+'%;background:'+col(r)+'"></span></span><span class="v">'+per[n].c+'/'+per[n].t+'</span></div>';}).join('')+'</div></div>'+
    '<div class="note fx-box"><h3>נושאים לחיזוק</h3>'+(weak.length?'<p>פחות מ-60% הצלחה. מומלץ לעבור על האלגוריתם ואז על הבוחן של השיעור:</p><div class="cta">'+weak.map(n=>'<a class="btn" href="#/l/'+n+'/'+(full(n)?'algo':'lab')+'">'+n+'. '+LESSONS[n].title+'</a>').join('')+'</div>':'<p>אין נושא מתחת ל-60%. כל הכבוד! נסה מבחן נוסף כדי לכסות שאלות אחרות.</p>')+'</div></div>'+

    '<div class="scopes"><div class="verdict" id="cl-verdict"></div><div id="cl-circ-host"></div><div class="readouts" id="cl-ro" style="margin-top:0"></div><div class="csteps"><h3>הפתרון צעד אחר צעד</h3><ol id="cl-steps"></ol></div></div></div>';
  const V={};let type='nmos',bias='div';
  const circs={};

    const C=Circuit(id,440,250);

      if(bias==='div'){C.rail(150,20,bj?'V_{CC}':'V_{DD}');C.w([150,20],[150,32]);C.R([150,32],[150,122],bj?'R_1':'R_{G1}',{side:1,off:18});C.w([150,122],[150,140]);C.nd(150,140);C.R([150,140],[150,222],bj?'R_2':'R_{G2}',{side:1,off:18});C.G(150,222);}

      else{C.V([150,222],[150,160],'V_G',{side:-1,off:28});C.G(150,222);C.w([150,160],[150,140]);}
      C.rail(300,20,bj?'V_{CC}':'V_{DD}');C.w([300,20],[300,32]);C.R([300,32],[300,96],bj?'R_C':'R_D',{side:-1,off:18});C.w([300,96],[300,110]);
      const t=bj?C.npn(290,140,{}):C.mos(290,140,{});C.w([300,170],[300,180]);C.R([300,180],[300,226],bj?'R_E':'R_S',{side:-1,off:18});C.G(300,226);

      if(bias==='div'){C.rail(150,20,'V_{DD}');C.w([150,20],[150,32]);C.R([150,32],[150,122],'R_{G1}',{side:1,off:18});C.w([150,122],[150,140]);C.nd(150,140);C.R([150,140],[150,222],'R_{G2}',{side:1,off:18});C.G(150,222);}

  function fields(){const box=d.querySelector('#cl-fields');const F2=CALC_F[type];

  const g=k=>{const el=d.querySelector('#cf-'+k);const v=el?parseFloat(el.value):NaN;return isFinite(v)?v:0;};

      let VBB,RB;if(bias==='div'){const R1=g('R1')*1e3,R2=g('R2')*1e3;VBB=VCC*R2/(R1+R2);RB=par(R1,R2);st.push('תבנין בבסיס: \\(V_{BB}=V_{CC}\\frac{R_2}{R_1+R_2}='+f3(VBB)+'\\text{V}\\), \\(R_B=R_1\\parallel R_2='+f3(RB/1e3)+'\\text{k}\\Omega\\).');}

      else{IB=(VBB-VBE)/(RB+(b+1)*RE);IC=b*IB;IE=IB+IC;VCE=VCC-IC*RC-IE*RE;
        st.push('הנחת פעיל קדמי. KVL בבסיס: \\(I_B=\\frac{V_{BB}-V_{BE}}{R_B+(\\beta+1)R_E}='+f3(IB*1e6,2)+'\\,\\mu\\text{A}\\).');
        st.push('\\(I_C=\\beta I_B='+f3(IC*1e3)+'\\text{mA}\\), \\(I_E='+f3(IE*1e3)+'\\text{mA}\\).');

        if(VCE>=VCEs){mode='act';st.push('בדיקה: \\(V_{CE}='+f3(VCE)+'\\ge V_{CE,sat}='+VCEs+'\\) ✓ <b>פעיל קדמי</b>.');}
        else{mode='sat';const a11=RB+RE,a12=RE,b1=VBB-VBE,a21=RE,a22=RC+RE,b2=VCC-VCEs,det=a11*a22-a12*a21;IB=(b1*a22-a12*b2)/det;IC=(a11*b2-a21*b1)/det;IE=IB+IC;VCE=VCEs;
          st.push('בדיקה: \\(V_{CE}\\lt V_{CE,sat}\\) ✗, ולכן <b>רוויה</b>. קובעים \\(V_{CE}='+VCEs+'\\text{V}\\) ופותרים שתי משוואות KVL: \\(I_B='+f3(IB*1e6,2)+'\\mu\\text{A}\\), \\(I_C='+f3(IC*1e3)+'\\text{mA}\\), \\(\\beta_{forced}='+f3(IC/IB,1)+'\\lt\\beta\\).');}}
      const names={cut:pill('קטעון','bad'),act:pill('פעיל קדמי','ok'),sat:pill('רוויה','warn')};
      verdict=names[mode]+'<span>'+(mode==='act'?'מתאים למגבר: אפשר לעבור לאות קטן.':mode==='sat'?'הטרנזיסטור כמתג סגור. כדי לחזור לפעיל: הגדל R<sub>B</sub> או הקטן R<sub>C</sub>.':'אין הולכה: V<sub>BB</sub> נמוך מדי.')+'</span>';
      const gm=IC/VT,rpi=b/gm,re=(b/(b+1))/gm,ro_=VA>0?VA/IC:Infinity;
      ro.push(['I<sub>B</sub>',si(IB,'A')],['I<sub>C</sub>',si(IC,'A')],['I<sub>E</sub>',si(IE,'A')],['V<sub>CE</sub>',fx(VCE,3)+' V'],['V<sub>E</sub> / V<sub>C</sub>',fx(IE*RE,2)+' / '+fx(VCC-IC*RC,2)+' V']);
      if(mode==='act'){ro.push(['g<sub>m</sub> = I<sub>C</sub>/V<sub>T</sub>',si(gm,'S')],['r<sub>π</sub> = β/g<sub>m</sub>',si(rpi,'Ω')],['r<sub>e</sub> = α/g<sub>m</sub>',si(re,'Ω')],['r<sub>o</sub> = V<sub>A</sub>/I<sub>C</sub>',si(ro_,'Ω')]);
        st.push('אות קטן: \\(g_m=\\frac{I_C}{V_T}='+f3(gm*1e3,2)+'\\,\\text{mA/V}\\), \\(r_\\pi=\\frac{\\beta}{g_m}='+f3(rpi/1e3,3)+'\\text{k}\\Omega\\), \\(r_e='+f3(re,1)+'\\Omega\\)'+(isFinite(ro_)?', \\(r_o='+f3(ro_/1e3,1)+'\\text{k}\\Omega\\)':'')+'.');}
    } else {

      let VG;if(bias==='div'){const R1=g('RG1')*1e3,R2=g('RG2')*1e3;VG=VDD*R2/(R1+R2);st.push('\\(i_G=0\\), מחלק מתח לא מועמס: \\(V_G=V_{DD}\\frac{R_{G2}}{R_{G1}+R_{G2}}='+f3(VG)+'\\text{V}\\).');}else{VG=g('VG');st.push('מתח שער נתון: \\(V_G='+f3(VG)+'\\text{V}\\).');}

          if(lo!=null){for(let k=0;k<80;k++){const m=(lo+hi)/2;if((f(lo)>0)===(f(m)>0))lo=m;else hi=m;}ID=(lo+hi)/2;}else{ID=Imax;}

    document.getElementById('mtitle').textContent=n+'. '+LESSONS[n].title;
    if(!m[3])window.scrollTo(0,0);kickLoop();return;}
  if(h.startsWith('#/f')){cur={page:'f',n:0,tab:''};page('f',buildFormulas);navMark('f');document.getElementById('mtitle').textContent='דף נוסחאות';}
  else if(h.startsWith('#/exam')){cur={page:'exam',n:0,tab:''};const p=page('exam',buildExam);if(p._init)examRender();p._init=1;navMark('exam');document.getElementById('mtitle').textContent='סימולטור מבחן';}
  else if(h.startsWith('#/x2026')){cur={page:'x2026',n:0,tab:''};page('x2026',X26.build);navMark('');document.getElementById('mtitle').textContent='פתרון מבחן 2026';}
  else if(h.startsWith('#/calc')){cur={page:'calc',n:0,tab:''};page('calc',buildCalc);navMark('calc');document.getElementById('mtitle').textContent='מחשבון נקודת עבודה';}
  else if(h.startsWith('#/q')){cur={page:'q',n:0,tab:''};page('q',buildPractice);navMark('');document.getElementById('mtitle').textContent='תרגול מעורב';}
  else{cur={page:'home',n:0,tab:''};page('home',buildHome);navMark('home');homeRefresh();document.getElementById('mtitle').textContent='אלקטרוניקה תקבילית';}
  refreshProgress();window.scrollTo(0,0);kickLoop();
}
window.addEventListener('hashchange',route);
applyTheme();route();

})();
</script>
