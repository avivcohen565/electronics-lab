theory:[
{t:'המודל של מעגל מיישר זרם',h:R`
<p>המטרה: להפוך את מתח הרשת (AC) למתח DC קבוע שמזין עומס. בסיכום התהליך מחולק לשרשרת של חמישה בלוקים, וכל אחד מטפל בשלב אחד:</p>
<div class="tbl"><table><thead><tr><th>#</th><th>בלוק</th><th>מה הוא עושה</th><th>צורת האות אחריו</th></tr></thead><tbody>
<tr><td>1</td><td>שנאי הספק (Power Transformer)</td><td>מוריד את מתח הרשת לאמפליטודה \(V_S\) מתאימה</td><td>סינוס \(\pm V_S\)</td></tr>
<tr><td>2</td><td>מיישר דיודות (Diode Rectifier)</td><td>מעביר רק קטבית אחת / הופך את החצי השלילי</td><td>"גבעות" (חצי-גל או גל-שלם)</td></tr>
<tr><td>3</td><td>מסנן (Filter, LPF)</td><td>מחליק את הגבעות</td><td>DC עם גליות קטנה</td></tr>
<tr><td>4</td><td>מייצב מתח (Voltage Regulator)</td><td>מוריד את שארית הגליות</td><td>DC קבוע \(v_{out}\)</td></tr>
<tr><td>5</td><td>עומס (Load)</td><td>צורך את ה-DC</td><td>—</td></tr>
</tbody></table></div>
<p>מתח הרשת בסיכום: \(220\text{V}_{rms}\), כלומר שיא של \(220\sqrt2\approx311\text{V}\), בתדר \(f=50\text{Hz}\).</p>
`+co('analogy','🏭','אנלוגיה: פס ייצור','<p>כל תחנה בפס עושה פעולה אחת בלבד, והמוצר של תחנה אחת הוא חומר הגלם של הבאה. לכן לומדים כל בלוק לחוד ואז מחברים: שנאי → מיישר → מסנן → מייצב.</p>')},

{t:'שנאי אידיאלי ומקדם ההשנאה',h:R`
<p>שנאי = סלילים <b>מצומדים</b> שמעבירים שטף מגנטי דרך ליבה פרומגנטית. בשאלות הקורס השנאי תמיד <b>אידיאלי</b>:</p>
<ol><li>מקדם צימוד מלא: \(k=1\).</li><li>השראות הסלילים גדולה מאוד ביחס לעומס: \(L_1,L_2\to\infty\).</li><li>אין איבודי אנרגיה: \(P_{in}=P_{out}\).</li></ol>
<p>הסליל הראשי (Primary, צד הכניסה) והמשני (Secondary, צד המוצא). מקדם ההשנאה:</p>
\[a=\frac{N_P}{N_S}=\frac{V_P}{V_S}=\frac{I_S}{I_P}\]
<p>המתחים מתייחסים כמו מספרי הליפופים, והזרמים ביחס <b>הפוך</b> (כי ההספק נשמר).</p>
`+co('warn','⚠️','איך היחס ניתן בשאלה','<p>בשאלות הראשי מסומן \\(N_1\\) והמשני \\(N_2\\). לפעמים נותנים \\(\\frac{N_2}{N_1}\\) (או \\(N_2:N_1\\)), שהוא <b>ההופכי</b> של \\(a\\), ולפעמים \\(\\frac{N_1}{N_2}\\) לפי ההגדרה. למשל \\(N_2:N_1=1:25\\) פירושו \\(\\frac{N_2}{N_1}=\\frac1{25}\\); ו-\\(\\frac{N_1}{N_2}=10\\) פירושו \\(a=10\\). תמיד בדוק מי במונה.</p>')+golab(2,'l2-tr','שחק עם יחס הליפופים')},

{t:'שנאי עם סנף מרכזי',h:R`
<p>ב-center tapped transformer יש יציאה נוספת <b>באמצע</b> הסליל המשני. הוא מחולק לשני חצאים שווים, ולכן:</p>
\[|v_{S1}|=|v_{S2}|\]
<p>אם מחברים את <b>הסנף המרכזי לאדמה</b>, שני הקצוות מקבלים מתחים <b>מנוגדים</b>: כשהקצה העליון ב-\(+\), התחתון ב-\(-\) באותו גודל. (בשנאי 12-0-12 למשל: הסנף הוא 0V, והקצוות \(\pm12\text{V}\), וביניהם 24V.)</p>
`+co('key','🔑','מה חשוב לזכור','<p>המתח על <b>כל</b> המשני הוא \\(2v_S\\). כשמחשבים יחס ליפופים של כל המשני מול הראשי, משתמשים בסכום שני החצאים.</p>')},

{t:'מיישר חצי-גל (חד-דרכי)',h:R`
<p>המבנה: מקור \(v_S(t)=V_S\sin(\omega t)\), דיודה אחת בטור ונגד עומס \(R\). הדיודה מוליכה רק בחצי החיובי.</p>
<p>עם <b>מודל מעשי</b> של הדיודה (מקור \(V_{D0}\) בטור עם \(r_D\)):</p>
\[v_{out}=\begin{cases}0 & v_S\lt V_{D0}\\ \dfrac{R}{R+r_D}\left(v_S-V_{D0}\right) & v_S\ge V_{D0}\end{cases}\]
<p>כש-\(r_D\ll R\) השיפוע \(\frac{R}{R+r_D}\approx1\) ומקבלים פשוט \(v_{out}=v_S-V_{D0}\). אופיין המעבר (VTC): אפס עד \(V_{D0}\), ואחר כך קו בשיפוע \(\approx1\).</p>
<p>המוצא הוא "גבעות" חיוביות בגובה \(V_{O,P}\) (שיא המוצא, קטן מ-\(V_S\) ב-\(V_{D0}\)), ובחצי השלילי אפס:</p>
\[V_{out,DC}=\frac{V_{O,P}}{\pi}\]\[V_{out,RMS}=\frac{V_{O,P}}{2}\]
`+golab(2,'l2-live','ראה את הזרם במיישר רגע אחר רגע')},

{t:'בחירת דיודה: זרם ו-PIV',h:R`
<p>שני פרמטרים קובעים איזו דיודה מתאימה למיישר:</p>
<ul><li><b>זרם מרבי</b> שהדיודה מסוגלת להעביר.</li><li><b>PIV</b> (Peak Inverse Voltage): הממתח האחורי המרבי שהדיודה סופגת בלי להישבר (בלי להגיע לאזור הפריצה).</li></ul>
<p>במיישר חצי-גל, בשיא השלילי האנודה ב-\(-V_S\) והקתודה ב-0V (אין זרם, אין מתח על \(R\)):</p>
\[\text{PIV}=0-(-V_S)=V_S\]
`+co('why','💡','למה זה חשוב?','<p>אם ה-PIV של המעגל גדול מדירוג הדיודה, היא נפרצת בכל מחזור. לכן בכל מיישר מחשבים "מה המתח האחורי הגדול ביותר" לפי מבנה המעגל, ובוחרים דיודה עם מרווח.</p>')+co('warn','⚠️','\\(V_S\\) הוא אמפליטודה','<p>בכל הנוסחאות \\(v_S(t)=V_S\\sin(\\omega t)\\), כלומר \\(V_S\\) הוא <b>שיא</b>. אם נתון ערך יעיל, כפול ב-\\(\\sqrt2\\) קודם.</p>')},

{t:'גל-שלם: שנאי עם סנף מרכזי ו-2 דיודות',h:R`
<p>לכל חצי של המשני יש דיודה משלו (\(D_1\) מהקצה העליון, \(D_2\) מהתחתון), ושתיהן מזינות את אותו \(R\). הסנף המרכזי מחובר לאדמה.</p>
<ul><li>חצי חיובי: הקצה העליון ב-\(+V_S\), \(D_1\) מוליכה, \(D_2\) בקטעון.</li><li>חצי שלילי: הקצה התחתון ב-\(+V_S\), \(D_2\) מוליכה, \(D_1\) בקטעון.</li></ul>
<p>כל ענף תורם גבעה אחת במחזור; ביחד מקבלים גבעה <b>בכל חצי מחזור</b>. אופיין המעבר סימטרי: שיפוע \(\approx+1\) עבור \(v_S>V_{D0}\) ושיפוע \(\approx-1\) עבור \(v_S\lt -V_{D0}\).</p>
<p><b>PIV:</b> כש-\(D_1\) מוליכה, הקתודה של \(D_2\) (המוצא) ב-\(V_S-V_D\) והאנודה שלה ב-\(-V_S\):</p>
\[\text{PIV}=(V_S-V_D)-(-V_S)=2V_S-V_D\]
<p><b>ערכי המוצא:</b></p>
\[V_{out,RMS}=\frac{V_{O,P}}{\sqrt2}\]\[V_{out,DC}=\frac{2V_{O,P}}{\pi}\]\[V_{O,P}=V_S-V_D\]
`+co('analogy','🚣','אנלוגיה: שני חותרים','<p>כל חותר (דיודה) מושך רק בכיוון אחד, אבל הם מתחלפים כל חצי מחזור. הסירה (העומס) מקבלת דחיפה בכל חצי מחזור במקום בחצי מהזמן, ולכן הממוצע כפול.</p>')},

{t:'גל-שלם: גשר דיודות',h:R`
<p>ארבע דיודות \(D_1..D_4\) וסליל משני רגיל (בלי סנף). בכל חצי מחזור <b>שתי דיודות בטור</b> מוליכות:</p>
<ul><li>חצי חיובי: \(D_1\) ו-\(D_2\) מוליכות.</li><li>חצי שלילי: \(D_3\) ו-\(D_4\) מוליכות.</li></ul>
<p>בשני המקרים הזרם עובר דרך \(R\) <b>באותו כיוון</b>, ולכן המוצא הוא גל שלם. כיוון ששתי דיודות בדרך, שיא המוצא נמוך ב-\(2V_D\):</p>
\[V_{O,P}=V_S-2V_D\]\[V_{out,RMS}=\frac{V_{O,P}}{\sqrt2}\]\[V_{out,DC}=\frac{2V_{O,P}}{\pi}\]
<p><b>PIV:</b> דיודה בקטעון (למשל \(D_4\) בחצי החיובי) רואה בין הדקיה בדיוק את המתח על דיודה מוליכה ועל המשני: \(V_S\) מינוס מפל אחד:</p>
\[\text{PIV}=V_S-V_D\]
<div class="tbl"><table><thead><tr><th></th><th>סנף מרכזי + 2 דיודות</th><th>גשר 4 דיודות</th></tr></thead><tbody>
<tr><td>\(V_{O,P}\)</td><td>\(V_S-V_D\)</td><td>\(V_S-2V_D\)</td></tr>
<tr><td>PIV</td><td>\(2V_S-V_D\)</td><td>\(V_S-V_D\)</td></tr>
<tr><td>דיודות מוליכות בכל רגע</td><td>1</td><td>2</td></tr>
</tbody></table></div>
`+co('key','🔑','הטרייד-אוף','<p>הגשר "משלם" מפל דיודה נוסף במוצא, אבל ה-PIV שלו בערך <b>חצי</b> ולא צריך שנאי עם סנף.</p>')},

{t:'גלאי שיא (Peak Detector)',h:R`
<p><b>אידיאלי</b> (דיודה + קבל \(C\), בלי עומס): בעלייה הראשונה הקבל נטען עד השיא \(V_P\). אחרי השיא \(v_S\) יורד, הדיודה נחסמת, ואין דרך לקבל להתפרק, לכן \(v_{out}=V_P\) קבוע.</p>
<p><b>מעשי</b> (מוסיפים \(R\) במקביל ל-\(C\)): כשהדיודה חסומה הקבל <b>מתפרק דרך \(R\)</b> והמתח יורד מעט, עד שבמחזור הבא \(v_S\) עוקף אותו שוב (רגע \(t_1\)) וטוען אותו חזרה לשיא (\(t_2\)). הירידה בין שני שיאים היא <b>מתח הגליות</b> \(V_r\).</p>
<p>כדי שההתפרקות תהיה קטנה ככל האפשר דורשים קבוע זמן ארוך בהרבה ממחזור:</p>
\[RC\gg T\]
<p><b>צורת הזרם בדיודה:</b> הדיודה מוליכה רק בחלון הקצר \(\Delta t\) (בין \(t_1\) ל-\(t_2\)) ובו היא צריכה להחזיר לקבל את כל המטען שהעומס לקח במחזור. לכן זרם הדיודה הוא <b>פולסים צרים וגבוהים</b>, בעוד זרם העומס \(i_L\) כמעט קבוע.</p>
`+co('analogy','🪣','אנלוגיה: דלי עם חור קטן','<p>הקבל הוא דלי, העומס הוא חור בתחתית. הברז (הדיודה) נפתח רק לרגע בשיא כל גל וממלא את הדלי מחדש. חור קטן (\\(RC\\) גדול) = המפלס כמעט לא יורד. אבל כיוון שהברז פתוח רק לרגע, הוא חייב לזרום חזק מאוד באותו רגע.</p>')},

{t:'גל-שלם עם קבל במקביל לעומס',h:R`
<p>מוסיפים קבל \(C\) במקביל ל-\(R\) במיישר גל-שלם. הקבל נטען פעמיים בכל מחזור, ולכן מתפרק רק חצי מחזור (\(\frac{T}{2}=\frac1{2f}\)), ומכאן ה-\(2f\) במכנה.</p>
<p><b>מתח גליות:</b></p>
<ul><li>שנאי עם סנף מרכזי ו-2 דיודות: \(V_r=\dfrac{V_P-V_D}{2fRC}\)</li><li>גשר דיודות: \(V_r=\dfrac{V_P-2V_D}{2fRC}\)</li></ul>
<p><b>מתח המוצא (DC):</b> המוצא נע בין השיא לשיא פחות \(V_r\), והממוצע באמצע:</p>
\[V_{out,DC}=(V_P-V_D)-\frac12V_r\]
<p><b>זרם בעומס:</b></p>
<ul><li>סנף מרכזי: \(I_L=\dfrac{V_P-V_D}{R}\)</li><li>גשר: \(I_L=\dfrac{V_P-2V_D}{R}\)</li></ul>
<p><b>זרמים בדיודה:</b></p>
\[i_{D,AVG}=I_L\left(1+\pi\sqrt{\frac{V_P}{2V_r}}\right)\]\[i_{D,\max}=I_L\left(1+2\pi\sqrt{\frac{V_P}{2V_r}}\right)\]
`+co('why','💡','מה רואים מהנוסחאות','<p>הגדלת \\(C\\) מקטינה את \\(V_r\\) ומקרבת את \\(V_{out,DC}\\) לשיא, אבל \\(\\sqrt{V_P/2V_r}\\) גדל, כלומר פולסי הזרם בדיודה <b>גדלים</b>. גליות קטנה "עולה" בזרם שיא גבוה בדיודה, ולכן צריך לבדוק את דירוג הזרם שלה.</p>')}
],

  given:R`\(V_{1,rms}=110\text{V}\), כל חצי משני: \(V_{S,rms}=5.5\text{V}\)`,
  ask:R`א. \(a=\frac{N_1}{N_2}\) · ב. נקודת ההארקה`,
  steps:[
   {t:'המתח על כל המשני',b:R`<p>שני החצאים שווים ובטור, לכן על כל הסליל המשני:</p>\[V_{2,rms}=2V_{S,rms}=2\cdot5.5=11\text{ V}\]`},

  ans:R`א. \(a=10\) (יחס לכל המשני). ב. להאריק את הסנף המרכזי: \(v_{S1}=-v_{S2}\), שיא \(\pm7.78\text{V}\).`},

  st:R`(מבחן 2023 סמסטר 3 מועד 1) עבור המיישר שבאיור, כל הדיודות זהות ומתח ההולכה של כל דיודה \(V_D=0.7\text{V}\). א. שרטט שני מחזורים של \(V_{o1}\) ו-\(V_{o2}\) בתלות בזמן, וציין איזו דיודה מוליכה בכל מצב. ב. אם המתח הממוצע של \(V_{o1}\) הוא \(20\text{V}\), חשב את האמפליטודה של \(V_S\). ג. חשב את יחס הליפופים \(\frac{N_2}{N_1}\) הדרוש לקבלת מתח ממוצע של \(|20|\text{V}\) במוצא.`,
  given:R`\(V_{in,eff}=120\text{V}\), \(f=60\text{Hz}\), \(V_D=0.7\text{V}\), שנאי עם סנף מרכזי מוארק, כל חצי \(N_2\) עם מתח \(V_S\)`,
  ask:R`א. צורות גל ודיודות מוליכות · ב. \(V_S\) · ג. \(\frac{N_2}{N_1}\)`,
  steps:[
   {t:'זיהוי המבנה',b:R`<p>הסנף המרכזי מוארק, ולכן הקצה העליון ב-\(+v_S\) והתחתון ב-\(-v_S\). הגשר מחבר את הצומת הימני (הקתודות של \(D_1,D_3\)) ל-\(V_{o1}\), ואת השמאלי (האנודות של \(D_2,D_4\)) ל-\(V_{o2}\). האמצע בין שני הנגדים מוארק. זהו ספק <b>דו-קוטבי</b>: \(V_{o1}\) חיובי ו-\(V_{o2}\) שלילי.</p>`},
   {t:'א. החצי החיובי של vS',b:R`<p>הקצה העליון ב-\(+V_S\): \(D_1\) מוליכה אל \(V_{o1}\) והזרם חוזר דרך ה-R העליון לאדמה ולסנף. הקצה התחתון ב-\(-V_S\): \(D_2\) מוליכה ממוצא \(V_{o2}\) אליו.</p>\[V_{o1}=v_S-V_D\]\[V_{o2}=-(v_S-V_D)\]<p>\(D_3,D_4\) חסומות.</p>`},
   {t:'א. החצי השלילי של vS',b:R`<p>עכשיו הקצה התחתון הוא החיובי: \(D_3\) מוליכה אל \(V_{o1}\), ו-\(D_4\) מוליכה מ-\(V_{o2}\) לקצה העליון (השלילי).</p>\[V_{o1}=|v_S|-V_D\]\[V_{o2}=-(|v_S|-V_D)\]<p>\(D_1,D_2\) חסומות. לכן \(V_{o1}\) הוא גל-שלם חיובי עם שיא \(V_S-V_D\), ו-\(V_{o2}\) תמונת המראה שלו (גבעות שליליות). בכל מסלול יש דיודה <b>אחת</b> בין המשני למוצא, בדיוק כמו במיישר עם סנף מרכזי.</p>`},
   {t:'ב. האמפליטודה של VS',b:R`<p>גל-שלם: \(V_{out,DC}=\frac{2V_{O,P}}{\pi}\) עם \(V_{O,P}=V_S-V_D\):</p>\[V_{O,P}=\frac{\pi\cdot20}{2}=10\pi\approx31.42\text{ V}\]\[V_S=V_{O,P}+V_D\]\[V_S=31.42+0.7\approx32.12\text{ V}\]`},
   {t:'ג. יחס הליפופים',b:R`<p>שיא הכניסה: \(V_{in,p}=120\sqrt2\approx169.71\text{V}\). כל חצי משני מסומן \(N_2\) ונושא \(V_S\):</p>\[\frac{N_2}{N_1}=\frac{V_S}{V_{in,p}}=\frac{32.12}{169.71}\]\[\frac{N_2}{N_1}\approx0.189\approx\frac1{5.28}\]`},
   {t:'בדיקה',b:R`<p>\(\frac{2(32.12-0.7)}{\pi}=20.0\text{V}\) <span class="ok-t">✓</span>. ובשלילי: הממוצע של \(V_{o2}\) הוא \(-20\text{V}\), ולכן בשאלה כתוב \(|20|\text{V}\).</p>`}
  ],
  ans:R`א. חצי חיובי: \(D_1,D_2\) מוליכות; חצי שלילי: \(D_3,D_4\). \(V_{o1}\) גל-שלם חיובי, \(V_{o2}=-V_{o1}\), שיא \(V_S-V_D\). ב. \(V_S\approx32.12\text{V}\). ג. \(\frac{N_2}{N_1}\approx0.189\).`},

  x:['זה ה-RMS של גל-שלם.',null,'זה הערך הממוצע (DC) של חצי-גל.','זה הממוצע של גל-שלם.']},
 {q:'מהו ה-PIV במיישר חצי-גל עם \\(v_S=V_S\\sin(\\omega t)\\) ונגד \\(R\\)?',o:['\\(2V_S\\)','\\(V_S-V_D\\)','\\(V_S\\)','\\(2V_S-V_D\\)'],a:2,

  x:['אין כאן סליל נוסף שמוסיף \\(V_S\\) שני.','זה ה-PIV של הגשר.',null,'זה ה-PIV של מיישר עם סנף מרכזי.']},
 {q:'במיישר גל-שלם עם שנאי בעל סנף מרכזי ו-2 דיודות, מהו ה-PIV?',o:['\\(V_S-V_D\\)','\\(2V_S-V_D\\)','\\(V_S\\)','\\(2V_S-2V_D\\)'],a:1,
  e:'הקתודה של הדיודה החסומה במוצא \\(V_S-V_D\\), האנודה ב-\\(-V_S\\): ההפרש \\(2V_S-V_D\\).',
  x:['זה ה-PIV של גשר דיודות.',null,'זה ה-PIV של חצי-גל.','רק דיודה אחת מוליכה בכל רגע, לכן מופחת מפל אחד בלבד.']},
 {q:'במיישר גשר, מהו שיא המוצא \\(V_{O,P}\\)?',o:['\\(V_S\\)','\\(V_S-V_D\\)','\\(2V_S-V_D\\)','\\(V_S-2V_D\\)'],a:3,
  e:'בכל חצי מחזור שתי דיודות בטור בדרך הזרם, לכן \\(V_{O,P}=V_S-2V_D\\).',
  x:['מתעלם מהמפלים על הדיודות המוליכות.','זה שיא המוצא עם סנף מרכזי (דיודה אחת).','זה PIV של סנף מרכזי, לא מתח מוצא.',null]},
 {q:'בגשר הדיודות של הסיכום, אילו דיודות מוליכות בחצי החיובי של \\(v_S\\)?',o:['\\(D_1\\) ו-\\(D_2\\)','\\(D_3\\) ו-\\(D_4\\)','\\(D_1\\) ו-\\(D_3\\)','כל ארבע'],a:0,
  e:'בחצי החיובי הזרם יוצא מהקצה העליון דרך \\(D_1\\), עובר ב-R, וחוזר דרך \\(D_2\\) לקצה התחתון.',
  x:[null,'הן מוליכות בחצי השלילי.','\\(D_1,D_3\\) מתחברות לאותו צומת מוצא; הן לא בטור באותו מסלול.','אז הגשר היה מקצר את המשני; בכל חצי רק שתיים מוליכות.']},
 {q:'בגלאי שיא מעשי (דיודה, \\(C\\) ו-\\(R\\) במקביל), מה נדרש כדי שהתפרקות הקבל תהיה קטנה?',o:['\\(RC\\ll T\\)','\\(RC=T\\)','\\(RC\\gg T\\)','\\(R\\to0\\)'],a:2,

  e:'\\(V_r=\\frac{V_P-V_D}{2fRC}=\\frac{16.3}{10}=1.63\\text{V}\\).',

 {q:'מגדילים את \\(C\\) במיישר עם קבל סינון. מה קורה לזרם השיא בדיודה \\(i_{D,\\max}\\)?',o:['קטן, כי הגליות קטנה','גדל, כי \\(\\sqrt{V_P/2V_r}\\) גדל','לא משתנה, תלוי רק ב-\\(I_L\\)','מתאפס'],a:1,

/* LESSON 3 · טרנזיסטור MOSFET — source: שיעור 3 PDF */
CONTENT[3]={
theory:[
{t:'המבנה הפיזיקאלי של ה-MOSFET',h:R`
<p>אחרי הדיודה, שמנצלת את החוקים הפיזיקאליים בצומת PN, מרחיבים את הרעיון לרכיב עם יותר הדקים.</p>
<ul>
<li><b>מצע (Substrate / Body)</b>: בסיס סיליקון מזוהם מסוג P או N.</li>
<li>בתוך המצע יש <b>שני אזורים</b> מזוהמים בסוג <b>הפוך</b> לזה של המצע: ה-<b>Drain</b> (שפך) וה-<b>Source</b> (מקור). לדוגמה, במצע P האזורים הם \(n^+\).</li>
<li>מעל המצע, בין שני האזורים, יש שכבת <b>מבודד</b>: תחמוצת סיליקון \(\text{SiO}_2\), ומעליה אלקטרודת מתכת.</li>
<li>ארבעה מגעים מתכתיים: <b>D</b>, <b>S</b>, <b>G</b> (Gate, שער) ו-<b>B</b> (מצע).</li>
</ul>
<p>שולטים בשדה החשמלי שבין האזורים, וכך שולטים בזרם שזורם ביניהם. אורך התעלה בין S ל-D מסומן \(L\) ורוחבה \(W\).</p>
<p>מכאן השם: <b>M</b>etal <b>O</b>xide <b>S</b>emiconductor <b>F</b>ield <b>E</b>ffect <b>T</b>ransistor, כלומר שכבות מתכת, תחמוצת ומוליך למחצה, ופעולה בעזרת שדה חשמלי.</p>
`+co('analogy','🚰','אנלוגיה: ברז עם ידית מבודדת',R`<p>השער מופרד מהמצע בשכבת \(\text{SiO}_2\), כמו ידית ברז שלא נוגעת במים. משנים את המתח בשער, והשדה החשמלי "פותח" או "סוגר" את המעבר בין S ל-D.</p>`)+golab(3,'l3-ch','ראה את המבנה והתעלה')},

{t:'ארבעת הסוגים שנעסוק בהם',h:R`
<p>יש משפחה רחבה של טרנזיסטורי MOSFET, אבל בקורס מתמקדים בארבעה בלבד:</p>
<div class="tbl"><table><thead><tr><th>סוג</th><th>תעלה מובנית?</th><th>N-Channel</th><th>P-Channel</th></tr></thead><tbody>
<tr><td><b>Depletion</b> (דילול)</td><td>כן, יש תעלה מובנית</td><td>NMOS</td><td>PMOS</td></tr>
<tr><td><b>Enhancement</b> (שיפור)</td><td>לא, אין תעלה מובנית</td><td>NMOS</td><td>PMOS</td></tr>
</tbody></table></div>
<p>בסמלים החשמליים: ב-NMOS ה-Drain למעלה וה-Source למטה, וב-PMOS ה-Source למעלה וה-Drain למטה. בסמל Enhancement קו התעלה מקווקו (אין תעלה מובנית), ובסמל Depletion הוא רציף. יש גם סמלים מקוצרים שלא מציירים בהם את הדק המצע.</p>
`+co('key','🔑','במבחן',R`<p>סוג ה-Enhancement הוא הנפוץ בשאלות. לפני כל חישוב זהה: N או P? Enhancement או Depletion? מזה נקבע הסימן של \(V_T\) ואילו נוסחאות להפעיל.</p>`)+golab(3,'l3-types','השווה בין ארבעת הסוגים')},

{t:'מתח הסף ליצירת תעלה',h:R`
<p>מחברים לרכיב שני מקורות מתח: \(v_{GS}\) בין G ל-S, ו-\(v_{DS}\) בין D ל-S. מתחילים רק עם \(v_{GS}\).</p>
<p>כש-\(v_{GS}\) עובר ערך סף מסוים נוצרת <b>תעלה</b> בין ה-Drain ל-Source (ב-NMOS תעלת n מושרית), ומטענים יכולים לנוע.</p>
\[V_T:\ \text{threshold voltage}\qquad \text{channel exists}\iff v_{GS}>V_T\]
\[V_{OV}=V_{GS}-V_T\qquad(\text{overdrive voltage})\]
<p>\(V_{OV}\) אומר <b>בכמה</b> עברנו את הסף. כל נוסחאות הזרם בהמשך תלויות בו.</p>
`+co('analogy','🚪','אנלוגיה: דלת כבדה',R`<p>עד שדוחפים בכוח \(V_T\) הדלת לא זזה בכלל. רק הכוח <b>העודף</b>, \(V_{OV}\), קובע כמה רחב היא נפתחת.</p>`)},

{t:'הוספת מתח בין D ל-S: שלושה תחומים',h:R`
<p><b>\(v_{DS}\) קטן (עשיריות וולט):</b> התעלה מתנהגת כמו נגד. הזרם \(i_D\) (או \(I_{DS}\)) עולה <b>ליניארית</b> עם \(v_{DS}\), והשיפוע פרופורציונלי ל-\(V_{OV}\): ככל ש-\(v_{GS}\) גדול יותר, הישר תלול יותר (ההתנגדות קטנה). עבור \(v_{GS}\le V_T\) הזרם אפס.</p>
<p><b>הגדלת \(v_{DS}\):</b> הזרם ממשיך לגדול, אבל התעלה משתנה לאורכה ונעשית צרה בצד ה-Drain, והעקומה מתעקמת.</p>
<p><b>לתעלה יש גבול:</b> כשהיא "מוצתה" (נצבטה בצד ה-Drain), הגדלת \(v_{DS}\) כבר לא מגדילה את \(i_D\).</p>
<div class="tbl"><table><thead><tr><th>תחום</th><th>תנאים</th></tr></thead><tbody>
<tr><td>${'<span class="tag bad">קיטעון (Cutoff)</span>'}</td><td>\(V_{GS}\lt V_T\)</td></tr>
<tr><td>${'<span class="tag ok">אוהמי / ריבועי / טריודי</span>'}</td><td>\(V_{GS}>V_T\) וגם \(V_{DS}\lt V_{GS}-V_T\)</td></tr>
<tr><td>${'<span class="tag dc">רוויה (Saturation)</span>'}</td><td>\(V_{GS}>V_T\) וגם \(V_{DS}>V_{GS}-V_T\)</td></tr>
</tbody></table></div>
\[V_{DS,sat}=V_{OV}=V_{GS}-V_T\]
<p>נקודת המעבר בין התחום הריבועי לרוויה (עבור \(V_{GS}\) נתון) נקראת <b>נקודת הצביטה (pinch off)</b>.</p>
`+co('why','💡','בקיצור',R`<p>קודם בודקים \(V_{OV}>0\) (יש תעלה?), ואז משווים את \(V_{DS}\) ל-\(V_{OV}\): קטן ממנו → טריודה, גדול ממנו → רוויה.</p>`)+golab(3,'l3-dc','ראה את האופיין משתנה')},

{t:'אופיינים ונוסחאות זרם: NMOS Enhancement',h:R`
<p>לדיודה (שני הדקים) הספיק אופיין IV אחד. לרכיב עם יותר משני הדקים צריך <b>שני אופיינים</b> כדי לתאר אותו במלואו:</p>
<ul><li>\(i_{DS}=f(V_{DS})\) כאשר \(V_{GS}\) קבוע (אופיין מוצא).</li><li>\(i_{DS}=f(V_{GS})\) כאשר \(V_{DS}\) קבוע (אופיין העברה).</li></ul>
<p><b>נתונים פיזיקאליים של NMOS Enhancement:</b> \(V_T>0\text{V}\) (אין תעלה מובנית), ו-</p>
\[k_n'=\mu_nC_{ox}\ \left[\frac{\text{A}}{\text{V}^2}\right],\qquad K_n=\frac12k_n'\left(\frac WL\right)=\frac12\mu_nC_{ox}\left(\frac WL\right)\ \left[\frac{\text{A}}{\text{V}^2}\right]\]
<div class="tbl"><table><thead><tr><th>מצב</th><th>תנאים</th><th>נוסחה</th></tr></thead><tbody>
<tr><td>נתק</td><td>\(V_{GS}\lt V_T\)</td><td>\(I_D=0\)</td></tr>
<tr><td>הולכה / טריודי</td><td>\(V_{GS}>V_T,\ V_{DS}\lt V_{GS}-V_T\)</td><td>\(I_D=k_n'\left(\frac WL\right)\left((V_{GS}-V_T)V_{DS}-\frac12V_{DS}^2\right)\)</td></tr>
<tr><td>רוויה</td><td>\(V_{GS}>V_T,\ V_{DS}>V_{GS}-V_T\)</td><td>\(I_D=\frac12k_n'\left(\frac WL\right)(V_{GS}-V_T)^2=K_nV_{OV}^2\)</td></tr>
</tbody></table></div>
`+co('warn','⚠️','שים לב ל-½',R`<p>\(k_n'\) (קטן) הוא פרמטר התהליך, ו-\(K_n\) (גדול) כבר כולל את ה-½ ואת \(W/L\). בסיכום הוא נכתב גם \(K_n'\). אם כתוב \(I_D=K_nV_{OV}^2\) אין ½ נוסף.</p>`)},

{t:'אופיין המוצא של NMOS Enhancement',h:R`
<p>משרטטים \(i_D\) כתלות ב-\(v_{DS}\) עבור כמה ערכי \(v_{GS}=V_T+V_{OV1},\,V_T+V_{OV2},\dots\):</p>
<ul>
<li><b>בטריודה</b> (\(v_{DS}\le v_{OV}\)) כל עקומה היא חלק מפרבולה שעולה מהראשית.</li>
<li><b>ברוויה</b> (\(v_{DS}\ge v_{OV}\)) כל עקומה שטוחה בגובה \(\tfrac12k_n'(W/L)V_{OV}^2\): הזרם תלוי רק ב-\(V_{GS}\).</li>
<li>הגבול בין התחומים הוא הנקודות שבהן \(v_{DS}=v_{OV}\). מציבים זאת בנוסחת הרוויה ומקבלים פרבולה:</li>
</ul>
\[v_{DS}=v_{OV}\ \Rightarrow\ i_D=\frac12k_n'\left(\frac WL\right)v_{DS}^2\]
<p>מתחת ל-\(v_{GS}\le V_T\) (קיטעון) הזרם אפס לכל \(v_{DS}\).</p>
`+co('key','🔑','איך קוראים את הגרף',R`<p>נקודת הברך של כל עקומה נמצאת ב-\(v_{DS}=V_{OV}\) של אותה עקומה, כלומר \(V_{DS,sat}\) גדל ככל ש-\(v_{GS}\) גדל.</p>`)},

{t:'PMOS Enhancement',h:R`
<p><b>נתונים פיזיקאליים:</b> \(V_T\lt 0\text{V}\), ו-</p>
\[k_p'=\mu_pC_{ox}\ \left[\frac{\text{A}}{\text{V}^2}\right],\qquad K_p=\frac12k_p'\left(\frac WL\right)\]
<div class="tbl"><table><thead><tr><th>מצב</th><th>תנאים</th><th>נוסחה</th></tr></thead><tbody>
<tr><td>נתק</td><td>\(V_{GS}>V_T\)</td><td>\(I_D=0\)</td></tr>
<tr><td>הולכה / טריודי</td><td>\(V_{GS}\lt V_T,\ V_{DS}>V_{GS}-V_T\)</td><td>\(I_D=k_p'\left(\frac WL\right)\left((V_{SG}-|V_T|)V_{SD}-\frac12V_{SD}^2\right)\)</td></tr>
<tr><td>רוויה</td><td>\(V_{GS}\lt V_T,\ V_{DS}\lt V_{GS}-V_T\)</td><td>\(I_D=\frac12k_p'\left(\frac WL\right)(V_{SG}-|V_T|)^2\)</td></tr>
</tbody></table></div>
<p>התנאים הם התנאים של NMOS עם <b>אי-שוויונות הפוכים</b>. בנוסחאות כל הגדלים חיוביים: \(V_{SG}\), \(V_{SD}\) ו-\(|V_T|\). הזרם זורם מה-Source (למעלה) אל ה-Drain.</p>
`+co('why','💡','תרגום לגדלים חיוביים',R`<p>הכפלת התנאים ב-\(-1\) נותנת: הולכה כש-\(V_{SG}>|V_T|\); עם \(V_{OV}=V_{SG}-|V_T|\), טריודה כש-\(V_{SD}\lt V_{OV}\) ורוויה כש-\(V_{SD}>V_{OV}\). בדיוק כמו NMOS.</p>`)},

{t:'NMOS Depletion ואופייני הרוויה',h:R`
<p>ב-NMOS מסוג Depletion יש תעלה מובנית, ולכן \(V_T\lt 0\). בגרף שבסיכום \(V_T=-4\text{V}\): הטרנזיסטור מוליך כבר ב-\(v_{GS}=0\) (הזרם שם מסומן \(I_{DSS}=16\text{mA}\)), ונחסם רק ב-\(v_{GS}\le-4\text{V}\). אותן נוסחאות ואותו גבול \(v_{DS}=v_{GS}-V_T\).</p>
<p><b>אופייני \(i_D=f(v_{GS})\) ברוויה לארבעת הסוגים</b> (תנאי: \(v_{DS}\ge v_{GS}-v_T\)):</p>
\[I_D=\frac12k_n'\left(\frac WL\right)(V_{GS}-V_T)^2=K_nV_{OV}^2\]
<div class="tbl"><table><thead><tr><th>סוג</th><th>\(V_T\)</th><th>העקומה מתחילה ב-</th></tr></thead><tbody>
<tr><td>n-channel enhancement</td><td>\(>0\)</td><td>\(v_{GS}=V_T>0\) ועולה ימינה</td></tr>
<tr><td>n-channel depletion</td><td>\(\lt 0\)</td><td>\(v_{GS}=V_T\lt 0\) ועולה ימינה</td></tr>
<tr><td>p-channel depletion</td><td>\(>0\)</td><td>\(v_{GS}=V_T>0\) ועולה שמאלה</td></tr>
<tr><td>p-channel enhancement</td><td>\(\lt 0\)</td><td>\(v_{GS}=V_T\lt 0\) ועולה שמאלה</td></tr>
</tbody></table></div>
`+co('key','📈','ריבועי, לא מעריכי',R`<p>צורת העקומות היא <b>ריבועית</b> ב-\(V_{OV}\), בשונה מהדיודה שבה הזרם מעריכי במתח.</p>`)},

{t:'אפקט התקצרות התעלה (Channel Length Modulation)',h:R`
<p>כשמגדילים את \(v_{DS}\), התעלה מתקצרת בשיעור \(\Delta L\), ואורכה נעשה \(L-\Delta L\). לכן גם ברוויה הזרם עולה מעט עם \(v_{DS}\).</p>
<ul><li>האפקט משמעותי <b>רק ברוויה</b>. בתחום הטריודי מתעלמים ממנו לחלוטין.</li><li>גודלו נתון על ידי \(\lambda\ [1/\text{V}]\), שמקבלים ישירות בשאלה (או מהיצרן).</li></ul>
\[I_D=\frac12k_n'\left(\frac WL\right)(V_{GS}-V_T)^2\left(1+\lambda V_{DS}\right)\]
<p><b>מתח Early</b> (ע"ש ג'יימס ארלי): \(V_A=\dfrac1\lambda\). כל הישרים ברוויה, כשממשיכים אותם שמאלה, נפגשים בנקודה \(v_{DS}=-V_A\), והשיפוע שלהם הוא \(1/r_0\).</p>
\[I_D=\frac12k_n'\left(\frac WL\right)(V_{GS}-V_T)^2\left(1+\frac{V_{DS}}{V_A}\right)\]
`+co('analogy','📏','אנלוגיה',R`<p>ככל ש-\(v_{DS}\) גדל, נקודת הצביטה "זוחלת" לכיוון ה-Source. תעלה קצרה יותר מוליכה קצת יותר, ולכן העקומה ברוויה לא שטוחה לגמרי אלא נוטה מעט.</p>`)},

{t:'אפקט המצע (Body Effect)',h:R`
<p>לפעמים המצע B לא מחובר ל-Source, כלומר \(V_{SB}\ne0\). אז מתח הסף <b>גדל</b> מעט לעומת מתח הסף הנתון. מסמנים ב-\(V_{T0}\) את מתח הסף ללא אפקט מצע:</p>
\[V_T=V_{T0}+\gamma\left(\sqrt{0.6+V_{SB}}-\sqrt{0.6}\right),\qquad \gamma\approx0.5\ \left[\sqrt{\text{V}}\right]\]
<p>כש-\(V_{SB}=0\) הסוגריים מתאפסים ו-\(V_T=V_{T0}\).</p>
`+co('warn','⚠️','המספר 0.6',R`<p>0.6 מופיע <b>בשני</b> השורשים: \(\sqrt{0.6+V_{SB}}\) פחות \(\sqrt{0.6}\), לא \(\sqrt{V_{SB}}\). אחרי שמחשבים את \(V_T\) החדש, משתמשים בו בכל הנוסחאות (\(V_{OV}\), תנאי תחום, זרם).</p>`)+golab(3,'l3-body','ראה את V<sub>T</sub> זז עם V<sub>SB</sub>')},

{t:'מודל אות קטן, מודל T והמרת מקורות',h:R`
<p><b>מודל אות קטן (π)</b>, שאיתו עובדים ברוב השאלות: בין G ל-S נתק (\(i_g=0\)), ובין D ל-S מקור זרם תלוי \(g_mv_{gs}\) במקביל ל-\(r_0\).</p>
\[g_m=k_n'\left(\frac WL\right)(V_{GS}-V_T)=k_n'\left(\frac WL\right)V_{OV}=\sqrt{2k_n'\left(\frac WL\right)I_D}=\frac{2I_D}{V_{OV}}\ \left[\frac{\text{A}}{\text{V}}\right]\]
\[r_0=\frac{1}{\lambda I_D}=\frac{V_A}{I_D}\qquad I_D=\frac12k_n'\left(\frac WL\right)V_{OV}^2\ (\text{saturation})\]
<p>\(r_0\) סופי <b>רק</b> אם נתון אפקט התקצרות תעלה. אחרת \(r_0\to\infty\). \(g_m\) הוא הנגזרת של \(I_D=K_nV_{OV}^2\) לפי \(V_{GS}\): \(2K_nV_{OV}\).</p>
<p><b>מודל T</b> (נפגוש לעיתים רחוקות, ללא התקצרות תעלה, \(r_0\to\infty\)): מקור הזרם \(g_mv_{gs}\) מ-D כלפי מטה, ומתחתיו התנגדות \(1/g_m\) עד ה-S. השער מתחבר לנקודה שביניהם ו-\(i_g=0\).</p>
<p><b>המרה למקור מתח תלוי:</b> לפי המרת מקורות (מהנדסת חשמל 1), מקור זרם \(g_mv_{gs}\) במקביל ל-\(r_0\) שקול למקור מתח \(\mu v_{gs}\) בטור ל-\(r_0\):</p>
\[\mu=g_mr_0\]
`+co('warn','⚠️','מתי ההמרה אסורה',R`<p>אם \(r_0\to\infty\) (אין התקצרות תעלה), במודל יש רק מקור זרם, ואין התנגדות להמיר איתה. ההמרה רלוונטית <b>רק</b> כשיש אפקט התקצרות תעלה בשאלה.</p>`)+golab(3,'l3-ss','ראה את g<sub>m</sub> כשיפוע')}
],

st:R`NMOS Enhancement עם \(V_{T0}=1\text{V}\), \(\gamma=0.5\sqrt{\text{V}}\), \(K_n=\tfrac12k_n'(W/L)=0.5\,\text{mA/V}^2\) ו-\(\lambda=0.02\,\text{V}^{-1}\). המצע במתח \(-2\text{V}\) ולכן \(V_{SB}=2\text{V}\). נתון \(V_{GS}=2.5\text{V}\), \(V_{DS}=5\text{V}\). מצא \(V_T\), תחום, \(I_D\) (עם ובלי התקצרות תעלה), \(g_m\), \(r_0\) ו-\(\mu\).`,

theory:[
{t:'מעגלי הגבר: הקדמה',h:R`
<p>עד עכשיו מצאנו נקודת עבודה. בשיעור הזה משתמשים בטרנזיסטור כדי <b>להגביר</b> אות כניסה, שיכול להיות אות מתח או אות זרם, לפי דרישות נתונות.</p>
<p>במבחן מקבלים מעגל ונדרשים לנתח אותו ולמצוא את הפרמטרים שמתארים את יכולת ההגבר שלו. לכן קודם לומדים כמה מושגים כלליים של מגברים, ואחר כך את שלוש תצורות החיבור של ה-MOSFET.</p>
`+co('why','💡','למה צריך "שפה" כללית?','<p>ברגע שמתארים כל מעגל טרנזיסטור בעזרת אותם פרמטרים (התנגדות כניסה, התנגדות מוצא והגבר), אפשר <b>לשרשר</b> כמה דרגות הגבר ולחשב את כולן יחד, בלי לפתור כל פעם את כל המעגל מחדש.</p>')},
{t:'ארבעת המודלים הכלליים של מגבר',h:R`
<p>כל מגבר בקורס אפשר לייצג באחד מארבעה מודלים, ואפשר לעבור ממודל אחד לאחר. ההבדל ביניהם הוא מה נכנס (מתח או זרם) ומה יוצא:</p>
<div class="tbl"><table><thead><tr><th>סוג</th><th>פרמטר ההגבר</th><th>יחידות</th><th>אידיאלי</th></tr></thead><tbody>
<tr><td>מגבר מתח</td><td>\(A_{vo}=\left.\frac{v_o}{v_i}\right|_{i_o=0}\)</td><td>V/V</td><td>\(R_i=\infty,\ R_o=0\)</td></tr>
<tr><td>מגבר זרם</td><td>\(A_{is}=\left.\frac{i_o}{i_i}\right|_{v_o=0}\)</td><td>A/A</td><td>\(R_i=0,\ R_o=\infty\)</td></tr>
<tr><td>מגבר טרנס-מוליכות</td><td>\(G_m=\left.\frac{i_o}{v_i}\right|_{v_o=0}\)</td><td>A/V</td><td>\(R_i=\infty,\ R_o=\infty\)</td></tr>
<tr><td>מגבר טרנס-התנגדות</td><td>\(R_m=\left.\frac{v_o}{i_i}\right|_{i_o=0}\)</td><td>V/A</td><td>\(R_i=0,\ R_o=0\)</td></tr>
</tbody></table></div>
<p>במודלים של הגבר "פתוח" (\(i_o=0\)) המוצא הוא מקור מתח תלוי בטור ל-\(R_o\). במודלים של הגבר "בקצר" (\(v_o=0\)) המוצא הוא מקור זרם תלוי במקביל ל-\(R_o\). בכניסה תמיד יש \(R_i\).</p>
`+co('analogy','🎯','איך לזכור את האידיאלי','<p>מי שמקבל <b>מתח</b> רוצה לא להעמיס על המקור: \\(R_i=\\infty\\). מי שמקבל <b>זרם</b> רוצה לבלוע את כולו: \\(R_i=0\\). ובמוצא: מי שמוציא <b>מתח</b> רוצה להיות מקור מתח טוב (\\(R_o=0\\)), ומי שמוציא <b>זרם</b> רוצה להיות מקור זרם טוב (\\(R_o=\\infty\\)).</p>')},
{t:'שלושת הדברים שמעניינים אותנו',h:R`
<p>בכל מגבר, בסוף, רוצים לדעת שלושה דברים:</p>
<ol><li><b>התנגדות הכניסה</b> \(R_{in}\).</li><li><b>התנגדות המוצא</b> \(R_{out}\).</li><li><b>ההגבר וסוגו</b>: \(A\,[\text{V/V}]\), \(A\,[\text{A/A}]\), \(G\,[\text{A/V}]\) או \(R\,[\text{V/A}]\).</li></ol>
<p>כשממדלים מעגל טרנזיסטור לאחת התצורות האלה, אפשר לשרשר דרגות הגבר רבות ולהציב דרישות על הנגדים והקבלים שמחברים ביניהן.</p>`},
{t:'מודל כללי של מעגל הגבר',h:R`
<p>המודל הטיפוסי: מקור אות \(v_{sig}\) עם התנגדות פנימית \(R_{sig}\), המגבר עם מתח כניסה \(v_i\) וזרם כניסה \(i_i\), ובמוצא עומס \(R_L\) עם מתח \(v_o\) וזרם \(i_o\). מבדילים בין הפרמטר "בלי העמסה" לפרמטר "עם העמסה":</p>
<div class="tbl"><table><thead><tr><th>פרמטר</th><th>משמעות</th></tr></thead><tbody>
<tr><td>\(R_i\)</td><td>התנגדות כניסה <b>ללא</b> עומס במוצא</td></tr>
<tr><td>\(R_{in}\)</td><td>התנגדות כניסה <b>עם</b> עומס במוצא</td></tr>
<tr><td>\(R_o\)</td><td>התנגדות מוצא <b>ללא</b> עומס בכניסה</td></tr>
<tr><td>\(R_{out}\)</td><td>התנגדות מוצא <b>עם</b> עומס בכניסה</td></tr>
<tr><td>\(A_{v0}\)</td><td>הגבר מתח ללא נגד עומס</td></tr>
<tr><td>\(A_v\)</td><td>הגבר מתח כולל נגד עומס</td></tr>
<tr><td>\(A_i\)</td><td>הגבר זרם ללא העמסה של מקור הזרם</td></tr>
<tr><td>\(A_{is}\)</td><td>הגבר זרם כולל העמסה של המקור בכניסת המגבר</td></tr>
<tr><td>\(G_v=\dfrac{v_o}{v_{sig}}\)</td><td>הגבר המתח הכללי של מעגל ההגבר</td></tr>
</tbody></table></div>
<p>הסיכום מצייר את המגבר בשתי צורות: <b>מודל מתח</b> (\(R_{in}\) בכניסה, מקור \(A_{vo}v_i\) בטור ל-\(R_o\) במוצא) ו<b>מודל טרנס-מוליכות</b> (\(R_{in}\) בכניסה, מקור \(G_mv_i\) במקביל ל-\(R_o\)).</p>
`+co('key','🔑','קריאת מודל המתח מהציור','<p>במודל המתח יש שני מחלקי מתח: \\(R_{sig}\\) מול \\(R_{in}\\) בכניסה, ו-\\(R_o\\) מול \\(R_L\\) במוצא. לכן:</p>\\[\\frac{v_i}{v_{sig}}=\\frac{R_{in}}{R_{in}+R_{sig}}\\]\\[A_v=\\frac{v_o}{v_i}=A_{vo}\\frac{R_L}{R_L+R_o}\\]\\[G_v=\\frac{v_o}{v_{sig}}=\\frac{R_{in}}{R_{in}+R_{sig}}\\cdot A_v\\]<p>כלומר \\(A_v=v_o/v_i\\) כבר כולל את העומס, ו-\\(G_v\\) מוסיף גם את ההפסד בכניסה. לא להתבלבל בין \\(A_v\\) ל-\\(G_v\\).</p>')+golab(4,'l4-model','שחק עם R<sub>sig</sub>, R<sub>in</sub>, R<sub>o</sub>, R<sub>L</sub>')},
{t:'שלוש תצורות ההגבר',h:R`
<p>ל-MOSFET יש 3 הדקים, ולכן אפשר לחבר אותו ב-3 תצורות. בכל תצורה <b>הדק אחד משותף</b> לאות הכניסה ולאות המוצא, ושם התצורה הוא לפי ההדק הזה:</p>
<div class="tbl"><table><thead><tr><th>תצורה</th><th>הדק משותף</th><th>כניסה</th><th>מוצא</th><th>\(v_{in}\)</th><th>\(v_{out}\)</th></tr></thead><tbody>
<tr><td><b>CS</b> Common Source</td><td>S</td><td>G</td><td>D</td><td>\(V_{GS}\)</td><td>\(V_{DS}\)</td></tr>
<tr><td><b>CG</b> Common Gate</td><td>G</td><td>S</td><td>D</td><td>\(V_{SG}\)</td><td>\(V_{DG}\)</td></tr>
<tr><td><b>CD</b> Common Drain (Source Follower)</td><td>D</td><td>G</td><td>S</td><td>\(V_{GD}\)</td><td>\(V_{SD}\)</td></tr>
</tbody></table></div>
<p>לכל תצורה מחפשים את הפרמטרים מהסעיף הקודם. בסיכום התצורות מנותחות <b>במקרה הכללי</b>, עם כל הנגדים האפשריים ועם \(r_0\).</p>
`+co('key','🔑','כלל הנגד החסר','<p>הנוסחאות נכתבו למקרה הכללי ביותר. <b>נגד שחסר במעגל מציבים כנתק</b>, כלומר התנגדות אינסופית, ולא כקצר.</p>')+golab(4,'l4-cfg','השווה את שלוש התצורות')},
{t:'תצורת CS',h:R`
<p>המעגל בסיכום: אות נכנס דרך \(R_{sig}\) וקבל צימוד לשער, \(R_G\) מהשער לאדמה, \(R_D\) מ-\(V_{DD}\) לדריין, \(R_S\) בסורס (עם מקור זרם \(I\) ל-\(-V_{SS}\)), והמוצא דרך קבל צימוד לעומס \(R_L\).</p>
<p><b>התנגדויות כניסה ומוצא:</b></p>
\[R_{in}=R_G\]
\[R_o=\left(g_mR_S+1\right)r_0+R_S\]
\[R_{out}=R_o\parallel R_D=\left(\frac{1}{R_D}+\frac{1}{\left(g_mR_S+1\right)r_0+R_S}\right)^{-1}\]
<p><b>הגבר מתח:</b></p>
\[A_V=\frac{v_o}{v_i}=-\frac{g_m\cdot R_L\parallel R_D}{\left(1+g_mR_S\right)+\left(R_S+R_L\parallel R_D\right)/r_0}\]
<p><b>מקרים פרטיים שימושיים:</b></p>
<div class="tbl"><table><thead><tr><th>תנאי</th><th>הגבר</th></tr></thead><tbody>
<tr><td>\(r_0\to\infty,\ R_S\ne0\)</td><td>\(A_V=-\dfrac{g_m\cdot R_L\parallel R_D}{1+g_mR_S}\)</td></tr>
<tr><td>\(r_0\ne\infty,\ R_S=0\)</td><td>\(A_V=-\dfrac{g_m\cdot R_L\parallel R_D}{1+R_L\parallel R_D/r_0}\)</td></tr>
<tr><td>\(r_0\to\infty,\ R_S=0\)</td><td>\(A_V=-g_m\cdot R_L\parallel R_D\)</td></tr>
</tbody></table></div>
`+co('key','🔑','הערות מהסיכום','<p>• מעגל CS הוא <b>הופך מופע</b> (סימן מינוס בהגבר).<br>• יש לו יכולת טובה של <b>הגבר מתח</b>.<br>• \\(R_S\\) מקטין את ההגבר פי \\(1+g_mR_S\\), אבל מגדיל מאוד את \\(R_o\\).</p>')},
{t:'תצורת CG',h:R`
<p>המעגל בסיכום: השער מחובר לאדמה, האות נכנס דרך \(R_{sig}\) וקבל צימוד ל<b>סורס</b> (שמוזן ממקור זרם \(I\)), והמוצא נלקח מהדריין (\(R_D\), ועומס \(R_L\) דרך קבל).</p>
<p><b>התנגדויות כניסה ומוצא:</b></p>
\[R_{in}=\frac{1+R_L\parallel R_D/r_0}{1/r_0+g_m}\]
\[R_o=\left(g_mr_0+1\right)\cdot R_{sig}\parallel R_S+r_0,\qquad R_{out}=R_o\parallel R_D\]
<p><b>הגבר מתח</b> (חיובי, כלומר <b>לא הופך מופע</b>):</p>
\[A_V=\frac{v_o}{v_i}=\frac{\left(1+g_mr_0\right)\cdot R_L\parallel R_D}{r_0+R_L\parallel R_D}\]
<p><b>מקרה פרטי שימושי: \(r_0\to\infty\)</b></p>
\[R_{in}=\frac{1}{g_m},\qquad R_o\to\infty,\qquad R_{out}=R_D,\qquad A_V=\frac{v_o}{v_i}=g_m\cdot R_L\parallel R_D\]
`+co('why','💡','מה מיוחד כאן','<p>ההגבר זהה בגודלו ל-CS הפשוט, אבל <b>בלי היפוך מופע</b>. מנגד, התנגדות הכניסה קטנה מאוד (\\(1/g_m\\)), ולכן עם \\(R_{sig}\\) גדול רוב האות "הולך לאיבוד" בכניסה.</p>')+co('warn','⚠️','שים לב','<p>עם \\(r_0\\) סופי, \\(R_{in}\\) תלוי בעומס שבמוצא, ו-\\(R_o\\) תלוי ב-\\(R_{sig}\\) שבכניסה. זו בדיוק ההבחנה בין \\(R_i\\) ל-\\(R_{in}\\) ובין \\(R_o\\) ל-\\(R_{out}\\).</p>')},
{t:'תצורת CD (עוקב סורס)',h:R`
<p>המעגל בסיכום: האות נכנס לשער (עם \(R_G\)), הדריין מחובר ישירות ל-\(V_{DD}\), והמוצא נלקח מה<b>סורס</b> (מקור זרם \(I\), ועומס \(R_L\) דרך קבל). גם כאן <b>אין היפוך מופע</b>, וההגבר <b>קרוב ל-1</b>. היתרון המרכזי: המעגל משמש <b>חוצץ מתח</b> (buffer).</p>

<p><b>הגבר מתח:</b></p>

<p><b>בנוכחות נגד \(R_D\)</b> בדריין:</p>

theory:[
{t:'מבנה ואופן פעולת BJT',h:R`
<p>היסטורית, הטרנזיסטור הראשון נבנה מ<b>שתי דיודות מחוברות זו לזו</b>. לכן יש בו שני צמתים (Junctions), ומכאן השם: <b>טרנזיסטור ביפולרי, BJT</b> (Bipolar Junction Transistor).</p>
<div class="cols2"><div><p><b>NPN:</b> פולט (Emitter) מסוג n, בסיס (Base) דק מסוג p, קולט (Collector) מסוג n. הזרם המרכזי זורם <b>מהקולט לפולט</b>.</p></div><div><p><b>PNP:</b> פולט p, בסיס n, קולט p. הזרם המרכזי זורם <b>מהפולט לקולט</b>.</p></div></div>
<p>שני הצמתים: <b>EBJ</b> (צומת פולט-בסיס) ו-<b>CBJ</b> (צומת קולט-בסיס). כל צומת הוא דיודה, ומצב שתי הדיודות יקבע את מצב הפעולה.</p>
<p><b>סמל וחוקי קירכהוף.</b> החץ בסמל נמצא תמיד על הפולט ומראה את כיוון הזרם: ב-NPN החץ יוצא (\(I_B,I_C\) נכנסים, \(I_E\) יוצא), ב-PNP החץ נכנס (\(I_E\) נכנס, \(I_B,I_C\) יוצאים). תמיד מתקיים:</p>
\[I_E=I_B+I_C\qquad(\text{KCL})\]
\[\text{NPN}:\ V_{CE}=V_{CB}+V_{BE}\qquad\qquad \text{PNP}:\ V_{EC}=V_{BC}+V_{EB}\qquad(\text{KVL})\]
`+co('analogy','🚪','אנלוגיה: שתי דלתות בטור','<p>כדי שזרם יעבור מ-C ל-E צריך לעבור דרך שתי "דלתות" (שתי הדיודות) שמסתכלות לכיוונים הפוכים. הבסיס הוא המפתח: זרם קטן שנכנס בו פותח את המעבר לזרם הגדול.</p>')+co('key','🔑','PNP = NPN הפוך','<p>ב-PNP כל המתחים והזרמים מתהפכים: במקום \\(V_{BE},V_{CE}\\) עובדים עם \\(V_{EB},V_{EC}\\). שאר הנוסחאות זהות.</p>')},
{t:'מצבי פעולה ונוסחאות זרם',h:R`
<p>מכיוון שה-BJT בנוי משתי דיודות, אפשר להגדיר 4 מצבי פעולה לפי מצב כל צומת. בקורס עוסקים בשלושה: קטעון, פעיל קדמי ורוויה (פעיל אחורי לא נלמד).</p>
<div class="tbl"><table><thead><tr><th>מצב פעולה</th><th>צומת BE (EBJ)</th><th>צומת BC (CBJ)</th></tr></thead><tbody>
<tr><td>`+tg('bad','קטעון (Cutoff)')+R`</td><td>אחורי</td><td>אחורי</td></tr>
<tr><td>`+tg('dc','פעיל קדמי (Forward Active)')+R`</td><td>קדמי</td><td>אחורי</td></tr>
<tr><td>`+tg('ok','רוויה (Saturation)')+R`</td><td>קדמי</td><td>קדמי</td></tr>
<tr><td>`+tg('gray','פעיל אחורי')+R`</td><td>אחורי</td><td>קדמי</td></tr>
</tbody></table></div>
<p style="margin-top:10px"><b>נוסחאות זרם.</b> בפתרון מניחים תחילה שהטרנזיסטור בפעיל קדמי, עם \(V_D=0.7\text{V}\ (=v_\gamma)\) על צומת BE:</p>
<div class="tbl"><table><thead><tr><th>מצב</th><th>תנאים</th><th>נוסחאות</th></tr></thead><tbody>
<tr><td>נתק</td><td>\(V_{BE}\lt V_D\)</td><td>\(I_C=0\)</td></tr>
<tr><td>פעיל קדמי</td><td>\(V_{BE}>V_D,\ V_{CE}>V_{BE}\)</td><td>\(I_C=\alpha I_E,\ \ I_C=\beta I_B\)</td></tr>
<tr><td>רוויה</td><td>\(V_{BE}>V_D,\ 0.2\text{V}\lt V_{CE}\lt 0.3\text{V}\)</td><td>\(I_C\lt\beta I_B\)</td></tr>
</tbody></table></div>
<p style="margin-top:10px">ברוויה הזרם נקרא \(I_{C,sat}\) והמתח \(V_{CE,sat}\) (ערכו נתון בשאלה).</p>
`+golab(5,'l5-modes','ראה את מצבי הפעולה')},
{t:'משמעות הפרמטרים α ו-β',h:R`
<p><b>\(\alpha\):</b> מוגדר לפי \(I_C=\alpha I_E\). הוא קרוב מאוד ל-1 (בד"כ \(\alpha\approx0.999\)), ומתאר את הגבר הזרם לאות גדול.</p>
<p><b>\(\beta\):</b> מוגדר לפי \(I_C=\beta I_B\), בד"כ בסדר גודל של 100. מתאר את הגבר הזרם לאות קטן.</p>
\[\beta=\frac{\alpha}{1-\alpha}\qquad\qquad \alpha=\frac{\beta}{\beta+1}\]
`+co('warn','⚠️','תקף רק בפעיל קדמי','<p>היחסים \\(I_C=\\beta I_B\\) ו-\\(I_C=\\alpha I_E\\) נכונים <b>רק</b> בפעיל קדמי. כשהטרנזיסטור נכנס לרוויה, מגדילים את \\(I_B\\) אבל \\(I_C\\) מפסיק לגדול: הוא נתקע על \\(I_{C,sat}\\), ולכן \\(I_{C,sat}\\lt\\beta I_B\\).</p>')+co('why','💡','למה זה חשוב?','<p>מכיוון ש-\\(I_E=(\\beta+1)I_B\\), כל נגד בפולט "נראה" מהבסיס גדול פי \\(\\beta+1\\). זה יופיע גם בחישובי DC וגם בהתנגדויות הכניסה של מעגלי ההגבר.</p>')},
{t:'אופיינים של BJT ותנאי מצבי הפעולה',h:R`
<p>כמו ב-MOSFET, גם כאן מתארים את הפעולה בעזרת אופיין: הזרם המרכזי \(I_C\) (שנכנס בקולט ויוצא בפולט) כפונקציה של \(V_{CE}\). ההבדל: ב-MOSFET המתח \(V_{GS}\) שלט בזרם, וכאן <b>הזרם בין הבסיס לפולט</b> הוא ששולט. לכן יש עקומה לכל ערך של \(I_B\).</p>
<p>\(I_B\) עצמו תלוי ב-\(V_{BE}\): כל עוד \(V_{BE}>v_\gamma\), דיודת BE בממתח קדמי ומוליכה, וזרם \(I_B\) מוגבר פי \(\beta\) ליצירת \(I_C\).</p>
<ul><li><b>קטעון:</b> \(I_B=0\), העקומה על ציר \(V_{CE}\).</li><li><b>רוויה:</b> האזור התלול ליד \(V_{CE}\approx0\) (עד בערך 0.7V בסרטוט).</li><li><b>פעיל:</b> העקומות כמעט שטוחות, \(I_C\approx\beta I_B\).</li><li><b>פריצה:</b> מעבר ל-\(V_{CE(max)}\).</li></ul>
<p><b>תנאים ל-NPN:</b></p>
<div class="tbl"><table><thead><tr><th>מצב</th><th>צמתים</th><th>תנאי</th></tr></thead><tbody>
<tr><td>קטעון</td><td>BE אחורי, BC אחורי</td><td>\(V_{BE}\lt0.7\text{V}\)</td></tr>
<tr><td>פעיל קדמי</td><td>BE קדמי, BC אחורי</td><td>\(V_{BE}>0.7\text{V},\ V_{CB}>0\)</td></tr>
<tr><td>רוויה</td><td>BE קדמי, BC קדמי</td><td>\(V_{BE}\ge0.7\text{V},\ V_{CB}\lt0\)</td></tr>
<tr><td>פעיל אחורי</td><td>BE אחורי, BC קדמי</td><td>\(V_{CE}\lt0\)</td></tr>
</tbody></table></div>
<p style="margin-top:10px"><b>הסבר בעזרת שני מקורות (\(V_{BB}\) בבסיס, \(V_{CC}\) בקולט):</b></p>
<ul><li>${''}`+tg('bad','קטעון')+R` \(V_{BE}\lt0.7\text{V}\), לכן \(I_B=0\). הטרנזיסטור הוא מפסק פתוח: \(I_C=0\) ו-\(V_{CE}=V_{CC}\).</li>
<li>`+tg('ok','רוויה')+R` שתי הדיודות קדמיות. \(V_{CE}\) יורד עד \(V_{CE,sat}\) והזרם נקבע ע"י המעגל החיצוני:
\[I_C=I_{C,sat}=\frac{V_{CC}-V_{CE,sat}}{R_C}\]</li>
<li>`+tg('dc','פעיל קדמי')+R` BE קדמי ו-BC אחורי. רק כאן \(I_C=\beta I_B\), ו-\(I_C\) כמעט לא מושפע מ-\(V_{CE}\). תמיד \(0\lt I_C\lt I_{C,sat}\). אם \(I_B\) גדול מדי ו-\(\beta I_B\) יוצא מהתחום, מגיעים לרוויה (או לפריצה).</li></ul>
`+co('warn','⚠️','שים לב לתנאי הרוויה','<p>בעמוד 6 בסיכום תנאי הרוויה נכתב פעם אחת כ-"\\(V_{CB}\\ge0.7\\text{V}\\)". הכוונה היא שצומת BC <b>קדמי</b>, כלומר \\(V_{BC}\\ge0.7\\text{V}\\) (\\(V_{CB}\\lt0\\)), כפי שכתוב בהמשך העמוד. מבחינה מעשית: רוויה ⇔ \\(V_{CE}\\lt V_{BE}\\).</p>')},
{t:'קו עבודה ונקודת עבודה',h:R`
<p>כמו בדיודות וב-MOSFET, מחפשים <b>קו עבודה</b> של המעגל ו<b>נקודת עבודה</b> של הטרנזיסטור, בעזרת ניתוח DC (אות גדול).</p>
<p>נקודת העבודה היא \((V_{CE},I_C)\). לפעמים צריך לציין גם את \(I_B\).</p>
<p>קו העבודה מתקבל מ-KVL בלולאת הקולט (\(V_{CC}=I_CR_C+V_{CE}\)):</p>
\[I_C=-\frac{1}{R_C}V_{CE}+\frac{V_{CC}}{R_C}\]
<p>זה קו ישר שחותך את הציר האופקי ב-\(V_{CE}=V_{CC}\) (נקודת הקטעון) ואת האנכי ב-\(V_{CC}/R_C\). נקודת העבודה היא החיתוך של הקו עם עקומת ה-\(I_B\) של המעגל.</p>
`+co('analogy','🛤️','אנלוגיה: מסילה','<p>קו העבודה הוא מסילה שנקבעת רק ע"י \\(V_{CC}\\) ו-\\(R_C\\). \\(I_B\\) קובע איפה על המסילה נעצור. מגדילים \\(I_B\\): הנקודה מטפסת שמאלה-למעלה עד שנתקעת בפינת הרוויה.</p>')},
{t:'מודלים לניתוח אות קטן: היבריד-π ו-T',h:R`
<p>בניתוח AC מחליפים את הטרנזיסטור במודל ליניארי שהפרמטרים שלו נקבעים מנקודת העבודה (\(V_T=25\text{mV}\)).</p>
<div class="cols2"><div><p><b>מודל היבריד-π:</b> בין B ל-E נגד \(r_\pi\); בין C ל-E מקור זרם תלוי \(g_mv_{be}\).</p>
\[g_m=\frac{I_C}{V_T}\]
\[r_\pi=\frac{v_{be}}{i_b}=(\beta+1)r_e=\frac{\beta V_T}{I_C}=\frac{\beta}{g_m}\]</div>
<div><p><b>מודל T:</b> מקור \(g_mv_{be}\) מ-C לצומת פנימי, ומהצומת נגד \(r_e\) אל E. הבסיס מתחבר לצומת הפנימי.</p>
\[r_e=\frac{V_T}{I_E}=\frac{\beta V_T}{(\beta+1)I_C}=\frac{\alpha}{g_m}\approx\frac{1}{g_m}\]</div></div>
`+co('key','🔑','הערה על סימון','<p>בטקסט של הסיכום כתוב \\(g_m=I_E/V_T\\) ו-\\(r_e=1/g_m\\), ובסרטוט המודל \\(g_m=I_C/V_T\\) ו-\\(r_e=\\alpha/g_m\\). מכיוון ש-\\(\\alpha\\approx0.999\\), ההפרש זניח, ובחישובים מספריים משתמשים ב-\\(g_m=I_C/V_T\\).</p>')+co('why','💡','החיבור בין המודלים','<p>שני המודלים שקולים: הזרם שנכנס לבסיס קטן פי \\(\\beta+1\\) מהזרם בפולט, לכן \\(r_e\\) שבפולט "נראה" מהבסיס כ-\\(r_\\pi=(\\beta+1)r_e\\).</p>')},
{t:'אפקט התקצרות התעלה (Early)',h:R`
<p>באופיין \(I_C=f(V_{CE})\) העקומות באזור הפעיל אינן שטוחות לגמרי: יש להן שיפוע קטן. אם ממשיכים אותן שמאלה, <b>כולן נפגשות בנקודה אחת</b> על הציר, \(V_{CE}=-V_A\).</p>
<p>השיפוע הזה מתבטא בהתנגדות מוצא:</p>
\[r_0=\frac{V_A}{I_C}\]
<p>במודל (היבריד-π או T) מוסיפים את \(r_0\) <b>בין C ל-E</b>, במקביל למקור הזרם התלוי.</p>
<ul><li>יש התנגדות מוצא (נתון \(V_A\)): \(r_0=V_A/I_C\).</li><li>אין התנגדות מוצא: \(r_0\to\infty\) (נתק).</li></ul>`},
{t:'מעגלי הגבר: שלוש תצורות',h:R`
<p>כדי לזהות את התצורה בודקים <b>לאיזה הדק מחובר אות הכניסה \(v_{in}\)</b> ו<b>מאיזה הדק נמדד המוצא \(v_{out}\)</b>. ההדק השלישי הוא ה"משותף".</p>
<div class="tbl"><table><thead><tr><th>תצורה</th><th>כניסה</th><th>מוצא</th><th>הדק משותף</th></tr></thead><tbody>
<tr><td><b>CE</b> פולט משותף</td><td>בסיס</td><td>קולט</td><td>פולט</td></tr>
<tr><td><b>CB</b> בסיס משותף</td><td>פולט</td><td>קולט</td><td>בסיס</td></tr>
<tr><td><b>CC</b> קולט משותף</td><td>בסיס</td><td>פולט</td><td>קולט</td></tr>
</tbody></table></div>
<p style="margin-top:10px">אותו זיהוי תקף גם ל-PNP (שם הפולט למעלה וסימני המתחים הפוכים).</p>
`+co('analogy','🎛️','טריק לזיכרון','<p>הקולט אף פעם לא כניסה, והבסיס אף פעם לא מוצא. מה שנשאר מגדיר את התצורה.</p>')+golab(5,'l5-cfg','השווה בין התצורות')},
{t:'מעגל CE (פולט משותף)',h:R`
<p>ב-CE הטרנזיסטור משמש <b>גם מגבר זרם וגם מגבר מתח</b>. זה מגבר מתח <b>מהפך</b> עם הגבר טוב. \(R_E\) הוא הנגד בפולט ו-\(R_L'\) הוא העומס הכולל בקולט.</p>
<p><b>התנגדות כניסה ומוצא:</b></p>
\[R_{in}=r_\pi+\frac{R_E(\beta+1)r_0}{r_0+R_E+R_L}\qquad R_o=r_0+(1+g_mr_0)\cdot(r_\pi\parallel R_E)\]
<p><b>הגבר מתח וזרם:</b></p>
\[\frac{v_o}{v_i}=-\frac{\beta R_L}{r_\pi+(\beta+1)R_E+(r_\pi/r_0)(R_E+R_L)}\qquad \frac{i_o}{i_i}=-\frac{\beta}{1+(R_E+R_L)/r_0}\]
<p><b>מקרה פרטי \(r_0\to\infty\):</b></p>
\[R_{in}=(\beta+1)(r_e+R_E)=r_\pi+(\beta+1)R_E,\quad R_o=\infty,\quad \frac{i_o}{i_i}=-\beta,\quad \frac{v_o}{v_i}=-\frac{\beta R_L'}{r_\pi+(\beta+1)R_E}\]
<p><b>מקרה פרטי \(r_0\to\infty\) וגם \(R_E\to0\):</b></p>
\[\frac{v_o}{v_i}=-g_mR_L'\]
`+co('why','💡','מה R<sub>E</sub> עושה?','<p>\\(R_E\\) מוכפל ב-\\(\\beta+1\\) במכנה: הוא מגדיל מאוד את \\(R_{in}\\) אבל מקטין את ההגבר. בלי \\(R_E\\) מקבלים את ההגבר המקסימלי \\(-g_mR_L\'\\).</p>')+golab(5,'l5-ce','נסה מגבר CE')},
{t:'מעגלי CC ו-CB',h:R`
<h4>CC (קולט משותף) — Emitter Follower</h4>
<p>מיועד לעבוד בתדרים גבוהים. היתרון שלו הוא כ<b>חוצץ מתח</b>: הגבר המתח קרוב ל-1 (אך קטן ממנו), <b>התנגדות כניסה גדולה והתנגדות מוצא קטנה</b>, ויש לו הגבר זרם טוב.</p>
\[R_{in}=(\beta+1)\left(r_e+(r_0+R_C)\parallel R_L\right)\qquad R_o=\frac{r_\pi+R_B}{\beta+1}\parallel(r_0+R_C)\]
\[\frac{v_o}{v_i}=\frac{r_0\parallel R_L}{r_0\parallel R_L+r_e}\qquad \frac{i_o}{i_i}=\frac{(\beta+1)r_0+R_C}{r_0+R_L+R_C}\]
<p>כאשר \(r_0\to\infty\):</p>
\[R_{in}=r_\pi+(\beta+1)R_L'=(\beta+1)(r_e+R_L'),\quad R_o=\frac{R_B}{\beta+1}+r_e,\quad \frac{i_o}{i_i}=\beta+1,\quad \frac{v_o}{v_i}=\frac{R_L'}{R_L'+r_e}\approx1\]
<h4>CB (בסיס משותף)</h4>
<p>התנגדות כניסה <b>נמוכה מאוד</b>, הגבר מתח זהה (בגודלו) לזה של CE, והתנגדות מוצא גבוהה. לבדו הוא לא מגבר מתח שימושי, אבל הוא מתפקד טוב בתדרים גבוהים.</p>
\[R_{in}=\frac{(r_\pi+R_B)(1+R_L/r_0)}{(\beta+1)+\dfrac{r_\pi+R_B+R_L}{r_0}}\qquad R_o=r_0+(1+g_mr_0)(r_\pi\parallel R_{sig})\]
\[\frac{v_o}{v_i}=\frac{(\beta r_0+r_\pi)R_L}{(r_0+R_L)r_\pi}\qquad \frac{i_o}{i_i}=\frac{\beta+(r_\pi+R_B)/r_0}{(\beta+1)+\dfrac{r_\pi+R_B+R_L}{r_0}}\]
<p>כאשר \(r_0\to\infty\) (ו-\(R_B\to0\)):</p>
\[R_{in}=\frac{r_\pi}{\beta+1}=r_e\approx\frac{1}{g_m},\quad R_o=\infty,\quad \frac{v_o}{v_i}=\frac{\beta R_L'}{r_\pi}=g_mR_L',\quad \frac{i_o}{i_i}=\frac{\beta}{\beta+1}=\alpha\]
`+co('warn','⚠️','שתי טעויות הקלדה בסיכום (CB)','<p>(1) במכנה של \\(R_{in}\\) בסיכום חסר ה-"+": צריך \\((\\beta+1)+\\frac{r_\\pi+R_B+R_L}{r_0}\\), כמו במכנה של הגבר הזרם (אחרת עבור \\(r_0\\to\\infty\\) לא מקבלים \\(\\frac{r_\\pi+R_B}{\\beta+1}\\)). בדקתי בגזירה מלאה. (2) במקרה הפרטי כתוב \\(R_B\\to\\infty\\); כדי לקבל \\(r_\\pi/(\\beta+1)\\) צריך \\(R_B\\to0\\).</p>')+R`
<div class="tbl"><table><thead><tr><th></th><th>CE</th><th>CC</th><th>CB</th></tr></thead><tbody>

theory:[
{t:'ראי זרם עם MOSFETs: המבנה הבסיסי',h:R`
<p>במעגלים משולבים (IC) צריך לעיתים קרובות <b>זרם קבוע</b> שכמעט לא משתנה עם העומס או עם מתח המוצא. הפתרון הפופולרי: שני טרנזיסטורים \(Q_1\) ו-\(Q_2\) עם <b>אותו \(V_{GS}\)</b> (השערים מחוברים יחד והמקורות יחד).</p>
<ul><li>\(Q_1\) מחובר כדיודה (שער מחובר לדרֵין), לכן \(V_{DS1}=V_{GS}\ge V_{GS}-V_t\): הוא <b>מאולץ להיות ברוויה</b>.</li>
<li>כדי שהמעגל יעבוד, <b>דורשים שגם \(Q_2\) יהיה ברוויה</b> (\(V_{DS2}\ge V_{GS}-V_t\)).</li>
<li>זרם הייחוס נקבע ע"י הנגד \(R\): \[I_{REF}=\frac{V_{DD}-V_{GS}}{R}\]</li></ul>
<p>הצד של \(Q_2\) מתנהג כ<b>מקור זרם \(I_o\)</b> עם התנגדות מוצא:</p>
\[R_{out}=r_0=\frac{1}{\lambda I_D}=\frac{V_A}{I_o}\]
`+co('analogy','🪞','למה "ראי"?','<p>\\(Q_1\\) "מודד" את זרם הייחוס והופך אותו למתח \\(V_{GS}\\). \\(Q_2\\) מקבל את אותו מתח ולכן "משקף" את הזרם לצד השני, מוכפל ביחס הגאומטריה.</p>')+golab(6,'l6-mos','פתח את סימולציית ראי ה-MOS')},
{t:'יחס הזרמים: בלי ועם התקצרות תעלה',h:R`
<p><b>ללא אפקט התקצרות תעלה:</b> היחס בין זרם המוצא לזרם הייחוס תלוי <b>רק בגאומטריה</b> של \(Q_1\) ו-\(Q_2\):</p>
\[\frac{I_0}{I_{REF}}=\frac{(W/L)_2}{(W/L)_1}\]
<p><b>כולל אפקט התקצרות תעלה:</b> לכל טרנזיסטור יש גורם \((1+\lambda V_{DS})\). ב-\(Q_1\): \(V_{DS1}=V_{GS}\), ב-\(Q_2\): \(V_{DS2}=V_o\). בקירוב מסדר ראשון:</p>
\[\frac{I_0}{I_{REF}}=\frac{(W/L)_2}{(W/L)_1}\cdot\frac{1+\lambda V_o}{1+\lambda V_{GS}}\approx\frac{(W/L)_2}{(W/L)_1}\left(1+\lambda\left(V_o-V_{GS}\right)\right)\]
\[\boxed{I_0=I_{REF}\,\frac{(W/L)_2}{(W/L)_1}\left(1+\lambda\left(V_o-V_{GS}\right)\right)}\]
`+co('key','🔑','מתי הראי מדויק?','<p>כש-\\(V_o=V_{GS}\\) שני הטרנזיסטורים באותו \\(V_{DS}\\) והשגיאה מתאפסת. ככל ש-\\(V_o\\) רחוק מ-\\(V_{GS}\\), הזרם סוטה, והסטייה קטנה יותר ככל ש-\\(r_0\\) גדול (\\(\\lambda\\) קטן).</p>')},
{t:'מעגלי הכוונת זרם (MOS)',h:R`
<p>אפשר ליצור <b>כמה מקורות זרם</b> לחלקים שונים של המעגל המשולב, כולם מאותו זרם ייחוס. בתצורה הבסיסית: \(Q_1\) (ייחוס) מול \(Q_2,Q_3\) (NMOS), ו-\(Q_3\) מזין ראי PMOS \(Q_4,Q_5\).</p>
<ul><li>זרם הייחוס נקבע ע"י הנגד \(R\).</li>
<li>\(Q_1\) ברוויה, אבל צריך <b>לאלץ</b> גם את האחרים לרוויה. עבור NMOS: \(V_{D2},V_{D3}\ge -V_{SS}+V_{OV_1}\).</li>
<li>עבור ה-PMOS \(Q_5\): \(V_{D5}\le V_{DD}-\left|V_{OV_5}\right|\).</li></ul>
\[I_2=I_{REF}\frac{(W/L)_2}{(W/L)_1},\qquad I_3=I_4=I_{REF}\frac{(W/L)_3}{(W/L)_1},\qquad I_5=I_4\frac{(W/L)_5}{(W/L)_4}\]
<div class="cols2"><div>`+co('key','⬇️','Current Sink','<p>\\(Q_2\\) (NMOS) <b>מושך</b> זרם מלמטה: "בולע" זרם מהעומס אל \\(-V_{SS}\\).</p>')+R`</div><div>`+co('key','⬆️','Current Source','<p>\\(Q_5\\) (PMOS) <b>מזריק</b> זרם לעומס מלמעלה, מ-\\(V_{DD}\\).</p>')+R`</div></div>`},
{t:'ראי זרם עם BJTs',h:R`
<p>אותו רעיון בטכנולוגיית BJT: \(Q_1\) מחובר כדיודה (בסיס לקולקטור), \(Q_2\) משקף. שניהם עם אותו \(V_{BE}\). המעגל ממשש מקור זרם \(I_o\) עם:</p>
\[R_{out}=r_0=\frac{V_A}{I_C}\]
<p>כשזרם הייחוס נוצר דרך נגד \(R\) מ-\(V_{CC}\):</p>
\[I_C=\frac{\beta}{\beta+2}\cdot\frac{V_{CC}-V_{BE}}{R}\ \underset{\beta\gg2}{\approx}\ \frac{V_{CC}-V_{BE}}{R}\ \underset{V_{CC}\gg V_{BE}}{\approx}\ \frac{V_{CC}}{R}\]
<p>כלומר את הזרם אפשר להעריך בקירוב טוב רק לפי \(V_{CC}\) ו-\(R\). בשאלות עם מגברים, מקור זרם כזה מוחלף פשוט במקור זרם אידיאלי \(I_o\).</p>
<p><b>המקרה האידיאלי (\(\beta\to\infty\)):</b></p>
\[I_{C1}=I_{S1}e^{V_{BE1}/V_T},\qquad I_{C2}=I_{S2}e^{V_{BE2}/V_T}\]
<p>אם הצמתים זהים (\(I_{S1}=I_{S2}\)) ו-\(V_{BE1}=V_{BE2}\), מקבלים \(I_{C1}=I_{C2}\), כלומר \(I_o=I_{REF}\).</p>
<p><b>הגדלת זרם המוצא:</b> אם מגדילים את שטח צומת BE של \(Q_2\) פי \(m\), מקבלים (עדיין באידיאלי) <span class="dc-t">\(I_o=m\cdot I_{REF}\)</span>.</p>
`+golab(6,'l6-bjt','פתח את סימולציית ראי ה-BJT')},
{t:'BJT: התחשבות בזרם הבסיס ובאפקט Early',h:R`
<p>עבור \(\beta\) סופי, \(I_{REF}\) צריך לספק גם את <b>שני זרמי הבסיס</b> (\(I_C/\beta\) לכל טרנזיסטור): \(I_{REF}=I_C+2I_C/\beta\). לכן:</p>
\[\frac{I_o}{I_{REF}}=\frac{1}{1+2/\beta}=\frac{\beta}{\beta+2}\qquad(\beta\to\infty\Rightarrow I_o=I_{REF})\]
<p>עם הכפלה פי \(m\) (בסיס \(Q_2\) לוקח \(mI_C/\beta\)):</p>
\[\frac{I_o}{I_{REF}}=\frac{m}{1+\dfrac{m+1}{\beta}}\]
<p>התנגדות המוצא נשארת \(R_{out}=r_{02}=V_{A2}/I_C\) (מחושבת ממודל אות קטן).</p>
<p><b>גם \(\beta\) סופי וגם \(R_{out}\) סופי (Early):</b></p>
\[\boxed{I_o=I_{REF}\,\frac{m}{1+\dfrac{m+1}{\beta}}\cdot\left(1+\frac{V_o-V_{BE}}{V_{A2}}\right)}\]
<p>כש-\(V_o=V_{BE}\) אפקט Early מתבטל (שני הטרנזיסטורים באותו \(V_{CE}\)).</p>
`+co('why','💡','מקבילה ל-MOS','<p>הגורם \\((V_o-V_{BE})/V_{A2}\\) הוא בדיוק האנלוג של \\(\\lambda(V_o-V_{GS})\\) בראי ה-MOS. ההבדל היחיד: ב-BJT יש גם שגיאת \\(\\beta\\), כי יש זרם בסיס, וב-MOS אין זרם שער.</p>')},
{t:'הכוונת זרם BJT ומקורות מתואמים',h:R`
<p>גם ב-BJT מחברים מספר מקורות לאותו ייחוס. עם ראי PNP \(Q_1\) למעלה וראי NPN \(Q_2\) למטה, ונגד \(R\) ביניהם:</p>
\[I_{REF}=\frac{V_{CC}+V_{EE}-V_{EB1}-V_{BE2}}{R}\]
<p>בהנחות: \(\beta\) גדול (מזניחים זרמי בסיס), מתעלמים מ-Early, כל הטרנזיסטורים זהים (אותו \(I_S\)):</p>
<ul><li>\(Q_1\) ו-\(Q_3\): \(I_1=I_{REF}\).</li>
<li>\(Q_1\) עם \(Q_5\) ו-\(Q_6\) (במקביל): \(I_3=2I_{REF}\).</li>
<li>\(Q_2\) עם \(Q_7,Q_8,Q_9\): \(I_4=3I_{REF}\). (ו-\(Q_4\): \(I_2=I_{REF}\).)</li></ul>
`+co('warn','⚠️','שתי הערות מהסיכום','<p>1) הזרמים נשארים קבועים <b>כל עוד</b> מפל המתח \\(V_{CE}\\) (או \\(V_{EC}\\)) לא מכניס את הטרנזיסטור לרוויה; הוא חייב להישאר במצב הפעיל.<br>2) \\(Q_3\\), \\(Q_5,Q_6\\) (PNP) יוצרים Current sources; \\(Q_4\\) ו-\\(Q_7,Q_8,Q_9\\) (NPN) יוצרים Current sinks.</p>')+R`
<p><b>מקרה פרטי: N מקורות מתואמים עם \(\beta\) סופי.</b> טרנזיסטור ייחוס אחד מזין \(N\) יציאות, כולן עם \(I_C\):</p>
\[I_{REF}=I_C+(N+1)I_B=I_C\left(1+\frac{N+1}{\beta}\right)\ \Rightarrow\ \boxed{I_C=I_{REF}\left(1+\frac{N+1}{\beta}\right)^{-1}}\]`},
{t:'ראי זרם של וילסון (Wilson)',h:R`
<p>בראי הבסיסי, \(\beta\) סופי גורם לסטייה של <b>אחוזים שלמים</b> בזרם. ג'ורג' וילסון הציע שיפור שמקטין את התלות ב-\(\beta\) ושומר על התנגדות מוצא גדולה.</p>
<p>המבנה: \(Q_1,Q_2\) ראי בתחתית (\(Q_2\) מחובר כדיודה), ו-\(Q_3\) למעלה מוליך את זרם המוצא; הבסיס של \(Q_3\) מוזן מהקולקטור של \(Q_1\). זרם האמיטר של \(Q_3\) הוא \(I_C(1+2/\beta)\) ולכן \(I_o=I_C\frac{(1+2/\beta)\beta}{\beta+1}\).</p>
\[\frac{I_o}{I_{REF}}=\frac{1}{1+\dfrac{2}{\beta(\beta+2)}}\approx\frac{1}{1+2/\beta^2},\qquad R_{out}=\frac{\beta r_0}{2}\]
`+co('key','🔑','מה הרווחנו','<p>השגיאה ירדה מסדר \\(2/\\beta\\) (ראי בסיסי) לסדר \\(2/\\beta^2\\). עם \\(\\beta=100\\): 2% לעומת 0.02%. והתנגדות המוצא גדלה פי \\(\\beta/2\\) לעומת \\(r_0\\).</p>')+co('warn','📝','הערה על הסיכום','<p>בסיכום כתוב במכנה \\(\\beta^2+\\beta\\). מהזרמים שבאיור עצמו יוצא \\(\\beta^2+2\\beta=\\beta(\\beta+2)\\). הקירוב \\(1/(1+2/\\beta^2)\\) זהה בשני המקרים.</p>')},
{t:'ראי זרם של וידלר (Widlar): זרמים קטנים',h:R`
<p>מוסיפים נגד \(R_E\) באמיטר של \(Q_2\). כעת \(V_{BE2}\lt V_{BE1}\), וההפרש נופל על \(R_E\). כשמזניחים זרמי בסיס, \(V_{BE}=V_T\ln(I_C/I_S)\), ולכן:</p>
\[\boxed{I_oR_E=V_T\ln\left(\frac{I_{REF}}{I_o}\right)}\]
<ul><li>לתכנון (\(I_o\) נתון): מציבים ומקבלים \(R_E\) ישירות.</li>
<li>לניתוח (\(R_E\) נתון): המשוואה <b>איטרטיבית</b>, כי \(I_o\) מופיע משני הצדדים.</li>
<li>המשוואה לוגריתמית, ולכן עבור זרם קטן (\(\sim1\mu\text{A}:10\mu\text{A}\)) מספיק \(R_E\) בערך סביר.</li></ul>
<p>התנגדות המוצא:</p>
\[R_{out}=r_{02}\left(g_m\left(R_E\parallel r_\pi\right)+1\right)\]
`+co('why','💡','מסקנה','<p>היתרון: \\(R_E\\) ביחד עם \\(R\\) יכולים להיות <b>קטנים</b> יותר מאשר בראי הבסיסי, ולכן תופסים פחות שטח ב-IC. בנוסף, התנגדות המוצא גדלה פי \\((g_mR_E\\parallel r_\\pi+1)\\). כלומר \\(R_E\\) מאפשר: להוריד ערכי נגדים, לייצר זרם קטן, ולהגדיל את \\(R_{out}\\).</p>')+golab(6,'l6-wid','פתח את סימולציית וידלר')},
{t:'תצורת Cascode',h:R`
<p><b>הגדרה:</b> חיבור דרגת CG ל-CS ב-MOSFET (או CB ל-CE ב-BJT). השם מ-cascaded cathode, אופן החיבור של שפופרות. מטרתה: לשמור על <b>התנגדות מוצא גבוהה</b> והמוליכות של CS, יחד עם תכונת החציצה של CG, ובכך להגיע לרוחב סרט גבוה יותר. למרות ששתי דרגות, מתייחסים אליו כמגבר של דרגה אחת.</p>
<p><b>מגבר MOS בתצורת Cascode</b> (\(Q_1\) CS, \(Q_2\) CG עם \(V_{BIAS}\)). ללא עומס (\(R_L\to\infty\)):</p>
\[A_{V0}=\left.\frac{v_o}{v_{in}}\right|_{R_L\to\infty}=-g_mr_{01}\left(1+g_{m2}r_{02}\right)\approx-g_mr_{01}g_{m2}r_{02}\]
<p>לטרנזיסטורים מתואמים, והתנגדות המוצא:</p>\[A_{V0}=-\left(g_mr_0\right)^2,\qquad R_o=\left(1+g_{m2}r_{01}\right)r_{02}+r_{01}\approx g_{m2}r_{01}r_{02}\]
<p>עם עומס סופי \(R_L\):</p>
\[G_V=-\frac{g_{m1}r_{01}g_{m2}r_{02}R_L}{g_{m2}r_{01}r_{02}+r_{02}+R_L}\approx-g_{m1}\left(g_{m2}r_{01}r_{02}\parallel R_L\right),\qquad R_{out}=R_o\parallel R_L\]
<p>כלומר <span class="ac-t">\(G_V=-G_mR_o\parallel R_L\)</span> עם \(G_m=g_{m1}\).</p>
`+golab(6,'l6-cas','פתח את סימולציית הקסקוד')},
{t:'Cascode ב-BJT ותצורות Cascade (שירשור)',h:R`
<p><b>קסקוד BJT</b> (\(Q_1\) CE, \(Q_2\) CB) - יתרונות דומים ל-MOS, אבל:</p>
\[R_{in}=r_\pi,\qquad R_o=\beta_2r_{02},\qquad A_{V0}=-\frac{\beta_1\beta_2r_{02}}{r_{\pi1}}=-g_{m1}\beta_2r_{02}=-g_{m1}R_o\]
<p>עם עומס: \(R_{in}=r_{\pi1}\), \(R_{out}=(\beta_2r_{02})\parallel R_L\), \(G_V=-g_{m1}(r_{02}\parallel R_L)\) (כפי שמופיע בסיכום).</p>
<p>תצורות קסקוד נוספות: Double Cascode, Folded Cascode, BiCMOS Cascode (לא נכנסים אליהן).</p>
<p><b>Cascade (שירשור)</b> שונה מ-Cascode: במקום שני טרנזיסטורים באותו פס, המוצא של דרגה אחת נכנס לכניסה של הבאה. מקורות הזרם ממומשים בראי זרם, והניתוח לפי נוסחאות המגברים הדו-דרגתיים:</p>

st:R`במעגל הכוונת הזרם שבסיכום (ראי PNP עליון \(Q_1\) עם \(Q_3,Q_5,Q_6\); ראי NPN תחתון \(Q_2\) עם \(Q_4,Q_7,Q_8,Q_9\); \(Q_5,Q_6\) מחוברים במקביל ל-\(I_3\) ו-\(Q_7,Q_8,Q_9\) במקביל ל-\(I_4\)). מצא את כל הזרמים עבור הנתונים. (המספרים נוספו לדוגמה שבסיכום.)`,
given:R`\(V_{CC}=V_{EE}=5\text{V}\), \(V_{EB1}=V_{BE2}=0.7\text{V}\), \(R=8.6\text{k}\Omega\); \(\beta\) גדול, בלי Early, כל הטרנזיסטורים זהים`,
ask:R`\(I_{REF},\ I_1,\ I_2,\ I_3,\ I_4\)`,
steps:[
{t:'זרם הייחוס',b:R`<p>מסלול: \(V_{CC}\to\) צומת EB של \(Q_1\to R\to\) צומת BE של \(Q_2\to -V_{EE}\):</p>\[I_{REF}=\frac{V_{CC}+V_{EE}-V_{EB1}-V_{BE2}}{R}=\frac{10-1.4}{8.6\text{k}}=1\text{ mA}\]`},
{t:'I₁ ו-I₂',b:R`<p>\(Q_3\) מקבל את \(V_{EB}\) של \(Q_1\), ו-\(Q_4\) את \(V_{BE}\) של \(Q_2\). טרנזיסטורים זהים ו-\(\beta\) גדול:</p>\[I_1=I_{REF}=1\text{ mA}\ (\text{source}),\qquad I_2=I_{REF}=1\text{ mA}\ (\text{sink})\]`},
{t:'I₃: שני טרנזיסטורים במקביל',b:R`<p>\(Q_5\) ו-\(Q_6\) כל אחד משקף \(I_{REF}\) והזרמים מתחברים (שקול להכפלת שטח פי \(m=2\)):</p>\[I_3=2I_{REF}=2\text{ mA}\]`},
{t:'I₄: שלושה במקביל',b:R`\[I_4=3I_{REF}=3\text{ mA}\]<p>\(I_3\) הוא Current source (PNP), \(I_4\) הוא Current sink (NPN).</p>`},
{t:'תנאי העבודה',b:R`<p>הזרמים נכונים רק כל עוד כל טרנזיסטור מוצא נשאר במצב <b>הפעיל</b>: מפל \(V_{EC}\) (PNP) או \(V_{CE}\) (NPN) לא מכניס אותו לרוויה.</p>`}
],
ans:R`\(I_{REF}=1\text{mA}\) · \(I_1=I_2=1\text{mA}\) · \(I_3=2\text{mA}\) · \(I_4=3\text{mA}\)`},

w:440,h:245,
st:R`ראי זרם BJT שבו שטח צומת BE של \(Q_2\) גדול פי \(m=2\). חשב את \(I_o\): (א) באידיאלי, (ב) עם \(\beta=100\), (ג) עם \(\beta=100\) וגם Early. חשב גם את \(R_{out}\).`,
given:R`\(I_{REF}=1\text{mA}\), \(m=2\), \(\beta=100\), \(V_{A2}=50\text{V}\), \(V_o=5\text{V}\), \(V_{BE}=0.7\text{V}\)`,
ask:R`\(I_o\) בשלושת המקרים · \(R_{out}\)`,
steps:[
{t:'(א) אידיאלי',b:R`<p>\(\beta\to\infty\): זרמי הבסיס זניחים, \(I_o=m\cdot I_{REF}=2\text{ mA}\).</p>`},
{t:'(ב) β סופי',b:R`<p>\(I_{REF}\) מזין את \(I_C\) של \(Q_1\) וגם בסיסים: \(I_C/\beta+mI_C/\beta\):</p>\[I_o=I_{REF}\frac{m}{1+\frac{m+1}{\beta}}=\frac{2}{1+0.03}=1.942\text{ mA}\]<p>שגיאה של כ-3%.</p>`},
{t:'(ג) הוספת Early',b:R`\[I_o=1.942\cdot\left(1+\frac{V_o-V_{BE}}{V_{A2}}\right)=1.942\cdot\left(1+\frac{4.3}{50}\right)=2.109\text{ mA}\]<p>אם היה \(V_o=V_{BE}=0.7\text{V}\), הגורם היה 1 בדיוק.</p>`},
{t:'התנגדות מוצא',b:R`\[R_{out}=r_{02}=\frac{V_{A2}}{I_C}=\frac{50}{1.942\text{m}}\approx25.7\text{ k}\Omega\]`},
{t:'השוואה לוילסון',b:R`<p>לראי 1:1 בסיסי עם \(\beta=100\): \(\frac{\beta}{\beta+2}=0.980\) (שגיאה 2%). בוילסון: \(\frac{1}{1+2/(\beta^2+2\beta)}=0.9998\) (שגיאה 0.02%), וגם \(R_{out}=\beta r_0/2\), פי 50 מ-\(r_0\).</p>`}
],

st:R`ראי וידלר. (א) מצא \(R_E\) כך ש-\(I_o=10\mu\text{A}\). (ב) חשב את \(R_{out}\) עבור הנקודה הזו. (ג) אם במקום זה \(R_E=5\text{k}\Omega\), מצא את \(I_o\).`,
given:R`\(I_{REF}=1\text{mA}\), \(V_T=25\text{mV}\), \(\beta=100\), \(V_A=100\text{V}\); זרמי בסיס מוזנחים`,
ask:R`\(R_E\), \(R_{out}\), \(I_o\) עבור \(R_E=5\text{k}\Omega\)`,
steps:[
{t:'(א) תכנון ישיר',b:R`\[I_oR_E=V_T\ln\frac{I_{REF}}{I_o}\ \Rightarrow\ R_E=\frac{0.025}{10\mu}\ln(100)=11.51\text{ k}\Omega\]<p>לשם השוואה: בראי בסיסי מ-\(V_{CC}=10\text{V}\) היה צריך \(R\approx\frac{10-0.7}{10\mu}=930\text{k}\Omega\) כדי לקבל 10µA. זה היתרון של וידלר: נגדים קטנים.</p>`},
{t:'(ב) פרמטרים לאות קטן',b:R`\[g_m=\frac{I_o}{V_T}=0.4\ \text{mA/V},\quad r_\pi=\frac{\beta}{g_m}=250\text{ k}\Omega,\quad r_{02}=\frac{V_A}{I_o}=10\text{ M}\Omega\]`},
{t:'(ב) התנגדות המוצא',b:R`\[R_E\parallel r_\pi=11.51\text{k}\parallel250\text{k}=11.0\text{ k}\Omega,\quad g_m(R_E\parallel r_\pi)=4.40\]\[R_{out}=r_{02}\left(g_m(R_E\parallel r_\pi)+1\right)=10\text{M}\cdot5.40=54\text{ M}\Omega\]`},
{t:'(ג) משוואה איטרטיבית',b:R`\[I_o=\frac{V_T}{R_E}\ln\frac{I_{REF}}{I_o}=5\mu\text{A}\cdot\ln\frac{1\text{m}}{I_o}\]<p>ניחוש \(I_o=20\mu\text{A}\): \(5\mu\cdot\ln50=19.56\mu\text{A}\) → \(5\mu\cdot\ln(51.1)=19.67\mu\text{A}\) → \(19.64\mu\text{A}\) → מתכנס.</p>`},
{t:'תוצאה',b:R`<p><span class="ok-t">\(I_o\approx19.65\mu\text{A}\)</span>. בדיקה: \(19.65\mu\cdot5\text{k}=98.2\text{mV}\) ו-\(0.025\ln(1\text{m}/19.65\mu)=98.2\text{mV}\) ✓</p>`}
],
ans:R`\(R_E=11.5\text{k}\Omega\) · \(R_{out}\approx54\text{M}\Omega\) · עבור \(R_E=5\text{k}\Omega\): \(I_o\approx19.6\mu\text{A}\)`},

{t:'הקדמה: מגבר הפרש אידיאלי ומעשי',h:R`
<p><b>מגבר הפרש</b> מקבל שני אותות כניסה \(v_{in}^{+}(t)\) ו-\(v_{in}^{-}(t)\) ומוציא את <b>ההפרש</b> ביניהם, מוגבר פי גורם קבוע שנקבע על ידי הפרמטרים של המגבר.</p>
<p><b>במגבר אידיאלי</b> מספיקים שלושה סימונים:</p>
\[v_{id}=v_{in}^{+}-v_{in}^{-}=v_2-v_1,\qquad v_{out}=A_d\left(v_{in}^{+}-v_{in}^{-}\right)=A_dv_{id},\qquad A_d=\frac{v_{out}}{v_{id}}\]
<p><b>במגבר מעשי</b> לכניסות יש גם רכיב משותף (הטיה, רעש). מגדירים את <b>המתח המשותף</b> כממוצע הכניסות, ואת ההגבר שלו:</p>
\[v_{CM}=\frac{v_{in}^{+}+v_{in}^{-}}{2}=\frac12(v_1+v_2),\qquad A_{CM}=\frac{v_{out}}{v_{CM}}\]
<p>במגבר אידיאלי \(A_{CM}=0\): אם \(v_{in}^{+}=v_{in}^{-}\) אז \(v_{out}=A_d(v_{in}^{+}-v_{in}^{-})=0\). במגבר מעשי המוצא הוא סכום של שני החלקים:</p>
\[v_{out}=A_dv_{id}+A_{CM}v_{CM},\qquad CMRR=\left|\frac{A_d}{A_{CM}}\right|\]
`+co('key','🎯','CMRR = מדד האיכות',R`<p>יחס דחיית האות המשותף (Common Mode Rejection Ratio) אומר כמה ההגבר להפרש חזק מההגבר לחלק המשותף, שמקורו בדרך כלל ברעש שמגיע לשתי הכניסות יחד. תמיד שואפים ל-\(CMRR\gg1\).</p>`)+co('analogy','🎧','אנלוגיה: שיחה בחדר רועש',R`<p>שני מיקרופונים קולטים את אותו רעש רקע (משותף) ורק אחד קולט את הדובר (הפרש). מגבר הפרש טוב מחסר ביניהם: הרעש מתבטל והדיבור נשאר. \(CMRR\) גבוה = ביטול רעש טוב.</p>`)},

{t:'מבנה בסיסי והגדרת מתח המוצא',h:R`
<p>המגבר בנוי משני טרנזיסטורים <b>מתואמים</b> \(Q_1,Q_2\). הכניסות \(v_{G1},v_{G2}\) (או \(v_{B1},v_{B2}\)) מחוברות ל-Gate (או ל-Base). כל טרנזיסטור מחובר לאספקה \(V_{DD}\) (או \(V_{CC}\)) דרך נגד זהה \(R_D\) (או \(R_C\)), וה-Sources (או ה-Emitters) מחוברים יחד ל<b>מקור זרם משותף \(I\)</b>, שבדרך כלל ממומש בעצמו במעגל MOSFETs. בהמשך יופיעו גם מעגלים עם עומס אקטיבי במקום \(R_D\).</p>
<p>בנקודת העבודה: \(I_{D1}=I_{D2}=\tfrac{I}{2}\) (או \(I_{C1}=I_{C2}=\tfrac{I}{2}\)).</p>
<p><b>הגדרת המוצא:</b> \(v_{out}=A_d\left(v_{in2}-v_{in1}\right)\), כאשר \(A_d\) הוא הגבר ההפרש ו-\(v_{in1},v_{in2}\) הן הכניסה הראשונה והשנייה. ספציפית:</p>
\[\text{BJT:}\ \ v_{out}=v_{C1}-v_{C2}=A_d\left(v_{B1}-v_{B2}\right)\qquad \text{MOSFET:}\ \ v_{out}=v_{D1}-v_{D2}=A_d\left(v_{G1}-v_{G2}\right)\]
`+co('why','💡','מקור הזרם מחלק תמיד שווה בשווה',R`<p>כל עוד הטרנזיסטורים מתואמים, מקור הזרם מחלק את \(I\) שווה בין הענפים <b>גם אם נגדי העומס שונים</b>: אם \(R_{D1}\ne R_{D2}\) (או \(R_{C1}\ne R_{C2}\)) עדיין \(I_{D1}=I_{D2}\) (או \(I_{C1}=I_{C2}\)). אי-התאמה בנגדים משנה רק את מתחי המוצא.</p>`)+co('warn','⚠️','קוטביות המוצא',R`<p>בסיכום מופיעות כמה צורות כתיבה של המוצא (\(v_{in2}-v_{in1}\), \(v_{D1}-v_{D2}\), \(v_{o2}-v_{o1}\)). הסימן של \(A_d\) תלוי באיזו מהן בוחרים, לכן תמיד לכתוב במפורש מה \(v_{out}\) לפני שמציבים.</p>`)},

{t:'MOS: פעולה במצב Common-Mode וטווח ה-CM',h:R`
<p>מחברים את שתי הכניסות לאותו מתח: \(v_{G1}=v_{G2}=v_{CM}\). המתח המשותף <b>לא משפיע</b> על נקודת העבודה: מקור הזרם כופה \(i_{D1}=i_{D2}=\tfrac12I\), ולכן גם \(v_{GS1}=v_{GS2}\). כש-\(v_{CM}\) עולה, מתח ה-Sources פשוט "עולה איתו".</p>
<p>אבל \(v_{CM}\) לא יכול להיות כל ערך. מגדירים \(V_{CS}\) = המתח על מקור הזרם (CS = Current Source).</p>
<div class="cols2"><div><p><b>אילוץ תחתון:</b> \(V_{CS}\) לא יכול לרדת מתחת למינימום שמשאיר את הטרנזיסטורים של מקור הזרם ברוויה:</p>\[V_{CM\min}=V_{SS}+V_{CS\min}+V_{GS}\]</div><div><p><b>אילוץ עליון:</b> \(Q_1,Q_2\) צריכים להישאר ברוויה, \(V_{DS}\ge V_{OV}=V_{GS}-V_t\). עם \(V_D=V_{DD}-\tfrac12IR_D\):</p>\[V_{CM\max}=V_{DD}-\tfrac12IR_D+V_t\]</div></div>
<p><b>טווח CM תקין:</b></p>
\[V_{SS}+V_{CS\min}+V_{GS}\ \le\ V_{CM}\ \le\ V_{DD}-\tfrac12IR_D+V_t\]
`+co('key','🧮','מאיפה בא האילוץ העליון',R`<p>\(V_{DS}=V_{GS}-V_t\) בגבול, כלומר \(V_D-V_S=V_G-V_S-V_t\), ו-\(V_S\) מתבטל: \(V_D=V_G-V_t\). מציבים \(V_D=V_{DD}-\tfrac12IR_D\) ו-\(V_G=V_{CM}\) ומקבלים את \(V_{CM\max}\). ה-½ מופיע כי בכל ענף זורם \(I/2\).</p>`)+co('warn','⚠️','סימן של V<sub>SS</sub>',R`<p>בנוסחה \(V_{SS}\) הוא מתח הצומת התחתון כפי שהוא (מספר שלילי, למשל \(-2.5\text{V}\)). לא להציב את הגודל החיובי.</p>`)+golab(7,'l7-rng','הזז את v_CM ובדוק מתי יוצאים מרוויה')},

{t:'MOS: פעולה במצב Differential ו-v<sub>id,max</sub>',h:R`
<p>מכניסים כניסה דיפרנציאלית \(v_{id}=v_{in}^{+}-v_{in}^{-}\). כדי למצוא עד איפה אפשר להגדיל אותה, בוחנים את המקרה הקיצוני \(v_{in}^{-}=0\), ואז \(v_{id}=v_{in}^{+}=v_{G1}\).</p>
<p>בקצה התחום <b>כל הזרם \(I\) עובר ב-\(Q_1\)</b> ו-\(Q_2\) בדיוק נכבה. זרם כפול ב-\(Q_1\) (פי 2 מ-\(I/2\)) דורש מתח יתר גדול פי \(\sqrt2\):</p>
\[v_{GS1}=\sqrt2V_{OV}+V_t,\qquad v_S=-V_t\]
<p>(כי \(Q_2\) על סף הולכה עם \(v_{G2}=0\)). לכן:</p>
\[V_{id\max}=v_{GS1}-v_{GS2}=v_{GS1}+v_S=\sqrt2V_{OV}+V_t-V_t=\sqrt2V_{OV}\]
\[0\lt v_{id}\lt V_{id\max}=\sqrt2V_{OV}\]
<p>זה תחום המתחים שבו \(Q_1\) ברוויה ושני הטרנזיסטורים עוד מוליכים. מעבר לו כל הזרם כבר "הוסט" לצד אחד והמגבר רווי.</p>
`+co('warn','⚠️','√2 ולא 2',R`<p>\(V_{OV}\) מוגדר בנקודת העבודה, בזרם \(I/2\). הזרם תלוי ב-\(V_{OV}^2\), לכן הכפלת הזרם מגדילה את מתח היתר פי \(\sqrt2\) בלבד.</p>`)},

{t:'MOS: התנהגות הזרמים במצב דיפרנציאלי',h:R`
<p>המטרה: להפוך את המגבר ל<b>ליניארי</b>, כלומר לקבל מוצא שתלוי ליניארית ב-\(v_{id}\). משוואות הזרמים של שני הטרנזיסטורים ברוויה נותנות:</p>
\[\begin{cases}\sqrt{i_{D1}}-\sqrt{i_{D2}}=v_{id}\sqrt{\tfrac12k_n'\tfrac WL}\\[4pt] i_{D1}+i_{D2}=I\end{cases}\]
<p>אם דורשים \(v_{id}\ll V_{OV}\) אפשר לקרב:</p>
\[i_{D1}=\frac I2-i_{d1}=\frac I2-\frac{I}{V_{GS}-V_t}\cdot\frac{v_{id}}{2}=\frac I2-g_m\frac{v_{id}}2,\qquad i_{D2}=\frac I2+g_m\frac{v_{id}}2\]
<p>במגבר ההפרש \(g_m\) מוגדר כשינוי הזרם \(i_d\) ביחס לשינוי המתח \(v_{gs}\): \(g_m=\dfrac{i_d}{v_{gs}}\), ובנקודת העבודה:</p>
\[g_m=\frac{2I_D}{V_{GS}-V_t}=\frac{2I_D}{V_{OV}}=\frac{I}{V_{OV}}\]
<p><b>המסקנה:</b> אמפליטודת שינוי הזרם היא \(\Delta I_D=g_mv_{id}\). מצאנו תלות ליניארית של הפרש הזרמים במתח הכניסה. זה ההפרש שנותן את אות ה-AC במוצא.</p>
<p><b>הגרף המנורמל</b> (\(i_D/I\) מול \(v_{id}/V_{OV}\)): שתי עקומות S הפוכות שנחתכות ב-0.5. באזור \(|v_{id}|\ll V_{OV}\) הן כמעט ישרות (אזור הקירוב הליניארי), ובקצוות \(\pm\sqrt2V_{OV}\) אחד הזרמים מגיע ל-\(I\) והשני ל-0.</p>
`+co('why','⚖️','פשרה: תחום ליניארי מול הגבר',R`<p>ככל ש-\(g_m\) קטן יותר (\(V_{OV}\) גדול יותר), "המלבן" הליניארי בגרף מתרחב ותחום \(v_{id}\) גדל. מצד שני, ההגבר קטן יחד עם \(g_m\). בגרף של \(V_{OV}=0.2,0.3,0.4\text{V}\) רואים שהעקומה של \(V_{OV}\) גדול יותר שטוחה יותר ורחבה יותר.</p>`)+co('warn','⚠️','סימן של i<sub>d1</sub>',R`<p>בנוסחאות הסיכום \(i_{D1}\) יורד ו-\(i_{D2}\) עולה, ואילו בגרף \(i_{D1}\) עולה עם \(v_{id}\). הסימן תלוי באיזה כיוון מגדירים את \(v_{id}\) ואת \(i_d\). מה שחשוב: סכום הזרמים תמיד \(I\), וההפרש ביניהם \(g_mv_{id}\).</p>`)+golab(7,'l7-pair','ראה את עקומות הזרמים ואת השפעת V_OV')},

{t:'MOS: הגבר הפרשי לאות קטן (Differential Gain)',h:R`
<p>מחברים <b>כניסה אנטי-סימטרית</b>: \(v_{in1}=v_{id}/2\) ו-\(v_{in2}=-v_{id}/2\). מהפיתוח בכיתה:</p>
<ul><li>\(v_S=0\): ה-Sources הם <b>אדמה וירטואלית</b> לאות הדיפרנציאלי.</li><li>\(i_{d1}=-i_{d2}\) ו-\(v_{GS1}=-v_{GS2}\), ולכן \(v_{id}=2v_{GS1}=-2v_{GS2}\).</li></ul>
<p>כל צד הוא מגבר CS שמקבל \(\pm v_{id}/2\):</p>
\[v_{o1}=v_{D1}=-g_m\frac{v_{id}}2R_D,\qquad v_{o2}=v_{D2}=g_m\frac{v_{id}}2R_D\]
<p><b>הגבר חד-צדדי</b> (single ended, מוצא אחד):</p>
\[A_{d,\text{single ended}}=\left\{\frac{v_{o2}}{v_{in1}-v_{in2}},\ \frac{v_{o1}}{v_{in1}-v_{in2}}\right\}=\pm\frac12g_m\left(r_0\parallel R_D\right)\]
<p>(+ עבור \(v_{o2}\), − עבור \(v_{o1}\)). <b>הגבר דיפרנציאלי</b> (מוצא בין שני ה-Drains):</p>
\[A_d=\frac{v_{o2}-v_{o1}}{v_{in1}-v_{in2}}=g_m\left(r_0\parallel R_D\right)\]
`+co('warn','⚠️','הערה מהסיכום: היפוך המוצא הופך סימן',R`<p>אם לוקחים \(v_{out}=v_{o1}-v_{o2}\) מקבלים \(A_d=\dfrac{v_{o1}-v_{o2}}{v_{in1}-v_{in2}}=-g_m\left(r_0\parallel R_D\right)\). לכן חשוב להקפיד על קוטביות מתחי המוצא.</p>`)+co('analogy','⚖️','אנלוגיה: נדנדה',R`<p>כשצד אחד עולה בדיוק במידה שהשני יורד, נקודת הציר (ה-Source) לא זזה. לכן אין אות על מקור הזרם, והוא לא משפיע על \(A_d\).</p>`)},

{t:'MOS: הגבר משותף לאות קטן (Common-Mode Gain) ו-CMRR',h:R`
<p>כעת \(v_{in1}=v_{in2}=v_{CM}\), ומקור הזרם הלא-אידיאלי מיוצג בהתנגדות \(R_{SS}\). מהפיתוח: \(i_{d1}=i_{d2}=i_d\), וכל הזרם \(2i_d\) עובר ב-\(R_{SS}\):</p>
\[v_{CM}=2R_{SS}i_d,\qquad v_{o1}=v_{o2}=-R_Di_d\]
<p><b>מוצא דיפרנציאלי</b> (\(v_{out}=v_{o1}-v_{o2}\)):</p>
\[A_{CM}=\frac{v_{o1}-v_{o2}}{v_{CM}}=0\qquad\Rightarrow\qquad CMRR=\left|\frac{A_d}{A_{CM}}\right|\to\infty\]
<p><b>מוצא חד-צדדי</b> (\(v_{out}=v_{o1}\) או \(v_{o2}\)):</p>
\[A_{CM,\text{single ended}}=\left\{\frac{v_{o1}}{v_{CM}};\frac{v_{o2}}{v_{CM}}\right\}=-\frac{R_D}{2R_{SS}}\]
\[CMRR=\left|\frac{A_d}{A_{CM}}\right|=\left|\frac{\tfrac12g_mr_0\parallel R_D}{\tfrac{R_D}{2R_{SS}}}\right|_{r_0\gg R_D}=g_mR_{SS}\]
<p><b>טרנזיסטורים לא מתואמים</b> (\(g_{m1}\ne g_{m2}\), \(\Delta g_m=g_{m2}-g_{m1}\lt g_m\)):</p>
\[A_{CM,\text{single ended}}\Big|_{g_{m1}\ne g_{m2}}=\frac{R_D}{2R_{SS}}\cdot\frac{\Delta g_m}{g_m},\qquad CMRR=\frac{2g_m^2R_{SS}}{\Delta g_m}\]
`+co('key','🔑','מה מגדיל את ה-CMRR',R`<p>בכל הנוסחאות \(R_{SS}\) במונה: ככל שמקור הזרם קרוב יותר לאידיאלי (\(R_{SS}\to\infty\)), \(A_{CM}\to0\) ו-\(CMRR\to\infty\). ב-CM ההתנגדות \(R_{SS}\) היא "ניוון Source" חזק (\(2R_{SS}\) לכל צד), ולכן ההגבר קטן.</p>`)+golab(7,'l7-cm','שנה R_SS ואי-התאמה וראה את ה-CMRR')},

{t:'BJT: אות גדול ותחום עבודה ליניארי',h:R`
<p>המבנה זהה: \(R_C\) במקום \(R_D\), \(V_{CC}\) ו-\(-V_{EE}\), ומקור זרם \(I\) באמיטרים. בתחום העבודה הליניארי זרמי האמיטר המנורמלים הם:</p>
\[\frac{i_{E1}}{I}=0.5+\frac14\frac{v_{id}}{V_T},\qquad \frac{i_{E2}}{I}=0.5-\frac14\frac{v_{id}}{V_T}\]
<p>מניחים \(\alpha\approx1\) (כלומר \(i_C\approx i_E\) בכל טרנזיסטור), ולכן אפשר לקרב:</p>
\[i_c=\pm g_m\frac{v_{id}}2,\qquad g_m=\frac1{r_e}=\frac{\beta+1}{r_\pi}\]
<p>מהגרף רואים ש-\(v_{id}\) של כ-\(4V_T\), <b>בערך 100mV</b>, מספיק כדי להסיט את כל הזרם לטרנזיסטור אחד. זה תחום קטן בהרבה מב-MOSFET, שם \(v_{id}\) יכול להגיע ל-\(\sqrt2V_{OV}\) (סדר גודל של וולטים).</p>
<ul><li>לכן המגבר משמש גם כ<b>מפסק מבוסס זרם</b> שעובד בתדרים גבוהים מאוד.</li><li>יתרון נוסף: בתחום זה אף טרנזיסטור לא נכנס לרוויה.</li><li>כדי <b>למתוח</b> את הגרף ולהגדיל את תחום \(v_{id}\), מוסיפים זוג נגדים מתואמים \(R_E\) באמיטר של כל טרנזיסטור.</li></ul>
`+co('analogy','🚦','אנלוגיה: מתג רכבות',R`<p>הזרם \(I\) הוא רכבת שחייבת לנסוע באחד משני המסלולים. הפרש קטן של כ-100mV בבסיסים מספיק כדי להעביר את כולה למסלול אחד. \(R_E\) הוא "קפיץ" שמקשה על ההעברה ולכן מרחיב את התחום.</p>`)},

{t:'BJT: הגבר הפרשי לאות קטן (Differential Mode)',h:R`
<p>מניחים כניסות \(v_{in1}=v_{CM}+\tfrac12v_{id}\) ו-\(v_{in2}=v_{CM}-\tfrac12v_{id}\), עם \(v_{id}=v_{B1}-v_{B2}\). אם \(v_{in1}=-v_{in2}\) המגבר נקרא <b>אנטי-סימטרי</b>, ואז מתח האמיטרים \(v_E=0\).</p>
<p>עם נגדים מתואמים \(R_E\) באמיטר של כל טרנזיסטור:</p>
\[A_d=-\frac{\beta R_Cr_0}{\left(r_\pi+R_E\right)\left(r_0+R_C+R_E\right)+\beta R_Er_0}\ \xrightarrow{r_0\to\infty}\ A_d=-\frac{g_mR_C}{1+\frac{R_E}{r_e}}=-\alpha\frac{R_C}{r_e+R_E}\]
\[A_{d,\text{single ended}}=\frac{v_{o2}}{v_{id}}=-\frac{v_{o1}}{v_{id}}=\frac12\frac{g_mR_C}{1+\frac{R_E}{r_e}}=\frac12\alpha\frac{R_C}{r_e+R_E}\]
<p><b>התנגדות כניסה דיפרנציאלית</b> (שימו לב לקירובים, ומשתמשים בהם כשרלוונטי):</p>
\[R_{id}=2\left(\left(r_\pi+R_E\right)+\frac{R_E\cdot\beta r_0}{r_0+R_C+R_E}\right)\Bigg|_{r_0\to\infty}=2\left(r_\pi+(\beta+1)R_E\right)\approx2(\beta+1)R_E\]
<p>הקירוב האחרון מתקיים כש-\(r_\pi\ll(\beta+1)R_E\). האיבר עם \(r_0\) מופיע רק אם מתחשבים באפקט Early.</p>
<p><b>קשרים מהירים</b> (בכל טרנזיסטור זורם \(I/2\)):</p>
\[r_e=\frac{V_T}{I_E}=\frac{2V_T}{I},\qquad g_m=\frac{I_C}{V_T}=\frac{\alpha I}{2V_T}\]
`+co('why','💡','מה עושה R<sub>E</sub>',R`<p>\(R_E\) מקטין את ההגבר פי \(1+R_E/r_e\), אבל בתמורה מרחיב את התחום הליניארי ומגדיל מאוד את \(R_{id}\): במקום \(2r_\pi\) מקבלים בערך \(2(\beta+1)R_E\).</p>`)},

{t:'BJT: הגבר משותף לאות קטן (Common Mode) והערות',h:R`
<p>מחברים \(v_{CM}=\dfrac{v_1+v_2}{2}=\dfrac{v_{B1}+v_{B2}}{2}\), ומקור הזרם מיוצג ב-\(R_{EE}\) (כאן בלי \(R_E\)). מתקבל:</p>
\[A_d=\pm\frac{\beta\,r_0\parallel R_C}{r_\pi}=\pm g_m\cdot r_0\parallel R_C,\qquad A_{d,\text{single ended}}=\frac{v_{o2}}{v_{id}}=-\frac{v_{o1}}{v_{id}}=\pm\frac12g_m\cdot r_0\parallel R_C\]
\[A_{CM,\text{single ended}}=\frac{v_{o1}}{v_{CM}}=\frac{v_{o2}}{v_{CM}}=-\frac{R_C}{2R_{EE}}\]
<p><b>התנגדויות כניסה:</b></p>
\[R_{id}=\frac{v_{id}}{i_{B1}}=2r_\pi=2(\beta+1)r_e,\qquad R_{iCM}=\frac{v_{CM}}{i_B}\ \xrightarrow{r_0\to\infty}\ 2R_{EE}(\beta+1)\]
<p><b>יחס דחיית אות משותף:</b></p>
\[CMRR_{\text{single ended}}=\left|\frac{A_{d,\text{single ended}}}{A_{CM,\text{single ended}}}\right|=g_mR_{EE}\]
<p><b>הערות – נגדי עומס לא מתואמים</b> (\(R_{C1}\ne R_{C2}\)): גם במוצא דיפרנציאלי נשאר הגבר משותף:</p>
\[A_{CM,\text{diff}}=\frac{\Delta R_C}{2R_{EE}}=A_{CM,\text{single ended}}\cdot\frac{\Delta R_C}{R_C},\qquad CMRR_{\text{diff}}=\left|\frac{A_{d,\text{diff}}}{A_{CM,\text{diff}}}\right|=\frac{g_mR_C}{\Delta R_C/2R_{EE}}=2g_mR_{EE}\cdot\frac{R_C}{\Delta R_C}\]
`+co('warn','⚠️','שתי הערות על הסיכום',R`<p>1. בביטוי ל-\(R_{iCM}\) הסיכום כותב באמצע \((\beta+1)\left(R_{EE}\parallel\tfrac12r_0\right)\), שבגבול \(r_0\to\infty\) נותן \((\beta+1)R_{EE}\), ובסוף \(2R_{EE}(\beta+1)\). התוצאה הסופית \(2(\beta+1)R_{EE}\) היא ההתנגדות שרואה <b>בסיס אחד</b> (כל צד "רואה" \(2R_{EE}\)); \((\beta+1)R_{EE}\) היא ההתנגדות של שני הבסיסים יחד.</p><p>2. ב-\(CMRR_{\text{diff}}\) הסיכום מוסיף אחרי השבר גורם \(\cdot\tfrac{R_C}{\Delta R_C}\). הפישוט המדויק של \(\dfrac{g_mR_C}{\Delta R_C/2R_{EE}}\) הוא \(2g_mR_{EE}\cdot\dfrac{R_C}{\Delta R_C}\), בלי גורם נוסף, כלומר פי \(2R_C/\Delta R_C\) מה-\(CMRR\) החד-צדדי.</p>`)+co('key','🔗','MOS ↔ BJT',R`<p>אותן נוסחאות, רק \(R_D\to R_C\), \(R_{SS}\to R_{EE}\) ו-\(g_m=I/V_{OV}\to g_m=I/2V_T\). הבדל מהותי: ל-BJT יש זרם בסיס ולכן \(R_{id}\) סופית, ותחום ה-\(v_{id}\) הליניארי צר בהרבה.</p>`)}
],

{t:'CMRR חד-צדדי',b:R`\[CMRR=\left|\frac{A_{d,se}}{A_{CM,se}}\right|=\frac{3.03}{0.1}=30.3\]<p>הקירוב \(g_mR_{SS}=1.333\text{m}\cdot25\text{k}=33.3\) מניח \(r_0\gg R_D\). כאן \(r_0=10R_D\), לכן הפער כ-10%.</p>`},

{t:'BJT: הגבר, התנגדות כניסה ו-CMRR, עם ובלי R<sub>E</sub>',lvl:'תרגיל נוסף',tags:['dc','ac'],

{t:'קשרים מהירים',b:R`\[r_e=\frac{2V_T}{I}=\frac{50\text{m}}{1\text{m}}=50\ \Omega\]\[g_m=\frac{I}{2V_T}=20\ \text{mA/V}\]\[r_\pi=(\beta+1)r_e=5.05\text{ k}\Omega\]`},
{t:'בלי R<sub>E</sub>: הגבר ו-R<sub>id</sub>',b:R`\[|A_d|=g_mR_C=20\text{m}\cdot10\text{k}=200\]\[A_{d,se}=\pm\tfrac12g_mR_C=\pm100\]\[R_{id}=2r_\pi=2(\beta+1)r_e=10.1\text{ k}\Omega\]`},
{t:'בלי R<sub>E</sub>: משותף ו-CMRR',b:R`\[A_{CM,se}=-\frac{R_C}{2R_{EE}}=-\frac{10\text{k}}{100\text{k}}=-0.1\]\[R_{iCM}\approx2R_{EE}(\beta+1)\]\[=2\cdot50\text{k}\cdot101=10.1\text{ M}\Omega\]\[CMRR_{se}=g_mR_{EE}=20\text{m}\cdot50\text{k}=1000\]\[\left(=\tfrac{100}{0.1}\ \checkmark\right)\]`},

/* LESSON 8 · מעגלי משוב — source: שיעור 8 PDF */
CONTENT[8]={
theory:[
{t:'מבוא: מה זה משוב',h:R`
<p><b>משוב (Feedback)</b> הוא מנגנון שבו חלק מאות היציאה מוחזר אל הכניסה ומשפיע על התנהגות המערכת. יש שני סוגים עיקריים:</p>
<div class="cols2"><div><p><b class="bad-t">משוב חיובי</b>: אות המשוב <b>מתווסף</b> לאות הכניסה ומחזק אותו. המערכת מתרחקת מנקודת שיווי המשקל, ולכן משתמשים בו ליצירת תנודות: מתנדים (Oscillators), שעונים (Clock Generators), משווים עם היסטרזיס (Schmitt Trigger). נלמד עליו בקורס אלקטרוניקה ספרתית.</p></div>
<div><p><b class="ok-t">משוב שלילי</b>: אות המשוב <b>נגרע</b> מאות הכניסה, ומייצב את המערכת סביב נקודת העבודה. הוא מגדיל יציבות, מקטין את השפעת שינויים בפרמטרי הרכיבים, מקטין עיוותים ומרחיב את רוחב הסרט (Bandwidth).</p></div></div>
`+co('analogy','🚿','אנלוגיה: כיוון מים במקלחת',R`<p>אתה מרגיש שהמים חמים מדי (דגימת היציאה) ומסובב את הברז לכיוון הקר (החזרה לכניסה בסימן הפוך). זה משוב שלילי: הטמפרטורה מתייצבת. אם היית מסובב דווקא לכיוון החם כשחם לך, זה משוב חיובי: המצב בורח.</p>`)},
{t:'מבנה מערכת משוב',h:R`
<p>מערכת משוב בנויה משני רכיבים:</p>
<ul><li><b>מעגל הגבר קדמי</b> (הגבר בחוג פתוח) \(A\).</li><li><b>רשת משוב</b> (לרוב ממומשת על ידי חיישן) עם <b>גורם משוב</b> \(\beta\).</li></ul>
<p>אות הכניסה \(x\) נכנס לצומת סיכום, יחד עם אות המשוב \(\beta y\) (בסימן + או −). ההפרש נכנס ל-\(A\), והיציאה \(y\) נדגמת חזרה דרך \(\beta\).</p>
<div class="legend">\(A\) = המגבר "האמיתי" · \(\beta\) = כמה מהיציאה חוזר לכניסה · \(A_f\) = ההגבר של כל המערכת בחוג סגור</div>
`+golab(8,'l8-loop','שחק עם A ו-β בלולאה')},
{t:'משוואת המשוב',h:R`
<p>מפיתוח קצר של הלולאה מקבלים את ההגבר בחוג סגור:</p>
\[H(s)=A_f=\frac{Y}{X}=\frac{A}{1\mp\beta A}\]
<ul><li>סימן <b>+</b> במכנה (\(1+\beta A\)): <b>משוב שלילי</b>. ההגבר קטן מ-\(A\).</li><li>סימן <b>−</b> במכנה (\(1-\beta A\)): <b>משוב חיובי</b>. כש-\(\beta A\to1\) המכנה מתאפס, וזה בדיוק המנגנון של מתנד.</li></ul>
`+co('why','💡','מאיפה זה בא (שתי שורות)',R`<p>בצומת: \(x_i=x-\beta y\). במגבר: \(y=Ax_i=A(x-\beta y)\). מעבירים אגפים: \(y(1+\beta A)=Ax\), ומכאן \(A_f=\dfrac{A}{1+\beta A}\).</p>`)},
{t:'הגבר קדמי גדול, והיתרונות של משוב שלילי',h:R`
<p>כשההגבר הקדמי גדול מאוד, <b>רשת המשוב לבדה</b> קובעת את ההגבר בחוג סגור:</p>
\[A_f=\lim_{A\to\infty}\frac{A}{1+\beta A}=\frac{1}{\beta}\]
<div class="tbl"><table><thead><tr><th>ביטוי</th><th>שם</th></tr></thead><tbody>
<tr><td>\(\beta A\)</td><td>הגבר החוג (loop gain)</td></tr>
<tr><td>\(1+\beta A\)</td><td>כמות המשוב (amount of feedback / feedback factor)</td></tr>
</tbody></table></div>
<p>אם מתכננים את רשת המשוב כך ש-\(\beta\) כמעט לא תלוי בטמפרטורה, בתדר ובפרמטרי הרכיבים, וגם \(\beta A\gg1\), אז \(A_f\approx1/\beta\): ההגבר יציב יותר, ליניארי יותר ובעל רוחב סרט גדול יותר.</p>
<p><b>יתרונות המשוב השלילי</b> (הפיתוח המתמטי המלא יינתן בקורס מבוא לבקרה):</p>
<ul><li>הפחתת עיוותים לא ליניאריים.</li><li>הפחתת הרגישות של ההגבר הכולל לשינויים.</li><li>הרחבת רוחב הסרט של המגבר הכולל.</li></ul>

st:R`מגבר עם הגבר קדמי \(A=10^4\) מחובר במשוב שלילי עם \(\beta=0.01\). חשב את הגבר החוג, כמות המשוב ו-\(A_f\). אחר כך, בגלל שינוי טמפרטורה, \(A\) יורד ל-\(5000\). בכמה משתנה \(A_f\)?`,
given:R`\(A=10^4,\ \beta=0.01\), משוב שלילי. אחר כך \(A=5\cdot10^3\).`,
ask:R`\(\beta A,\ 1+\beta A,\ A_f\) · השינוי היחסי ב-\(A_f\)`,
steps:[
{t:'הגבר החוג וכמות המשוב',b:R`\[\beta A=0.01\cdot10^4=100,\qquad 1+\beta A=101\]`},
{t:'הגבר בחוג סגור',b:R`\[A_f=\frac{A}{1+\beta A}=\frac{10^4}{101}=99.01\]<p>קרוב מאוד ל-\(1/\beta=100\), כי \(\beta A=100\gg1\).</p>`},
{t:'אחרי הירידה ב-A',b:R`\[\beta A=50,\qquad A_f=\frac{5000}{51}=98.04\]`},
{t:'השוואה',b:R`<p>\(A\) ירד ב-<b>50%</b>, אבל \(A_f\) ירד רק מ-99.01 ל-98.04, כלומר ב-<b>0.98%</b>. זו הפחתת הרגישות של ההגבר הכולל: ההגבר נקבע כמעט רק על ידי \(\beta\).</p>`+co('why','💡','המחיר',R`<p>ויתרנו על הגבר: מ-\(10^4\) ל-\(\approx 99\), כלומר פי \(1+\beta A=101\). משוב שלילי "קונה" יציבות וליניאריות בתמורה להגבר.</p>`)}
],
ans:R`\(\beta A=100,\ 1+\beta A=101,\ A_f=99.01\) · אחרי השינוי \(A_f=98.04\): ירידה של כ-1% בלבד לעומת 50% ב-\(A\).`},

st:R`מגבר מתח בסיסי עם התנגדות כניסה \(R_{id}\), התנגדות מוצא \(r_o\) והגבר מתח במעגל פתוח \(\mu\). מחלק המתח \(R_1,R_2\) ביציאה מחזיר את \(V_f\) לכניסה המחסרת. מצא את \(\beta\), את \(A\) של מעגל A המועמס, את \(A_f\), \(R_{if}\) ו-\(R_{o,f}\).`,
given:R`\(R_s=10\text{k}\Omega,\ R_{id}=100\text{k}\Omega,\ r_o=1\text{k}\Omega,\ \mu=1000\), \(R_L=2\text{k}\Omega,\ R_1=1\text{k}\Omega,\ R_2=9\text{k}\Omega\)`,
ask:R`\(\beta,\ A_v,\ A_{v,f},\ R_{if},\ R_{o,f}\)`,
steps:[
{t:'זיהוי הטופולוגיה',b:R`<p>המחלק מחובר <b>במקביל</b> ל-\(V_o\) (דגימת מתח), ו-\(V_f\) נמצא <b>בטור</b> עם הכניסה (החזרת מתח). לכן <b>טורי-מקבילי (Series-Shunt)</b>: מגבר מתח, מטריצות \(h\).</p>`},
{t:'גורם המשוב',b:R`<p>מפעילים \(V_o\) על פורט 2, פורט 1 פתוח (\(I_1=0\)):</p>\[\beta=\left.\frac{V_f}{V_o}\right|_{I_1=0}=\frac{R_1}{R_1+R_2}=\frac{1}{10}=0.1\]`},
{t:'העמסת רשת המשוב',b:R`<p>\(R_{11}\): פורט 2 <b>מקוצר</b> (היציאה לאדמה), \(R_1\parallel R_2\). \(R_{22}\): פורט 1 <b>פתוח</b>, \(R_1+R_2\).</p>\[R_{11}=1\text{k}\parallel9\text{k}=0.9\text{ k}\Omega\]\[R_{22}=10\text{ k}\Omega\]<p>\(R_{11}\) בטור בכניסה, \(R_{22}\) במקביל ל-\(R_L\) ביציאה.</p>`},
{t:'מעגל A המועמס',b:R`\[R_i=R_s+R_{id}+R_{11}\]\[R_i=10+100+0.9=110.9\text{ k}\Omega\]\[R_L\parallel R_{22}=2\text{k}\parallel10\text{k}=1.667\text{ k}\Omega\]\[A_v=\frac{V_o}{V_s}=\mu\cdot\frac{R_{id}}{R_i}\cdot\frac{R_L\parallel R_{22}}{R_L\parallel R_{22}+r_o}\]\[A_v=1000\cdot0.9017\cdot0.625=563.6\]`},
{t:'הגבר בחוג סגור',b:R`\[\beta A_v=56.36,\quad 1+\beta A_v=57.36\]\[A_{v,f}=\frac{563.6}{57.36}=9.83\ \text{V/V}\]<p>קרוב ל-\(1/\beta=10\).</p>`},

],

given:R`\(R_s=10\text{k}\Omega,\ R_{id}=10\text{k}\Omega,\ r_o=1\text{k}\Omega,\ \mu=1000\), \(R_F=100\text{k}\Omega,\ R_L=2\text{k}\Omega\)`,
ask:R`\(\beta,\ A_z,\ A_{z,f},\ R_{if},\ R_{o,f}\)`,
steps:[
{t:'זיהוי הטופולוגיה',b:R`<p>\(R_F\) מחובר לצומת היציאה (דגימת מתח) ולצומת הכניסה, שם \(I_f\) נגרע מ-\(I_s\) (החזרת זרם). לכן <b>מקבילי-מקבילי (Shunt-Shunt)</b>: \(A_z=v_o/i_i\), מטריצות \(y\).</p>`},
