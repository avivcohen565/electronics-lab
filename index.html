LESSONS[6]={title:'ראי זרם ומקורות זרם',sub:'ראי MOSFET ו-BJT, השפעת β ו-Early, וילסון, וידלר, קסקודה',topics:'4 הדמיות',
intro:'במעגלים משולבים לא בונים מקורות זרם מנגדים גדולים, אלא "מעתיקים" זרם ייחוס בעזרת טרנזיסטורים תואמים. תראה איך הזרם משתקף, מתי המראה נשברת, ולמה קסקודה מגדילה את התנגדות המוצא ואת ההגבר.',
build(root){
section(root,{id:'l6-mos',tag:'MOSFET',title:'ראי זרם MOSFET חי',short:'ראי MOSFET',
lead:'Q1 מחובר כדיודה (Gate ל-Drain) ולכן תמיד ברוויה. הנגד R קובע את <span class="m">I<sub>REF</sub></span>. ל-Q2 אותו <span class="m">V<sub>GS</sub></span>, ולכן הוא מעתיק את הזרם ביחס הגיאומטריה. העומס <span class="m">R<sub>L</sub></span> קובע את מתח המוצא <span class="m">V<sub>o</sub></span>.',
body:'<div class="lab"><div class="controls"><div class="sliders" id="mm-ctl"></div></div><div class="scopes">'+circ('cx-mm',lg('t1','זרם','dot'))+scope('c-mm','short',lg('t1','I<sub>o</sub>(V<sub>o</sub>)')+lg('t2','קו עומס')+lg('t3','נקודת עבודה','dot')+lg('t4','רוויה','dash'),'מוצא הראי')+'</div></div><div class="readouts" id="r-mm"></div>'+
notes('<h3>מה לראות</h3><ul><li>שנה את יחס הגיאומטריות: <span class="m">I<sub>o</sub></span> משתנה באותו יחס.</li><li>עם <span class="m">λ &gt; 0</span> הזרם תלוי מעט ב-<span class="m">V<sub>o</sub></span>: השיפוע הוא <span class="m">1/r<sub>o</sub></span>, וזו התנגדות המוצא של מקור הזרם.</li><li>הגדל את <span class="m">R<sub>L</sub></span> עד ש-<span class="m">V<sub>o</sub> &lt; V<sub>OV</sub></span>: Q2 יוצא מרוויה והמראה מפסיקה לעבוד.</li></ul>',
'<h3>נוסחאות</h3>'+F('','I<sub>REF</sub> = (V<sub>DD</sub> − V<sub>GS</sub>)/R')+F('','I<sub>o</sub>/I<sub>REF</sub> = (W/L)<sub>2</sub>/(W/L)<sub>1</sub>')+F('עם λ:','I<sub>o</sub> = I<sub>REF</sub>·(W/L)<sub>2</sub>/(W/L)<sub>1</sub>·(1+λ(V<sub>o</sub>−V<sub>GS</sub>))')+F('','R<sub>out</sub> = r<sub>o</sub> = V<sub>A</sub>/I<sub>o</sub>')+F('תנאי:','V<sub>o</sub> ≥ V<sub>OV</sub>'))});
(function(){
  const C=Circuit('cx-mm',420,240),cv=reg('c-mm'),Vt=1,kn1=1e-3;
  mk('path',{d:'M90 20 L300 20',class:'k'},C.svg);C.T(200,14,'V_{DD}','hi','middle');
  C.w([110,20],[110,30]);C.R([110,30],[110,90],'R',{side:1});C.w([110,90],[110,110]);const q1=C.mos(120,140,{flip:-1,label:'Q1'});
  C.nd(110,100);C.w([110,100],[165,100],[165,140]);C.w(q1.g,[228,140]);C.nd(165,140);const q2=C.mos(250,140,{label:'Q2',id:'q2'});
  C.w([110,170],[110,200]);C.G(110,200);C.w([260,170],[260,200]);C.G(260,200);
  C.w([260,20],[260,30]);C.R([260,30],[260,90],'R_L',{side:-1});C.w([260,90],[260,110]);C.nd(260,100);C.w([260,100],[320,100]);C.term(320,100);C.T(330,104,'V_o','big','start');C.T(330,124,'','val','start',null,'vo');
  C.T(60,70,'','val','middle',null,'ir');C.T(300,60,'','val','start',null,'io');
  C.flow('r',[[110,20],[110,110],[110,170],[110,200]]);C.flow('o',[[260,20],[260,110],[260,170],[260,200]]);
  const st=sliders('mm-ctl',[
    {key:'VDD',id:'mm-vdd',label:'V<sub>DD</sub>',min:3,max:15,step:0.5,value:10,fmt:v=>v.toFixed(1)+' V'},
    {key:'R',id:'mm-r',label:'R',min:2,max:50,step:0.5,value:10,map:v=>v*1000,fmt:v=>si(v,'Ω')},
    {key:'m',id:'mm-m',label:'<span class="m">(W/L)<sub>2</sub>/(W/L)<sub>1</sub></span>',min:0.25,max:4,step:0.25,value:1,fmt:v=>v.toFixed(2)},
    {key:'lam',id:'mm-lam',label:'λ',min:0,max:0.1,step:0.005,value:0.02,fmt:v=>v.toFixed(3)+' V⁻¹'},
    {key:'RL',id:'mm-rl',label:'R<sub>L</sub>',min:0.5,max:40,step:0.5,value:5,map:v=>v*1000,fmt:v=>si(v,'Ω')}],upd);
  function upd(){const {VDD,R,m,lam,RL}=st;
    const VGS=bisect(v=>0.5*kn1*(v-Vt)**2-(VDD-v)/R,Vt,VDD),IREF=(VDD-VGS)/R,VOV=VGS-Vt,kn2=kn1*m;
    const Io_of=Vo=>Vo>=VOV?IREF*m*(1+lam*(Vo-VGS)):kn2*(VOV*Math.max(0,Vo)-Math.max(0,Vo)**2/2)*(1+lam*(VOV-VGS));
    const Vo=bisect(v=>Io_of(v)-(VDD-v)/RL,0,VDD),Io=(VDD-Vo)/RL,sat=Vo>=VOV;
    const p=[];for(let i=0;i<=200;i++){const v=VDD*i/200;p.push([v,Io_of(v)*1e3]);}
    draw(cv,{x0:0,x1:VDD,y0:0,y1:Math.max(IREF*m*1.5,VDD/RL*0.6)*1e3,xl:'V_o [V]',yl:'I_o [mA]',bands:[{x0:0,x1:VOV,c:'t3',a:.1,label:'טריודה'}],series:[{c:'t4',w:1.2,dash:[4,4],pts:[[VOV,0],[VOV,1e3]]},{c:'t1',w:2.6,pts:p},{c:'t2',w:2,pts:[[0,VDD/RL*1e3],[VDD,0]]}],points:[{x:Vo,y:Io*1e3,c:'t3',label:si(Io,'A')}]});
    const Im=VDD/2000;C.I('r',mag(IREF,Im));C.I('o',mag(Io,Im));C.st('q2',sat?'on':'hot');
    C.set('ir','I_{REF}='+si(IREF,'A'));C.set('io','I_o='+si(Io,'A'));C.set('vo',Vo.toFixed(2)+' V');
    readouts('r-mm',[['Q2',sat?pill('רוויה · מראה תקינה','ok'):pill('טריודה · המראה נשברה','bad'),'html'],['V<sub>GS</sub>',VGS.toFixed(3)+' V'],['V<sub>OV</sub>',VOV.toFixed(3)+' V'],['I<sub>REF</sub>',si(IREF,'A')],['I<sub>o</sub>',si(Io,'A')],['I<sub>o</sub>/I<sub>REF</sub>',(Io/IREF).toFixed(3)],['R<sub>out</sub> = 1/(λI<sub>o</sub>)',lam>0?si(1/(lam*Io),'Ω'):'∞'],['V<sub>o</sub>',Vo.toFixed(3)+' V']]);}
  upd();
})();

section(root,{id:'l6-bjt',tag:'BJT',title:'ראי זרם BJT: למה β סופי "גונב" זרם',short:'ראי BJT',
lead:'שני טרנזיסטורים תואמים עם אותו <span class="m">V<sub>BE</sub></span> נושאים אותו <span class="m">I<sub>C</sub></span>. אבל שני זרמי הבסיס נלקחים מ-<span class="m">I<sub>REF</sub></span>, ולכן <span class="m">I<sub>o</sub></span> קצת קטן ממנו. וילסון מתקן את זה.',
body:'<div class="lab"><div class="controls"><div class="seg" id="bm-sel"><button type="button" data-v="basic" aria-pressed="true">בסיסי</button><button type="button" data-v="mult" aria-pressed="false">מכפלה m</button><button type="button" data-v="wil" aria-pressed="false">וילסון</button></div><div class="sliders" id="bm-ctl"></div></div><div class="scopes">'+circ('cx-bm',lg('t1','זרם','dot'))+scope('c-bm','short',lg('t1','בסיסי')+lg('t2','מכפלה (÷m)')+lg('t4','וילסון')+lg('t3','β נוכחי','dot'),'דיוק המראה')+'</div></div><div class="readouts" id="r-bm"></div>'+
notes('<h3>מה לראות</h3><ul><li>ב-β קטן השגיאה של המראה הבסיסית גדולה (ב-β=20 כ-9%). וילסון מקטין אותה לסדר של <span class="m">2/β²</span>.</li><li>מכפלה פי m: מגדילים את שטח צומת BE של Q2 פי m. אבל עכשיו m+1 זרמי בסיס נגנבים.</li><li>עם אפקט Early: <span class="m">I<sub>o</sub></span> תלוי ב-<span class="m">V<sub>o</sub></span>, ומתבטל כש-<span class="m">V<sub>o</sub> = V<sub>BE</sub></span>.</li></ul>',
'<h3>נוסחאות</h3>'+F('בסיסי:','I<sub>o</sub>/I<sub>REF</sub> = 1/(1+2/β) = β/(β+2)')+F('מכפלה:','I<sub>o</sub>/I<sub>REF</sub> = m/(1+(m+1)/β)')+F('Early:','I<sub>o</sub> = I<sub>REF</sub>·m/(1+(m+1)/β)·(1+(V<sub>o</sub>−V<sub>BE</sub>)/V<sub>A2</sub>)')+F('וילסון:','I<sub>o</sub>/I<sub>REF</sub> = 1/(1+2/(β²+2β)) ≈ 1/(1+2/β²)')+F('וילסון:','R<sub>out</sub> = βr<sub>o</sub>/2')+F('N יציאות:','I<sub>C</sub> = I<sub>REF</sub>(1+(N+1)/β)<sup>−1</sup>'))});
(function(){
  const C=Circuit('cx-bm',420,230),cv=reg('c-bm');
  mk('path',{d:'M60 18 L330 18',class:'k'},C.svg);C.T(200,12,'V_{CC}','hi','middle');
  C.w([110,18],[110,35]);C.V([110,35],[110,85],'I_{REF}',{kind:'i',side:1,off:30});C.w([110,85],[110,120]);
  const q1=C.npn(120,150,{flip:-1,label:'Q1'});const q2=C.npn(250,150,{label:'Q2'});
  C.nd(110,105);C.w([110,105],[185,105],[185,150]);C.w(q1.b,q2.b);C.nd(185,150);
  C.w([110,180],[110,205]);C.G(110,205);C.w([260,180],[260,205]);C.G(260,205);C.w([260,120],[260,60]);C.term(260,60);C.T(272,64,'I_o','big','start');
  C.T(200,95,'','val','middle',null,'ib');C.T(272,84,'','val','start',null,'io');
  C.flow('ref',[[110,35],[110,120],[110,180],[110,205]]);C.flow('b',[[110,105],[185,105],[185,150]]);C.flow('b2',[[185,150],[240,150]]);C.flow('b1',[[185,150],[130,150]]);C.flow('o',[[260,60],[260,120],[260,180],[260,205]]);
  const getT=seg('bm-sel',()=>upd());
  const st=sliders('bm-ctl',[{key:'b',id:'bm-b',label:'β',min:10,max:300,step:5,value:50,fmt:v=>String(v)},{key:'m',id:'bm-m',label:'m',min:1,max:5,step:1,value:2,fmt:v=>String(v)},{key:'IREF',id:'bm-i',label:'I<sub>REF</sub>',min:0.1,max:5,step:0.1,value:1,map:v=>v/1000,fmt:v=>si(v,'A')}],upd);
  const f={basic:(b)=>1/(1+2/b),mult:(b,m)=>m/(1+(m+1)/b),wil:(b)=>1/(1+2/(b*b+2*b))};
  function upd(){const t=getT(),{b,m,IREF}=st,r=f[t](b,m),Io=IREF*r,IC1=t==='mult'?Io/m:Io,IB=(IC1+(t==='mult'?Io:Io))/b;
    const P=[[],[],[]];for(let i=0;i<=200;i++){const bb=10+290*i/200;P[0].push([bb,f.basic(bb)]);P[1].push([bb,f.mult(bb,m)/m]);P[2].push([bb,f.wil(bb)]);}
    draw(cv,{x0:10,x1:300,y0:0.75,y1:1.04,xl:'β',yl:'I_o / m·I_REF',series:[{c:'t1',w:2.2,pts:P[0]},{c:'t2',w:2.2,pts:P[1]},{c:'t4',w:2.2,pts:P[2]}],points:[{x:b,y:t==='mult'?r/m:r,c:'t3',label:((t==='mult'?r/m:r)*100).toFixed(2)+'%'}]});
    const Im=IREF*5;C.I('ref',mag(IREF,Im));C.I('o',mag(Io,Im));C.I('b',mag(IB,Im)*0.8);C.I('b1',mag(IC1/b,Im)*0.8);C.I('b2',mag(Io/b,Im)*0.8,1);
    C.set('ib','2I_B ≈ '+si(IB,'A'));C.set('io',si(Io,'A'));
    readouts('r-bm',[['I<sub>o</sub>/I<sub>REF</sub>',r.toFixed(4)],['I<sub>o</sub>',si(Io,'A')],['שגיאה מהאידיאלי',((1-r/(t==='mult'?m:1))*100).toFixed(2)+'%'],['זרם בסיס כולל שנגנב',si(IB,'A')]]);}
  upd();
})();

section(root,{id:'l6-wid',tag:'וידלר',title:'ראי וידלר: זרמים קטנים עם נגדים קטנים',short:'וידלר',
lead:'נגד <span class="m">R<sub>E</sub></span> בפולט של Q2 מקטין את <span class="m">V<sub>BE2</sub></span>, ולכן את <span class="m">I<sub>o</sub></span>, באופן לוגריתמי. כך מקבלים µA בודדים בלי נגד של MΩ, ובונוס: התנגדות מוצא גדולה יותר.',
body:'<div class="lab"><div class="controls"><div class="sliders" id="wd-ctl"></div></div><div class="scopes">'+scope('c-wd','short',lg('t1','I<sub>o</sub>(R<sub>E</sub>)')+lg('t3','נקודה נוכחית','dot'),'וידלר')+'</div></div><div class="readouts" id="r-wd"></div>'+
notes('<h3>איך פותרים</h3><p>המשוואה <span class="m">I<sub>o</sub>R<sub>E</sub> = V<sub>T</sub>ln(I<sub>REF</sub>/I<sub>o</sub>)</span> טרנסצנדנטית. פותרים באיטרציה, או בוחרים את <span class="m">I<sub>o</sub></span> הרצוי ומחשבים ישירות את <span class="m">R<sub>E</sub></span>, וזה קל בהרבה.</p>',F('','I<sub>o</sub>R<sub>E</sub> = V<sub>T</sub>ln(I<sub>REF</sub>/I<sub>o</sub>)')+F('','R<sub>out</sub> = r<sub>o2</sub>(g<sub>m</sub>(R<sub>E</sub>‖r<sub>π</sub>)+1)'))});
(function(){
  const cv=reg('c-wd');
  const st=sliders('wd-ctl',[{key:'I',id:'wd-i',label:'I<sub>REF</sub>',min:0.1,max:5,step:0.1,value:1,map:v=>v/1000,fmt:v=>si(v,'A')},{key:'RE',id:'wd-re',label:'R<sub>E</sub>',min:0,max:20,step:0.1,value:5,map:v=>v*1000,fmt:v=>si(v,'Ω')},{key:'VA',id:'wd-va',label:'V<sub>A</sub>',min:20,max:200,step:10,value:100,fmt:v=>v+' V'},{key:'b',id:'wd-b',label:'β',min:50,max:300,step:10,value:100,fmt:v=>String(v)}],upd);
  const solve=(I,RE)=>RE<=0?I:bisect(x=>x*RE-VT*Math.log(I/x),1e-12,I);
  function upd(){const {I,RE,VA,b}=st,Io=solve(I,RE),p=[];for(let i=0;i<=200;i++){const r=20000*i/200;p.push([r/1000,solve(I,r)*1e6]);}
    draw(cv,{x0:0,x1:20,y0:0,y1:I*1e6*1.05,xl:'R_E [kΩ]',yl:'I_o [µA]',series:[{c:'t1',w:2.6,pts:p}],points:[{x:RE/1000,y:Io*1e6,c:'t3',label:si(Io,'A')}]});
    const gm=Io/VT,rpi=b/gm,ro=VA/Io,Rout=ro*(gm*par(RE,rpi)+1);
    readouts('r-wd',[['I<sub>o</sub>',si(Io,'A')],['I<sub>REF</sub>/I<sub>o</sub>',(I/Io).toFixed(2)],['ΔV<sub>BE</sub> = I<sub>o</sub>R<sub>E</sub>',si(Io*RE,'V')],['r<sub>o2</sub>',si(ro,'Ω')],['R<sub>out</sub>',si(Rout,'Ω')],['שיפור R<sub>out</sub>','×'+(Rout/ro).toFixed(1)]]);}
  upd();
})();

section(root,{id:'l6-cas',tag:'קסקודה',title:'קסקודה: ערימת טרנזיסטורים שמכפילה את g<sub>m</sub>r<sub>o</sub>',short:'קסקודה',
lead:'דרגת CS (Q1) שמעליה דרגת CG (Q2). Q2 "מגן" על ה-Drain של Q1 ומכפיל את התנגדות המוצא בערך פי <span class="m">g<sub>m2</sub>r<sub>o2</sub></span>. עם עומס מקור זרם אידיאלי ההגבר עולה מ-<span class="m">g<sub>m</sub>r<sub>o</sub></span> ל-<span class="m">(g<sub>m</sub>r<sub>o</sub>)²</span>.',
body:'<div class="lab"><div class="controls"><div class="sliders" id="cs6-ctl"></div></div><div class="scopes">'+circ('cx-cs6','<span>Q1: CS (כניסה) · Q2: CG (מוצא) · עומס מקור זרם I</span>')+'<div class="note"><h3>השוואה (בסולם dB)</h3><div id="cs6-bars"></div></div></div></div><div class="readouts" id="r-cs6"></div>'+
notes('<h3>מה לראות</h3><ul><li>בלי עומס (<span class="m">R<sub>L</sub> → ∞</span>): הגבר הקסקודה גדול פי <span class="m">g<sub>m</sub>r<sub>o</sub></span> מהגבר CS רגיל.</li><li>עם <span class="m">R<sub>L</sub></span> סופי העומס שולט: <span class="m">G<sub>v</sub> = −g<sub>m1</sub>(R<sub>o</sub>‖R<sub>L</sub>)</span>, והיתרון נעלם כש-<span class="m">R<sub>L</sub> ≪ R<sub>o</sub></span>.</li><li>ב-BJT: <span class="m">R<sub>o</sub> = β<sub>2</sub>r<sub>o2</sub></span>. התקרה היא β, כי r<sub>π</sub> "מקצרת".</li></ul>',
'<h3>נוסחאות</h3>'+F('MOS:','A<sub>v0</sub> = −g<sub>m1</sub>r<sub>o1</sub>(1+g<sub>m2</sub>r<sub>o2</sub>) ≈ −(g<sub>m</sub>r<sub>o</sub>)²')+F('MOS:','R<sub>o</sub> = (1+g<sub>m2</sub>r<sub>o1</sub>)r<sub>o2</sub>+r<sub>o1</sub> ≈ g<sub>m2</sub>r<sub>o2</sub>r<sub>o1</sub>')+F('עם R<sub>L</sub>:','G<sub>v</sub> = −g<sub>m1</sub>(R<sub>o</sub>‖R<sub>L</sub>)')+F('BJT:','R<sub>in</sub> = r<sub>π</sub> · R<sub>o</sub> = β<sub>2</sub>r<sub>o2</sub> · A<sub>v0</sub> = −g<sub>m1</sub>β<sub>2</sub>r<sub>o2</sub>'))});
(function(){
  const C=Circuit('cx-cs6',380,250);
  C.rail(250,16,'V_{DD}');C.w([250,16],[250,25]);C.V([250,25],[250,70],'I',{kind:'i',side:1,off:26});
  C.w([250,70],[250,90]);C.nd(250,80);C.w([250,80],[320,80]);C.term(320,80);C.T(330,84,'v_o','big','start');
  const q2=C.mos(240,120,{label:'Q2'});C.w(q2.g,[150,120]);C.T(146,124,'V_{BIAS}','hi','end');
  C.w([250,150],[250,160]);const q1=C.mos(240,190,{label:'Q1'});C.w(q1.g,[150,190]);C.T(146,194,'v_i','val2','end');C.w([250,220],[250,232]);C.G(250,232);
  C.flow('i',[[250,25],[250,90],[250,150],[250,160],[250,220],[250,232]]);C.I('i',0.4);
  const st=sliders('cs6-ctl',[{key:'gm',id:'cs6-gm',label:'g<sub>m</sub>',min:0.5,max:10,step:0.5,value:2,map:v=>v*1e-3,fmt:v=>si(v,'A/V')},{key:'ro',id:'cs6-ro',label:'r<sub>o</sub>',min:5,max:200,step:5,value:50,map:v=>v*1000,fmt:v=>si(v,'Ω')},{key:'RL',id:'cs6-rl',label:'R<sub>L</sub>',min:1,max:1e4,step:1,value:1e4,map:v=>v>=1e4?Infinity:v*1000,fmt:v=>si(v,'Ω')}],upd);
  function upd(){const {gm,ro,RL}=st,Ro=(1+gm*ro)*ro+ro,Rocs=ro;
    const Gcs=gm*par(Rocs,RL),Gcas=gm*par(Ro,RL);
    const mx=Math.max(db(Gcas),1);const bar=(l,v)=>'<div style="display:flex;justify-content:space-between;font-size:14px;margin-top:8px"><span>'+l+'</span><span class="m">'+v.toFixed(0)+' ('+db(v).toFixed(1)+' dB)</span></div><div class="bar2"><span style="width:'+clamp(db(v)/mx*100,2,100)+'%;background:var(--accent)"></span></div>';
    document.getElementById('cs6-bars').innerHTML=bar('CS רגיל: g<sub>m</sub>(r<sub>o</sub>‖R<sub>L</sub>)',Gcs)+bar('קסקודה: g<sub>m</sub>(R<sub>o</sub>‖R<sub>L</sub>)',Gcas)+bar('הגבר עצמי μ = g<sub>m</sub>r<sub>o</sub>',gm*ro);
    readouts('r-cs6',[['g<sub>m</sub>r<sub>o</sub>',(gm*ro).toFixed(0)],['R<sub>o</sub> CS',si(Rocs,'Ω')],['R<sub>o</sub> קסקודה',si(Ro,'Ω')],['|A<sub>v</sub>| CS',Gcs.toFixed(1)],['|A<sub>v</sub>| קסקודה',Gcas.toFixed(1)],['יחס',(Gcas/Gcs).toFixed(1)+'×']]);}
  upd();
})();
},
quiz:[
{q:'בראי MOSFET עם (W/L)<sub>2</sub> = 3(W/L)<sub>1</sub> ו-I<sub>REF</sub> = 100µA (λ=0). מה I<sub>o</sub>?',o:['33µA','100µA','300µA','900µA'],a:2,e:'I<sub>o</sub> = I<sub>REF</sub>·(W/L)<sub>2</sub>/(W/L)<sub>1</sub> = 300µA.'},
{q:'למה Q1 בראי זרם תמיד ברוויה?',o:['כי V<sub>GS</sub> גבוה','כי הוא מחובר כדיודה: V<sub>DS</sub> = V<sub>GS</sub> &gt; V<sub>GS</sub> − V<sub>T</sub>','כי R גדול','כי λ=0'],a:1,e:'Gate מחובר ל-Drain, ולכן V<sub>DS</sub> = V<sub>GS</sub>, שתמיד גדול מ-V<sub>OV</sub>.'},
{q:'מהי התנגדות המוצא של ראי זרם פשוט?',o:['1/g<sub>m</sub>','r<sub>o2</sub> = V<sub>A</sub>/I<sub>o</sub>','R','∞'],a:1,e:'במוצא רואים את ה-Drain (או הקולט) של Q2: R<sub>out</sub> = r<sub>o2</sub>.'},
{q:'ראי BJT בסיסי עם β=50. מהו I<sub>o</sub>/I<sub>REF</sub>?',o:['1','0.98','0.962','0.5'],a:2,e:'I<sub>o</sub>/I<sub>REF</sub> = 1/(1+2/β) = 1/1.04 ≈ 0.962.'},
{q:'מה היתרון המרכזי של ראי וילסון?',o:['הגבר מתח גבוה','תלות קטנה מאוד ב-β (שגיאה ≈2/β²) ו-R<sub>out</sub> = βr<sub>o</sub>/2','זרם גדול יותר','צורך פחות טרנזיסטורים'],a:1,e:'וילסון מקטין את שגיאת זרמי הבסיס לסדר 2/β² ומגדיל את התנגדות המוצא.'},
{q:'בקסקודת MOS עם טרנזיסטורים תואמים ובלי עומס, ההגבר הוא בערך:',o:['−g<sub>m</sub>r<sub>o</sub>','−(g<sub>m</sub>r<sub>o</sub>)²','−g<sub>m</sub>R<sub>D</sub>','1'],a:1,e:'A<sub>v0</sub> = −g<sub>m1</sub>r<sub>o1</sub>(1+g<sub>m2</sub>r<sub>o2</sub>) ≈ −(g<sub>m</sub>r<sub>o</sub>)².'}
],
formulas:[
['ראי MOS','I<sub>o</sub>/I<sub>REF</sub> = (W/L)<sub>2</sub>/(W/L)<sub>1</sub> · I<sub>REF</sub> = (V<sub>DD</sub>−V<sub>GS</sub>)/R'],
['ראי MOS עם λ','I<sub>o</sub> = I<sub>REF</sub>(W/L)<sub>2</sub>/(W/L)<sub>1</sub>·(1+λ(V<sub>o</sub>−V<sub>GS</sub>))'],
['R<sub>out</sub> ראי','R<sub>out</sub> = r<sub>o</sub> = V<sub>A</sub>/I<sub>o</sub>'],
['הכוונת זרם','I<sub>2</sub> = I<sub>REF</sub>(W/L)<sub>2</sub>/(W/L)<sub>1</sub>, V<sub>D2</sub> ≥ −V<sub>SS</sub>+V<sub>OV1</sub>'],
['ראי BJT','I<sub>o</sub>/I<sub>REF</sub> = β/(β+2) = 1/(1+2/β)'],
['BJT עם R','I<sub>C</sub> = β/(β+2)·(V<sub>CC</sub>−V<sub>BE</sub>)/R ≈ V<sub>CC</sub>/R'],
['מכפלה m','I<sub>o</sub>/I<sub>REF</sub> = m/(1+(m+1)/β)'],
['N יציאות','I<sub>C</sub> = I<sub>REF</sub>(1+(N+1)/β)<sup>−1</sup>'],
['וילסון','I<sub>o</sub>/I<sub>REF</sub> ≈ 1/(1+2/β²) · R<sub>out</sub> = βr<sub>o</sub>/2'],
['וידלר','I<sub>o</sub>R<sub>E</sub> = V<sub>T</sub>ln(I<sub>REF</sub>/I<sub>o</sub>) · R<sub>out</sub> = r<sub>o2</sub>(g<sub>m</sub>(R<sub>E</sub>‖r<sub>π</sub>)+1)'],
['קסקודה MOS','A<sub>v0</sub> ≈ −g<sub>m1</sub>r<sub>o1</sub>g<sub>m2</sub>r<sub>o2</sub> · R<sub>o</sub> ≈ g<sub>m2</sub>r<sub>o2</sub>r<sub>o1</sub>'],
['קסקודה BJT','R<sub>in</sub> = r<sub>π</sub> · R<sub>o</sub> = β<sub>2</sub>r<sub>o2</sub> · G<sub>v</sub> = −g<sub>m1</sub>(r<sub>o2</sub>‖R<sub>L</sub>)']
]};

/* =================== LESSON 7: DIFFERENTIAL AMPLIFIER =================== */
LESSONS[7]={title:'מגבר דיפרנציאלי',sub:'זוג הפרש MOS ו-BJT, חלוקת זרם, הגבר הפרשי ומשותף, CMRR',topics:'3 הדמיות',
intro:'מגבר הפרש מגביר רק את ההפרש בין שתי הכניסות ומתעלם ממה שמשותף להן (רעש, הטיה). הלב שלו: מקור זרם זנב קבוע שמתחלק בין שני ענפים. תראה את הזרם "עובר" מצד לצד כש-v<sub>id</sub> משתנה.',
build(root){
section(root,{id:'l7-pair',tag:'זוג הפרש',title:'הזרם עובר מצד לצד',short:'זוג הפרש',
lead:'שני טרנזיסטורים תואמים, <span class="m">R<sub>D</sub></span> זהים ומקור זרם <span class="m">I</span> משותף. <span class="m">i<sub>D1</sub> + i<sub>D2</sub> = I</span> תמיד. במצב משותף כל ענף מקבל <span class="m">I/2</span>. לחץ "הפעל" לסריקה אוטומטית של <span class="m">v<sub>id</sub></span>.',
body:'<div class="lab"><div class="controls"><div class="seg" id="dp-type"><button type="button" data-v="mos" aria-pressed="true">MOSFET</button><button type="button" data-v="bjt" aria-pressed="false">BJT</button></div><div class="sliders" id="dp-ctl"></div></div><div class="scopes">'+circ('cx-dp',lg('t1','זרם','dot'),true)+scope('c-dp','short',lg('t1','i<sub>1</sub>/I')+lg('t2','i<sub>2</sub>/I')+lg('t4','תחום ליניארי')+lg('t3','נקודה נוכחית','dot'),'חלוקת זרם')+'</div></div><div class="readouts" id="r-dp"></div>'+
notes('<h3>מה לראות</h3><ul><li><b>MOS</b>: הזרם כולו עובר לצד אחד כש-<span class="m">|v<sub>id</sub>| = √2·V<sub>OV</sub></span>. הגדל את <span class="m">V<sub>OV</sub></span>: התחום הליניארי מתרחב, אבל <span class="m">g<sub>m</sub> = I/V<sub>OV</sub></span> קטן.</li><li><b>BJT</b>: המעבר חד בהרבה: כמעט הכל עובר לצד אחד כבר ב-<span class="m">4V<sub>T</sub> ≈ 100mV</span>. זה שימושי כמפסק זרם מהיר.</li><li>באזור הליניארי: <span class="m">Δi = g<sub>m</sub>v<sub>id</sub>/2</span> בכל ענף, בכיוונים הפוכים.</li></ul>',
'<h3>נוסחאות</h3>'+F('MOS:','√i<sub>D1</sub> − √i<sub>D2</sub> = v<sub>id</sub>√(½k\'<sub>n</sub>W/L)')+F('MOS:','i<sub>D1,2</sub> = I/2 ± g<sub>m</sub>v<sub>id</sub>/2, g<sub>m</sub> = I/V<sub>OV</sub>')+F('MOS:','|v<sub>id</sub>|<sub>max</sub> = √2·V<sub>OV</sub>')+F('BJT:','i<sub>E1</sub>/I = 1/(1+e<sup>−v<sub>id</sub>/V<sub>T</sub></sup>) ≈ 0.5 + v<sub>id</sub>/4V<sub>T</sub>')+F('BJT:','g<sub>m</sub> = αI/2V<sub>T</sub> · r<sub>e</sub> = 2V<sub>T</sub>/I')+F('הגבר:','A<sub>d</sub> = (v<sub>o2</sub>−v<sub>o1</sub>)/v<sub>id</sub> = g<sub>m</sub>(r<sub>o</sub>‖R<sub>D</sub>)'))});
(function(){
  const C=Circuit('cx-dp',420,250),cv=reg('c-dp');
  mk('path',{d:'M90 18 L330 18',class:'k'},C.svg);C.T(210,12,'V_{DD}','hi','middle');
  C.w([120,18],[120,25]);C.R([120,25],[120,80],'R_D',{side:1});C.w([120,80],[120,90]);C.w([300,18],[300,25]);C.R([300,25],[300,80],'R_D',{side:-1});C.w([300,80],[300,90]);
  const q1=C.mos(110,120,{label:''}),q2=C.mos(310,120,{flip:-1});C.w(q1.g,[40,120]);C.term(40,120);C.w(q2.g,[380,120]);C.term(380,120);
  C.T(40,106,'v_{G1}','hi','middle');C.T(380,106,'v_{G2}','hi','middle');
  C.w([120,150],[120,170],[300,170],[300,150]);C.nd(210,170);C.V([210,175],[210,222],'I',{kind:'i',side:1,off:22});C.w([210,170],[210,175]);C.w([210,222],[210,235]);C.T(210,248,'−V_{SS}','hi','middle');
  C.nd(120,85).nd(300,85);C.T(140,74,'','val','start',null,'o1');C.T(280,74,'','val','end',null,'o2');C.T(70,150,'','val2','middle',null,'vid');
  C.T(135,205,'','val','middle',null,'i1');C.T(285,205,'','val','middle',null,'i2');
  C.flow('a',[[120,25],[120,90],[120,150],[120,170],[210,170]]);C.flow('b',[[300,25],[300,90],[300,150],[300,170],[210,170]]);C.flow('t',[[210,170],[210,235]]);
  C.playing=false;C.bindPlay();
  const getT=seg('dp-type',()=>upd());
  const st=sliders('dp-ctl',[
    {key:'vid',id:'dp-vid',label:'v<sub>id</sub> = v<sub>G1</sub> − v<sub>G2</sub>',min:-1.5,max:1.5,step:0.005,value:0.1,fmt:v=>si(v,'V')},
    {key:'I',id:'dp-i',label:'I (זנב)',min:0.2,max:4,step:0.1,value:1,map:v=>v/1000,fmt:v=>si(v,'A')},
    {key:'VOV',id:'dp-vov',label:'V<sub>OV</sub> (MOS)',min:0.1,max:0.8,step:0.02,value:0.3,fmt:v=>v.toFixed(2)+' V'},
    {key:'RD',id:'dp-rd',label:'R<sub>D</sub>',min:1,max:20,step:0.5,value:5,map:v=>v*1000,fmt:v=>si(v,'Ω')},
    {key:'VDD',id:'dp-vdd',label:'V<sub>DD</sub>',min:3,max:15,step:0.5,value:5,fmt:v=>v.toFixed(1)+' V'}],upd);
  function split(t,vid){const I=st.I;if(t==='bjt'){const a=1/(1+Math.exp(-vid/VT));return [a*I,(1-a)*I];}
    const V=st.VOV,lim=Math.SQRT2*V;if(vid>=lim)return [I,0];if(vid<=-lim)return [0,I];const x=vid/2;const d=(I/V)*x*Math.sqrt(Math.max(0,1-x*x/(V*V)));return [I/2+d,I/2-d];}
  function show(vid){const t=getT(),[i1,i2]=split(t,vid),I=st.I,v1=st.VDD-i1*st.RD,v2=st.VDD-i2*st.RD;
    C.I('a',clamp(i1/I,0,1)*0.9+(i1>I*0.01?0.1:0));C.I('b',clamp(i2/I,0,1)*0.9+(i2>I*0.01?0.1:0));C.I('t',0.8);
    C.set('o1','v_{o1}='+v1.toFixed(2));C.set('o2','v_{o2}='+v2.toFixed(2));C.set('vid','v_{id}='+si(vid,'V'));C.set('i1',si(i1,'A'));C.set('i2',si(i2,'A'));
    const X=t==='bjt'?0.25:Math.max(1.2,2*Math.SQRT2*st.VOV),p1=[],p2=[];for(let i=0;i<=300;i++){const v=-X+2*X*i/300,s=split(t,v);p1.push([v,s[0]/I]);p2.push([v,s[1]/I]);}
    const lin=t==='bjt'?VT:st.VOV/2;
    draw(cv,{x0:-X,x1:X,y0:0,y1:1.05,xl:'v_id [V]',yl:'i/I',bands:[{x0:-lin,x1:lin,c:'t4',a:.12}],series:[{c:'t1',w:2.5,pts:p1},{c:'t2',w:2.5,pts:p2}],points:[{x:vid,y:i1/I,c:'t3',label:(i1/I*100).toFixed(0)+'%'},{x:vid,y:i2/I,c:'t3',r:4}]});
    const gm=t==='bjt'?I/(2*VT):I/st.VOV,Ad=gm*st.RD;
    readouts('r-dp',[['i<sub>1</sub> / i<sub>2</sub>',si(i1,'A')+' / '+si(i2,'A')],['i<sub>1</sub>+i<sub>2</sub>',si(i1+i2,'A')],['v<sub>o2</sub>−v<sub>o1</sub>',fx(v2-v1,3)+' V'],['g<sub>m</sub> (כל טרנזיסטור)',si(gm,'A/V')],['A<sub>d</sub> = g<sub>m</sub>R<sub>D</sub>',Ad.toFixed(1)],['A<sub>d</sub> חד-צדדי',(Ad/2).toFixed(1)],['|v<sub>id</sub>|<sub>max</sub>',t==='bjt'?'≈4V<sub>T</sub> = 100mV':si(Math.SQRT2*st.VOV,'V'),t==='bjt'?'html':undefined]]);}
  C.tick=(t)=>{const X=getT()==='bjt'?0.2:1.5*Math.SQRT2*st.VOV;show(X*Math.sin(2*Math.PI*0.2*t));};
  function upd(){document.getElementById('dp-vov').disabled=getT()==='bjt';show(st.vid);}
  upd();
})();

section(root,{id:'l7-cm',tag:'דחיית אות משותף',title:'CMRR בפעולה: רעש משותף נעלם, אות הפרשי נשאר',short:'CMRR',
lead:'לשתי הכניסות נכנס אותו רעש גדול (<span class="m">v<sub>CM</sub></span>) ועוד אות קטן בהפרש. המוצא: <span class="m">v<sub>out</sub> = A<sub>d</sub>v<sub>id</sub> + A<sub>CM</sub>v<sub>CM</sub></span>. ככל ש-<span class="m">R<sub>SS</sub></span> (התנגדות מקור הזנב) גדול, הרעש נדחה יותר.',
body:'<div class="lab"><div class="controls"><div class="seg" id="cm-out"><button type="button" data-v="se" aria-pressed="true">מוצא חד-צדדי</button><button type="button" data-v="df" aria-pressed="false">מוצא הפרשי</button></div><div class="sliders" id="cm-ctl"></div></div><div class="scopes">'+scope('c-cm','short',lg('t2','v<sub>1</sub>')+lg('t3','v<sub>2</sub>')+'<span>(כניסות: רעש גדול + אות קטן)</span>','כניסות')+scope('c-cm2','short',lg('t1','v<sub>out</sub>')+lg('t4','A<sub>d</sub>v<sub>id</sub> (אידיאלי)','dash'),'מוצא')+'</div></div><div class="readouts" id="r-cm"></div>'+
notes('<h3>מה לראות</h3><ul><li>הקטן את <span class="m">R<sub>SS</sub></span>: הרעש "דולף" למוצא החד-צדדי.</li><li>עבור למוצא הפרשי: עם רכיבים תואמים <span class="m">A<sub>CM</sub> = 0</span> ו-CMRR → ∞.</li><li>אי-התאמה <span class="m">ΔR<sub>D</sub></span> מחזירה רעש גם למוצא ההפרשי.</li></ul>',
'<h3>נוסחאות (MOS)</h3>'+F('','v<sub>CM</sub> = (v<sub>1</sub>+v<sub>2</sub>)/2 · v<sub>id</sub> = v<sub>1</sub>−v<sub>2</sub>')+F('חד-צדדי:','A<sub>CM</sub> = −R<sub>D</sub>/2R<sub>SS</sub> · A<sub>d</sub> = ½g<sub>m</sub>(r<sub>o</sub>‖R<sub>D</sub>)')+F('חד-צדדי:','CMRR = g<sub>m</sub>R<sub>SS</sub>')+F('הפרשי, אי-התאמה:','A<sub>CM</sub> = (R<sub>D</sub>/2R<sub>SS</sub>)(ΔR<sub>D</sub>/R<sub>D</sub>)')+F('הפרשי:','CMRR = 2g<sub>m</sub>R<sub>SS</sub>/(ΔR<sub>D</sub>/R<sub>D</sub>)')+F('dB:','CMRR<sub>dB</sub> = 20log<sub>10</sub>|A<sub>d</sub>/A<sub>CM</sub>|'))});
(function(){
  const cv=reg('c-cm'),cv2=reg('c-cm2');const getO=seg('cm-out',()=>upd());
  const st=sliders('cm-ctl',[
    {key:'gm',id:'cm-gm',label:'g<sub>m</sub>',min:0.5,max:10,step:0.5,value:2,map:v=>v*1e-3,fmt:v=>si(v,'A/V')},
    {key:'RD',id:'cm-rd',label:'R<sub>D</sub>',min:1,max:20,step:0.5,value:10,map:v=>v*1000,fmt:v=>si(v,'Ω')},
    {key:'RSS',id:'cm-rss',label:'R<sub>SS</sub>',min:0,max:40,step:1,value:20,map:v=>Math.pow(10,2+v/10),fmt:v=>si(v,'Ω')},
    {key:'dR',id:'cm-dr',label:'אי-התאמה ΔR<sub>D</sub>/R<sub>D</sub>',min:0,max:10,step:0.5,value:2,map:v=>v/100,fmt:v=>(v*100).toFixed(1)+'%'},
    {key:'n',id:'cm-n',label:'אמפליטודת רעש משותף',min:0,max:2,step:0.1,value:1,fmt:v=>v.toFixed(1)+' V'},
    {key:'s',id:'cm-s',label:'אות הפרשי v<sub>id</sub>',min:1,max:50,step:1,value:10,map:v=>v/1000,fmt:v=>si(v,'V')}],upd);
  function upd(){const {gm,RD,RSS,dR,n,s}=st,se=getO()==='se';
    const Ad=se?gm*RD/2:gm*RD,Acm=se?-RD/(2*RSS):(RD/(2*RSS))*dR,cmrr=Math.abs(Ad/(Acm||1e-30));
    const P1=[],P2=[],P3=[],P4=[];for(let i=0;i<=500;i++){const t=i/500;const vcm=n*(0.7*Math.sin(2*Math.PI*3*t)+0.3*Math.sin(2*Math.PI*11*t+1)),vid=s*Math.sin(2*Math.PI*1*t);
      P1.push([t,vcm+vid/2]);P2.push([t,vcm-vid/2]);P3.push([t,Ad*vid+Acm*vcm]);P4.push([t,Ad*vid]);}
    const y1=Math.max(2.5,n+s)*1.1,y2=Math.max(Ad*s,Math.abs(Acm)*n)*1.3+0.01;
    draw(cv,{x0:0,x1:1,y0:-y1,y1:y1,xl:'t',yl:'[V]',series:[{c:'t2',w:1.8,pts:P1},{c:'t3',w:1.8,a:.8,pts:P2}]});
    draw(cv2,{x0:0,x1:1,y0:-y2,y1:y2,xl:'t',yl:'v_out [V]',series:[{c:'t4',w:1.4,dash:[5,4],pts:P4},{c:'t1',w:2.4,pts:P3}]});
    readouts('r-cm',[['A<sub>d</sub>',Ad.toFixed(1)],['A<sub>CM</sub>',Acm===0?'0':Acm.toExponential(2)],['CMRR',isFinite(cmrr)&&cmrr<1e12?cmrr.toFixed(0):'∞'],['CMRR [dB]',isFinite(cmrr)&&cmrr<1e12?db(cmrr).toFixed(1)+' dB':'∞'],['רעש במוצא / אות במוצא',(Math.abs(Acm)*n/(Ad*s)*100).toFixed(1)+'%']]);}
  upd();
})();

section(root,{id:'l7-rng',tag:'תחום כניסה משותפת',title:'כמה אפשר להזיז את v<sub>CM</sub>?',short:'תחום CM',
lead:'מלמטה: מקור הזרם צריך מינימום מתח <span class="m">V<sub>CS,min</sub></span>. מלמעלה: Q1,Q2 חייבים להישאר ברוויה (<span class="m">V<sub>DS</sub> ≥ V<sub>OV</sub></span>).',
body:'<div class="lab"><div class="controls"><div class="sliders" id="rg-ctl"></div></div><div class="scopes">'+scope('c-rg','short',lg('ok','תחום תקין')+lg('t3','v<sub>CM</sub> נוכחי','dot'),'תחום CM')+'</div></div><div class="readouts" id="r-rg"></div>'+
notes('<h3>ההיגיון</h3><ul><li>v<sub>CM</sub> נמוך מדי: מתח ה-Source יורד, ומקור הזרם "נחנק".</li><li>v<sub>CM</sub> גבוה מדי: ה-Source עולה, V<sub>DS</sub> קטן, והטרנזיסטורים נכנסים לטריודה.</li></ul>',F('','V<sub>CM,min</sub> = −V<sub>SS</sub> + V<sub>CS,min</sub> + V<sub>GS</sub>')+F('','V<sub>CM,max</sub> = V<sub>DD</sub> − ½IR<sub>D</sub> + V<sub>t</sub>')+F('','V<sub>GS</sub> = V<sub>t</sub> + V<sub>OV</sub>, ½I = ½k<sub>n</sub>V<sub>OV</sub>²'))});
(function(){
  const cv=reg('c-rg');
  const st=sliders('rg-ctl',[{key:'VDD',id:'rg-vdd',label:'V<sub>DD</sub> = V<sub>SS</sub>',min:1.5,max:10,step:0.5,value:5,fmt:v=>'±'+v.toFixed(1)+' V'},{key:'I',id:'rg-i',label:'I',min:0.1,max:2,step:0.05,value:0.5,map:v=>v/1000,fmt:v=>si(v,'A')},{key:'RD',id:'rg-rd',label:'R<sub>D</sub>',min:1,max:20,step:0.5,value:8,map:v=>v*1000,fmt:v=>si(v,'Ω')},{key:'Vt',id:'rg-vt',label:'V<sub>t</sub>',min:0.3,max:1.5,step:0.05,value:0.7,fmt:v=>v.toFixed(2)+' V'},{key:'kn',id:'rg-kn',label:'k<sub>n</sub>',min:0.5,max:10,step:0.5,value:4,map:v=>v*1e-3,fmt:v=>si(v,'A/V²')},{key:'Vcs',id:'rg-vcs',label:'V<sub>CS,min</sub>',min:0.1,max:1.5,step:0.05,value:0.4,fmt:v=>v.toFixed(2)+' V'},{key:'vcm',id:'rg-vcm',label:'v<sub>CM</sub>',min:-10,max:10,step:0.1,value:0,fmt:v=>fx(v,1)+' V'}],upd);
  function upd(){const {VDD,I,RD,Vt,kn,Vcs,vcm}=st,VOV=Math.sqrt(I/kn),VGS=Vt+VOV,lo=-VDD+Vcs+VGS,hi=VDD-0.5*I*RD+Vt,ok=vcm>=lo&&vcm<=hi&&lo<hi;
    draw(cv,{x0:-10,x1:10,y0:0,y1:1,xl:'v_CM [V]',bands:[{x0:lo,x1:hi,c:'ok',a:.25}],series:[{c:'bad',w:1.5,dash:[4,4],pts:[[-VDD,0],[-VDD,1]]},{c:'bad',w:1.5,dash:[4,4],pts:[[VDD,0],[VDD,1]]}],points:[{x:vcm,y:0.5,c:'t3',label:fx(vcm,1)+' V'}]});
    readouts('r-rg',[['V<sub>OV</sub>',VOV.toFixed(3)+' V'],['V<sub>GS</sub>',VGS.toFixed(3)+' V'],['V<sub>CM,min</sub>',lo.toFixed(2)+' V'],['V<sub>CM,max</sub>',hi.toFixed(2)+' V'],['מצב',lo>=hi?pill('אין תחום תקין','bad'):ok?pill('בתחום','ok'):pill('מחוץ לתחום','bad'),'html']]);}
  upd();
})();
},
quiz:[
{q:'במגבר הפרש עם מקור זנב I, כשהכניסות שוות (v<sub>id</sub>=0), מה הזרם בכל ענף?',o:['I','I/2','0','2I'],a:1,e:'מטעמי סימטריה הזרם מתחלק שווה: i<sub>D1</sub> = i<sub>D2</sub> = I/2.'},
{q:'בזוג הפרש MOS, מאיזה v<sub>id</sub> כל הזרם עובר לצד אחד?',o:['V<sub>OV</sub>','√2·V<sub>OV</sub>','4V<sub>T</sub>','V<sub>t</sub>'],a:1,e:'|v<sub>id</sub>|<sub>max</sub> = √2V<sub>OV</sub>. ב-BJT המעבר חד יותר, בערך 4V<sub>T</sub>.'},
{q:'מה ההגבר הדיפרנציאלי (מוצא הפרשי) של זוג MOS עם g<sub>m</sub>=2mA/V, R<sub>D</sub>=10kΩ ו-r<sub>o</sub>→∞?',o:['10','20','40','200'],a:1,e:'A<sub>d</sub> = g<sub>m</sub>(r<sub>o</sub>‖R<sub>D</sub>) = 2m·10k = 20. במוצא חד-צדדי החצי: 10.'},
{q:'מה ה-CMRR במוצא חד-צדדי כש-g<sub>m</sub>=2mA/V ו-R<sub>SS</sub>=100kΩ?',o:['50','200','2000','∞'],a:1,e:'CMRR = g<sub>m</sub>R<sub>SS</sub> = 2m·100k = 200 (46dB).'},
{q:'למה מקור זרם זנב טוב (R<sub>SS</sub> גדול) משפר את המגבר?',o:['מגדיל את A<sub>d</sub>','מקטין את A<sub>CM</sub> = −R<sub>D</sub>/2R<sub>SS</sub> ולכן מגדיל CMRR','מקטין רעש תרמי','מגדיל את תחום הכניסה'],a:1,e:'אות משותף משנה את הזרם דרך R<sub>SS</sub> בלבד. ככל ש-R<sub>SS</sub> גדול, השינוי קטן, ו-A<sub>CM</sub> קטן.'},
{q:'בזוג הפרש BJT, מה g<sub>m</sub> של כל טרנזיסטור עם זרם זנב I?',o:['I/V<sub>T</sub>','αI/2V<sub>T</sub>','2I/V<sub>T</sub>','I/4V<sub>T</sub>'],a:1,e:'כל טרנזיסטור נושא I/2, ולכן g<sub>m</sub> = (αI/2)/V<sub>T</sub>.'}
],
formulas:[

['מוצא','v<sub>out</sub> = A<sub>d</sub>v<sub>id</sub> + A<sub>CM</sub>v<sub>CM</sub> · CMRR = |A<sub>d</sub>/A<sub>CM</sub>|'],
['MOS חלוקה','i<sub>D1,2</sub> = I/2 ± g<sub>m</sub>v<sub>id</sub>/2 · g<sub>m</sub> = 2I<sub>D</sub>/V<sub>OV</sub> = I/V<sub>OV</sub>'],
['MOS תחום','|v<sub>id</sub>|<sub>max</sub> = √2V<sub>OV</sub>'],
['תחום CM','V<sub>SS</sub>+V<sub>CS,min</sub>+V<sub>GS</sub> ≤ V<sub>CM</sub> ≤ V<sub>DD</sub> − ½IR<sub>D</sub> + V<sub>t</sub>'],
['הגבר הפרשי','A<sub>d</sub> = g<sub>m</sub>(r<sub>o</sub>‖R<sub>D</sub>) · חד-צדדי: ±½g<sub>m</sub>(r<sub>o</sub>‖R<sub>D</sub>)'],
['הגבר משותף MOS','A<sub>CM,se</sub> = −R<sub>D</sub>/2R<sub>SS</sub> · CMRR = g<sub>m</sub>R<sub>SS</sub>'],
['אי-התאמת g<sub>m</sub>','A<sub>CM,se</sub> = (R<sub>D</sub>/2R<sub>SS</sub>)(Δg<sub>m</sub>/g<sub>m</sub>) · CMRR = 2g<sub>m</sub>²R<sub>SS</sub>/Δg<sub>m</sub>'],
['BJT חלוקה','i<sub>E1,2</sub>/I = 0.5 ± v<sub>id</sub>/4V<sub>T</sub>'],
['BJT עם R<sub>E</sub>','A<sub>d</sub> = −α R<sub>C</sub>/(r<sub>e</sub>+R<sub>E</sub>) · R<sub>id</sub> ≈ 2(β+1)(r<sub>e</sub>+R<sub>E</sub>)'],
['BJT CM','A<sub>CM,se</sub> = −R<sub>C</sub>/2R<sub>EE</sub> · CMRR<sub>se</sub> = g<sub>m</sub>R<sub>EE</sub> · R<sub>iCM</sub> ≈ 2R<sub>EE</sub>(β+1)'],
['BJT קשרים','r<sub>e</sub> = 2V<sub>T</sub>/I · g<sub>m</sub> = αI/2V<sub>T</sub>']
]};

LESSONS[8]={title:'מעגלי משוב',sub:'A, β, הגבר חוג, רגישות, רוחב סרט, עיוות וארבע הטופולוגיות',topics:'4 הדמיות',
intro:'משוב שלילי מחליף הגבר גולמי ולא יציב בהגבר קטן יותר, יציב וליניארי, שנקבע כמעט רק על ידי רשת המשוב. תראה את זה קורה: ההגבר נצמד ל-1/β, רוחב הסרט מתרחב, והעיוות נעלם.',
build(root){
section(root,{id:'l8-loop',tag:'המבנה הבסיסי',title:'לולאת המשוב: A, β ו-A<sub>f</sub>',short:'לולאת משוב',
lead:'<span class="m">x</span> נכנס לנקודת סיכום, מוגבר ב-<span class="m">A</span> ל-<span class="m">y</span>, וחלק <span class="m">β·y</span> חוזר ומחוסר מהכניסה (משוב שלילי). הנקודות הזזות מראות את עוצמת האות בכל ענף.',
body:'<div class="lab"><div class="controls"><div class="sliders" id="fb-ctl"></div></div><div class="scopes">'+circ('cx-fb',lg('t1','אות','dot'))+scope('c-fb','short',lg('t1','A<sub>f</sub>(A)')+lg('t4','1/β','dash')+lg('t3','נקודה נוכחית','dot'),'Af מול A')+'</div></div><div class="readouts" id="r-fb"></div>'+
notes('<h3>מה לראות</h3><ul><li>כש-<span class="m">Aβ ≫ 1</span>, <span class="m">A<sub>f</sub> ≈ 1/β</span> ולא משנה כמה A גדול. שנה את A פי 10 וראה ש-A<sub>f</sub> כמעט לא זז.</li><li>אות השגיאה <span class="m">x − βy</span> נעשה זעיר. זה הבסיס ל"כללי הזהב" של מגבר שרת.</li><li>רגישות: שינוי יחסי ב-A מתחלק ב-<span class="m">1+Aβ</span>.</li></ul>',
'<h3>נוסחאות</h3>'+F('','A<sub>f</sub> = y/x = A/(1+βA)')+F('','A<sub>f</sub> → 1/β כש-A → ∞')+F('הגבר חוג:','L = Aβ')+F('כמות משוב:','1 + Aβ')+F('רגישות:','dA<sub>f</sub>/A<sub>f</sub> = (dA/A)/(1+Aβ)')+F('משוב חיובי:','A<sub>f</sub> = A/(1−βA): מתנדים, שמיט'))});
(function(){
  const C=Circuit('cx-fb',440,200),cv=reg('c-fb');
  C.term(20,70);C.T(20,56,'x','big','middle');C.w([20,70],[89,70]);C.arrow(89,70,1,0);C.sum(100,70);C.T(88,58,'+','hi','middle');C.T(112,98,'−','hi','middle');
  C.w([111,70],[170,70]);C.arrow(170,70,1,0);C.blk(215,70,90,44,'A');C.w([260,70],[420,70]);C.arrow(420,70,1,0);C.T(425,74,'y','big','start');C.nd(340,70);
  C.w([340,70],[340,150],[260,150]);C.arrow(260,150,-1,0);C.blk(215,150,90,40,'β');C.w([170,150],[100,150],[100,81]);C.arrow(100,81,0,-1);
  C.T(140,60,'','val2','middle',null,'e');C.T(390,60,'','val','middle',null,'y');C.T(135,140,'','val','middle',null,'f');
  C.flow('x',[[20,70],[89,70]]);C.flow('e',[[111,70],[170,70]]);C.flow('y',[[260,70],[420,70]]);C.flow('f',[[340,70],[340,150],[260,150]]);C.flow('f2',[[170,150],[100,150],[100,81]]);
  const st=sliders('fb-ctl',[{key:'A',id:'fb-a',label:'A (חוג פתוח)',min:1,max:5,step:0.05,value:3,map:v=>Math.pow(10,v),fmt:v=>si(v,'')},{key:'b',id:'fb-b',label:'β',min:-3,max:0,step:0.05,value:-1,map:v=>Math.pow(10,v),fmt:v=>v.toPrecision(3)},{key:'dA',id:'fb-da',label:'שינוי ב-A (טמפרטורה, ייצור)',min:-50,max:50,step:5,value:-20,fmt:v=>(v>0?'+':'')+v+'%'}],upd);
  function upd(){const {A,b,dA}=st,Af=A/(1+A*b),A2=A*(1+dA/100),Af2=A2/(1+A2*b),x=1,y=Af*x,e=x-b*y;
    C.I('x',0.6);C.I('e',clamp(0.15+0.85*e,0.12,1));C.I('y',0.9);C.I('f',0.6);C.I('f2',0.6);C.set('e','e='+e.toPrecision(3));C.set('y','y='+y.toPrecision(3)+'x');C.set('f','βy='+(b*y).toPrecision(3));
    const p=[];for(let i=0;i<=200;i++){const l=0+5*i/200,a=Math.pow(10,l);p.push([l,Math.log10(a/(1+a*b))]);}
    draw(cv,{x0:0,x1:5,y0:-0.2,y1:Math.max(Math.log10(1/b)+0.6,1.2),xl:'log₁₀ A',yl:'log₁₀ A_f',series:[{c:'t4',w:1.4,dash:[5,4],pts:[[0,Math.log10(1/b)],[5,Math.log10(1/b)]]},{c:'axis',w:1,dash:[2,4],pts:[[0,0],[5,5]]},{c:'t1',w:2.6,pts:p}],points:[{x:Math.log10(A),y:Math.log10(Af),c:'t3',label:'A_f='+Af.toPrecision(4)}]});
    readouts('r-fb',[['A<sub>f</sub>',Af.toPrecision(5)],['1/β',(1/b).toPrecision(4)],['שגיאה מ-1/β',((1-Af*b)*100).toFixed(2)+'%'],['הגבר חוג Aβ',(A*b).toPrecision(4)],['1+Aβ',(1+A*b).toPrecision(4)],['אות שגיאה e/x',e.toPrecision(3)],['שינוי ב-A<sub>f</sub> כש-A משתנה '+dA+'%',((Af2/Af-1)*100).toFixed(3)+'%']]);}
  upd();
})();

section(root,{id:'l8-bw',tag:'רוחב סרט',title:'משוב מרחיב את רוחב הסרט',short:'רוחב סרט',
lead:'מגבר עם קוטב יחיד: <span class="m">A(f) = A<sub>0</sub>/(1+jf/f<sub>H</sub>)</span>. עם משוב, ההגבר קטן פי <span class="m">1+A<sub>0</sub>β</span> ורוחב הסרט גדל פי אותו גורם. מכפלת הגבר × רוחב סרט נשמרת.',
body:'<div class="lab"><div class="controls"><div class="sliders" id="bw-ctl"></div></div><div class="scopes">'+scope('c-bw','',lg('t2','חוג פתוח |A|')+lg('t1','חוג סגור |A<sub>f</sub>|')+lg('t3','f<sub>H</sub>, f<sub>Hf</sub>','dot'),'בודה')+'</div></div><div class="readouts" id="r-bw"></div>'+
notes('<h3>מה לראות</h3><p>שני הגרפים נפגשים בתדר גבוה: שם ההגבר הפתוח כבר קטן, <span class="m">Aβ</span> לא גדול מ-1, והמשוב "מפסיק לעבוד". מתחת לזה, החוג הסגור שטוח.</p>',F('','A<sub>f</sub>(f) = A<sub>0f</sub>/(1+jf/f<sub>Hf</sub>)')+F('','A<sub>0f</sub> = A<sub>0</sub>/(1+A<sub>0</sub>β)')+F('','f<sub>Hf</sub> = f<sub>H</sub>(1+A<sub>0</sub>β)')+F('','A<sub>0f</sub>·f<sub>Hf</sub> = A<sub>0</sub>·f<sub>H</sub>'))});
(function(){
  const cv=reg('c-bw');
  const st=sliders('bw-ctl',[{key:'A0',id:'bw-a',label:'A<sub>0</sub>',min:2,max:5,step:0.1,value:4,map:v=>Math.pow(10,v),fmt:v=>si(v,'')},{key:'fH',id:'bw-f',label:'f<sub>H</sub>',min:1,max:4,step:0.1,value:2,map:v=>Math.pow(10,v),fmt:v=>si(v,'Hz')},{key:'b',id:'bw-b',label:'β',min:-4,max:0,step:0.1,value:-2,map:v=>Math.pow(10,v),fmt:v=>v.toPrecision(2)}],upd);
  function upd(){const {A0,fH,b}=st,F=1+A0*b,A0f=A0/F,fHf=fH*F,p1=[],p2=[];
    for(let i=0;i<=300;i++){const l=0+9*i/300,f=Math.pow(10,l);p1.push([l,db(A0/Math.hypot(1,f/fH))]);p2.push([l,db(A0f/Math.hypot(1,f/fHf))]);}
    draw(cv,{x0:0,x1:9,y0:-20,y1:db(A0)+10,xl:'log₁₀ f [Hz]',yl:'|A| [dB]',series:[{c:'t2',w:2.2,pts:p1},{c:'t1',w:2.6,pts:p2}],points:[{x:Math.log10(fH),y:db(A0)-3,c:'t3',r:4,label:'f_H'},{x:Math.log10(fHf),y:db(A0f)-3,c:'t3',r:4,label:'f_Hf'}]});
    readouts('r-bw',[['A<sub>0f</sub>',A0f.toPrecision(4)+' ('+db(A0f).toFixed(1)+' dB)'],['f<sub>Hf</sub>',si(fHf,'Hz')],['1+A<sub>0</sub>β',F.toPrecision(4)],['GBW פתוח',si(A0*fH,'Hz')],['GBW סגור',si(A0f*fHf,'Hz')]]);}
  upd();
})();

section(root,{id:'l8-nl',tag:'עיוות',title:'משוב שלילי מיישר אי-ליניאריות',short:'עיוות',
lead:'המגבר כאן לא ליניארי: <span class="m">y = V<sub>sat</sub>·tanh(A·e/V<sub>sat</sub>)</span>. בחוג פתוח (הגבר מותאם ל-A<sub>f</sub>) הסינוס מתעוות. בחוג סגור הלולאה "מתקנת" את השגיאה, והמוצא כמעט סינוס נקי.',
body:'<div class="lab"><div class="controls"><div class="sliders" id="nl-ctl"></div></div><div class="scopes">'+scope('c-nl','',lg('t2','מגבר פתוח עם אותו הגבר (מעוות)')+lg('t1','עם משוב')+lg('t4','אידיאלי x/β','dash'),'עיוות')+'</div></div><div class="readouts" id="r-nl"></div>'+
notes('<h3>למה זה עובד</h3><p>הלולאה מודדת את המוצא בפועל ומזינה בחזרה בדיוק את השגיאה הדרושה. היכן שהמגבר "חלש" (ליד הרוויה), אות השגיאה גדל אוטומטית ומפצה. הפיצוי נגמר רק כשהמוצא מגיע לרוויה אמיתית.</p>',F('','y = f(A(x − βy))')+F('','עיוות<sub>f</sub> ≈ עיוות / (1+Aβ)'))});
(function(){
  const cv=reg('c-nl'),Vs=10;
  const st=sliders('nl-ctl',[{key:'A',id:'nl-a',label:'A',min:1,max:4,step:0.1,value:3,map:v=>Math.pow(10,v),fmt:v=>si(v,'')},{key:'b',id:'nl-b',label:'β',min:0.02,max:1,step:0.01,value:0.1,fmt:v=>v.toFixed(2)},{key:'x',id:'nl-x',label:'אמפליטודת כניסה',min:0.1,max:1.2,step:0.05,value:0.8,fmt:v=>v.toFixed(2)+' V'}],upd);
  const f=(A,e)=>Vs*Math.tanh(A*e/Vs);
  function upd(){const {A,b,x}=st,Af=A/(1+A*b),P1=[],P2=[],P3=[];let e1=0,e2=0;
    for(let i=0;i<=300;i++){const t=2*i/300,xi=x*Math.sin(2*Math.PI*t);const yc=bisect(y=>y-f(A,xi-b*y),-Vs,Vs,60),yo=f(Af,xi);P1.push([t,yo]);P2.push([t,yc]);P3.push([t,xi/b]);e1=Math.max(e1,Math.abs(yo-Af*xi));e2=Math.max(e2,Math.abs(yc-Af*xi));}
    const y=Math.max(Vs,x/b)*1.15;draw(cv,{x0:0,x1:2,y0:-y,y1:y,xl:'t / T',yl:'y [V]',series:[{c:'t4',w:1.3,dash:[5,4],pts:P3},{c:'t2',w:2,pts:P1},{c:'t1',w:2.6,pts:P2}]});
    readouts('r-nl',[['A<sub>f</sub>',Af.toFixed(2)],['סטייה מקסימלית בלי משוב',e1.toFixed(3)+' V'],['סטייה מקסימלית עם משוב',e2.toFixed(3)+' V'],['שיפור',(e2>1e-6?(e1/e2).toFixed(0):'∞')+'×'],['1+Aβ',(1+A*b).toFixed(0)]]);}
  upd();
})();

section(root,{id:'l8-top',tag:'טופולוגיות',title:'ארבע טופולוגיות: מה דוגמים ולאן מחזירים',short:'טופולוגיות',
lead:'המילה הראשונה אומרת איך המשוב <b>מוזרק</b> לכניסה (טורי = מתח, מקבילי = זרם), והשנייה איך הוא <b>נדגם</b> ביציאה (מקבילי = מתח, טורי = זרם). חיבור טורי מגדיל התנגדות פי <span class="m">1+Aβ</span>, וחיבור מקבילי מקטין אותה.',
body:'<div class="lab"><div class="controls"><div class="seg" id="tp-sel"><button type="button" data-v="ss" aria-pressed="true">טורי-מקבילי</button><button type="button" data-v="sr" aria-pressed="false">טורי-טורי</button><button type="button" data-v="pp" aria-pressed="false">מקבילי-מקבילי</button><button type="button" data-v="ps" aria-pressed="false">מקבילי-טורי</button></div><div class="sliders" id="tp-ctl"></div></div><div class="scopes">'+circ('cx-tp','<span id="tp-cap"></span>')+'</div></div><div class="readouts" id="r-tp"></div>'+
'<div class="tbl"><table><thead><tr><th>טופולוגיה</th><th>דוגם</th><th>מחזיר</th><th>A</th><th>β</th><th>R<sub>if</sub></th><th>R<sub>of</sub></th></tr></thead><tbody id="tp-tb"></tbody></table></div>'+
notes('<h3>שלבי הניתוח (מהסיכום)</h3><ol><li>לזהות את סוג המשוב ולמצוא β.</li><li>למצוא R<sub>i</sub>, R<sub>o</sub> של המגבר כולל העמסת רשת המשוב (R<sub>11</sub>, R<sub>22</sub>).</li><li>למצוא את הגבר מעגל ה-A.</li><li>A<sub>f</sub> = A/(1+βA).</li><li>R<sub>if</sub> ו-R<sub>of</sub>.</li></ol>','<h3>כלל אצבע</h3><p><b>טורי</b> (בכניסה או ביציאה) → ההתנגדות שם <b>גדלה</b> פי (1+Aβ).</p><p><b>מקבילי</b> → ההתנגדות <b>קטנה</b> פי (1+Aβ).</p><p>לכן טורי-מקבילי הוא מגבר מתח כמעט אידיאלי: R<sub>in</sub> גבוהה ו-R<sub>out</sub> נמוכה.</p>')});
(function(){
  const C=Circuit('cx-tp',440,170);
  C.blk(220,50,120,50,'A');C.blk(220,130,120,40,'β');C.w([40,50],[160,50]);C.w([280,50],[400,50]);C.w([340,50],[340,130],[280,130]);C.w([160,130],[90,130],[90,50]);C.nd(90,50).nd(340,50);
  C.T(40,40,'','big','middle',null,'in');C.T(400,40,'','big','middle',null,'out');C.T(90,150,'','val2','middle',null,'mix');C.T(340,150,'','val','middle',null,'smp');
  C.flow('a',[[40,50],[160,50]]);C.flow('b',[[280,50],[400,50]]);C.flow('c',[[340,50],[340,130],[280,130]]);C.flow('d',[[160,130],[90,130],[90,50]]);['a','b','c','d'].forEach(k=>C.I(k,0.5));
  const getT=seg('tp-sel',()=>upd());
  const st=sliders('tp-ctl',[{key:'A',id:'tp-a',label:'A (ביחידות הטופולוגיה)',min:1,max:5,step:0.1,value:3,map:v=>Math.pow(10,v),fmt:v=>si(v,'')},{key:'b',id:'tp-b',label:'β',min:-3,max:0,step:0.1,value:-1,map:v=>Math.pow(10,v),fmt:v=>v.toPrecision(2)},{key:'Ri',id:'tp-ri',label:'R<sub>i</sub>',min:1,max:6,step:0.1,value:4,map:v=>Math.pow(10,v),fmt:v=>si(v,'Ω')},{key:'Ro',id:'tp-ro',label:'R<sub>o</sub>',min:1,max:6,step:0.1,value:3,map:v=>Math.pow(10,v),fmt:v=>si(v,'Ω')}],upd);
  const T={ss:['טורי-מקבילי (Series-Shunt)','מתח','מתח','A<sub>v</sub>=v<sub>o</sub>/v<sub>i</sub>','v<sub>f</sub>/v<sub>o</sub>',1,-1],sr:['טורי-טורי (Series-Series)','זרם','מתח','G=i<sub>o</sub>/v<sub>i</sub>','v<sub>f</sub>/i<sub>o</sub>',1,1],pp:['מקבילי-מקבילי (Shunt-Shunt)','מתח','זרם','A<sub>z</sub>=v<sub>o</sub>/i<sub>i</sub>','i<sub>f</sub>/v<sub>o</sub>',-1,-1],ps:['מקבילי-טורי (Shunt-Series)','זרם','זרם','A<sub>i</sub>=i<sub>o</sub>/i<sub>i</sub>','i<sub>f</sub>/i<sub>o</sub>',-1,1]};
  function upd(){const t=getT(),r=T[t],{A,b,Ri,Ro}=st,F=1+A*b,Rif=r[5]>0?Ri*F:Ri/F,Rof=r[6]>0?Ro*F:Ro/F;
    C.set('in','כניסה');C.set('out','יציאה');C.set('mix',r[2]==='מתח'?'מחזיר מתח (טורי)':'מחזיר זרם (מקבילי)');C.set('smp',r[1]==='מתח'?'דוגם מתח (מקבילי)':'דוגם זרם (טורי)');
    document.getElementById('tp-cap').innerHTML=r[0];
    readouts('r-tp',[['A<sub>f</sub> = A/(1+Aβ)',(A/F).toPrecision(4)],['1+Aβ',F.toPrecision(4)],['R<sub>if</sub>',si(Rif,'Ω')+(r[5]>0?' ↑':' ↓')],['R<sub>of</sub>',si(Rof,'Ω')+(r[6]>0?' ↑':' ↓')]]);
    document.getElementById('tp-tb').innerHTML=Object.keys(T).map(k=>{const q=T[k];return '<tr'+(k===t?' class="on"':'')+'><td>'+q[0]+'</td><td>'+q[1]+'</td><td>'+q[2]+'</td><td class="n">'+q[3]+'</td><td class="n">'+q[4]+'</td><td class="n">'+(q[5]>0?'R<sub>i</sub>(1+βA)':'R<sub>i</sub>/(1+βA)')+'</td><td class="n">'+(q[6]>0?'R<sub>o</sub>(1+βA)':'R<sub>o</sub>/(1+βA)')+'</td></tr>';}).join('');}
  upd();
})();
},
quiz:[
{q:'A = 10,000 ו-β = 0.01. מה A<sub>f</sub>?',o:['100','99.01','10,000','0.01'],a:1,e:'A<sub>f</sub> = A/(1+Aβ) = 10000/101 ≈ 99.01. קרוב מאוד ל-1/β = 100.'},
{q:'באותו מעגל A יורד ב-20%. בכמה משתנה A<sub>f</sub>?',o:['20%','2%','≈0.2%','0%'],a:2,e:'dA<sub>f</sub>/A<sub>f</sub> = (dA/A)/(1+Aβ) = 20%/101 ≈ 0.2%.'},
{q:'מגבר עם A<sub>0</sub> = 10⁵ ו-f<sub>H</sub> = 10Hz סוגר בחוג עם הגבר 100. מה רוחב הסרט החדש?',o:['10Hz','1kHz','10kHz','1MHz'],a:2,e:'GBW = 10⁵·10 = 1MHz נשמר. עם הגבר 100: f<sub>Hf</sub> = 1MHz/100 = 10kHz.'},
{q:'איזו טופולוגיה מתאימה למגבר מתח (R<sub>in</sub> גבוה, R<sub>out</sub> נמוך)?',o:['טורי-מקבילי','מקבילי-טורי','טורי-טורי','מקבילי-מקבילי'],a:0,e:'טורי בכניסה מגדיל R<sub>in</sub>, ומקבילי (דגימת מתח) ביציאה מקטין R<sub>out</sub>.'},
{q:'במשוב מקבילי-מקבילי, מה קורה להתנגדות הכניסה?',o:['גדלה פי 1+Aβ','קטנה פי 1+Aβ','לא משתנה','מתאפסת'],a:1,e:'חיבור מקבילי בכניסה מקטין את ההתנגדות: R<sub>if</sub> = R<sub>i</sub>/(1+βA<sub>z</sub>).'},
{q:'לשם מה משמש משוב חיובי?',o:['ייצוב הגבר','הרחבת רוחב סרט','מתנדים ומשווים עם היסטרזיס (שמיט)','הקטנת עיוות'],a:2,e:'משוב חיובי מרחיק את המערכת משיווי משקל, ולכן משמש למתנדים, שעונים ומשווי שמיט.'}
],
formulas:[
['הגבר חוג סגור','A<sub>f</sub> = A/(1+βA) → 1/β'],['הגבר חוג','L = Aβ · כמות משוב: 1+Aβ'],

['מקבילי-מקבילי','β = i<sub>f</sub>/v<sub>o</sub> · R<sub>if</sub> = R<sub>i</sub>/(1+βA<sub>z</sub>) · R<sub>of</sub> = R<sub>o</sub>/(1+βA<sub>z</sub>)'],
['מקבילי-טורי','β = i<sub>f</sub>/i<sub>o</sub> · R<sub>if</sub> = R<sub>i</sub>/(1+βA<sub>i</sub>) · R<sub>of</sub> = R<sub>o</sub>(1+βA<sub>i</sub>)']
]};

    {key:'Rleak',id:'oa-rl',label:'R<sub>f</sub> מעשי (אינטגרטור)',min:10,max:1001,step:10,value:1001,map:v=>v>1000?Infinity:v*1000,fmt:v=>si(v,'Ω')},
    {key:'VCC',id:'oa-vcc',label:'V<sub>CC</sub>',min:3,max:15,step:0.5,value:12,fmt:v=>'±'+v.toFixed(1)+' V'}],upd);
  const vis={inv:['A','R1','Rf','VCC'],non:['A','R1','Rf','VCC'],buf:['A','VCC'],sum:['A','R1','Rf','R2','v2','VCC'],dif:['A','R1','Rf','R2','R4','cm','VCC'],int:['A','R1','f','C','Rleak','VCC'],der:['A','R1','f','C','VCC']};
  const ids={A:'oa-a',R1:'oa-r1',Rf:'oa-rf',R2:'oa-r2',R4:'oa-r4',v2:'oa-v2',cm:'oa-cm',f:'oa-f',C:'oa-c',Rleak:'oa-rl',VCC:'oa-vcc'};
  function show(){const t=getT();types.forEach(k=>document.getElementById('cx-oa-'+k).closest('figure').hidden=k!==t);Object.keys(ids).forEach(k=>document.getElementById(ids[k]).closest('.sl').hidden=!vis[t].includes(k));}
  const N=400;let W=null;
  function build(){const t=getT(),{A,R1,Rf,R2,R4,v2,cm,f,C,Rleak,VCC}=st,cl=v=>clamp(v,-VCC,VCC);const vin=[],vo=[],cur=[],vin2=[];
    if(t==='int'){const T=1/f,dt=T/N;let v=0;for(let k=0;k<6*N;k++){const x=((k%N)<N/2)?A:-A;v+=(-x/(R1*C)-(isFinite(Rleak)?v/(Rleak*C):0))*dt;v=cl(v);if(k>=5*N){vin.push(x);vo.push(v);cur.push(x/R1);}}
      if(!isFinite(Rleak)){const m=(Math.max(...vo)+Math.min(...vo))/2;for(let i=0;i<N;i++)vo[i]=cl(vo[i]-m);} }
    else if(t==='der'){const T=1/f;for(let i=0;i<N;i++){const ph=i/N,x=ph<0.5?A*(4*ph-1):A*(3-4*ph),dx=(ph<0.5?4*A:-4*A)/T;vin.push(x);vo.push(cl(-R1*C*dx));cur.push(C*dx);}}
    else for(let i=0;i<N;i++){const s=Math.sin(2*Math.PI*i/N),x=A*s;let y,ic;
      if(t==='inv'){y=-Rf/R1*x;ic=x/R1;}else if(t==='non'){y=(1+Rf/R1)*x;ic=x/R1;}else if(t==='buf'){y=x;ic=0;}
      else if(t==='sum'){y=-Rf*(x/R1+v2/R2);ic=x/R1;vin2.push(v2);}
      else{const n=cm*Math.sin(2*Math.PI*3*i/N+0.7),V1=n-x/2,V2=n+x/2,Vp=V2*R4/(R2+R4);y=(1+Rf/R1)*Vp-(Rf/R1)*V1;ic=(V1-Vp)/R1;vin2.push(V2);vin.push(V1);vo.push(cl(y));cur.push(ic);continue;}
      vin.push(x);vo.push(cl(y));cur.push(ic);}
    W={vin,vo,cur,vin2,t};}
  function frame(ph){const t=W.t,cc=CC[t],i=Math.floor((ph%1)*N)%N,Im=Math.max(...W.cur.map(Math.abs),1e-9);
    const m=x=>Math.abs(x)/Im*0.85+(Math.abs(x)>Im*0.02?0.12:0);
    if(t==='sum'){cc.I('i1',m(W.vin[i]/st.R1),Math.sign(W.vin[i])||1);cc.I('i2',m(st.v2/st.R2),Math.sign(st.v2)||1);const it=W.vin[i]/st.R1+st.v2/st.R2;cc.I('f',m(it),Math.sign(it)||1);}
    else if(t==='dif'){cc.I('i1',m(W.cur[i]),Math.sign(W.cur[i])||1);cc.I('i2',0.5,Math.sign(W.vin2[i])||1);}
    else if(t!=='buf'){cc.I('i',m(W.cur[i]),Math.sign(W.cur[i])||1);}
    cc.set('vo','v_{out}='+fx(W.vo[i],2));
    const P1=[],P2=[],P3=[];for(let k=0;k<2*N;k++){const j=k%N,x=k/N;P1.push([x,W.vin[j]]);P2.push([x,W.vo[j]]);if(W.vin2.length)P3.push([x,W.vin2[j]]);}
    const y=st.VCC*1.15;const S=[{c:'t5',w:1.2,dash:[5,4],pts:[[0,st.VCC],[2,st.VCC]]},{c:'t5',w:1.2,dash:[5,4],pts:[[0,-st.VCC],[2,-st.VCC]]},{c:'t2',w:1.8,pts:P1}];
    if(P3.length)S.push({c:'t3',w:1.5,a:.8,pts:P3});S.push({c:'t1',w:2.6,pts:P2});
    draw(cv,{x0:0,x1:2,y0:-y,y1:y,xl:'t / T',yl:'[V]',cursor:ph%2,series:S});}
  types.forEach(k=>{CC[k].tick=(t)=>{if(getT()===k&&W)frame(t*0.3);};});
  const FX={inv:['v<sub>out</sub> = −(R<sub>f</sub>/R<sub>1</sub>)v<sub>in</sub>','KCL: v<sub>in</sub>/R<sub>1</sub> = (0 − v<sub>out</sub>)/R<sub>f</sub>'],non:['v<sub>out</sub> = (1 + R<sub>f</sub>/R<sub>1</sub>)v<sub>in</sub>','R<sub>in</sub> → ∞ (הכניסה ישר ל-V<sup>+</sup>)'],buf:['v<sub>out</sub> = v<sub>in</sub>, A = 1','חוצץ: R<sub>in</sub>→∞, R<sub>out</sub>→0'],
    sum:['v<sub>out</sub> = −R<sub>f</sub>·Σ v<sub>k</sub>/R<sub>k</sub>','הזרמים מכל הכניסות מתחברים באדמה הווירטואלית'],dif:['v<sub>out</sub> = (1+R<sub>3</sub>/R<sub>1</sub>)(R<sub>4</sub>/(R<sub>2</sub>+R<sub>4</sub>)·v<sub>2</sub> − R<sub>3</sub>/(R<sub>1</sub>+R<sub>3</sub>)·v<sub>1</sub>)','אם R<sub>3</sub>/R<sub>1</sub> = R<sub>4</sub>/R<sub>2</sub>: v<sub>out</sub> = (R<sub>3</sub>/R<sub>1</sub>)(v<sub>2</sub> − v<sub>1</sub>)'],
    int:['v<sub>out</sub>(t) = −(1/RC)∫v<sub>in</sub>dτ + v<sub>C</sub>(0)','מעשי: A<sub>v</sub> = −R<sub>f</sub>/(R(1+jωR<sub>f</sub>C))'],der:['v<sub>out</sub>(t) = −RC·dv<sub>in</sub>/dt','גל משולש נכנס → גל ריבועי יוצא']};
  function upd(){show();build();const t=getT(),{A,R1,Rf,R2,R4,C,f}=st;
    document.getElementById('oa-f').innerHTML=FX[t].map(x=>F('',x)).join('');
    const gain={inv:-Rf/R1,non:1+Rf/R1,buf:1,sum:-Rf/R1,dif:Rf/R1}[t];
    const sat=Math.max(...W.vo.map(Math.abs))>=st.VCC-1e-9;
    const items=[['מצב המוצא',sat?pill('רוויה (נחתך)','bad'):pill('ליניארי','ok'),'html']];
    if(gain!=null)items.push(['הגבר',gain.toFixed(2)+' V/V']);
    if(t==='dif'){const k1=Rf/R1,k2=R4/R2;const Acm=(1+k1)*(k2/(1+k2))-k1;items.push(['A<sub>CM</sub>',Acm.toFixed(4)],['התאמה',Math.abs(k1-k2)<1e-9?pill('R<sub>3</sub>/R<sub>1</sub> = R<sub>4</sub>/R<sub>2</sub>','ok'):pill('אי-התאמה → רעש דולף','warn'),'html']);}
    if(t==='int')items.push(['שיא משולש (אידיאלי) A/(4fRC)',si(A/(4*f*R1*C),'V')],['1/RC',si(1/(R1*C),'s⁻¹')]);
    if(t==='der')items.push(['|v<sub>out</sub>| = RC·4Af',si(R1*C*4*A*f,'V')]);
    items.push(['v<sub>out</sub> מקס׳',fx(Math.max(...W.vo),2)+' V']);
    readouts('r-oa',items);frame(CC[t].t*0.3);}
  show();upd();
})();

section(root,{id:'l9-ia',tag:'מגבר מכשור',title:'מגבר מכשור (IA): הגבר גבוה, דחיית רעש מעולה',short:'מגבר מכשור',
lead:'שני מגברים לא-הופכים בכניסה (R<sub>in</sub> אינסופית) ואחריהם מגבר הפרש. נגד אחד, <span class="m">R<sub>G</sub></span>, קובע את ההגבר. המתח המשותף עובר את הדרגה הראשונה בהגבר 1, ונדחה בדרגה השנייה.',
body:'<div class="lab"><div class="controls"><div class="sliders" id="ia-ctl"></div></div><div class="scopes">'+scope('c-ia','short',lg('t2','v<sub>1</sub>')+lg('t3','v<sub>2</sub>')+lg('t1','v<sub>o</sub>'),'מגבר מכשור')+'</div></div><div class="readouts" id="r-ia"></div>'+
notes('<h3>הפיתוח</h3><p>מכללי הזהב, המתח על R<sub>G</sub> הוא v<sub>1</sub>−v<sub>2</sub>, והזרם <span class="m">I = (v<sub>1</sub>−v<sub>2</sub>)/R<sub>G</sub></span> זורם גם דרך שני נגדי המשוב R. לכן <span class="m">v<sub>01</sub>−v<sub>02</sub> = I(2R + R<sub>G</sub>)</span>.</p>',F('דרגה 1:','A<sub>id</sub> = (v<sub>01</sub>−v<sub>02</sub>)/(v<sub>1</sub>−v<sub>2</sub>) = 1 + 2R/R<sub>G</sub>')+F('כולל:','v<sub>o</sub> = (R<sub>2</sub>/R<sub>1</sub>)(1 + 2R/R<sub>G</sub>)(v<sub>1</sub> − v<sub>2</sub>)')+F('V<sub>REF</sub>:','מוסיף היסט (bias) למוצא'))});
(function(){
  const cv=reg('c-ia');
  const st=sliders('ia-ctl',[{key:'R',id:'ia-r',label:'R (משוב דרגה 1)',min:1,max:100,step:1,value:25,map:v=>v*1000,fmt:v=>si(v,'Ω')},{key:'RG',id:'ia-rg',label:'R<sub>G</sub>',min:0.1,max:50,step:0.1,value:1,map:v=>v*1000,fmt:v=>si(v,'Ω')},{key:'k',id:'ia-k',label:'R<sub>2</sub>/R<sub>1</sub> (דרגה 2)',min:0.5,max:10,step:0.5,value:1,fmt:v=>v.toFixed(1)},{key:'vd',id:'ia-vd',label:'v<sub>1</sub>−v<sub>2</sub> (שיא)',min:1,max:100,step:1,value:10,map:v=>v/1000,fmt:v=>si(v,'V')},{key:'cm',id:'ia-cm',label:'רעש משותף',min:0,max:5,step:0.1,value:3,fmt:v=>v.toFixed(1)+' V'}],upd);
  function upd(){const {R,RG,k,vd,cm}=st,A1=1+2*R/RG,A=k*A1,P1=[],P2=[],P3=[];
    for(let i=0;i<=400;i++){const t=i/400,n=cm*Math.sin(2*Math.PI*4*t+0.3),d=vd*Math.sin(2*Math.PI*t);P1.push([t,n+d/2]);P2.push([t,n-d/2]);P3.push([t,clamp(A*d,-13,13)]);}
    const y=Math.max(cm+vd,Math.min(13,A*vd))*1.15;draw(cv,{x0:0,x1:1,y0:-y,y1:y,xl:'t',yl:'[V]',series:[{c:'t2',w:1.4,pts:P1},{c:'t3',w:1.4,a:.8,pts:P2},{c:'t1',w:2.6,pts:P3}]});
    readouts('r-ia',[['הגבר דרגה 1',A1.toFixed(1)],['הגבר כולל',A.toFixed(1)+' ('+db(A).toFixed(1)+' dB)'],['v<sub>o</sub> שיא',si(Math.min(13,A*vd),'V')],['רעש משותף במוצא',pill('0 (אידיאלי)','ok'),'html']]);}
  upd();
})();

section(root,{id:'l9-rect',tag:'מיישר מדויק',title:'מיישר מדויק: דיודה בלי 0.7V',short:'מיישר מדויק',
lead:'מיישר דיודה רגיל "בולע" 0.7V, ולכן אות של 0.5V לא עובר בכלל. כשהדיודה בתוך לולאת המשוב, המגבר מעלה את המוצא שלו בדיוק כמה שצריך כדי לפתוח אותה, ומפל הדיודה מתחלק ב-<span class="m">A<sub>OL</sub></span>.',
body:'<div class="lab"><div class="controls"><div class="sliders" id="pr-ctl"></div></div><div class="scopes">'+scope('c-pr','short',lg('t2','v<sub>in</sub>')+lg('t5','דיודה רגילה','dash')+lg('t4','חצי גל מדויק')+lg('t1','גל שלם מדויק'),'זמן')+scope('c-pr2','short',lg('t5','דיודה רגילה','dash')+lg('t4','חצי גל מדויק')+lg('t1','גל שלם מדויק'),'VTC')+'</div></div><div class="readouts" id="r-pr"></div>'+
notes('<h3>חצי גל מדויק (המעגל מהסיכום)</h3><ul><li><span class="m">v<sub>in</sub> &gt; 0</span>: מוצא המגבר שלילי, D1 מוליכה ומקבעת את הכניסה המהפכת, D2 חסומה, <span class="m">v<sub>o</sub> = 0</span>.</li><li><span class="m">v<sub>in</sub> &lt; 0</span>: D2 מוליכה, המעגל הוא מגבר הופך: <span class="m">v<sub>o</sub> = −(R<sub>2</sub>/R<sub>1</sub>)v<sub>in</sub></span>.</li></ul><h3 style="margin-top:10px">גל שלם מדויק</h3><p>A1 (חצי גל) + A2 מסכם עם 2R<sub>1</sub> ו-R<sub>1</sub>: <span class="m">v<sub>o</sub> = −R<sub>2</sub>(v<sub>in</sub>/2R<sub>1</sub> + v<sub>A</sub>/R<sub>1</sub>)</span>, כש-v<sub>A</sub>=−v<sub>in</sub> עבור v<sub>in</sub>&gt;0. התוצאה: <span class="m">v<sub>o</sub> = (R<sub>2</sub>/2R<sub>1</sub>)|v<sub>in</sub>|</span>.</p>',
F('רגיל:','v<sub>o</sub> = v<sub>in</sub> − 0.7 (v<sub>in</sub>&gt;0.7), אחרת 0')+F('חצי גל:','v<sub>o</sub> = −(R<sub>2</sub>/R<sub>1</sub>)v<sub>in</sub> (v<sub>in</sub>&lt;0), אחרת 0')+F('גל שלם:','v<sub>o</sub> = (R<sub>2</sub>/2R<sub>1</sub>)|v<sub>in</sub>|')+F('מפל אפקטיבי:','V<sub>D</sub>/A<sub>OL</sub> ≈ 0'))});
(function(){
  const cv=reg('c-pr'),cv2=reg('c-pr2');
  const st=sliders('pr-ctl',[{key:'A',id:'pr-a',label:'אמפליטודת כניסה',min:0.1,max:5,step:0.05,value:0.5,fmt:v=>v.toFixed(2)+' V'},{key:'k',id:'pr-k',label:'R<sub>2</sub>/R<sub>1</sub>',min:0.5,max:4,step:0.1,value:2,fmt:v=>v.toFixed(1)}],upd);
  const simple=v=>Math.max(0,v-0.7),half=(v,k)=>v<0?-k*v:0,full=(v,k)=>k/2*Math.abs(v);
  function upd(){const {A,k}=st,T=[[],[],[],[]],V=[[],[],[]];
    for(let i=0;i<=400;i++){const t=2*i/400,v=A*Math.sin(2*Math.PI*t);T[0].push([t,v]);T[1].push([t,simple(v)]);T[2].push([t,half(v,k)]);T[3].push([t,full(v,k)]);}
    for(let i=0;i<=200;i++){const v=-A+2*A*i/200;V[0].push([v,simple(v)]);V[1].push([v,half(v,k)]);V[2].push([v,full(v,k)]);}
    const y=Math.max(A,A*k)*1.15;
    draw(cv,{x0:0,x1:2,y0:-A*1.15,y1:y,xl:'t / T',yl:'[V]',series:[{c:'t2',w:1.4,a:.8,pts:T[0]},{c:'t5',w:1.6,dash:[5,4],pts:T[1]},{c:'t4',w:2.2,pts:T[2]},{c:'t1',w:2.4,pts:T[3]}]});
    draw(cv2,{x0:-A,x1:A,y0:-0.05*y,y1:y,xl:'v_in [V]',yl:'v_o [V]',series:[{c:'t5',w:1.6,dash:[5,4],pts:V[0]},{c:'t4',w:2.2,pts:V[1]},{c:'t1',w:2.4,pts:V[2]}]});
    readouts('r-pr',[['שיא, דיודה רגילה',fx(simple(A),2)+' V'],['שיא, חצי גל מדויק',fx(k*A,2)+' V'],['שיא, גל שלם מדויק',fx(k/2*A,2)+' V'],['ממוצע גל שלם',fx(k/2*A*2/Math.PI,3)+' V']]);}
  upd();
})();

section(root,{id:'l9-log',tag:'לוגריתמי',title:'מגבר לוגריתמי ואנטי-לוגריתמי',short:'לוג',
lead:'טרנזיסטור (או דיודה) בענף המשוב: היחס האקספוננציאלי <span class="m">I<sub>C</sub> = I<sub>S</sub>e<sup>V<sub>BE</sub>/V<sub>T</sub></sup></span> הופך את המגבר למחשבון לוגריתם. בהחלפת המקומות מקבלים אקספוננט.',
body:'<div class="lab"><div class="controls"><div class="sliders" id="lg-ctl"></div></div><div class="scopes">'+scope('c-lg','short',lg('t1','v<sub>out</sub>(v<sub>in</sub>) לוגריתמי')+lg('t3','נקודה','dot'),'לוג')+'</div></div><div class="readouts" id="r-lg"></div>'+
notes('<h3>שים לב</h3><p>כל הכפלה של v<sub>in</sub> פי 10 מוסיפה למוצא <span class="m">−V<sub>T</sub>ln10 ≈ −57.6mV</span>, קבוע. זה מה שהופך כפל לחיבור: log(ab) = log a + log b.</p>',F('לוג:','v<sub>out</sub> = −V<sub>T</sub>ln(v<sub>in</sub>/(I<sub>S</sub>R))')+F('אנטי-לוג:','v<sub>out</sub> = −I<sub>S</sub>R·e<sup>v<sub>in</sub>/V<sub>T</sub></sup>'))});
(function(){
  const cv=reg('c-lg');
  const st=sliders('lg-ctl',[{key:'R',id:'lg-r',label:'R',min:1,max:100,step:1,value:10,map:v=>v*1000,fmt:v=>si(v,'Ω')},{key:'Is',id:'lg-is',label:'I<sub>S</sub>',min:-15,max:-12,step:0.1,value:-14,map:v=>Math.pow(10,v),fmt:v=>si(v,'A',2)},{key:'v',id:'lg-v',label:'v<sub>in</sub>',min:-3,max:1,step:0.05,value:0,map:v=>Math.pow(10,v),fmt:v=>si(v,'V')}],upd);
  function upd(){const {R,Is,v}=st,f=x=>-VT*Math.log(x/(Is*R)),p=[];for(let i=0;i<=200;i++){const l=-3+4*i/200;p.push([l,f(Math.pow(10,l))]);}
    draw(cv,{x0:-3,x1:1,y0:f(10)*1.1,y1:0,xl:'log₁₀ v_in [V]',yl:'v_out [V]',series:[{c:'t1',w:2.6,pts:p}],points:[{x:Math.log10(v),y:f(v),c:'t3',label:fx(f(v),3)+' V'}]});
    readouts('r-lg',[['v<sub>out</sub>',fx(f(v),4)+' V'],['I<sub>C</sub> = v<sub>in</sub>/R',si(v/R,'A')],['לכל עשור',si(-VT*Math.LN10,'V')]]);}
  upd();
})();
},
quiz:[
{q:'מגבר הופך עם R<sub>1</sub>=1kΩ ו-R<sub>f</sub>=3kΩ. v<sub>in</sub>=4V, V<sub>CC</sub>=±15V. מה v<sub>out</sub>?',o:['−12V','12V','−15V','−3V'],a:0,e:'A = −R<sub>f</sub>/R<sub>1</sub> = −3, v<sub>out</sub> = −12V, בתוך גבולות האספקה.'},
{q:'אותו מגבר עם v<sub>in</sub>=6V?',o:['−18V','−15V (רוויה)','18V','0V'],a:1,e:'החישוב נותן −18V, אבל המוצא לא יכול לעבור את −V<sub>CC</sub>, ולכן נתקע ב-−15V.'},
{q:'מה ההגבר של מגבר לא-הופך עם R<sub>1</sub>=10k ו-R<sub>f</sub>=40k?',o:['4','5','−4','0.2'],a:1,e:'A = 1 + R<sub>f</sub>/R<sub>1</sub> = 1 + 4 = 5.'},
{q:'למה אסור לכתוב KCL בצומת המוצא של מגבר שרת?',o:['כי המתח שם אפס','כי המגבר יכול לספק או לספוג כל זרם, והזרם שלו לא ידוע','כי אין שם זרם','כי זה צומת אדמה'],a:1,e:'מוצא המגבר הוא כמו מקור מתח תלוי שמספק כל זרם נדרש. הזרם שלו לא ידוע, ולכן משוואת KCL שם לא עוזרת.'},
{q:'במגבר מכשור עם R=25kΩ ו-R<sub>G</sub>=1kΩ (דרגה שנייה בהגבר 1). מה ההגבר?',o:['26','51','50','25'],a:1,e:'A = 1 + 2R/R<sub>G</sub> = 1 + 50 = 51.'},
{q:'אינטגרטור אידיאלי מקבל גל ריבועי. מה צורת המוצא?',o:['ריבועי','משולש','סינוס','קבוע'],a:1,e:'אינטגרל של קבוע הוא קו ישר. מקטעים של ±A נותנים שיפועים מתחלפים, כלומר גל משולש (הפוך בסימן).'},
{q:'מה היתרון של מיישר מדויק?',o:['הגבר גבוה יותר','מיישר גם אותות קטנים מ-0.7V, כי מפל הדיודה מתחלק ב-A<sub>OL</sub>','לא צריך ספק כוח','עובד רק ב-DC'],a:1,e:'הדיודה בתוך לולאת המשוב, ולכן המגבר מפצה על המפל שלה.'}
],
formulas:[
['מגבר שרת','V<sub>out</sub> = A<sub>OL</sub>(V<sup>+</sup> − V<sup>−</sup>) · −V<sub>CC</sub> ≤ v<sub>out</sub> ≤ V<sub>CC</sub>'],
['כללי הזהב','V<sup>+</sup> = V<sup>−</sup> · I<sup>+</sup> = I<sup>−</sup> = 0'],
['הופך','v<sub>out</sub>/v<sub>in</sub> = −R<sub>f</sub>/R<sub>1</sub>'],
['הופך עם T','v<sub>out</sub>/v<sub>in</sub> = −(R<sub>2</sub>/R<sub>1</sub>)(1 + R<sub>4</sub>/R<sub>3</sub>)'],
['לא הופך','v<sub>out</sub>/v<sub>in</sub> = 1 + R<sub>f</sub>/R<sub>1</sub>'],['חוצץ','v<sub>out</sub> = v<sub>in</sub>'],
['מסכם','v<sub>out</sub> = −R<sub>f</sub>Σ(v<sub>k</sub>/R<sub>k</sub>)'],
['הפרש','v<sub>out</sub> = (1+R<sub>3</sub>/R<sub>1</sub>)(R<sub>4</sub>v<sub>2</sub>/(R<sub>2</sub>+R<sub>4</sub>) − R<sub>3</sub>v<sub>1</sub>/(R<sub>1</sub>+R<sub>3</sub>))'],
['מגבר מכשור','A<sub>id</sub> = 1 + 2R<sub>1</sub>/R<sub>3</sub> · v<sub>o</sub> = (R<sub>2</sub>/R<sub>1</sub>)(2R<sub>3</sub>/R<sub>G</sub>+1)(v<sub>1</sub>−v<sub>2</sub>)'],
['אינטגרטור','v<sub>out</sub> = −(1/RC)∫v<sub>in</sub>dτ + v<sub>C</sub>(0) · מעשי: A<sub>v</sub> = −R<sub>f</sub>/(R(1+jωR<sub>f</sub>C))'],
['גוזר','v<sub>out</sub> = −RC·dv<sub>in</sub>/dt'],
['לוג','v<sub>out</sub> = −V<sub>T</sub>ln(v<sub>in</sub>/(I<sub>S</sub>R))'],['אנטי-לוג','v<sub>out</sub> = I<sub>S</sub>R·e<sup>v<sub>in</sub>/V<sub>T</sub></sup> (בסימן לפי המעגל)']
]};

/* ---------- router & pages ---------- */
const view=document.getElementById('view');
const pages={};
const ORDER=[1,2,3,4,5,6,7,8,9];
function page(key,builder){
  Object.values(pages).forEach(p=>p.hidden=true);
  if(!pages[key]){const d=document.createElement('div');view.appendChild(d);pages[key]=d;builder(d);}
  pages[key].hidden=false;
  return pages[key];
}
function navMark(k){document.querySelectorAll('[data-nav]').forEach(a=>{if(a.dataset.nav===k)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});}

function buildHome(d){
  const done=ORDER.reduce((s,n)=>s+lessonProgress(n).correct,0),tot=ORDER.reduce((s,n)=>s+lessonProgress(n).tot,0);
  const groups=[['דיודות',[1,2]],['טרנזיסטורים',[3,4,5]],['מעגלים משולבים ומגברים',[6,7,8,9]]];
  d.innerHTML='<div class="hero"><div class="herobox"><div><div class="kicker">LevelUp · 9 שיעורים · ללמוד דרך הידיים</div>'+
    '<h1>מעבדת אלקטרוניקה תקבילית</h1><p class="sub">כל הקורס במקום אחד: מצומת PN ועד מגברי שרת. בכל שיעור יש מעגלים חיים שבהם רואים איך הזרם זורם, סקופים שמגיבים לכל סליידר, ושאלות תרגול עם הסבר מלא.</p>'+
    '<div class="stats"><div class="stat"><b>9</b><span>שיעורים</span></div><div class="stat"><b id="h-sims">40+</b><span>הדמיות ומעגלים</span></div><div class="stat"><b id="h-score">'+done+'/'+tot+'</b><span>תשובות נכונות</span></div></div></div>'+
    '<figure class="scope" style="margin:0"><div id="hero-c"></div><figcaption>'+lg('t1','זרם במיישר גשר: הזרם בעומס זורם תמיד באותו כיוון')+'</figcaption></figure></div></div>'+
    groups.map(g=>'<div class="group-h">'+g[0]+'</div><div class="grid">'+g[1].map(n=>{const L=LESSONS[n];
      return '<a class="card" href="#/l/'+n+'"><span class="num">'+String(n).padStart(2,'0')+'</span><h3>'+L.title+'</h3><p>'+L.sub+'</p><div class="prog" data-prog="'+n+'"><span style="width:0"></span></div><div class="meta"><span>'+L.topics+'</span><span>'+L.quiz.length+' שאלות</span></div></a>';}).join('')+'</div>').join('')+
    '<footer>מבוסס על סיכומי LevelUp לקורס אלקטרוניקה תקבילית. V<sub>T</sub> = 25mV בכל החישובים. ההדמיות הן מודלים לימודיים ולא סימולציית SPICE.</footer>';
  heroBridge();updateHomeProgress();
}
function heroBridge(){
  const C=Circuit('hero-c',420,230);
  // bridge rectifier
  const L=[40,115],top=[210,40],bot=[210,190],lft=[140,115],rgt=[280,115];
  C.V([40,150],[40,80],'v_s',{kind:'ac',side:1,off:26});
  C.w([40,80],[40,40],top).w([40,150],[40,190],bot);
  C.D(lft,top,'D4',{id:'d4',side:1}); C.D(top,rgt,'D1',{id:'d1',side:-1});
  C.D(bot,rgt,'D2',{id:'d2',side:1}); C.D(lft,bot,'D3',{id:'d3',side:-1});
  C.w(rgt,[330,115],[330,60],[380,60]);C.R([380,60],[380,170],'R_L',{side:-1});C.w([380,170],[380,200],[110,200],[110,115],lft);
  C.nd(top[0],top[1]).nd(bot[0],bot[1]).nd(lft[0],lft[1]).nd(rgt[0],rgt[1]);
  C.flow('p',[[40,80],[40,40],top,rgt,[330,115],[330,60],[380,60],[380,170],[380,200],[110,200],[110,115],lft,bot,[40,190],[40,150]]);
  C.flow('n',[[40,150],[40,190],bot,rgt,[330,115],[330,60],[380,60],[380,170],[380,200],[110,200],[110,115],lft,top,[40,40],[40,80]]);
  C.T(395,118,'+','hi','middle');
  C.tick=(t)=>{const v=Math.sin(2*Math.PI*t*0.35),a=Math.abs(v);const pos=v>0.05,neg=v<-0.05;
    C.I('p',pos?a:0);C.I('n',neg?a:0);C.st('d1',pos?'on':'dim');C.st('d3',pos?'on':'dim');C.st('d2',neg?'on':'dim');C.st('d4',neg?'on':'dim');};
  C.tick(0.7);
}
function buildLesson(d,n){
  const L=LESSONS[n];
  d.innerHTML='<div class="lhead"><div class="kicker">שיעור '+n+' מתוך 9</div><h1>'+L.title+'</h1><p class="sub">'+L.intro+'</p><div class="chips" id="chips-'+n+'"></div></div>';
  const root=document.createElement('div');d.appendChild(root);
  L.build(root);
  const q=section(root,{id:'l'+n+'-quiz',tag:'תרגול',title:'בדוק את עצמך',short:'תרגול',lead:'שאלות בסגנון המבחן. לחץ על תשובה וקבל הסבר מלא. ההתקדמות נשמרת בדפדפן הזה.'});
  quiz(q,n,L.quiz);
  const i=ORDER.indexOf(n),prev=ORDER[i-1],next=ORDER[i+1];
  const nav=document.createElement('div');nav.className='nextl';
  nav.innerHTML=(prev?'<a class="btn" href="#/l/'+prev+'">→ שיעור '+prev+': '+LESSONS[prev].title+'</a>':'<span></span>')+(next?'<a class="btn solid" href="#/l/'+next+'">שיעור '+next+': '+LESSONS[next].title+' ←</a>':'<a class="btn solid" href="#/q">לתרגול המסכם ←</a>');
  d.appendChild(nav);
  const chips=document.getElementById('chips-'+n);
  root.querySelectorAll('section.mod').forEach(s=>{const b=document.createElement('button');b.type='button';b.textContent=s.dataset.title.replace(/<[^>]+>/g,'');b.onclick=()=>s.scrollIntoView({behavior:reduced?'auto':'smooth'});chips.appendChild(b);});
}
function copyText(t,btn){const done=()=>{const o=btn.textContent;btn.textContent='הועתק ✓';setTimeout(()=>btn.textContent=o,1400);};
  const fb=()=>{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){}ta.remove();};
  try{navigator.clipboard.writeText(t).then(done,fb);}catch(e){fb();}}
function texDoc(){return FORMULAS.map(L=>'% ===== שיעור '+L.n+': '+L.title+' =====\n'+L.groups.map(g=>'% --- '+g.h+' ---\n'+g.items.map(i=>(i.l?'% '+i.l.replace(/<[^>]+>/g,'')+'\n':'')+'\\['+i.t+'\\]').join('\n')).join('\n')).join('\n\n');}
function buildFormulas(d){
  d.innerHTML='<div class="lhead"><div class="kicker">דף נוסחאות · LaTeX</div><h1>כל הנוסחאות של הקורס</h1><p class="sub">'+FORMULAS.reduce((a,L)=>a+L.groups.reduce((b,g)=>b+g.items.length,0),0)+' נוסחאות מ-9 השיעורים, כתובות בקוד LaTeX ומוצגות כנוסחה. ליד כל נוסחה יש כפתור להעתקת הקוד.</p>'+
    '<input class="search" id="fsearch" type="search" placeholder="חיפוש: זנר, CMRR, g_m, \\\\frac…" aria-label="חיפוש נוסחה">'+
    '<div class="presets" style="margin-top:10px"><button type="button" id="fcode">הצג קוד לכל הנוסחאות</button><button type="button" id="fall">העתק את כל הקוד</button></div>'+
    '<div class="chips" id="fchips"></div></div><div id="flist"></div>';
  const list=d.querySelector('#flist');let k=0;
  list.innerHTML=FORMULAS.map(L=>'<section class="fgroup" id="fl-'+L.n+'"><h2 style="font-size:22px">שיעור '+L.n+' · '+L.title+'</h2>'+L.groups.map(g=>'<h3 class="fh">'+g.h+'</h3>'+g.items.map(i=>{k++;
      return '<div class="frow2" data-t="'+(g.h+' '+i.l+' '+i.t).replace(/<[^>]+>/g,'').replace(/"/g,'').toLowerCase()+'">'+(i.l?'<div class="fn">'+i.l+'</div>':'')+
      '<div class="fmath" dir="ltr">\\['+i.t.replace(/</g,'&lt;')+'\\]</div><div class="fbar"><button type="button" class="btn fcopy" data-k="'+k+'">העתק LaTeX</button><button type="button" class="btn ftog">קוד</button></div><pre class="fcode" dir="ltr" hidden>'+i.t.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</pre></div>';}).join('')).join('')+'</section>').join('');
  const all=[];FORMULAS.forEach(L=>L.groups.forEach(g=>g.items.forEach(i=>all.push(i.t))));
  list.querySelectorAll('.fcopy').forEach(b=>b.onclick=()=>copyText(all[+b.dataset.k-1],b));
  list.querySelectorAll('.ftog').forEach(b=>b.onclick=()=>{const pre=b.closest('.frow2').querySelector('pre');pre.hidden=!pre.hidden;});
  let shown=false;d.querySelector('#fcode').onclick=e=>{shown=!shown;list.querySelectorAll('pre.fcode').forEach(p=>p.hidden=!shown);e.target.textContent=shown?'הסתר את הקוד':'הצג קוד לכל הנוסחאות';};
  d.querySelector('#fall').onclick=e=>copyText(texDoc(),e.target);
  const ch=d.querySelector('#fchips');FORMULAS.forEach(L=>{const b=document.createElement('button');b.type='button';b.textContent=L.n+'. '+L.title;b.onclick=()=>document.getElementById('fl-'+L.n).scrollIntoView({behavior:reduced?'auto':'smooth'});ch.appendChild(b);});
  d.querySelector('#fsearch').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();
    list.querySelectorAll('.fgroup').forEach(g=>{let any=false;g.querySelectorAll('.frow2').forEach(r=>{const ok=!q||r.dataset.t.includes(q);r.hidden=!ok;any=any||ok;});g.querySelectorAll('.fh').forEach(h=>{let n=h.nextElementSibling,vis=false;while(n&&n.classList.contains('frow2')){if(!n.hidden)vis=true;n=n.nextElementSibling;}h.hidden=!vis;});g.hidden=!any;});});
  const typeset=()=>{if(window.MathJax&&MathJax.typesetPromise){MathJax.typesetPromise([list]).catch(()=>{});}else setTimeout(typeset,300);};typeset();
}
function buildPractice(d){
  d.innerHTML='<div class="lhead"><div class="kicker">תרגול מסכם</div><h1>12 שאלות מכל הקורס</h1><p class="sub">סט אקראי מכל השיעורים. אחרי שסיימת, לחץ על "סט חדש" לקבלת שאלות אחרות.</p><div class="presets" style="margin-top:12px"><button type="button" id="newset">סט חדש</button></div></div><div id="qhost"></div>';
  const host=d.querySelector('#qhost');
  const make=()=>{host.innerHTML='';const all=[];ORDER.forEach(n=>LESSONS[n].quiz.forEach(q=>all.push(Object.assign({},q,{q:'<span class="muted">[שיעור '+n+']</span> '+q.q}))));
    for(let i=all.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[all[i],all[j]]=[all[j],all[i]];}
    const p=store.get('quiz',{});delete p.Lmix;store.set('quiz',p);quiz(host,'mix',all.slice(0,12));};
  d.querySelector('#newset').onclick=make;make();
}
function route(){
  const h=location.hash||'#/';let m;
  if((m=h.match(/^#\/l\/(\d)/))&&LESSONS[+m[1]]){const n=+m[1];page('l'+n,d=>buildLesson(d,n));navMark('home');}
  else if(h.startsWith('#/f')){page('f',buildFormulas);navMark('f');}
  else if(h.startsWith('#/q')){page('q',buildPractice);navMark('q');}
  else{page('home',buildHome);navMark('home');updateHomeProgress();const s=document.getElementById('h-score');if(s){const c=ORDER.reduce((a,n)=>a+lessonProgress(n).correct,0),t=ORDER.reduce((a,n)=>a+lessonProgress(n).tot,0);s.textContent=c+'/'+t;}}
  window.scrollTo(0,0);kickLoop();
}
window.addEventListener('hashchange',route);
(function(){
  const b=document.getElementById('flowtog');
  const upd=()=>{document.body.classList.toggle('electrons',electronMode);b.setAttribute('aria-pressed',electronMode?'true':'false');b.querySelector('span').textContent=electronMode?'זרימת אלקטרונים':'זרם קונבנציונלי';};
  b.addEventListener('click',()=>{electronMode=!electronMode;store.set('electrons',electronMode);upd();});upd();
})();
route();

})();
</script>
