<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="מעבדת אלקטרוניקה תקבילית: מעגלים חיים, סימולציות, תרגול ודף נוסחאות">
<style>html,body{margin:0}</style>
</head>
<body>
<title>מעבדת אלקטרוניקה תקבילית</title>
<script>window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]},svg:{fontCache:'global'},startup:{typeset:false}};</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.min.js" async></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Rubik:wght@500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#F2F4F1;--surface:#FFFFFF;--surface2:#E7ECE8;--ink:#14201B;--muted:#56645E;--line:#D3DAD5;
  --accent:#0A7A60;--accent-soft:#D5ECE3;--on-accent:#FFFFFF;
  --ok:#1C8F55;--warn:#A86F00;--bad:#C63E33;
  --scope-bg:#0E1613;--scope-grid:#1D2A25;--scope-axis:#50655C;--scope-text:#97ACA3;--scope-hi:#D8E5DF;
  --t1:#F2C230;--t2:#3CC4E2;--t3:#F2649E;--t4:#7EDC8C;--t5:#B7A3FF;
  --p-reg:#35202A;--n-reg:#15303A;--dep:#0A0F0D;
  --wire:#6F8A80;--comp:#D8E5DF;--comp-dim:#5E7068;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --display:"Rubik","Assistant",system-ui,sans-serif;
  --body:"Assistant","Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1210;--surface:#131B18;--surface2:#1A2420;--ink:#E2EAE6;--muted:#8FA098;--line:#26332E;
    --accent:#3FCBA4;--accent-soft:#16332A;--on-accent:#06120E;
    --ok:#4CC985;--warn:#E3A93A;--bad:#F07266;--scope-bg:#070B0A;--scope-grid:#17221E;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1210;--surface:#131B18;--surface2:#1A2420;--ink:#E2EAE6;--muted:#8FA098;--line:#26332E;
  --accent:#3FCBA4;--accent-soft:#16332A;--on-accent:#06120E;
  --ok:#4CC985;--warn:#E3A93A;--bad:#F07266;--scope-bg:#070B0A;--scope-grid:#17221E;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:16px/1.6 var(--body)}
.app{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 110px}
@media (min-width:700px){.app{padding-inline:24px}}
/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding-block:10px;margin-inline:-16px;padding-inline:16px}
@media (min-width:700px){.bar{margin-inline:-24px;padding-inline:24px}}
.brand{font:800 17px/1 var(--display);color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand svg{width:26px;height:26px}
.bar .sp{flex:1}
.bar nav{display:none;gap:4px}
@media (min-width:900px){.bar nav{display:flex}}
.bar nav a,.tabbar a{color:var(--muted);text-decoration:none;font:500 14px/1 var(--display);padding:9px 12px;border-radius:8px}
.bar nav a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.flowtog{display:flex;align-items:center;gap:6px;font:500 12.5px/1.2 var(--display);color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.flowtog i{width:9px;height:9px;border-radius:50%;background:var(--t1);display:inline-block}
.flowtog[aria-pressed="true"] i{background:var(--t2)}
.tabbar{position:fixed;inset-inline:0;bottom:0;z-index:30;display:flex;justify-content:space-around;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;padding:6px 10px;min-width:70px}
.tabbar a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tabbar a[aria-current="page"]{color:var(--accent)}
@media (min-width:900px){.tabbar{display:none}.app{padding-block-end:60px}}
/* home */
.hero{padding-block:30px 10px;display:grid;gap:18px}
.kicker,.eyebrow{font:600 12px/1 var(--display);letter-spacing:.08em;color:var(--accent)}
h1{font:800 clamp(30px,6vw,52px)/1.05 var(--display);margin:8px 0 10px;text-wrap:balance}
.sub{color:var(--muted);max-width:64ch;margin:0}
.herobox{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:center}
@media (max-width:840px){.herobox{grid-template-columns:minmax(0,1fr)}}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:110px}
.stat b{display:block;font:700 22px/1.1 var(--mono)}
.stat span{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:22px}
.card{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;text-decoration:none;color:var(--ink);transition:border-color .15s,transform .15s;position:relative;overflow:hidden}
.card:hover,.card:focus-visible{border-color:var(--accent);outline:none}
.card .num{font:800 34px/1 var(--mono);color:var(--accent);opacity:.9}
.card h3{font:600 18px/1.25 var(--display);margin:0}
.card p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
.card .prog{height:5px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:8px}
.card .prog span{display:block;height:100%;background:var(--accent)}
.card .meta{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between}
.group-h{font:600 13px/1 var(--display);color:var(--muted);letter-spacing:.06em;margin:28px 0 -8px}
/* lesson */
.lhead{padding-block:26px 8px}
.lhead h1{font-size:clamp(28px,5vw,44px)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:12px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{font:500 13.5px/1 var(--display);color:var(--ink);padding:8px 12px;border:1px solid var(--line);border-radius:999px;white-space:nowrap;background:var(--surface);cursor:pointer}
.chips button:hover{border-color:var(--accent);color:var(--accent)}
section.mod{padding-block:34px;border-bottom:1px solid var(--line);scroll-margin-top:70px}
h2{font:600 clamp(21px,3.4vw,29px)/1.2 var(--display);margin:8px 0 8px;text-wrap:balance}
h3{font:600 16px/1.3 var(--display);margin:0 0 8px}
.lead{max-width:72ch;color:var(--muted);margin:0}
.lab{display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr);gap:18px;margin-top:18px;align-items:start}
@media (max-width:840px){.lab{grid-template-columns:minmax(0,1fr)}}
.lab.solo{grid-template-columns:minmax(0,1fr)}
.controls{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.sliders{display:flex;flex-direction:column;gap:10px}
.sl label{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14.5px}
.sl output{font-family:var(--mono);font-size:13px;color:var(--accent);direction:ltr;unicode-bidi:isolate;white-space:nowrap}
input[type=range]{width:100%;accent-color:var(--accent);direction:ltr;margin:4px 0 0}
input[type=range]:disabled{opacity:.4}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex-wrap:wrap}
.seg button{flex:1 1 auto;padding:8px 8px;background:transparent;border:0;border-inline-start:1px solid var(--line);font:500 13.5px/1.2 var(--display);color:var(--ink);cursor:pointer;min-width:0}
.seg button:first-child{border-inline-start:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14.5px}
.checks label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.checks input{accent-color:var(--accent)}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets button,.btn{font:500 13px/1.2 var(--display);padding:7px 10px;border-radius:8px;border:1px dashed var(--accent);background:transparent;color:var(--accent);cursor:pointer}
.presets button:hover,.btn:hover{background:var(--accent-soft)}
.btn.solid{border-style:solid;background:var(--accent);color:var(--on-accent);font-size:14px;padding:10px 16px}
.scopes{display:flex;flex-direction:column;gap:12px;min-width:0}
figure.scope{margin:0;background:var(--scope-bg);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
figure.scope canvas{display:block;width:100%;aspect-ratio:16/9}
figure.scope canvas.wide{aspect-ratio:16/7}
figure.scope canvas.short{aspect-ratio:16/6}
figure.scope canvas.sq{aspect-ratio:4/3}
figure.scope svg.circ{display:block;width:100%;height:auto;direction:ltr}
figcaption{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;padding:8px 12px;font-size:12.5px;color:var(--scope-text);border-top:1px solid var(--scope-grid)}
figcaption .play{margin-inline-start:auto;font:600 12px/1 var(--display);color:var(--scope-hi);background:transparent;border:1px solid var(--scope-axis);border-radius:6px;padding:5px 9px;cursor:pointer}
.lg{white-space:nowrap}
.lg::before{content:"";display:inline-block;width:14px;height:3px;border-radius:2px;background:var(--c);margin-inline-end:6px;vertical-align:middle}
.lg.dash::before{background:repeating-linear-gradient(90deg,var(--c) 0 4px,transparent 4px 7px)}
.lg.dot::before{width:9px;height:9px;border-radius:50%}
.readouts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:14px}
.ro{background:var(--surface);padding:10px 12px;min-width:0}
.ro .k{font-size:12.5px;color:var(--muted);display:block;line-height:1.35}
.ro .v{font-family:var(--mono);font-size:15px;direction:ltr;unicode-bidi:isolate;display:block;text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font:600 13px/1.4 var(--display)}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.mute{background:var(--surface2);color:var(--muted)}
.notes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:16px}
@media (max-width:840px){.notes{grid-template-columns:minmax(0,1fr)}}
.note{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.note.fx-box{background:var(--surface2);border-color:transparent}
.note p{margin:0 0 8px}.note p:last-child{margin-bottom:0}
.note ul,.note ol{margin:0;padding-inline-start:18px}
.note li{margin-bottom:6px}
.fx{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;direction:rtl;font-family:var(--mono);font-size:14px;padding:5px 0;color:var(--ink)}
.fx .c{font-family:var(--body);font-size:13px;color:var(--muted);flex:none}
.fx .f{direction:ltr;unicode-bidi:isolate}
.m{font-family:var(--mono);font-size:.9em;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
sub,sup{font-size:.72em;line-height:0}
.muted{color:var(--muted)}
.tbl{overflow-x:auto;margin-top:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
tr:last-child td{border-bottom:0}
th{font:600 13px/1.3 var(--display);color:var(--muted);background:var(--surface2)}
td.n{font-family:var(--mono);direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
tr.on td{background:var(--accent-soft)}
.bar2{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--surface2);margin-top:6px;direction:ltr}
.bar2 span{display:block;height:100%;transition:width .15s}
.junc{display:flex;align-items:center;gap:6px;flex-wrap:wrap;direction:ltr;justify-content:flex-end}
.term{font:700 14px/1 var(--mono);padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface2)}
.jn{padding:5px 8px;border-radius:7px;font:600 12.5px/1.2 var(--display);direction:rtl}
.jn.fwd{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.jn.rev{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
/* svg circuits */
svg.circ{background:var(--scope-bg)}
svg.circ .w{fill:none;stroke:var(--wire);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
svg.circ .k{fill:none;stroke:var(--comp);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
svg.circ .kf{fill:var(--comp);stroke:none}
svg.circ .kb{fill:var(--scope-bg);stroke:var(--comp);stroke-width:2}
svg.circ .dim .k{stroke:var(--comp-dim)}
svg.circ .dim .kf{fill:var(--comp-dim)}
svg.circ .on .k{stroke:var(--t4)}
svg.circ .on .kf{fill:var(--t4)}
svg.circ .hot .k{stroke:var(--t1)}
svg.circ .nd{fill:var(--wire)}
svg.circ text{font:600 12px var(--mono);fill:var(--scope-text)}
svg.circ text.hi{fill:var(--scope-hi)}
svg.circ text.big{font-size:13.5px;fill:var(--scope-hi)}
svg.circ text.val{fill:var(--t1);font-size:12.5px}
svg.circ text.val2{fill:var(--t2);font-size:12.5px}
svg.circ text.he{font:600 12.5px var(--body)}
svg.circ .fl{fill:none;stroke:var(--t1);stroke-width:5;stroke-linecap:round;stroke-dasharray:0.01 15}
body.electrons svg.circ .fl{stroke:var(--t2)}
svg.circ .blk{fill:var(--scope-grid);stroke:var(--comp);stroke-width:2}
/* quiz */
.quiz{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.q .qt{font-weight:600;margin:0 0 10px}
.q .qn{font:700 12px/1 var(--mono);color:var(--accent);margin-bottom:6px}
.opts{display:grid;gap:6px}
.opts button{text-align:right;font:15px/1.4 var(--body);color:var(--ink);background:var(--surface2);border:1px solid transparent;border-radius:9px;padding:9px 12px;cursor:pointer}
.opts button:hover:not(:disabled){border-color:var(--accent)}
.opts button:disabled{cursor:default}
.opts button.good{background:color-mix(in srgb,var(--ok) 18%,var(--surface));border-color:var(--ok)}
.opts button.badc{background:color-mix(in srgb,var(--bad) 14%,var(--surface));border-color:var(--bad)}
.q .ex{margin-top:10px;font-size:14.5px;color:var(--muted);border-inline-start:3px solid var(--accent);padding-inline-start:10px}
.score{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.nextl{display:flex;justify-content:space-between;gap:10px;margin-top:26px;flex-wrap:wrap}
.nextl a{text-decoration:none}
/* formula sheet */
.search{width:100%;font:16px var(--body);padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);margin-top:14px}
.fgroup{margin-top:22px}
.fgroup h3{font-size:17px}
.frow{display:grid;grid-template-columns:minmax(120px,210px) minmax(0,1fr);gap:4px 14px;padding:9px 0;border-bottom:1px solid var(--line);align-items:baseline}
@media (max-width:600px){.frow{grid-template-columns:minmax(0,1fr)}}
.frow .fn{color:var(--muted);font-size:14px}
.frow .ff{font-family:var(--mono);font-size:14px;direction:ltr;unicode-bidi:isolate;text-align:right;overflow-wrap:anywhere}
.fh{margin:18px 0 4px;color:var(--accent);font-size:15px}
.frow2{display:grid;grid-template-columns:minmax(120px,200px) minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.frow2 .fn{color:var(--muted);font-size:14px;unicode-bidi:plaintext;text-align:right}
.frow2 .fmath{overflow-x:auto;overflow-y:hidden;min-width:0;text-align:left;color:var(--ink);font-size:15px}
.frow2 .fmath mjx-container{margin:4px 0!important}
.frow2 .fbar{display:flex;gap:6px}
.frow2 .fbar .btn{padding:5px 8px;font-size:12px;white-space:nowrap}
.frow2 pre.fcode{grid-column:1/-1;margin:0;padding:10px 12px;background:var(--scope-bg);color:var(--t1);border-radius:8px;font:13px/1.5 var(--mono);overflow-x:auto;white-space:pre-wrap;word-break:break-all;text-align:left}
@media (max-width:700px){.frow2{grid-template-columns:minmax(0,1fr)}.frow2 .fbar{justify-content:flex-start}}
footer{padding-block:28px 0;color:var(--muted);font-size:13.5px}
@media (prefers-reduced-motion: reduce){.bar2 span{transition:none}.card{transition:none}}
</style>

<div class="app" dir="rtl" lang="he">
  <header class="bar">
    <a class="brand" href="#/"><svg viewBox="0 0 26 26" aria-hidden="true"><rect x="1" y="1" width="24" height="24" rx="6" fill="var(--accent)"/><path d="M5 13h5l2-5 3 10 2-5h4" fill="none" stroke="var(--on-accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>אלקטרוניקה תקבילית</a>
    <span class="sp"></span>
    <nav aria-label="ניווט ראשי"><a href="#/" data-nav="home">שיעורים</a><a href="#/f" data-nav="f">דף נוסחאות</a><a href="#/q" data-nav="q">תרגול מסכם</a></nav>

  </header>
  <main id="view"></main>
</div>

  <a href="#/f" data-nav="f"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z M8 8h8 M8 12h8 M8 16h5"/></svg>נוסחאות</a>
  <a href="#/q" data-nav="q"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/></svg>תרגול</a>
</nav>

<script>
(function(){

function si(v,u,d){

  const a=Math.abs(v);let f=1e-15,p='f';

/* ---------- controls ---------- */
function sliders(cid,specs,on){
  const box=document.getElementById(cid),st={};
  specs.forEach(s=>{
    const w=document.createElement('div');w.className='sl';
    w.innerHTML='<label for="'+s.id+'"><span>'+s.label+'</span><output id="'+s.id+'-o" for="'+s.id+'"></output></label>'+
      '<input type="range" id="'+s.id+'" min="'+s.min+'" max="'+s.max+'" step="'+s.step+'" value="'+s.value+'">';
    box.appendChild(w);
    const inp=w.querySelector('input'),out=w.querySelector('output');
    const upd=()=>{const v=+inp.value;st[s.key]=s.map?s.map(v):v;out.textContent=s.fmt(st[s.key]);};
    inp.addEventListener('input',()=>{upd();on();});upd();
  });
  return st;
}
function setVals(obj){Object.keys(obj).forEach(id=>{
  const el=document.getElementById(id);if(!el)return;
  if(el.type==='checkbox'){if(el.checked!==obj[id]){el.checked=obj[id];el.dispatchEvent(new Event('change'));}}
  else{el.value=obj[id];el.dispatchEvent(new Event('input'));}
});}
function readouts(id,items){
  document.getElementById(id).innerHTML=items.map(it=>'<div class="ro"><span class="k">'+it[0]+'</span>'+
    (it[2]==='html'?'<span>'+it[1]+'</span>':'<span class="v">'+it[1]+'</span>')+'</div>').join('');
}
function seg(id,cb){ // buttons inside #id toggle aria-pressed; cb(value)
  const box=document.getElementById(id);let cur=null;
  box.querySelectorAll('button').forEach(b=>{if(b.getAttribute('aria-pressed')==='true')cur=b.dataset.v;
    b.addEventListener('click',()=>{box.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));cur=b.dataset.v;cb(cur);});});
  return ()=>cur;

  [...el.childNodes].forEach(n=>{if(!(n.nodeType===1&&n.classList.contains('c')))f.appendChild(n);});el.appendChild(f);});}

/* ---------- visibility-driven animation for canvases ---------- */
function animator(cv,drawFn,stepFn){
  const A={visible:false,raf:0,draw:()=>drawFn(),last:0};cv._anim=A;
  const loop=t=>{if(!A.visible||cv.offsetParent===null){A.raf=0;return;}const dt=A.last?Math.min(50,t-A.last)/16.67:1;A.last=t;stepFn(dt);drawFn();A.raf=requestAnimationFrame(loop);};
  A.kick=()=>{if(A.visible&&!reduced&&!A.raf){A.last=0;A.raf=requestAnimationFrame(loop);}};
  const io=new IntersectionObserver(es=>es.forEach(e=>{A.visible=e.isIntersecting;
    if(A.visible&&!reduced)A.kick();
    if(A.visible&&reduced){stepFn(0);drawFn();}}),{threshold:0.02});
  io.observe(cv);return A;
}
function prep(cv){
  const W=cv.clientWidth,H=cv.clientHeight,d=window.devicePixelRatio||1;
  if(!W||!H)return null;
  if(cv.width!==Math.round(W*d)||cv.height!==Math.round(H*d)){cv.width=Math.round(W*d);cv.height=Math.round(H*d);}
  const g=cv.getContext('2d');g.setTransform(d,0,0,d,0,0);g.direction='ltr';return {g,W,H};
}

function setLabel(t,text){
  while(t.firstChild)t.removeChild(t.firstChild);
  const re=/_\{([^}]*)\}|_([A-Za-z0-9α-ω]+)/g;let last=0,m;const s=String(text);
  while((m=re.exec(s))){if(m.index>last)t.appendChild(document.createTextNode(s.slice(last,m.index)));
    const sp=mk('tspan',{dy:'3','font-size':'0.72em'},t);sp.textContent=m[1]||m[2];
    const back=mk('tspan',{dy:'-3'},t);back.textContent=' ';last=re.lastIndex;}
  if(last<s.length)t.appendChild(document.createTextNode(s.slice(last)));
}
let loopRaf=0,loopLast=0;
function kickLoop(){if(!loopRaf){loopLast=0;loopRaf=requestAnimationFrame(loop);}}
function loop(ts){
  const dt=loopLast?Math.min(0.05,(ts-loopLast)/1000):0.016;loopLast=ts;let any=false;
  circuits.forEach(C=>{
    if(!C.visible||C.svg.getBoundingClientRect().width===0)return;any=true;
    if(C.tick&&C.playing){C.t+=dt;C.tick(C.t,dt);}
    if(!reduced){const dir=electronMode?-1:1;
      for(const k in C.flows){const f=C.flows[k];if(f.m<=0.001)continue;f.off-=dir*f.dir*(18+95*Math.min(1,f.m))*dt;f.el.style.strokeDashoffset=f.off.toFixed(2);}}
  });
  loopRaf=any?requestAnimationFrame(loop):0;
}
/* map a current to 0..1 flow magnitude on a log scale */

  const state=prog[key]||{};
  const sc=document.createElement('div');sc.className='score';
  const upd=()=>{const n=Object.keys(state).length,c=Object.values(state).filter(Boolean).length;
    sc.innerHTML=pill(c+' / '+qs.length+' נכונות','ok')+'<span class="muted">'+(n<qs.length?'ענית על '+n+' מתוך '+qs.length:'סיימת את התרגול של השיעור')+'</span><button type="button" class="btn" id="qreset-'+lid+'">התחל מחדש</button>';
    document.getElementById('qreset-'+lid).onclick=()=>{for(const k in state)delete state[k];prog[key]=state;store.set('quiz',prog);box.innerHTML='';render();};
    prog[key]=state;store.set('quiz',prog);updateHomeProgress();};
  function render(){
    qs.forEach((q,i)=>{
      const d=document.createElement('div');d.className='q';
      d.innerHTML='<div class="qn">שאלה '+(i+1)+'</div><p class="qt">'+q.q+'</p><div class="opts">'+q.o.map((o,j)=>'<button type="button" data-j="'+j+'">'+o+'</button>').join('')+'</div>';
      const btns=[...d.querySelectorAll('button')];
      const reveal=(j)=>{btns.forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add('good');else if(k===j)b.classList.add('badc');});
        const ex=document.createElement('div');ex.className='ex';ex.innerHTML=(j===q.a?'<b>נכון.</b> ':'<b>לא בדיוק.</b> ')+q.e;d.appendChild(ex);};
      btns.forEach(b=>b.addEventListener('click',()=>{const j=+b.dataset.j;state[i]=j===q.a;reveal(j);upd();}));
      if(state[i]!==undefined){reveal(state[i]?q.a:(q.a+1)%q.o.length);}
      box.appendChild(d);
    });
    box.appendChild(sc);upd();
  }
  render();
}
function lessonProgress(n){const p=store.get('quiz',{})['L'+n]||{};const L=LESSONS[n];const tot=L&&L.quiz?L.quiz.length:1;
  return {done:Object.keys(p).length,correct:Object.values(p).filter(Boolean).length,tot};}
function updateHomeProgress(){document.querySelectorAll('[data-prog]').forEach(el=>{const p=lessonProgress(+el.dataset.prog);el.querySelector('span').style.width=(p.correct/p.tot*100)+'%';});}

/* =================== LESSON 1: DIODES =================== */
LESSONS[1]={title:'דיודות',sub:'צומת PN, מודלים, קו עבודה, אות קטן, קטימה וזנר',topics:'6 הדמיות',
intro:'הדיודה היא הרכיב הלא-ליניארי הראשון בקורס. בשיעור הזה נבין למה היא מוליכה רק בכיוון אחד, איך בוחרים מודל, איך מוצאים נקודת עבודה, ואיך בונים מעגלי קטימה ומייצבי זנר.',
build(root){
/* ---- PN ---- */
section(root,{id:'l1-pn',tag:'פיזיקה',title:'צומת PN: למה הדיודה מוליכה רק בכיוון אחד',short:'צומת PN',
lead:'בצד P יש עודף חורים ובצד N עודף אלקטרונים. ליד הצומת הם מתאחים ומשאירים <b>אזור מחסור</b> עם יונים קבועים בלבד. היונים יוצרים שדה חשמלי שחוסם מעבר נוסף. מתח חיצוני משנה את גובה המחסום.',
body:'<div class="lab"><div class="controls"><div class="sliders" id="pn-ctl"></div><div class="presets"><button type="button" data-preset="pn-rev">אחורי −4V</button><button type="button" data-preset="pn-zero">ללא ממתח</button><button type="button" data-preset="pn-fwd">קדמי 0.7V</button></div></div>'+
'<div class="scopes">'+scope('c-pn','wide',lg('t3','חורים','dot')+lg('t2','אלקטרונים','dot')+'<span class="lg" style="--c:#5d6f68">אזור מחסור ויונים</span>','צומת PN')+'</div></div><div class="readouts" id="r-pn"></div>'+
notes('<h3>מה לראות</h3><ul><li><b>אחורי</b>: אזור המחסור מתרחב והנשאים נדחקים מהצומת. זורם רק זרם הזליגה <span class="m">I<sub>S</sub></span> (fA).</li><li><b>קדמי</b>: המחסום יורד, נשאים חוצים את הצומת והופכים לנשאי מיעוט (ונעלמים בהתאחדות). הזרם גדל אקספוננציאלית.</li><li>בסביבות <span class="m">0.6–0.7V</span> זה כבר זרם ממשי: מתח הברך <span class="m">V<sub>D0</sub></span>.</li></ul>',
'<h3>הקשר לנוסחה</h3>'+F('','I<sub>D</sub> = I<sub>S</sub>(e<sup>V<sub>D</sub>/nV<sub>T</sub></sup> − 1)')+'<p>האקספוננט סופר כמה נשאים מצליחים לעבור את המחסום, שיורד ליניארית עם <span class="m">V<sub>D</sub></span>. ה-<span class="m">−1</span> הוא הזרם ההפוך.</p>')});
(function(){
  const cv=reg('c-pn');const Vbi=0.75,IS=1e-14;
  const st=sliders('pn-ctl',[{key:'V',id:'pn-v',label:'V<sub>D</sub> = V<sub>P</sub> − V<sub>N</sub>',min:-5,max:0.8,step:0.01,value:0,fmt:v=>fx(v,2)+' V'}],upd);
  const parts=[];
  for(let i=0;i<70;i++){parts.push({t:'h',x:Math.random()*0.42+0.02,y:Math.random()*0.8+0.1,vx:0,life:1,minor:false});parts.push({t:'e',x:0.56+Math.random()*0.42,y:Math.random()*0.8+0.1,vx:0,life:1,minor:false});}
  let wH=0.06,flow=0;
  function geom(){const V=st.V;wH=0.055*Math.sqrt(Math.max(0.012,(Vbi-V))/Vbi);flow=Math.min(2.2,Math.exp((V-0.66)/0.035));if(V<0.4)flow=0;}
  function step(dt){const xl=0.5-wH,xr=0.5+wH;
    parts.forEach(p=>{p.vx+=(Math.random()-0.5)*0.0022*dt;p.vx*=0.9;const dir=p.t==='e'?-1:1;
      p.x+=(p.vx+flow*0.0032*dir)*dt;p.y=clamp(p.y+(Math.random()-0.5)*0.01*dt,0.06,0.94);
      if(!p.minor){
        if(p.t==='e'){if(flow<0.03){if(p.x<xr+0.005){p.x=xr+0.005+Math.random()*0.01;p.vx=Math.abs(p.vx);}}else if(p.x<xl){p.minor=true;p.life=1;}if(p.x>0.995){p.x=0.995;p.vx=-Math.abs(p.vx);}}
        else{if(flow<0.03){if(p.x>xl-0.005){p.x=xl-0.005-Math.random()*0.01;p.vx=-Math.abs(p.vx);}}else if(p.x>xr){p.minor=true;p.life=1;}if(p.x<0.005){p.x=0.005;p.vx=Math.abs(p.vx);}}
      }else{p.life-=0.018*dt;if(p.life<=0||p.x<0||p.x>1){p.minor=false;p.life=1;p.vx=0;p.x=p.t==='e'?0.985-Math.random()*0.03:0.015+Math.random()*0.03;p.y=Math.random()*0.8+0.1;}}
    });}
  function drawPN(){const c=prep(cv);if(!c)return;const {g,W,H}=c,P=pal();const xl=0.5-wH,xr=0.5+wH;
    g.fillStyle=P.preg;g.fillRect(0,0,W/2,H);g.fillStyle=P.nreg;g.fillRect(W/2,0,W/2,H);
    g.fillStyle=P.dep;g.globalAlpha=0.75;g.fillRect(xl*W,0,(xr-xl)*W,H);g.globalAlpha=1;
    g.font='600 10px "JetBrains Mono", monospace';g.textAlign='center';g.textBaseline='middle';const dx=0.018;
    for(let x=0.5-dx/2;x>xl;x-=dx)for(let r=0;r<6;r++){const y=(r+0.5)/6;g.strokeStyle=P.t3;g.globalAlpha=0.55;g.beginPath();g.arc(x*W,y*H,5,0,7);g.stroke();g.fillStyle=P.t3;g.fillText('−',x*W,y*H);}
    for(let x=0.5+dx/2;x<xr;x+=dx)for(let r=0;r<6;r++){const y=(r+0.5)/6;g.strokeStyle=P.t2;g.globalAlpha=0.55;g.beginPath();g.arc(x*W,y*H,5,0,7);g.stroke();g.fillStyle=P.t2;g.fillText('+',x*W,y*H);}
    g.globalAlpha=1;
    parts.forEach(p=>{g.globalAlpha=p.minor?Math.max(0,p.life):1;if(p.t==='h'){g.strokeStyle=P.t3;g.lineWidth=1.8;g.beginPath();g.arc(p.x*W,p.y*H,3.4,0,7);g.stroke();}else{g.fillStyle=P.t2;g.beginPath();g.arc(p.x*W,p.y*H,3,0,7);g.fill();}});
    g.globalAlpha=1;g.lineWidth=1;g.fillStyle=P.hi;g.font='700 15px Rubik, sans-serif';g.textBaseline='top';g.textAlign='left';g.fillText('P (אנודה)',10,8);g.textAlign='right';g.fillText('N (קתודה)',W-10,8);
    const ay=H-16,a0=xr*W-4,a1=xl*W+4;g.strokeStyle=P.t1;g.fillStyle=P.t1;g.lineWidth=2;
    if(a0-a1>14){g.beginPath();g.moveTo(a0,ay);g.lineTo(a1+6,ay);g.stroke();g.beginPath();g.moveTo(a1,ay);g.lineTo(a1+8,ay-5);g.lineTo(a1+8,ay+5);g.fill();g.font='600 11px "JetBrains Mono", monospace';g.textAlign='center';g.textBaseline='bottom';g.fillText('E',(a0+a1)/2,ay-4);}
    g.lineWidth=1;if(flow>0.03){g.fillStyle=P.t4;g.font='600 12px Assistant, sans-serif';g.textAlign='center';g.textBaseline='top';g.fillText('← אלקטרונים   ·   זרם I →',W/2,8);}}
  const A=animator(cv,drawPN,step);
  function upd(){geom();const V=st.V,I=IS*(Math.exp(V/VT)-1);
    const s=V>=0.55?pill('מוליכה (ON)','ok'):V>0.005?pill('קדמי חלש','warn'):V>=-0.005?pill('שיווי משקל','mute'):pill('אחורי (OFF)','bad');
    readouts('r-pn',[['מצב',s,'html'],['זרם I<sub>D</sub>',si(I,'A')],['רוחב אזור המחסור (יחסי)',(wH/0.055).toFixed(2)+' ×'],['מחסום V<sub>bi</sub> − V<sub>D</sub>',fx(Math.max(0,Vbi-V),2)+' V']]);
    if(reduced||!A.raf){step(0);drawPN();}}
  presets({'pn-rev':{'pn-v':-4},'pn-zero':{'pn-v':0},'pn-fwd':{'pn-v':0.7}});upd();
})();

section(root,{id:'l1-iv',tag:'מודלים',title:'ארבעת המודלים של הדיודה על גרף אחד',short:'מודלים',
lead:'כל מודל הוא קירוב של האופיין האקספוננציאלי. הדלק וכבה מודלים כדי לראות איפה כל קירוב טוב ואיפה הוא נשבר.',
body:'<div class="lab"><div class="controls"><div class="checks"><label><input type="checkbox" id="iv-m1" checked> אידיאלית</label><label><input type="checkbox" id="iv-m2" checked> מקור מתח</label><label><input type="checkbox" id="iv-m3" checked> V<sub>D0</sub>+r<sub>D</sub></label><label><input type="checkbox" id="iv-m4" checked> מעשית</label></div><div class="sliders" id="iv-ctl"></div></div>'+
'<div class="scopes">'+scope('c-iv','',lg('t5','אידיאלית')+lg('t4','מקור מתח V<sub>D0</sub>')+lg('t2','V<sub>D0</sub> + r<sub>D</sub>')+lg('t1','מעשית'),'אופיין IV')+'</div></div><div class="readouts" id="r-iv"></div>'+
notes('<h3>ניסויים</h3><ul><li>הגדל את <span class="m">I<sub>S</sub></span> פי 10: העקומה זזה שמאלה ב-<span class="m">nV<sub>T</sub>ln10 ≈ 58n mV</span>.</li><li>שנה את <span class="m">n</span> מ-1 ל-2 (לפי הסיכום: 1 לגרמניום, 2 לסיליקון): הברך מתונה יותר ו-<span class="m">r<sub>d</sub></span> כפול.</li><li>התאם את <span class="m">V<sub>D0</sub></span> ו-<span class="m">r<sub>D</sub></span> כך שהקו הכחול ישיק לצהוב. זה בדיוק המודל השלישי.</li></ul>',
'<h3>המודלים מהסיכום</h3>'+F('אידיאלית:','V<sub>D</sub>&gt;0 → קצר · V<sub>D</sub>&lt;0 → נתק')+F('מודל שני:','i<sub>D</sub>=0 (v<sub>D</sub>&lt;V<sub>D0</sub>) · ∞ (v<sub>D</sub>&gt;V<sub>D0</sub>)')+F('מודל שלישי:','i<sub>D</sub> = (v<sub>D</sub> − V<sub>D0</sub>)/r<sub>D</sub>')+F('מעשית:','I<sub>D</sub> ≈ I<sub>S</sub>·exp(V<sub>D</sub>/nV<sub>T</sub>)')+'<p>טיפ: עם דיודות אידיאליות מניחים מצב, פותרים, ובודקים שההנחה מתקיימת.</p>')});
(function(){
  const cv=reg('c-iv');
  const st=sliders('iv-ctl',[
    {key:'Is',id:'iv-is',label:'I<sub>S</sub>',min:-15,max:-9,step:0.1,value:-14,map:v=>Math.pow(10,v),fmt:v=>si(v,'A',2)},
    {key:'n',id:'iv-n',label:'n',min:1,max:2,step:0.05,value:1,fmt:v=>v.toFixed(2)},
    {key:'VD0',id:'iv-vd0',label:'V<sub>D0</sub>',min:0.4,max:0.8,step:0.01,value:0.65,fmt:v=>v.toFixed(2)+' V'},
    {key:'rD',id:'iv-rd',label:'r<sub>D</sub>',min:1,max:40,step:1,value:8,fmt:v=>v+' Ω'}],upd);
  ['iv-m1','iv-m2','iv-m3','iv-m4'].forEach(id=>document.getElementById(id).addEventListener('change',upd));
  function upd(){const {Is,n,VD0,rD}=st,x0=-0.4,x1=1.0,y0=-2,y1=20,s=[];
    if($('#iv-m1').checked)s.push({c:'t5',w:2.5,pts:[[x0,0],[0,0],[0,40]]});
    if($('#iv-m2').checked)s.push({c:'t4',w:2,pts:[[x0,0],[VD0,0],[VD0,40]]});
    if($('#iv-m3').checked)s.push({c:'t2',w:2,pts:[[x0,0],[VD0,0],[VD0+0.04*rD,40]]});
    if($('#iv-m4').checked){const p=[];for(let i=0;i<=500;i++){const v=x0+(x1-x0)*i/500;p.push([v,Math.min(1e3,Is*(Math.exp(v/(n*VT))-1)*1e3)]);}s.push({c:'t1',w:2.6,pts:p});}
    const V1=n*VT*Math.log(1e-3/Is+1),V10=n*VT*Math.log(1e-2/Is+1);
    draw(cv,{x0,x1,y0,y1,xl:'V_D [V]',yl:'I_D [mA]',series:s,points:$('#iv-m4').checked?[{x:V1,y:1,c:'t1',r:4,label:'1mA'},{x:V10,y:10,c:'t1',r:4,label:'10mA'}]:[]});
    readouts('r-iv',[['V<sub>D</sub> ב-1mA',fx(V1,3)+' V'],['V<sub>D</sub> ב-10mA',fx(V10,3)+' V'],['תוספת מתח לכל פי 10',si(n*VT*Math.LN10,'V')],['r<sub>d</sub> ב-1mA',si(n*VT/1e-3,'Ω')],['r<sub>d</sub> ב-10mA',si(n*VT/1e-2,'Ω')]]);}
  upd();
})();

/* ---- live circuit: exam example ---- */
section(root,{id:'l1-ex',tag:'מעגל חי',title:'דוגמה מהסיכום: מתי הדיודה נדלקת?',short:'מעגל חי',
lead:'המעגל מהסיכום: <span class="m">V<sub>in</sub></span> דרך 20Ω לצומת, ממנו 10Ω, דיודה ומקור 5V לאדמה. <span class="m">V<sub>out</sub></span> נמדד על הצומת. הזז את <span class="m">V<sub>in</sub></span> ועקוב אחרי הזרם.',
body:'<div class="lab"><div class="controls"><div class="seg" id="ex-model"><button type="button" data-v="ideal" aria-pressed="true">דיודה אידיאלית</button><button type="button" data-v="cvd" aria-pressed="false">מודל V<sub>D0</sub>=0.7V</button></div><div class="sliders" id="ex-ctl"></div><div class="presets"><button type="button" data-preset="ex-a">א. 0V</button><button type="button" data-preset="ex-b">ב. 2V</button><button type="button" data-preset="ex-c">ג. 6V</button><button type="button" data-preset="ex-d">ד. 8V</button></div></div>'+
'<div class="scopes">'+circ('cx-ex',lg('t1','זרם (נקודות זזות)','dot')+lg('t4','דיודה מוליכה'))+scope('c-ex','short',lg('t1','V<sub>out</sub>(V<sub>in</sub>)')+lg('t3','נקודה נוכחית','dot'),'אופיין מעבר')+'</div></div><div class="readouts" id="r-ex"></div>'+
notes('<h3>הפתרון, צעד אחר צעד</h3><ol><li>מסמנים <span class="m">V<sub>N</sub> = 5V</span> (קבוע מהסוללה).</li><li>מניחים OFF: אין זרם, ולכן <span class="m">V<sub>P</sub> = V<sub>out</sub> = V<sub>in</sub></span>.</li><li>ההנחה נכונה כל עוד <span class="m">V<sub>in</sub> &lt; 5V</span>. מעבר לזה הדיודה ON.</li><li>ON: <span class="m">I = (V<sub>in</sub> − 5)/30</span> ו-<span class="m">V<sub>out</sub> = 5 + 10·I</span>.</li></ol>',
'<h3>תשובות הדוגמה</h3>'+F('א.','V<sub>in</sub>=0 → OFF → V<sub>out</sub>=0V')+F('ב.','V<sub>in</sub>=2 → OFF → V<sub>out</sub>=2V')+F('ג.','V<sub>in</sub>=6 → ON → I=1/30 A → V<sub>out</sub>=5.33V')+F('ד.','V<sub>in</sub>=8 → ON → I=0.1A → V<sub>out</sub>=6V')+'<p>שים לב לשבירה בגרף ב-5V: השיפוע יורד מ-1 ל-<span class="m">10/30 = 1/3</span>. זה מחלק המתח שנוצר כשהדיודה מוליכה.</p>')});
(function(){
  const C=Circuit('cx-ex',440,240),cv=reg('c-ex');
  C.V([50,185],[50,105],'V_{in}',{side:1,off:30});
  C.w([50,105],[50,50],[90,50]);C.R([90,50],[180,50],'20Ω',{side:-1});C.w([180,50],[330,50]);C.nd(220,50);
  C.R([220,50],[220,110],'10Ω',{side:1});C.D([220,110],[220,150],'D',{id:'d',side:1});C.bat([220,200],[220,165],'5V',{side:1});
  C.w([220,150],[220,165]);C.w([220,200],[220,215]);C.w([50,185],[50,215],[330,215]);C.nd(220,215);
  C.term(330,50).term(330,215);C.T(345,135,'V_{out}','big','start');C.T(345,155,'','val','start',null,'vo');
  C.T(230,32,'','val','middle',null,'vn');C.T(110,130,'','val2','middle',null,'iv');
  C.flow('i',[[50,105],[50,50],[220,50],[220,215],[50,215],[50,185]]);
  const getM=seg('ex-model',()=>upd());
  const st=sliders('ex-ctl',[{key:'V',id:'ex-v',label:'V<sub>in</sub>',min:-4,max:10,step:0.1,value:6,fmt:v=>v.toFixed(1)+' V'}],upd);
  const solve=(V,vd)=>{const on=V>5+vd;const I=on?(V-5-vd)/30:0;return {on,I,Vo:on?5+vd+I*10:V};};
  function upd(){const vd=getM()==='cvd'?0.7:0,s=solve(st.V,vd);
    C.st('d',s.on?'on':'dim');C.I('i',s.on?mag(s.I,0.2):0);
    C.set('vo','= '+s.Vo.toFixed(2)+' V');C.set('vn',s.on?'I = '+(s.I*1000).toFixed(1)+' mA':'I = 0');C.set('iv',st.V.toFixed(1)+' V');
    const pts=[];for(let i=0;i<=200;i++){const v=-4+14*i/200;pts.push([v,solve(v,vd).Vo]);}
    draw(cv,{x0:-4,x1:10,y0:-4,y1:8,xl:'V_in [V]',yl:'V_out [V]',series:[{c:'axis',w:1,dash:[4,4],pts:[[-4,-4],[8,8]]},{c:'t1',w:2.6,pts}],points:[{x:st.V,y:s.Vo,c:'t3',label:s.Vo.toFixed(2)+'V'}]});
    readouts('r-ex',[['מצב הדיודה',s.on?pill('ON · מוליכה','ok'):pill('OFF · קטעון','mute'),'html'],['V<sub>P</sub> / V<sub>N</sub>',(s.on?(5+vd):st.V).toFixed(2)+' / 5.00 V'],['I',si(s.I,'A')],['V<sub>out</sub>',s.Vo.toFixed(3)+' V'],['V<sub>in</sub> שבו הדיודה נדלקת',(5+vd).toFixed(1)+' V']]);}
  presets({'ex-a':{'ex-v':0},'ex-b':{'ex-v':2},'ex-c':{'ex-v':6},'ex-d':{'ex-v':8}});upd();
})();

/* ---- load line ---- */
section(root,{id:'l1-ll',tag:'דיודה מעשית',title:'קו עבודה, נקודת עבודה והתנגדות דינמית',short:'קו עבודה',
lead:'<span class="m">V<sub>DC</sub> + v<sub>d</sub>(t)</span> דרך נגד <span class="m">R</span> אל דיודה מעשית. ה-DC קובע את נקודת העבודה Q. אות AC קטן "מנדנד" את קו העבודה סביב Q, והדיודה מתנהגת כמו נגד <span class="m">r<sub>d</sub></span>.',
body:'<div class="lab"><div class="controls"><div class="sliders" id="ll-ctl"></div></div><div class="scopes">'+scope('c-ll','',lg('t1','אופיין')+lg('t2','קו עבודה')+lg('t2','קצוות AC','dash')+lg('t3','משיק ב-Q','dash'),'קו עבודה')+scope('c-ll2','short',lg('t1','i<sub>D</sub>(t) מדויק')+lg('t3','קירוב אות קטן','dash'),'זרם בזמן')+'</div></div><div class="readouts" id="r-ll"></div>'+
notes('<h3>מה לראות</h3><ul><li>קו העבודה חותך את הצירים ב-<span class="m">V<sub>DC</sub></span> וב-<span class="m">V<sub>DC</sub>/R</span>.</li><li>באמפליטודה קטנה, המדויק והקירוב חופפים. מעל 200mV חצי גל אחד נמתח: <span class="m">e<sup>x</sup> ≈ 1+x</span> כבר לא תקף.</li><li>יותר זרם DC → משיק תלול יותר → <span class="m">r<sub>d</sub></span> קטן.</li></ul>',
'<h3>הפיתוח</h3>'+F('','i<sub>D</sub> = I<sub>D</sub>·exp(v<sub>d</sub>/nV<sub>T</sub>) ≈ I<sub>D</sub>(1 + v<sub>d</sub>/nV<sub>T</sub>)')+F('','r<sub>d</sub> = nV<sub>T</sub>/I<sub>DQ</sub>')+'<p>סדר: (1) DC: מבטלים AC, קבלים נתק, מוצאים Q. (2) AC: מבטלים DC, קבלים קצר, דיודה → <span class="m">r<sub>d</sub></span>. (3) סופרפוזיציה.</p>')});
(function(){
  const cv=reg('c-ll'),cv2=reg('c-ll2');
  const st=sliders('ll-ctl',[
    {key:'VS',id:'ll-vs',label:'V<sub>DC</sub>',min:0.6,max:6,step:0.05,value:2,fmt:v=>v.toFixed(2)+' V'},
    {key:'R',id:'ll-r',label:'R',min:20,max:2000,step:10,value:100,fmt:v=>si(v,'Ω')},
    {key:'va',id:'ll-va',label:'אמפליטודת AC',min:0,max:400,step:5,value:40,map:v=>v/1000,fmt:v=>si(v,'V')},
    {key:'n',id:'ll-n',label:'n',min:1,max:2,step:0.05,value:2,fmt:v=>v.toFixed(2)},
    {key:'Is',id:'ll-is',label:'I<sub>S</sub>',min:-15,max:-7,step:0.1,value:-9,map:v=>Math.pow(10,v),fmt:v=>si(v,'A',2)}],upd);
  function solve(Vs,R,n,Is){if(Vs<=0)return {V:Vs,I:0};const V=bisect(v=>Is*(Math.exp(v/(n*VT))-1)-(Vs-v)/R,-1,Vs);return {V,I:(Vs-V)/R};}
  function upd(){const {VS,R,va,n,Is}=st,q=solve(VS,R,n,Is),rd=n*VT/q.I;
    const x1=Math.max(1,VS+va)*1.05,y1=(VS+va)/R*1e3*1.12,curve=[];
    for(let i=0;i<=400;i++){const v=x1*i/400;curve.push([v,Is*(Math.exp(v/(n*VT))-1)*1e3]);}
    const ll=V=>[[0,V/R*1e3],[V,0]];const series=[{c:'t1',w:2.6,pts:curve},{c:'t2',w:2,pts:ll(VS)}];
    if(va>0)series.push({c:'t2',w:1.4,dash:[5,4],a:.8,pts:ll(VS+va)},{c:'t2',w:1.4,dash:[5,4],a:.8,pts:ll(Math.max(0,VS-va))});
    series.push({c:'t3',w:1.5,dash:[6,4],pts:[[q.V-0.3,(q.I-0.3/rd)*1e3],[q.V+0.3,(q.I+0.3/rd)*1e3]]});
    draw(cv,{x0:0,x1,y0:0,y1,xl:'V_D [V]',yl:'I_D [mA]',series,points:[{x:q.V,y:q.I*1e3,c:'t3',label:'Q ('+q.V.toFixed(2)+'V, '+(q.I*1e3).toFixed(2)+'mA)'}]});
    const ex=[],ap=[];let mx=-1e9,mn=1e9;
    for(let i=0;i<=300;i++){const t=2*i/300,s=Math.sin(2*Math.PI*t),e=solve(VS+va*s,R,n,Is).I*1e3,a=(q.I+va*s/(R+rd))*1e3;ex.push([t,e]);ap.push([t,a]);mx=Math.max(mx,e,a);mn=Math.min(mn,e,a);}
    const pad=Math.max(0.05*q.I*1e3,(mx-mn)*0.15);
    draw(cv2,{x0:0,x1:2,y0:Math.max(0,mn-pad),y1:mx+pad,xl:'t / T',yl:'i_D [mA]',series:[{c:'axis',w:1,dash:[3,4],pts:[[0,q.I*1e3],[2,q.I*1e3]]},{c:'t1',w:2.4,pts:ex},{c:'t3',w:1.8,dash:[6,4],pts:ap}]});
    const ipk=va/(R+rd),up=(mx-q.I*1e3)/1e3,dn=(q.I*1e3-mn)/1e3,err=ipk>0?Math.abs(up-dn)/(up+dn)*100:0;
    readouts('r-ll',[['V<sub>DQ</sub>',fx(q.V,3)+' V'],['I<sub>DQ</sub>',si(q.I,'A')],['r<sub>d</sub>',si(rd,'Ω')],['i<sub>d,peak</sub> = v<sub>d</sub>/(R+r<sub>d</sub>)',si(ipk,'A')],
      ['עיוות',ipk>0?(err<3?pill(err.toFixed(1)+'% · אות קטן','ok'):err<10?pill(err.toFixed(1)+'% · גבולי','warn'):pill(err.toFixed(1)+'% · אות גדול','bad')):pill('אין AC','mute'),'html']]);}
  upd();
})();

/* ---- clipper live ---- */
section(root,{id:'l1-clip',tag:'שאלות מבחן',title:'מעגל קטימה חי ואופיין מעבר (VTC)',short:'קטימה',
lead:'<span class="m">v<sub>in</sub></span> דרך R=1kΩ לצומת המוצא. D1 אל <span class="m">+V<sub>1</sub></span> קוטמת למעלה, D2 מ-<span class="m">−V<sub>2</sub></span> קוטמת למטה, ו-<span class="m">R<sub>L</sub></span> הוא העומס. הכניסה משתנה לאט בזמן, כדי שתראה מי מוליך בכל רגע.',
body:'<div class="lab"><div class="controls"><div class="checks"><label><input type="checkbox" id="cl-d1" checked> D1</label><label><input type="checkbox" id="cl-d2" checked> D2</label></div><div class="sliders" id="cl-ctl"></div></div>'+
'<div class="scopes">'+circ('cx-cl',lg('t1','זרם','dot')+lg('t4','דיודה מוליכה'),true)+scope('c-cl2','short',lg('t2','v<sub>in</sub>(t)')+lg('t1','v<sub>out</sub>(t)'),'זמן')+scope('c-cl','short',lg('t1','VTC')+lg('t3','נקודות מפנה','dot'),'VTC')+'</div></div><div class="readouts" id="r-cl"></div>'+
notes('<h3>השיטה</h3><ol><li>לכל דיודה מסמנים <span class="m">V<sub>P</sub></span> ו-<span class="m">V<sub>N</sub></span>: אחד ידוע (המקור) והשני תלוי במוצא.</li><li>כל הדיודות OFF: מחלק מתח, <span class="m">v<sub>out</sub> = k·v<sub>in</sub></span>, <span class="m">k = R<sub>L</sub>/(R+R<sub>L</sub>)</span>.</li><li>D1 נדלקת כש-<span class="m">k·v<sub>in</sub> = V<sub>1</sub>+V<sub>D0</sub></span>. משם המוצא "נתפס".</li><li>כל נקודת מפנה פותחת תחום חדש עם מעגל שקול חדש.</li></ol>',
'<h3>הקשרים לפי תחום</h3><div id="cl-eqs"></div>')});
(function(){
  const C=Circuit('cx-cl',460,250),cv=reg('c-cl'),cv2=reg('c-cl2'),R=1000,f0=0.22;
  C.V([40,195],[40,115],'v_{in}',{kind:'ac',side:1,off:30});C.w([40,115],[40,60],[70,60]);C.R([70,60],[150,60],'R',{side:-1});C.w([150,60],[400,60]);C.nd(190,60).nd(270,60).nd(350,60);
  C.w([190,60],[190,80]);C.D([190,80],[190,130],'D1',{id:'d1',side:-1});C.w([190,130],[190,145]);C.bat([190,180],[190,145],'V_1',{side:-1});C.w([190,180],[190,215]);
  C.w([270,60],[270,80]);C.D([270,130],[270,80],'D2',{id:'d2',side:-1});C.w([270,130],[270,145]);C.bat([270,145],[270,180],'V_2',{side:-1});C.w([270,180],[270,215]);
  C.R([350,60],[350,215],'R_L',{side:-1,id:'rl'});C.w([40,195],[40,215],[400,215]);C.nd(190,215).nd(270,215).nd(350,215);C.term(400,60).term(400,215);
  C.T(412,130,'v_{out}','big','start');C.T(412,150,'','val','start',null,'vo');C.T(95,140,'','val2','middle',null,'vi');
  C.flow('r',[[40,115],[40,60],[190,60]]);C.flow('d1',[[190,60],[190,215]]);C.flow('d2',[[270,215],[270,60]]);C.flow('rl',[[270,60],[350,60],[350,215]]);C.flow('g',[[350,215],[40,215],[40,195]]);C.flow('m',[[190,60],[270,60]]);
  C.bindPlay();
  const st=sliders('cl-ctl',[
    {key:'V1',id:'cl-v1',label:'+V<sub>1</sub>',min:0,max:10,step:0.5,value:3,fmt:v=>v.toFixed(1)+' V'},
    {key:'V2',id:'cl-v2',label:'−V<sub>2</sub>',min:0,max:10,step:0.5,value:5,fmt:v=>'−'+v.toFixed(1)+' V'},
    {key:'VD0',id:'cl-vd',label:'V<sub>D0</sub>',min:0,max:0.8,step:0.05,value:0.7,fmt:v=>v.toFixed(2)+' V'},
    {key:'RL',id:'cl-rl',label:'R<sub>L</sub>',min:1,max:51,step:1,value:51,map:v=>v>=51?Infinity:v*1000,fmt:v=>si(v,'Ω')},
    {key:'A',id:'cl-a',label:'אמפליטודת כניסה',min:1,max:15,step:0.5,value:10,fmt:v=>v.toFixed(1)+' V'}],upd);
  ['cl-d1','cl-d2'].forEach(id=>document.getElementById(id).addEventListener('change',upd));
  let k=1,up=0,lo=0,d1=true,d2=true;const f=v=>{let o=k*v;if(d1&&o>up)o=up;if(d2&&o<lo)o=lo;return o;};
  let tin=[],tout=[];
  function timePlot(ph){draw(cv2,{x0:0,x1:2,y0:-15,y1:15,xl:'t / T',yl:'[V]',cursor:ph,series:[{c:'t2',w:1.6,a:.8,pts:tin},{c:'t1',w:2.6,pts:tout}]});}
  C.tick=(t)=>{const ph=(t*f0)%2,vin=st.A*Math.sin(2*Math.PI*ph),vo=f(vin),iR=(vin-vo)/R,iL=isFinite(st.RL)?vo/st.RL:0;
    const on1=d1&&k*vin>up,on2=d2&&k*vin<lo,Im=st.A/R;
    C.st('d1',on1?'on':'dim');C.st('d2',on2?'on':'dim');
    C.I('r',Math.abs(iR)/Im,Math.sign(iR)||1);C.I('m',Math.abs(iR-(on1?iR-iL:0))/Im,Math.sign(iR-(on1?iR-iL:0))||1);
    C.I('d1',on1?Math.abs(iR-iL)/Im:0);C.I('d2',on2?Math.abs(iL-iR)/Im:0);C.I('rl',Math.abs(iL)/Im,Math.sign(iL)||1);C.I('g',Math.abs(iR)/Im,Math.sign(iR)||1);
    C.set('vo',fx(vo,2)+' V');C.set('vi',fx(vin,2)+' V');timePlot(ph);};
  function upd(){const {V1,V2,VD0,RL,A}=st;d1=$('#cl-d1').checked;d2=$('#cl-d2').checked;k=isFinite(RL)?RL/(R+RL):1;up=V1+VD0;lo=-(V2+VD0);
    C.st('rl',isFinite(RL)?null:'dim');
    const L=15,vtc=[];for(let i=0;i<=600;i++){const v=-L+2*L*i/600;vtc.push([v,f(v)]);}
    const pts=[];if(d1&&up/k<=L)pts.push({x:up/k,y:up,c:'t3',label:'('+fx(up/k,2)+', '+fx(up,2)+')'});if(d2&&lo/k>=-L)pts.push({x:lo/k,y:lo,c:'t3',label:'('+fx(lo/k,2)+', '+fx(lo,2)+')'});
    draw(cv,{x0:-L,x1:L,y0:-L,y1:L,xl:'v_in [V]',yl:'v_out [V]',bands:[{x0:-A,x1:A,c:'t2',a:.07}],series:[{c:'axis',w:1.2,dash:[5,5],pts:[[-L,-L],[L,L]]},{c:'t1',w:2.8,pts:vtc}],points:pts});
    tin=[];tout=[];for(let i=0;i<=400;i++){const t=2*i/400,v=A*Math.sin(2*Math.PI*t);tin.push([t,v]);tout.push([t,f(v)]);}
    const kf=k.toFixed(3);
    $('#cl-eqs').innerHTML=(d1?F('D1 מוליכה:','v<sub>in</sub> &gt; '+fx(up/k,2)+' V → v<sub>out</sub> = V<sub>1</sub>+V<sub>D0</sub> = '+fx(up,2)+' V'):'')+F('שתיהן בקטעון:','v<sub>out</sub> = '+(k===1?'v<sub>in</sub>':kf+'·v<sub>in</sub>'))+(d2?F('D2 מוליכה:','v<sub>in</sub> &lt; '+fx(lo/k,2)+' V → v<sub>out</sub> = −(V<sub>2</sub>+V<sub>D0</sub>) = '+fx(lo,2)+' V'):'');
    readouts('r-cl',[['שיפוע בתחום המעבר k',kf],['מפנה עליון (v<sub>in</sub>)',d1?fx(up/k,2)+' V':'—'],['מפנה תחתון (v<sub>in</sub>)',d2?fx(lo/k,2)+' V':'—'],['v<sub>out</sub> מקס׳ / מינ׳',fx(f(A),2)+' / '+fx(f(-A),2)+' V']]);
    C.tick(C.t);}
  upd();
})();

/* ---- zener ---- */
section(root,{id:'l1-zen',tag:'דיודת זנר',title:'זנר כמייצב מתח: לאן הולך הזרם?',short:'זנר',
lead:'<span class="m">V<sub>S</sub></span> ← R ← צומת המוצא, ובו זנר בממתח אחורי במקביל ל-<span class="m">R<sub>L</sub></span>. הזנר "בולע" את עודף הזרם כדי שהמתח על העומס יישאר קרוב ל-<span class="m">V<sub>Z0</sub></span>, בתנאי ש-<span class="m">I<sub>Z,min</sub> ≤ I<sub>Z</sub> ≤ I<sub>Z,max</sub></span>.',
body:'<div class="lab"><div class="controls"><div class="presets"><button type="button" data-preset="zen-ex">הדוגמה מהסיכום (R=1kΩ)</button><button type="button" data-preset="zen-rmin">R = R<sub>min</sub> ≈ 714Ω</button></div><div class="checks"><label><input type="checkbox" id="zn-open"> ללא עומס</label></div><div class="sliders" id="zn-ctl"></div></div>'+
'<div class="scopes">'+circ('cx-zn',lg('t1','זרם','dot')+lg('t4','זנר בפריצה'))+scope('c-zn','short',lg('t1','V<sub>out</sub>(V<sub>S</sub>)')+lg('ok','תחום תקין'),'ייצוב')+scope('c-zn2','short',lg('t2','I<sub>Z</sub>(V<sub>S</sub>)')+lg('t4','I<sub>Z,min</sub>','dash')+lg('bad','I<sub>Z,max</sub>','dash'),'זרם זנר')+'</div></div><div class="readouts" id="r-zn"></div>'+
notes('<h3>מה לראות</h3><ul><li>מתחת ל-<span class="m">V<sub>S,min</sub></span> הזנר כבוי והמוצא עוקב אחרי הכניסה. מעליו העקומה שטוחה: ייצוב.</li><li>הגדל <span class="m">r<sub>z</sub></span>: השיפוע בתחום הייצוב הוא מקדם העברת הגלית.</li><li>נתק את העומס: כל הזרם עובר בזנר. זה המקרה המסוכן מבחינת הספק.</li></ul>',
'<h3>נוסחאות</h3>'+F('','V<sub>Z</sub> = V<sub>Z0</sub> + r<sub>z</sub>I<sub>Z</sub>')+F('','P<sub>Z,max</sub> ≈ V<sub>Z0</sub>·I<sub>Z,max</sub>')+F('','R<sub>max</sub> = (V<sub>S</sub>−V<sub>Z</sub>)/(I<sub>Z,min</sub>+I<sub>L</sub>)')+F('','R<sub>min</sub> = (V<sub>S</sub>−V<sub>Z</sub>)/(I<sub>Z,max</sub>+I<sub>L</sub>)')+F('','ΔV<sub>out</sub> = ΔV<sub>S</sub>·(r<sub>z</sub>‖R<sub>L</sub>)/(r<sub>z</sub>‖R<sub>L</sub>+R)'))});
(function(){
  const C=Circuit('cx-zn',420,230),cv=reg('c-zn'),cv2=reg('c-zn2');
  C.V([50,180],[50,100],'V_S',{side:1,off:30});C.w([50,100],[50,50],[80,50]);C.R([80,50],[170,50],'R',{side:-1});C.w([170,50],[370,50]);C.nd(220,50).nd(320,50);
  C.w([220,50],[220,75]);C.D([220,155],[220,75],'D_Z',{zener:true,id:'z',side:-1});C.w([220,155],[220,200]);
  C.R([320,50],[320,200],'R_L',{side:-1,id:'rl'});C.w([50,180],[50,200],[370,200]);C.nd(220,200).nd(320,200);C.term(370,50).term(370,200);
  C.T(120,32,'','val','middle',null,'i');C.T(232,120,'','val','start',null,'iz');C.T(332,85,'','val','start',null,'il');C.T(380,130,'','val2','start',null,'vo');
  C.flow('i',[[50,100],[50,50],[220,50]]);C.flow('z',[[220,50],[220,200]]);C.flow('l',[[220,50],[320,50],[320,200]]);C.flow('r1',[[320,200],[220,200]]);C.flow('r2',[[220,200],[50,200],[50,180]]);
  const st=sliders('zn-ctl',[
    {key:'VS',id:'zn-vs',label:'V<sub>S</sub>',min:0,max:40,step:0.5,value:22.5,fmt:v=>v.toFixed(1)+' V'},
    {key:'R',id:'zn-r',label:'R',min:100,max:3000,step:10,value:900,fmt:v=>si(v,'Ω')},
    {key:'RL',id:'zn-rl',label:'R<sub>L</sub>',min:200,max:10000,step:50,value:2500,fmt:v=>si(v,'Ω')},
    {key:'VZ',id:'zn-vz',label:'V<sub>Z0</sub>',min:3,max:15,step:0.1,value:7.5,fmt:v=>v.toFixed(1)+' V'},
    {key:'rz',id:'zn-rz',label:'r<sub>z</sub>',min:0,max:40,step:1,value:0,fmt:v=>v+' Ω'},
    {key:'Izmin',id:'zn-izmin',label:'I<sub>Z,min</sub>',min:1,max:20,step:0.5,value:12,map:v=>v/1000,fmt:v=>si(v,'A')},
    {key:'Pz',id:'zn-pz',label:'P<sub>Z,max</sub>',min:50,max:1000,step:5,value:135,map:v=>v/1000,fmt:v=>si(v,'W')}],upd);
  $('#zn-open').addEventListener('change',upd);
  function calc(VS,R,RL,VZ,rz){const Voc=isFinite(RL)?VS*RL/(R+RL):VS;
    if(Voc<=VZ){const IL=isFinite(RL)?Voc/RL:0;return {Vo:Voc,IZ:0,IL,I:IL,on:false};}
    const Vo=rz===0?VZ:(VS/R+VZ/rz)/(1/R+1/rz+(isFinite(RL)?1/RL:0));const IL=isFinite(RL)?Vo/RL:0,I=(VS-Vo)/R;return {Vo,IZ:I-IL,IL,I,on:true};}
  function upd(){const {VS,R,VZ,rz,Izmin,Pz}=st,RL=$('#zn-open').checked?Infinity:st.RL;document.getElementById('zn-rl').disabled=!isFinite(RL);
    const IZmax=Pz/VZ,c=calc(VS,R,RL,VZ,rz),IL0=isFinite(RL)?VZ/RL:0,VSmin=VZ+R*(Izmin+IL0),VSmax=VZ+R*(IZmax+IL0);
    const sw=[],iz=[];let ym=0;for(let i=0;i<=400;i++){const v=40*i/400,r=calc(v,R,RL,VZ,rz);sw.push([v,r.Vo]);iz.push([v,r.IZ*1e3]);ym=Math.max(ym,r.IZ*1e3);}
    draw(cv,{x0:0,x1:40,y0:0,y1:Math.max(VZ*1.5,5),xl:'V_S [V]',yl:'V_out [V]',bands:[{x0:VSmin,x1:VSmax,c:'ok',a:.16}],series:[{c:'axis',w:1,dash:[4,4],pts:[[0,VZ],[40,VZ]]},{c:'t1',w:2.6,pts:sw}],points:[{x:VS,y:c.Vo,c:'t3',label:fx(c.Vo,2)+' V'}]});
    draw(cv2,{x0:0,x1:40,y0:0,y1:Math.max(IZmax*1e3*1.25,ym*1.05,5),xl:'V_S [V]',yl:'I_Z [mA]',bands:[{x0:VSmin,x1:VSmax,c:'ok',a:.16}],series:[{c:'t4',w:1.4,dash:[5,4],pts:[[0,Izmin*1e3],[40,Izmin*1e3]]},{c:'bad',w:1.4,dash:[5,4],pts:[[0,IZmax*1e3],[40,IZmax*1e3]]},{c:'t2',w:2.5,pts:iz}],points:[{x:VS,y:c.IZ*1e3,c:'t3',label:(c.IZ*1e3).toFixed(1)+' mA'}]});
    const Im=0.05;C.st('z',c.on?'on':'dim');C.st('rl',isFinite(RL)?null:'dim');C.I('i',mag(c.I,Im));C.I('z',mag(c.IZ,Im));C.I('l',mag(c.IL,Im));C.I('r1',mag(c.IL,Im));C.I('r2',mag(c.I,Im));
    C.set('i','I = '+(c.I*1e3).toFixed(1)+' mA');C.set('iz','I_Z = '+(c.IZ*1e3).toFixed(1)+' mA');C.set('il','I_L = '+(c.IL*1e3).toFixed(1)+' mA');C.set('vo',fx(c.Vo,2)+' V');
    let s;if(!c.on)s=pill('הזנר כבוי','bad');else if(c.IZ<Izmin-1e-9)s=pill('I<sub>Z</sub> &lt; I<sub>Z,min</sub>','warn');else if(c.IZ>IZmax+1e-9)s=pill('חריגת הספק','bad');else s=pill('מייצב תקין','ok');
    const Rmax=(VS-VZ)/(Izmin+IL0),Rmin=(VS-VZ)/(IZmax+IL0),kz=rz===0?0:(isFinite(RL)?rz*RL/(rz+RL):rz),rip=kz/(kz+R);
    readouts('r-zn',[['מצב',s,'html'],['V<sub>out</sub>',fx(c.Vo,3)+' V'],['I / I<sub>Z</sub> / I<sub>L</sub>',(c.I*1e3).toFixed(1)+' / '+(c.IZ*1e3).toFixed(1)+' / '+(c.IL*1e3).toFixed(1)+' mA'],['P<sub>Z</sub>',si(Math.max(0,c.IZ)*c.Vo,'W')],['I<sub>Z,max</sub>',si(IZmax,'A')],
      ['R<sub>min</sub> … R<sub>max</sub>',VS>VZ?si(Rmin,'Ω')+' … '+si(Rmax,'Ω'):'—'],['תחום V<sub>S</sub> תקין',fx(VSmin,1)+' … '+fx(VSmax,1)+' V'],['ΔV<sub>out</sub> ל-±1V',c.on?'± '+si(rip,'V'):'—']]);}
  presets({'zen-ex':{'zn-open':false,'zn-vs':22.5,'zn-r':1000,'zn-rl':2500,'zn-vz':7.5,'zn-rz':0,'zn-izmin':12,'zn-pz':135},'zen-rmin':{'zn-open':false,'zn-vs':22.5,'zn-r':714,'zn-rl':2500,'zn-vz':7.5,'zn-rz':0,'zn-izmin':12,'zn-pz':135}});upd();
})();
},
quiz:[
{q:'דיודה אידיאלית מחוברת כך ש-V<sub>P</sub> = 3V ו-V<sub>N</sub> = 5V. מה מצבה?',o:['מוליכה (קצר)','קטעון (נתק)','מוליכה עם מפל 0.7V','תלוי בנגד בטור'],a:1,e:'V<sub>P</sub> &lt; V<sub>N</sub> פירושו ממתח אחורי. דיודה אידיאלית בממתח אחורי היא נתק, ו-I<sub>D</sub>=0.'},
{q:'בדוגמה מהסיכום (20Ω, 10Ω, דיודה ו-5V), מה V<sub>out</sub> כאשר V<sub>in</sub> = 8V?',o:['8V','5V','6V','5.33V'],a:2,e:'הדיודה ON: I = (8−5)/30 = 0.1A, ולכן V<sub>out</sub> = 5 + 0.1·10 = 6V.'},
{q:'דיודה מעשית עם n=2 מוטית בזרם I<sub>DQ</sub> = 2mA. מה ההתנגדות הדינמית r<sub>d</sub>?',o:['12.5Ω','25Ω','50Ω','1kΩ'],a:1,e:'r<sub>d</sub> = nV<sub>T</sub>/I<sub>DQ</sub> = 2·25mV / 2mA = 25Ω.'},
{q:'בניתוח AC (אות קטן) של מעגל עם דיודה, מה עושים עם מקור DC ועם קבלי צימוד?',o:['DC קצר, קבלים נתק','מבטלים את מקור ה-DC (קצר למקור מתח) וקבלי הצימוד הם קצר','משאירים הכל כמו שהוא','DC נתק, קבלים נתק'],a:1,e:'באות קטן מקור מתח DC מתאפס (הופך לקצר), וקבלי צימוד גדולים הם קצר בתדר האות. הדיודה מוחלפת ב-r<sub>d</sub>.'},
{q:'בדוגמת הזנר (V<sub>S</sub>=22.5V, V<sub>Z</sub>=7.5V, R<sub>L</sub>=2.5kΩ, I<sub>Z,min</sub>=12mA). מהו R<sub>max</sub>?',o:['1kΩ','714Ω','2.5kΩ','500Ω'],a:0,e:'I<sub>L</sub> = 7.5/2.5k = 3mA. R<sub>max</sub> = (22.5−7.5)/(12m+3m) = 15/15m = 1kΩ.'},
{q:'מה קורה לזרם הזנר אם מנתקים את העומס במעגל מייצב?',o:['הוא יורד לאפס','הוא לא משתנה','הוא גדל, כי כל הזרם דרך R עובר בזנר','הזנר עובר לממתח קדמי'],a:2,e:'לפי KCL, I = I<sub>Z</sub> + I<sub>L</sub>. כש-I<sub>L</sub>=0, כל הזרם עובר בזנר, ולכן זה המקרה שבו בודקים את P<sub>Z,max</sub>.'},
{q:'במעגל קטימה (R בטור, דיודה במוצא אל +V<sub>1</sub>, ללא עומס), מהו מתח המוצא המקסימלי?',o:['V<sub>1</sub>','V<sub>1</sub> + V<sub>D0</sub>','v<sub>in</sub>','V<sub>1</sub> − V<sub>D0</sub>'],a:1,e:'הדיודה נדלקת כש-V<sub>P</sub> − V<sub>N</sub> = V<sub>D0</sub>. V<sub>N</sub> = V<sub>1</sub>, ולכן המוצא נתפס על V<sub>1</sub> + V<sub>D0</sub>.'}
],
formulas:[
['משוואת הדיודה','I<sub>D</sub> = I<sub>S</sub>(e<sup>V<sub>D</sub>/nV<sub>T</sub></sup> − 1), V<sub>T</sub> ≈ 25mV'],
['קדמי','I<sub>D</sub> ≈ I<sub>S</sub>·exp(V<sub>D</sub>/nV<sub>T</sub>)'],
['מודל שלישי','i<sub>D</sub> = (v<sub>D</sub> − V<sub>D0</sub>)/r<sub>D</sub> עבור v<sub>D</sub> &gt; V<sub>D0</sub>'],
['קו עבודה','I<sub>D</sub> = (V<sub>DC</sub> − V<sub>D</sub>)/R'],
['התנגדות דינמית','r<sub>d</sub> = nV<sub>T</sub>/I<sub>DQ</sub>'],
['אות קטן','i<sub>d</sub>(t) = v<sub>d</sub>(t)/r<sub>d</sub>'],
['זנר','V<sub>Z</sub> = V<sub>Z0</sub> + r<sub>z</sub>I<sub>Z</sub>'],
['הספק זנר','P<sub>Z,max</sub> = I<sub>Z,max</sub>V<sub>Z,max</sub> ≈ V<sub>Z0</sub>I<sub>Z,max</sub>'],
['R מקסימלי (זנר)','R<sub>max</sub> = (V<sub>S</sub>−V<sub>Z</sub>)/(I<sub>Z,min</sub>+I<sub>L</sub>)'],
['R מינימלי (זנר)','R<sub>min</sub> = (V<sub>S</sub>−V<sub>Z</sub>)/(I<sub>Z,max</sub>+I<sub>L</sub>)'],
['מוצא זנר','V<sub>out</sub> = V<sub>Z0</sub>·(R‖R<sub>L</sub>)/(r<sub>z</sub>+R‖R<sub>L</sub>) + V<sub>S</sub>·(r<sub>z</sub>‖R<sub>L</sub>)/(R+r<sub>z</sub>‖R<sub>L</sub>)'],
['גלית זנר','ΔV<sub>out</sub> = ΔV<sub>S</sub>(r<sub>z</sub>‖R<sub>L</sub>)/(r<sub>z</sub>‖R<sub>L</sub>+R)']
]};

/* =================== LESSON 2: RECTIFIERS =================== */
LESSONS[2]={title:'מיישרי גל',sub:'שנאי, חצי גל, סנף מרכזי, גשר, קבל סינון ו-PIV',topics:'3 מעגלים חיים',
intro:'ספק כוח הופך 220V AC ל-DC יציב: שנאי מוריד מתח, דיודות מיישרות, קבל מסנן ומייצב מחליק. כאן תראה בדיוק באיזה מסלול הזרם עובר בכל חצי מחזור, ולמה הקבל מתפרק בין השיאים.',
build(root){
section(root,{id:'l2-tr',tag:'שנאי',title:'שנאי: יחס ליפופים ומתח שיא',short:'שנאי',
lead:'שנאי אידיאלי: מקדם צימוד 1, בלי הפסדים (<span class="m">P<sub>in</sub> = P<sub>out</sub></span>). מקדם ההשנאה <span class="m">a = N<sub>P</sub>/N<sub>S</sub> = V<sub>P</sub>/V<sub>S</sub> = I<sub>S</sub>/I<sub>P</sub></span>. שים לב: הרשת נותנת ערך יעיל (RMS), והמיישר "רואה" את ערך השיא.',
body:'<div class="lab"><div class="controls"><div class="sliders" id="tr-ctl"></div><div class="presets"><button type="button" data-preset="tr-ex">דוגמה: 220Vrms, 10:1</button><button type="button" data-preset="tr-ex2">110Vrms, a=10</button></div></div><div class="scopes">'+scope('c-tr','short',lg('t2','v<sub>P</sub>(t) ÷ a (לתצוגה)','dash')+lg('t1','v<sub>S</sub>(t)'),'שנאי')+'</div></div><div class="readouts" id="r-tr"></div>'+
notes('<h3>שים לב</h3><ul><li>לפעמים נתון <span class="m">N<sub>2</sub>/N<sub>1</sub></span> (היחס ההפוך). קרא בזהירות!</li><li>בשנאי עם סנף מרכזי, כל חצי של המשני מקבל <span class="m">V<sub>S</sub></span>, והקצוות הפוכים בפאזה.</li></ul>','<h3>נוסחאות</h3>'+F('','a = N<sub>1</sub>/N<sub>2</sub> = V<sub>P</sub>/V<sub>S</sub>')+F('','V<sub>S,peak</sub> = √2·V<sub>S,rms</sub>')+F('דוגמה:','220/10 = 22Vrms → 31.11V שיא'))});
(function(){
  const cv=reg('c-tr');
  const st=sliders('tr-ctl',[{key:'Vp',id:'tr-vp',label:'V<sub>P,rms</sub>',min:50,max:240,step:10,value:220,fmt:v=>v+' Vrms'},{key:'a',id:'tr-a',label:'a = N<sub>1</sub>/N<sub>2</sub>',min:1,max:30,step:0.5,value:10,fmt:v=>v.toFixed(1)}],upd);
  function upd(){const Vs=st.Vp/st.a,pk=Vs*Math.SQRT2,p1=[],p2=[];
    for(let i=0;i<=300;i++){const t=40*i/300,s=Math.sin(2*Math.PI*50*t/1000);p1.push([t,st.Vp*Math.SQRT2/st.a*s]);p2.push([t,pk*s]);}
    draw(cv,{x0:0,x1:40,y0:-pk*1.2,y1:pk*1.2,xl:'t [ms]',yl:'[V]',series:[{c:'t2',w:1.5,dash:[5,4],pts:p1},{c:'t1',w:2.4,pts:p2}]});
    readouts('r-tr',[['V<sub>S,rms</sub>',Vs.toFixed(2)+' V'],['V<sub>S,peak</sub>',pk.toFixed(2)+' V'],['V<sub>P,peak</sub>',(st.Vp*Math.SQRT2).toFixed(1)+' V'],['N<sub>2</sub>/N<sub>1</sub>',(1/st.a).toFixed(3)]]);}
  presets({'tr-ex':{'tr-vp':220,'tr-a':10},'tr-ex2':{'tr-vp':110,'tr-a':10}});upd();
})();

section(root,{id:'l2-live',tag:'מעגל חי',title:'איך הזרם עובר במיישר, רגע אחר רגע',short:'מיישר חי',
lead:'בחר סוג מיישר. הכניסה מסתובבת לאט (הילוך איטי של 50Hz), כך שרואים אילו דיודות מוליכות בכל חצי מחזור, ואיך הקבל מספק את זרם העומס כשהדיודות כבויות. הקו המקווקו האנכי בסקופ מסמן את הרגע הנוכחי.',
body:'<div class="lab"><div class="controls"><div class="seg" id="rc-type"><button type="button" data-v="half" aria-pressed="false">חצי גל</button><button type="button" data-v="ct" aria-pressed="false">סנף מרכזי</button><button type="button" data-v="br" aria-pressed="true">גשר</button></div><div class="sliders" id="rc-ctl"></div><div class="presets"><button type="button" data-preset="rc-noc">בלי קבל</button><button type="button" data-preset="rc-c">עם קבל 220µF</button></div></div>'+
'<div class="scopes"><div id="rc-hosts">'+circ('cx-half',lg('t1','זרם','dot')+lg('t4','דיודה מוליכה'),true)+circ('cx-ct',lg('t1','זרם','dot')+lg('t4','דיודה מוליכה'),true)+circ('cx-br',lg('t1','זרם','dot')+lg('t4','דיודות מוליכות'),true)+'</div>'+
scope('c-rc','short',lg('t2','v<sub>S</sub>(t)','dash')+lg('t1','v<sub>out</sub>(t)')+lg('t5','V<sub>DC</sub>','dash'),'מתחים')+scope('c-rc2','short',lg('t3','i<sub>D</sub>(t)')+lg('t4','i<sub>L</sub>(t)'),'זרמים')+'</div></div><div class="readouts" id="r-rc"></div>'+
notes('<h3>מה לראות</h3><ul><li><b>גשר:</b> בחצי החיובי D1 ו-D3 מוליכות, ובשלילי D2 ו-D4. בשני המקרים הזרם עובר ב-R<sub>L</sub> באותו כיוון! זה כל הרעיון של יישור גל שלם. בכל מסלול יש שתי דיודות, ולכן יורדים <span class="m">2V<sub>D</sub></span>.</li><li><b>סנף מרכזי:</b> כל חצי ליפוף עובד חצי מחזור. דיודה אחת במסלול, אבל ה-PIV כפול.</li><li><b>עם קבל:</b> הדיודות מוליכות רק בחלון קצר ליד השיא. בשאר הזמן הקבל מזרים את זרם העומס (שים לב לכיוון הזרם בקבל). זרם השיא בדיודה גדול בהרבה מ-<span class="m">I<sub>L</sub></span>.</li></ul>',
'<h3>נוסחאות</h3>'+F('חצי גל:','V<sub>DC</sub>=V<sub>O,P</sub>/π · V<sub>RMS</sub>=V<sub>O,P</sub>/2 · PIV=V<sub>S</sub>')+F('סנף מרכזי:','V<sub>O,P</sub>=V<sub>S</sub>−V<sub>D</sub> · PIV=2V<sub>S</sub>−V<sub>D</sub>')+F('גשר:','V<sub>O,P</sub>=V<sub>S</sub>−2V<sub>D</sub> · PIV=V<sub>S</sub>−V<sub>D</sub>')+F('גל שלם:','V<sub>DC</sub>=2V<sub>O,P</sub>/π · V<sub>RMS</sub>=V<sub>O,P</sub>/√2')+F('גלית:','V<sub>r</sub>=V<sub>O,P</sub>/(2fRC) (חצי גל: /fRC)')+F('עם קבל:','V<sub>DC</sub>=V<sub>O,P</sub>−V<sub>r</sub>/2')+F('זרם שיא:','i<sub>D,max</sub>=I<sub>L</sub>(1+2π√(V<sub>P</sub>/2V<sub>r</sub>))')+F('תנאי:','RC ≫ T'))});
(function(){
  const f=50,T=1/f,N=400,fAnim=0.18;
  const C={};
  // half wave
  let c=Circuit('cx-half',440,230);C.half=c;
  c.V([50,160],[50,80],'v_S',{kind:'ac',side:1,off:30});c.w([50,80],[50,50],[100,50]);c.D([100,50],[190,50],'D',{id:'d1',side:-1});c.w([190,50],[350,50]);c.nd(270,50);
  c.Cap([270,50],[270,190],'C',{id:'cap',side:-1});c.R([350,50],[350,190],'R_L',{side:-1});c.w([50,160],[50,190],[350,190]);c.nd(270,190);
  c.flow('d',[[50,80],[50,50],[270,50]]);c.flow('c',[[270,50],[270,190]]);c.flow('l',[[270,50],[350,50],[350,190],[270,190]]);c.flow('r',[[270,190],[50,190],[50,160]]);
  c.T(395,120,'','val','start',null,'vo');
  // center tap
  c=Circuit('cx-ct',440,250);C.ct=c;
  c.V([60,125],[60,55],'v_S',{kind:'ac',side:1,off:28});c.V([60,195],[60,125],'v_S',{kind:'ac',side:1,off:28});c.w([60,125],[100,125]);c.G(100,125);c.nd(60,125);
  c.w([60,55],[60,30],[100,30]);c.D([100,30],[180,30],'D1',{id:'d1',side:-1});c.w([180,30],[380,30]);
  c.w([60,195],[60,222],[100,222]);c.D([100,222],[180,222],'D2',{id:'d2',side:1});c.w([180,222],[230,222],[230,30]);c.nd(230,30);c.nd(290,30);
  c.Cap([290,30],[290,140],'C',{id:'cap',side:-1});c.G(290,140);c.R([380,30],[380,140],'R_L',{side:-1});c.G(380,140);
  c.flow('d1',[[60,55],[60,30],[290,30]]);c.flow('d2',[[60,195],[60,222],[230,222],[230,30],[290,30]]);c.flow('c',[[290,30],[290,140]]);c.flow('l',[[290,30],[380,30],[380,140]]);
  c.flow('g1',[[100,145],[100,125],[60,125]]);
  c.T(395,90,'','val','start',null,'vo');c.T(150,125,'סנף מרכזי','he','start');
  // bridge
  c=Circuit('cx-br',440,240);C.br=c;
  const top=[200,40],bot=[200,200],lft=[140,120],rgt=[260,120];
  c.V([40,155],[40,85],'v_S',{kind:'ac',side:1,off:26});c.w([40,85],[40,40],top);c.w([40,155],[40,200],bot);
  c.D(lft,top,'D4',{id:'d4',side:1});c.D(top,rgt,'D1',{id:'d1',side:-1});c.D(bot,rgt,'D2',{id:'d2',side:1});c.D(lft,bot,'D3',{id:'d3',side:-1});
  c.w(rgt,[300,120],[300,60],[400,60]);c.nd(330,60);c.Cap([330,60],[330,210],'C',{id:'cap',side:1,off:18});c.R([400,60],[400,210],'R_L',{side:-1});c.w([400,210],[110,210],[110,120],lft);c.nd(330,210);
  c.nd(...top).nd(...bot).nd(...lft).nd(...rgt);
  c.flow('p',[[40,85],[40,40],top,rgt,[300,120],[300,60],[330,60]]);c.flow('pr',[[330,210],[110,210],[110,120],lft,bot,[40,200],[40,155]]);
  c.flow('n',[[40,155],[40,200],bot,rgt,[300,120],[300,60],[330,60]]);c.flow('nr',[[330,210],[110,210],[110,120],lft,top,[40,40],[40,85]]);
  c.flow('c',[[330,60],[330,210]]);c.flow('l',[[330,60],[400,60],[400,210],[330,210]]);
  c.T(410,40,'','val','end',null,'vo');
  Object.values(C).forEach(x=>{x.bindPlay&&0;});
  ['half','ct','br'].forEach(k=>C[k].bindPlay());
  const getT=seg('rc-type',v=>{show();upd();});
  function show(){['half','ct','br'].forEach(k=>{document.getElementById('cx-'+k).closest('figure').hidden=k!==getT();});}
  const cv=reg('c-rc'),cv2=reg('c-rc2');
  const st=sliders('rc-ctl',[
    {key:'Vp',id:'rc-vp',label:'V<sub>S</sub> (שיא)',min:3,max:30,step:0.5,value:12,fmt:v=>v.toFixed(1)+' V'},
    {key:'VD',id:'rc-vd',label:'V<sub>D</sub>',min:0,max:1,step:0.05,value:0.7,fmt:v=>v.toFixed(2)+' V'},
    {key:'R',id:'rc-r',label:'R<sub>L</sub>',min:100,max:10000,step:100,value:1000,fmt:v=>si(v,'Ω')},
    {key:'C',id:'rc-c',label:'C',min:0,max:1000,step:10,value:220,map:v=>v*1e-6,fmt:v=>v===0?'ללא':si(v,'F')}],upd);
  let sim=null;
  function simulate(){const {Vp,VD,R,C:Cc}=st,type=getT(),nD=type==='br'?2:1,full=type!=='half';
    const rect=t=>{const s=Vp*Math.sin(2*Math.PI*f*t);return Math.max(0,(full?Math.abs(s):s)-nD*VD);};
    const dt=T/N;let v=0;const vs=[],vo=[],id=[],il=[];let sum=0,mx=-1e9,mn=1e9,idmax=0;
    for(let i=0;i<5*N;i++){const t=i*dt,r=rect(t);let vn,iD;
      if(Cc===0){vn=r;iD=r/R;}else{const dec=v*Math.exp(-dt/(R*Cc));if(r>=dec){vn=r;iD=Math.max(0,Cc*(vn-v)/dt+vn/R);}else{vn=dec;iD=0;}}
      v=vn;if(i>=4*N){vs.push(Vp*Math.sin(2*Math.PI*f*t));vo.push(v);id.push(iD);il.push(v/R);sum+=v;mx=Math.max(mx,v);mn=Math.min(mn,v);idmax=Math.max(idmax,iD);}}
    return {vs,vo,id,il,Vdc:sum/N,Vr:mx-mn,idmax,type,full,nD};}
  function scopes(ph){const s=sim,tm=i=>i/N*20;const P1=[],P2=[],P3=[],P4=[];
    for(let k=0;k<3;k++)for(let i=0;i<N;i++){const x=k*20+tm(i);P1.push([x,s.vs[i]]);P2.push([x,s.vo[i]]);P3.push([x,s.id[i]*1e3]);P4.push([x,s.il[i]*1e3]);}
    const cur=ph==null?null:ph*20;
    draw(cv,{x0:0,x1:60,y0:-st.Vp*1.12,y1:st.Vp*1.18,xl:'t [ms]',yl:'[V]',cursor:cur,series:[{c:'t2',w:1.5,dash:[5,4],a:.85,pts:P1},{c:'t5',w:1.3,dash:[6,4],pts:[[0,s.Vdc],[60,s.Vdc]]},{c:'t1',w:2.6,pts:P2}]});
    draw(cv2,{x0:0,x1:60,y0:0,y1:Math.max(1e-3,s.idmax*1e3)*1.12,xl:'t [ms]',yl:'[mA]',cursor:cur,series:[{c:'t4',w:1.8,pts:P4},{c:'t3',w:2,pts:P3}]});}
  function tick(t){const s=sim;if(!s)return;const ph=(t*fAnim)%3,i=Math.floor((ph%1)*N)%N;
    const vs=s.vs[i],iD=s.id[i],iL=s.il[i],iC=iD-iL,Im=Math.max(s.idmax,1e-6);
    const m=x=>clamp(Math.abs(x)/Im,0,1)*0.9+(Math.abs(x)>Im*0.01?0.1:0);
    const on=iD>Im*0.005,pos=vs>0;
    const cc=C[s.type];cc.set('vo','v_{out} = '+s.vo[i].toFixed(2)+' V');
    cc.I('c',st.C>0?m(iC):0,iC>=0?1:-1);cc.I('l',m(iL));cc.st('cap',st.C>0?null:'dim');
    if(s.type==='half'){cc.st('d1',on?'on':'dim');cc.I('d',on?m(iD):0);cc.I('r',on?m(iD):0);}
    else if(s.type==='ct'){cc.st('d1',on&&pos?'on':'dim');cc.st('d2',on&&!pos?'on':'dim');cc.I('d1',on&&pos?m(iD):0);cc.I('d2',on&&!pos?m(iD):0);cc.I('g1',on?m(iD):0);}
    else{cc.st('d1',on&&pos?'on':'dim');cc.st('d3',on&&pos?'on':'dim');cc.st('d2',on&&!pos?'on':'dim');cc.st('d4',on&&!pos?'on':'dim');
      cc.I('p',on&&pos?m(iD):0);cc.I('pr',on&&pos?m(iD):0);cc.I('n',on&&!pos?m(iD):0);cc.I('nr',on&&!pos?m(iD):0);}
    scopes(ph);}
  ['half','ct','br'].forEach(k=>{C[k].tick=(t)=>{if(getT()===k)tick(t);};});
  function upd(){sim=simulate();const s=sim,{Vp,VD,R}=st,Cc=st.C,Vop=Math.max(0,Vp-s.nD*VD);
    const PIV=s.type==='half'?(Cc>0?2*Vp-VD:Vp):s.type==='ct'?2*Vp-VD:Vp-VD;
    const VrF=Cc>0?Vop/((s.full?2:1)*f*R*Cc):null,VdcF=Cc>0?Vop-VrF/2:(s.full?2*Vop/Math.PI:Vop/Math.PI);
    const IL=Vop/R,idF=(Cc>0&&s.full&&VrF>0)?IL*(1+2*Math.PI*Math.sqrt(Vp/(2*VrF))):null;
    readouts('r-rc',[['V<sub>O,P</sub>',fx(Vop,2)+' V'],['V<sub>DC</sub> סימולציה / נוסחה',fx(s.Vdc,2)+' / '+fx(VdcF,2)+' V'],['V<sub>r</sub> סימולציה / נוסחה',fx(s.Vr,2)+' / '+(VrF==null?'—':fx(VrF,2))+' V'],
      ['PIV',fx(PIV,1)+' V'],['i<sub>D,max</sub> סימולציה',si(s.idmax,'A')],['i<sub>D,max</sub> נוסחה',idF==null?'—':si(idF,'A')],
      ['RC מול T',Cc>0?((R*Cc/T)>=10?pill('RC = '+(R*Cc/T).toFixed(0)+'T ✓','ok'):pill('RC = '+(R*Cc/T).toFixed(1)+'T · גלית גדולה','warn')):pill('ללא סינון','mute'),'html']]);
    const k=getT();const cc=C[k];tick(cc.t);}
  presets({'rc-noc':{'rc-c':0},'rc-c':{'rc-c':220}});
  show();upd();
})();
},
