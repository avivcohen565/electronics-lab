function mosId(VGS,VDS,Vt,kn,lam){const VOV=VGS-Vt;if(VOV<=0)return {r:'cut',I:0,VOV};
  if(VDS<VOV)return {r:'tri',I:kn*(VOV*VDS-VDS*VDS/2)*(1+lam*VDS),VOV};return {r:'sat',I:0.5*kn*VOV*VOV*(1+lam*VDS),VOV};}
LESSONS[3]={title:'MOSFET',sub:'מבנה, יצירת תעלה, תחומי פעולה, אופיינים, אפקט מצע ומודל אות קטן',topics:'5 הדמיות',
intro:'ב-MOSFET מתח השער יוצר תעלה של אלקטרונים בין Source ל-Drain, בלי שזורם זרם לשער. כאן רואים את התעלה נוצרת, מתכווצת ונצבטת, ומקשרים את זה לנוסחאות של שלושת תחומי הפעולה.',
build(root){
section(root,{id:'l3-ch',tag:'מבנה ופעולה',title:'התעלה נוצרת, מתכווצת ונצבטת',short:'התעלה',
lead:'NMOS מסוג Enhancement: מצע P ושני בורות N<sup>+</sup>. כש-<span class="m">V<sub>GS</sub> &gt; V<sub>T</sub></span> נוצרת תעלת אלקטרונים. <span class="m">V<sub>DS</sub></span> מושך אותם מ-S ל-D. ככל ש-<span class="m">V<sub>DS</sub></span> גדל, התעלה נעשית דקה בצד ה-Drain, ובנקודה <span class="m">V<sub>DS</sub> = V<sub>OV</sub></span> היא נצבטת (pinch-off).',
body:'<div class="lab"><div class="controls"><div class="sliders" id="ch-ctl"></div><div class="presets"><button type="button" data-preset="ch-cut">קטעון</button><button type="button" data-preset="ch-tri">טריודה</button><button type="button" data-preset="ch-edge">קצה הצביטה</button><button type="button" data-preset="ch-sat">רוויה</button></div></div>'+
'<div class="scopes">'+scope('c-ch','wide',lg('t2','אלקטרונים בתעלה','dot')+'<span class="lg" style="--c:#5d6f68">אזור מחסור</span>','חתך MOSFET')+scope('c-ch2','',lg('scope-axis','משפחת עקומות')+lg('t1','V<sub>GS</sub> הנוכחי')+lg('t5','גבול V<sub>DS</sub> = V<sub>OV</sub>','dash')+lg('t3','נקודת עבודה','dot'),'אופיין ID-VDS')+'</div></div><div class="readouts" id="r-ch"></div>'+
'<div class="tbl"><table><thead><tr><th>תחום</th><th>תנאים</th><th>זרם</th></tr></thead><tbody><tr data-r="cut"><td>קטעון (Cutoff)</td><td class="n">V<sub>GS</sub> &lt; V<sub>T</sub></td><td class="n">I<sub>D</sub> = 0</td></tr><tr data-r="tri"><td>טריודה (אוהמי)</td><td class="n">V<sub>GS</sub> &gt; V<sub>T</sub>, V<sub>DS</sub> &lt; V<sub>OV</sub></td><td class="n">I<sub>D</sub> = k\'<sub>n</sub>(W/L)(V<sub>OV</sub>V<sub>DS</sub> − ½V<sub>DS</sub>²)</td></tr><tr data-r="sat"><td>רוויה</td><td class="n">V<sub>GS</sub> &gt; V<sub>T</sub>, V<sub>DS</sub> ≥ V<sub>OV</sub></td><td class="n">I<sub>D</sub> = ½k\'<sub>n</sub>(W/L)V<sub>OV</sub>²(1+λV<sub>DS</sub>)</td></tr></tbody></table></div>'+
notes('<h3>מה לראות</h3><ul><li>מתחת ל-<span class="m">V<sub>T</sub></span> אין תעלה ואין זרם, גם אם <span class="m">V<sub>DS</sub></span> גדול.</li><li><b>טריודה</b>: ב-<span class="m">V<sub>DS</sub></span> קטן התעלה אחידה והטרנזיסטור הוא נגד שנשלט במתח (<span class="m">1/R ∝ V<sub>OV</sub></span>).</li><li><b>רוויה</b>: אחרי הצביטה, הגדלת <span class="m">V<sub>DS</sub></span> כמעט לא משנה את הזרם. האלקטרונים "נשפכים" דרך אזור המחסור ל-Drain. עם <span class="m">λ</span> התעלה מתקצרת מעט והזרם עולה (Channel Length Modulation).</li></ul>',
'<h3>הגדרות</h3>'+F('','V<sub>OV</sub> = V<sub>GS</sub> − V<sub>T</sub>')+F('','V<sub>DS,sat</sub> = V<sub>OV</sub>')+F('','k\'<sub>n</sub> = μ<sub>n</sub>C<sub>ox</sub> · K<sub>n</sub> = ½k\'<sub>n</sub>(W/L)')+F('','V<sub>A</sub> = 1/λ')+'<p>כאן <span class="m">k<sub>n</sub> = k\'<sub>n</sub>(W/L)</span>.</p>')});
(function(){
  const cv=reg('c-ch'),cv2=reg('c-ch2'),Vt=1;
  const st=sliders('ch-ctl',[
    {key:'VGS',id:'ch-vgs',label:'V<sub>GS</sub> (V<sub>T</sub> = 1V)',min:0,max:4,step:0.05,value:2.5,fmt:v=>v.toFixed(2)+' V'},
    {key:'VDS',id:'ch-vds',label:'V<sub>DS</sub>',min:0,max:5,step:0.05,value:0.6,fmt:v=>v.toFixed(2)+' V'},
    {key:'kn',id:'ch-kn',label:'k\'<sub>n</sub>(W/L)',min:0.2,max:4,step:0.1,value:1,map:v=>v*1e-3,fmt:v=>si(v,'A/V²')},
    {key:'lam',id:'ch-lam',label:'λ',min:0,max:0.2,step:0.01,value:0.05,fmt:v=>v.toFixed(2)+' V⁻¹'}],upd);
  let S=null;const parts=[];for(let i=0;i<70;i++)parts.push({x:Math.random(),y:Math.random(),o:Math.random()});
  function chan(x){ // returns thickness fraction 0..1 at x in [0,1]
    const VOV=S.VOV;if(VOV<=0)return 0;const Vd=Math.min(st.VDS,VOV);const Lp=S.r==='sat'?1-Math.min(0.25,st.lam*(st.VDS-VOV)*0.8):1;
    if(x>Lp)return 0;const xx=x/Lp;const q2=VOV*VOV-2*xx*(VOV*Vd-Vd*Vd/2);return Math.sqrt(Math.max(0,q2))/3;}
  function step(dt){if(!S)return;const sp=S.I>0?0.002+0.012*Math.min(1,S.I/4e-3):0;
    parts.forEach(p=>{if(S.VOV<=0){return;}p.x+=sp*dt*(0.7+0.6*p.o);p.y+=(Math.random()-.5)*0.05*dt;p.y=clamp(p.y,0,1);if(p.x>1.08){p.x=-0.02;p.y=Math.random();}});}
  function drawX(){const c=prep(cv);if(!c||!S)return;const {g,W,H}=c,P=pal();
    g.fillStyle=P.bg;g.fillRect(0,0,W,H);
    const y0=0.40*H,xs=0.30*W,xd=0.70*W;
    g.fillStyle=P.preg;g.fillRect(0.04*W,y0,0.92*W,0.55*H);
    // depletion
    const dep=0.04*H+(S.VOV>0?0.05*H:0.03*H*Math.min(1,st.VGS));
    g.fillStyle=P.dep;g.globalAlpha=.7;g.fillRect(xs,y0,xd-xs,dep+ (S.VOV>0?0.02*H:0));
    // drain side depletion grows with VDS
    const dd=0.03*H+0.035*H*Math.sqrt(st.VDS);g.beginPath();g.ellipse(xd-0.01*W,y0+0.1*H,0.1*W+dd*0.6,0.14*H+dd,0,0,Math.PI*2);g.fill();g.globalAlpha=1;
    // wells
    g.fillStyle=P.nreg;const well=(x,w)=>{g.beginPath();g.moveTo(x,y0);g.lineTo(x,y0+0.14*H);g.quadraticCurveTo(x,y0+0.24*H,x+0.03*W,y0+0.24*H);g.lineTo(x+w-0.03*W,y0+0.24*H);g.quadraticCurveTo(x+w,y0+0.24*H,x+w,y0+0.14*H);g.lineTo(x+w,y0);g.closePath();g.fill();};
    well(0.1*W,0.2*W);well(0.7*W,0.2*W);
    // static electrons in wells
    g.fillStyle=P.t2;g.globalAlpha=.55;for(let i=0;i<26;i++){const a=(i*37%100)/100,b=(i*61%100)/100;g.beginPath();g.arc(0.12*W+a*0.16*W,y0+0.03*H+b*0.17*H,2.2,0,7);g.fill();g.beginPath();g.arc(0.72*W+b*0.16*W,y0+0.03*H+a*0.17*H,2.2,0,7);g.fill();}g.globalAlpha=1;
    // channel
    if(S.VOV>0){g.fillStyle=P.t2;g.globalAlpha=.28;g.beginPath();g.moveTo(xs,y0);for(let i=0;i<=60;i++){const x=i/60;g.lineTo(xs+(xd-xs)*x,y0+chan(x)*0.12*H);}g.lineTo(xd,y0);g.closePath();g.fill();g.globalAlpha=1;
      parts.forEach(p=>{const t=chan(clamp(p.x,0,1));let yy;if(p.x<0||p.x>1){return;}
        if(t>0.01)yy=y0+2+p.y*(t*0.12*H-2);else yy=y0+0.02*H+p.y*0.05*H;g.fillStyle=P.t2;g.beginPath();g.arc(xs+(xd-xs)*p.x,yy,2.6,0,7);g.fill();});}
    // oxide & gate
    g.fillStyle='#8ea39a';g.fillRect(xs,y0-0.05*H,xd-xs,0.05*H);g.fillStyle='#c9d4cf';g.fillRect(xs,y0-0.15*H,xd-xs,0.10*H);
    // contacts
    g.fillStyle='#8ea39a';g.fillRect(0.15*W,y0-0.06*H,0.1*W,0.06*H);g.fillRect(0.75*W,y0-0.06*H,0.1*W,0.06*H);g.fillRect(0.45*W,0.95*H,0.1*W,0.04*H);
    g.font='700 14px "JetBrains Mono", monospace';g.fillStyle=P.hi;g.textAlign='center';g.textBaseline='bottom';
    g.fillText('S',0.2*W,y0-0.08*H);g.fillText('D',0.8*W,y0-0.08*H);g.fillText('G',0.5*W,y0-0.17*H);g.textBaseline='bottom';g.fillText('B',0.58*W,0.99*H);
    g.font='600 11px "JetBrains Mono", monospace';g.fillStyle=P.text;g.fillText('SiO₂',0.5*W,y0-0.055*H+12);
    g.fillText('n⁺',0.2*W,y0+0.23*H);g.fillText('n⁺',0.8*W,y0+0.23*H);g.fillText('p-substrate',0.5*W,0.9*H);
    g.font='600 13px Assistant, sans-serif';g.fillStyle=S.r==='sat'?P.t1:S.r==='tri'?P.t4:P.text;g.textAlign='left';g.textBaseline='top';
    g.fillText(S.r==='sat'?'רוויה: התעלה נצבטת ליד D':S.r==='tri'?'טריודה: תעלה רציפה':'קטעון: אין תעלה',10,8);
    g.textAlign='right';g.fillStyle=P.t1;g.font='600 12px "JetBrains Mono", monospace';g.fillText('I_D = '+si(S.I,'A'),W-10,8);}
  const A=animator(cv,drawX,step);
  function upd(){const {VGS,VDS,kn,lam}=st;S=mosId(VGS,VDS,Vt,kn,lam);
    const x1=5,fam=[],vovs=[0.5,1,1.5,2,2.5,3];let ymax=0.5*kn*9*(1+lam*5)*1e3*1.1;
    vovs.forEach(v=>{const p=[];for(let i=0;i<=120;i++){const d=x1*i/120;p.push([d,mosId(Vt+v,d,Vt,kn,lam).I*1e3]);}fam.push({c:'axis',w:1.2,pts:p});});
    if(S.VOV>0){const p=[];for(let i=0;i<=160;i++){const d=x1*i/160;p.push([d,mosId(VGS,d,Vt,kn,lam).I*1e3]);}fam.push({c:'t1',w:2.6,pts:p});}
    const b=[];for(let i=0;i<=60;i++){const d=3.2*i/60;b.push([d,0.5*kn*d*d*1e3]);}fam.push({c:'t5',w:1.3,dash:[5,4],pts:b});
    draw(cv2,{x0:0,x1,y0:0,y1:ymax,xl:'V_DS [V]',yl:'I_D [mA]',series:fam,points:[{x:VDS,y:S.I*1e3,c:'t3',label:si(S.I,'A')}],bands:S.VOV>0?[{x0:0,x1:S.VOV,c:'t4',a:.07,label:'טריודה'}]:[]});
    const gm=S.r==='sat'?kn*S.VOV:0,ro=S.I>0&&lam>0?1/(lam*0.5*kn*S.VOV*S.VOV):Infinity;
    const names={cut:pill('קטעון','mute'),tri:pill('טריודה','ok'),sat:pill('רוויה','warn')};
    readouts('r-ch',[['תחום',names[S.r],'html'],['V<sub>OV</sub>',fx(S.VOV,2)+' V'],['I<sub>D</sub>',si(S.I,'A')],['V<sub>DS,sat</sub>',S.VOV>0?fx(S.VOV,2)+' V':'—'],['g<sub>m</sub> (ברוויה)',S.r==='sat'?si(gm,'S'):'—'],['r<sub>o</sub> = 1/λI<sub>D</sub>',S.r==='sat'?si(ro,'Ω'):'—'],
      ['R<sub>DS</sub> בטריודה ≈ 1/(k<sub>n</sub>V<sub>OV</sub>)',S.r==='tri'?si(1/(kn*S.VOV),'Ω'):'—']]);
    document.querySelectorAll('#l3-ch tr[data-r]').forEach(tr=>tr.classList.toggle('on',tr.dataset.r===S.r));
    if(reduced||!A.raf){step(0);drawX();}}
  presets({'ch-cut':{'ch-vgs':0.7,'ch-vds':2},'ch-tri':{'ch-vgs':2.5,'ch-vds':0.4},'ch-edge':{'ch-vgs':2.5,'ch-vds':1.5},'ch-sat':{'ch-vgs':2.5,'ch-vds':3.5}});upd();
})();

section(root,{id:'l3-dc',tag:'ניתוח DC',title:'מעגל חי: מציאת נקודת עבודה של NMOS',short:'נקודת עבודה',
lead:'<span class="m">V<sub>DD</sub></span> ← <span class="m">R<sub>D</sub></span> ← Drain, Source לאדמה, ו-<span class="m">V<sub>GS</sub></span> על השער. אין זרם לשער (<span class="m">i<sub>G</sub> = 0</span>). האלגוריתם: מניחים רוויה, מחשבים, ובודקים.',
body:'<div class="lab"><div class="controls"><div class="sliders" id="md-ctl"></div></div><div class="scopes">'+circ('cx-md',lg('t1','I<sub>D</sub>','dot'))+scope('c-md','short',lg('t1','אופיין ב-V<sub>GS</sub> הנוכחי')+lg('t2','קו עבודה')+lg('t3','Q','dot'),'קו עבודה')+'</div></div><div class="readouts" id="r-md"></div>'+
notes('<h3>האלגוריתם</h3><ol><li>בודקים <span class="m">V<sub>GS</sub> &gt; V<sub>T</sub></span>. אם לא: קטעון, <span class="m">V<sub>DS</sub> = V<sub>DD</sub></span>.</li><li>מניחים רוויה: <span class="m">I<sub>D</sub> = ½k<sub>n</sub>V<sub>OV</sub>²</span>.</li><li>KVL: <span class="m">V<sub>DS</sub> = V<sub>DD</sub> − I<sub>D</sub>R<sub>D</sub></span>.</li><li>בודקים <span class="m">V<sub>DS</sub> ≥ V<sub>OV</sub></span>. אם לא, פותרים מחדש עם נוסחת הטריודה (משוואה ריבועית ב-<span class="m">V<sub>DS</sub></span>).</li></ol>',
'<h3>משוואת הטריודה</h3>'+F('','V<sub>DS</sub> = V<sub>DD</sub> − R<sub>D</sub>k<sub>n</sub>(V<sub>OV</sub>V<sub>DS</sub> − ½V<sub>DS</sub>²)')+'<p>בוחרים את השורש הקטן (זה שמקיים <span class="m">V<sub>DS</sub> &lt; V<sub>OV</sub></span>).</p>')});
(function(){
  const C=Circuit('cx-md',440,240),cv=reg('c-md'),Vt=1,kn=1e-3;
  C.rail(260,22,'V_{DD}');C.w([260,22],[260,40]);C.R([260,40],[260,110],'R_D',{side:1});C.w([260,110],[260,125]);
  const t=C.mos(250,155,{id:'q',label:''});C.w([260,185],[260,215]);C.G(260,215);
  C.w(t.g,[150,155]);C.V([150,215],[150,155],'V_{GS}',{side:-1,off:30});C.G(150,215);C.nd(260,118);C.T(300,122,'','val','start',null,'vd');C.T(300,70,'','val','start',null,'id');
  C.flow('i',[[260,40],[260,125],[260,185],[260,215]]);
  const st=sliders('md-ctl',[
    {key:'VDD',id:'md-vdd',label:'V<sub>DD</sub>',min:1,max:15,step:0.5,value:10,fmt:v=>v.toFixed(1)+' V'},
    {key:'RD',id:'md-rd',label:'R<sub>D</sub>',min:0.5,max:20,step:0.5,value:4,map:v=>v*1000,fmt:v=>si(v,'Ω')},
    {key:'VGS',id:'md-vgs',label:'V<sub>GS</sub>',min:0,max:4,step:0.05,value:2.5,fmt:v=>v.toFixed(2)+' V'}],upd);
  function solve(VDD,RD,VGS){const VOV=VGS-Vt;if(VOV<=0)return {r:'cut',I:0,VDS:VDD,VOV};
    let I=0.5*kn*VOV*VOV,VDS=VDD-I*RD;if(VDS>=VOV)return {r:'sat',I,VDS,VOV};
    const a=RD*kn/2,b=-(1+RD*kn*VOV),c=VDD;VDS=(-b-Math.sqrt(b*b-4*a*c))/(2*a);I=(VDD-VDS)/RD;return {r:'tri',I,VDS,VOV,Isat:0.5*kn*VOV*VOV};}
  function upd(){const {VDD,RD,VGS}=st,s=solve(VDD,RD,VGS);
    C.I('i',mag(s.I,VDD/RD));C.st('q',s.r==='cut'?'dim':s.r==='sat'?'hot':'on');C.set('vd','V_{DS} = '+s.VDS.toFixed(2)+' V');C.set('id','I_D = '+si(s.I,'A'));
    const p=[];for(let i=0;i<=200;i++){const d=VDD*1.05*i/200;p.push([d,mosId(VGS,d,Vt,kn,0).I*1e3]);}
    draw(cv,{x0:0,x1:VDD*1.05,y0:0,y1:Math.max(VDD/RD*1e3,0.5*kn*Math.max(0.1,s.VOV)**2*1e3)*1.15,xl:'V_DS [V]',yl:'I_D [mA]',series:[{c:'t1',w:2.5,pts:p},{c:'t2',w:2,pts:[[0,VDD/RD*1e3],[VDD,0]]}],points:[{x:s.VDS,y:s.I*1e3,c:'t3',label:'Q'}]});
    const n={cut:pill('קטעון','mute'),tri:pill('טריודה (ההנחה נכשלה)','warn'),sat:pill('רוויה (ההנחה נכונה)','ok')};
    readouts('r-md',[['תחום',n[s.r],'html'],['I<sub>D</sub>',si(s.I,'A')],['V<sub>DS</sub>',s.VDS.toFixed(3)+' V'],['V<sub>OV</sub>',fx(s.VOV,2)+' V'],['בדיקה',s.r==='cut'?'V<sub>GS</sub> &lt; V<sub>T</sub>':('V<sub>DS</sub> '+(s.VDS>=s.VOV?'≥':'&lt;')+' V<sub>OV</sub>'),'html']]);}
  upd();
})();

section(root,{id:'l3-types',tag:'ארבעה סוגים',title:'NMOS/PMOS, Enhancement/Depletion: אופייני רוויה',short:'סוגי MOSFET',
lead:'ברוויה כל הארבעה מקיימים <span class="m">I<sub>D</sub> = ½k\'(W/L)(V<sub>GS</sub> − V<sub>T</sub>)²</span>: עקומה ריבועית, לא אקספוננציאלית כמו בדיודה. מה שמשתנה הוא הסימן של <span class="m">V<sub>T</sub></span> והכיוון.',
body:'<div class="lab"><div class="controls"><div class="seg" id="ty-sel"><button type="button" data-v="ne" aria-pressed="true">NMOS Enh</button><button type="button" data-v="nd" aria-pressed="false">NMOS Dep</button><button type="button" data-v="pe" aria-pressed="false">PMOS Enh</button><button type="button" data-v="pd" aria-pressed="false">PMOS Dep</button></div><div class="sliders" id="ty-ctl"></div></div><div class="scopes">'+scope('c-ty','',lg('t1','הסוג שנבחר')+lg('scope-axis','שאר הסוגים')+lg('t3','V<sub>T</sub>','dot'),'אופייני רוויה')+'</div></div><div class="readouts" id="r-ty"></div>'+
notes('<h3>איך לזכור</h3><ul><li><b>Enhancement</b> ("שיפור"): אין תעלה מובנית. NMOS צריך <span class="m">V<sub>T</sub> &gt; 0</span>, PMOS <span class="m">V<sub>T</sub> &lt; 0</span>.</li><li><b>Depletion</b> ("דילול"): יש תעלה מובנית, זורם זרם גם ב-<span class="m">V<sub>GS</sub> = 0</span> (<span class="m">I<sub>DSS</sub></span>). NMOS: <span class="m">V<sub>T</sub> &lt; 0</span>.</li><li>ב-PMOS הכל הפוך: עובדים עם <span class="m">V<sub>SG</sub></span>, <span class="m">V<sub>SD</sub></span> ו-<span class="m">|V<sub>T</sub>|</span>, והזרם יוצא מה-Drain.</li></ul>',
'<h3>PMOS Enhancement</h3>'+F('הולכה:','V<sub>GS</sub> &lt; V<sub>T</sub> (V<sub>T</sub>&lt;0)')+F('טריודה:','I<sub>D</sub> = k\'<sub>p</sub>(W/L)((V<sub>SG</sub>−|V<sub>T</sub>|)V<sub>SD</sub> − ½V<sub>SD</sub>²)')+F('רוויה:','I<sub>D</sub> = ½k\'<sub>p</sub>(W/L)(V<sub>SG</sub>−|V<sub>T</sub>|)²')+F('Depletion:','I<sub>DSS</sub> = ½k(W/L)V<sub>T</sub>² (ב-V<sub>GS</sub>=0)'))});
(function(){
  const cv=reg('c-ty'),kn=1e-3;
  const getT=seg('ty-sel',()=>upd());
  const st=sliders('ty-ctl',[{key:'Vt',id:'ty-vt',label:'|V<sub>T</sub>|',min:0.5,max:4,step:0.1,value:1.5,fmt:v=>v.toFixed(1)+' V'},{key:'VGS',id:'ty-vgs',label:'V<sub>GS</sub>',min:-6,max:6,step:0.1,value:3,fmt:v=>fx(v,1)+' V'}],upd);
  const vtOf=(t,a)=>({ne:a,nd:-a,pe:-a,pd:a})[t];
  const cur=(t,v,a)=>{const Vt=vtOf(t,a);if(t[0]==='n')return v>Vt?0.5*kn*(v-Vt)**2:0;return v<Vt?0.5*kn*(v-Vt)**2:0;};
  function upd(){const t=getT(),a=st.Vt,s=[];
    ['ne','nd','pe','pd'].forEach(k=>{const p=[];for(let i=0;i<=240;i++){const v=-6+12*i/240;p.push([v,cur(k,v,a)*1e3]);}s.push({c:k===t?'t1':'axis',w:k===t?2.8:1.3,pts:p});});
    const I=cur(t,st.VGS,a),Vt=vtOf(t,a);
    draw(cv,{x0:-6,x1:6,y0:0,y1:0.5*kn*16*1e3,xl:'V_GS [V]',yl:'|I_D| [mA]',series:s,points:[{x:Vt,y:0,c:'t3',label:'V_T='+fx(Vt,1)},{x:st.VGS,y:I*1e3,c:'t1',r:4,label:si(I,'A')}]});
    const on=I>0;const names={ne:'NMOS Enhancement',nd:'NMOS Depletion',pe:'PMOS Enhancement',pd:'PMOS Depletion'};
    readouts('r-ty',[['סוג',names[t]],['V<sub>T</sub>',fx(Vt,1)+' V'],['מצב',on?pill('מוליך','ok'):pill('קטעון','mute'),'html'],['|I<sub>D</sub>| ברוויה',si(I,'A')],['I<sub>DSS</sub> (ב-V<sub>GS</sub>=0)',t[1]==='d'?si(cur(t,0,a),'A'):'0 (אין תעלה)']]);}
  upd();
})();

section(root,{id:'l3-body',tag:'אפקט מצע',title:'אפקט המצע (Body Effect)',short:'אפקט מצע',
lead:'כשהמצע לא מחובר ל-Source (<span class="m">V<sub>SB</sub> ≠ 0</span>), מתח הסף עולה. צריך יותר מתח שער כדי לפתוח את התעלה.',
body:'<div class="lab"><div class="controls"><div class="sliders" id="bd-ctl"></div></div><div class="scopes">'+scope('c-bd','short',lg('t1','V<sub>T</sub>(V<sub>SB</sub>)')+lg('t3','נקודה נוכחית','dot'),'אפקט מצע')+'</div></div><div class="readouts" id="r-bd"></div>'+
notes('<h3>המשמעות</h3><p>V<sub>SB</sub> חיובי מרחיב את אזור המחסור מתחת לתעלה. יש יותר מטען קבוע שהשער צריך "לנצח", ולכן V<sub>T</sub> עולה. בדוגמה בסיכום: V<sub>T0</sub>=1V ואפקט המצע מוסיף 0.4V, כך ש-V<sub>T</sub>=1.4V.</p>',F('','V<sub>T</sub> = V<sub>T0</sub> + γ(√(0.6+V<sub>SB</sub>) − √0.6)')+F('','γ ≈ 0.5 √V'))});
(function(){
  const cv=reg('c-bd');
  const st=sliders('bd-ctl',[{key:'VT0',id:'bd-vt0',label:'V<sub>T0</sub>',min:0.3,max:2,step:0.05,value:1,fmt:v=>v.toFixed(2)+' V'},{key:'g',id:'bd-g',label:'γ',min:0.1,max:1,step:0.05,value:0.5,fmt:v=>v.toFixed(2)+' √V'},{key:'VSB',id:'bd-vsb',label:'V<sub>SB</sub>',min:0,max:6,step:0.1,value:2,fmt:v=>v.toFixed(1)+' V'}],upd);
  const f=(v)=>st.VT0+st.g*(Math.sqrt(0.6+v)-Math.sqrt(0.6));
  function upd(){const p=[];for(let i=0;i<=100;i++){const v=6*i/100;p.push([v,f(v)]);}
    draw(cv,{x0:0,x1:6,y0:0,y1:Math.max(2.5,f(6)*1.1),xl:'V_SB [V]',yl:'V_T [V]',series:[{c:'axis',w:1,dash:[4,4],pts:[[0,st.VT0],[6,st.VT0]]},{c:'t1',w:2.6,pts:p}],points:[{x:st.VSB,y:f(st.VSB),c:'t3',label:f(st.VSB).toFixed(2)+'V'}]});
    readouts('r-bd',[['V<sub>T</sub>',f(st.VSB).toFixed(3)+' V'],['תוספת ΔV<sub>T</sub>',(f(st.VSB)-st.VT0).toFixed(3)+' V']]);}
  upd();
})();

section(root,{id:'l3-ss',tag:'אות קטן',title:'מודל אות קטן של MOSFET',short:'אות קטן',
lead:'סביב נקודת עבודה ברוויה, הטרנזיסטור הוא מקור זרם מבוקר מתח <span class="m">g<sub>m</sub>v<sub>gs</sub></span> במקביל ל-<span class="m">r<sub>o</sub></span>. אין זרם לשער. שלוש דרכים שקולות לחשב את <span class="m">g<sub>m</sub></span>.',
body:'<div class="lab"><div class="controls"><div class="sliders" id="ss-ctl"></div></div><div class="scopes">'+circ('cx-ss','<span>מודל π: G פתוח (i<sub>g</sub>=0), g<sub>m</sub>v<sub>gs</sub> ∥ r<sub>o</sub></span>')+scope('c-ss','short',lg('t1','I<sub>D</sub>(V<sub>GS</sub>)')+lg('t3','משיק: שיפוע g<sub>m</sub>','dash'),'gm')+'</div></div><div class="readouts" id="r-ss"></div>'+
notes('<h3>מה לראות</h3><ul><li><span class="m">g<sub>m</sub></span> הוא השיפוע של אופיין הרוויה בנקודת העבודה. הגדל את <span class="m">V<sub>OV</sub></span> והמשיק נעשה תלול.</li><li>בזרם קבוע, הגדלת <span class="m">V<sub>OV</sub></span> דווקא מקטינה את <span class="m">g<sub>m</sub> = 2I<sub>D</sub>/V<sub>OV</sub></span>.</li><li>ההגבר העצמי <span class="m">μ = g<sub>m</sub>r<sub>o</sub></span> הוא ההגבר המקסימלי של טרנזיסטור יחיד. אפשר להחליף את מקור הזרם ∥ r<sub>o</sub> במקור מתח μv<sub>gs</sub> בטור ל-r<sub>o</sub>.</li></ul>',
'<h3>נוסחאות</h3>'+F('','g<sub>m</sub> = k\'<sub>n</sub>(W/L)V<sub>OV</sub> = √(2k\'<sub>n</sub>(W/L)I<sub>D</sub>) = 2I<sub>D</sub>/V<sub>OV</sub>')+F('','r<sub>o</sub> = 1/(λI<sub>D</sub>) = V<sub>A</sub>/I<sub>D</sub>')+F('','μ = g<sub>m</sub>r<sub>o</sub>')+F('מודל T:','התנגדות 1/g<sub>m</sub> בין S לשער הפנימי'))});
(function(){
  const C=Circuit('cx-ss',380,200),cv=reg('c-ss');
  C.term(40,60);C.T(40,45,'G','big','middle');C.w([40,60],[80,60]);C.T(62,105,'v_{gs}','val2','middle');C.T(62,80,'+','hi','middle');C.T(62,140,'−','hi','middle');
  C.term(40,160);C.w([40,160],[340,160]);C.nd(200,160).nd(290,160);C.T(200,188,'S','big','middle');
  C.w([200,40],[340,40]);C.term(340,40);C.T(352,44,'D','big','start');C.nd(200,40).nd(290,40);
  C.dep([200,40],[200,160],'g_m v_{gs}',{side:-1,off:36});C.R([290,40],[290,160],'r_o',{side:-1});
  C.flow('i',[[340,40],[200,40],[200,160],[340,160]]);
  const st=sliders('ss-ctl',[{key:'kn',id:'ss-kn',label:'k\'<sub>n</sub>(W/L)',min:0.2,max:5,step:0.1,value:2,map:v=>v*1e-3,fmt:v=>si(v,'A/V²')},{key:'VOV',id:'ss-vov',label:'V<sub>OV</sub>',min:0.1,max:2,step:0.05,value:0.5,fmt:v=>v.toFixed(2)+' V'},{key:'lam',id:'ss-lam',label:'λ',min:0.005,max:0.2,step:0.005,value:0.02,fmt:v=>v.toFixed(3)+' V⁻¹'}],upd);
  function upd(){const {kn,VOV,lam}=st,ID=0.5*kn*VOV*VOV,gm=kn*VOV,ro=1/(lam*ID),Vt=1;C.I('i',0.5);
    const p=[];for(let i=0;i<=100;i++){const v=Vt+2.5*i/100;p.push([v,0.5*kn*(v-Vt)**2*1e3]);}
    const vg=Vt+VOV;draw(cv,{x0:Vt,x1:Vt+2.5,y0:0,y1:0.5*kn*6.25*1e3,xl:'V_GS [V]',yl:'I_D [mA]',series:[{c:'t1',w:2.5,pts:p},{c:'t3',w:1.6,dash:[6,4],pts:[[vg-1,(ID-gm)*1e3],[vg+1,(ID+gm)*1e3]]}],points:[{x:vg,y:ID*1e3,c:'t3',label:'Q'}]});
    readouts('r-ss',[['I<sub>D</sub> = ½k<sub>n</sub>V<sub>OV</sub>²',si(ID,'A')],['g<sub>m</sub> = k<sub>n</sub>V<sub>OV</sub>',si(gm,'S')],['2I<sub>D</sub>/V<sub>OV</sub>',si(2*ID/VOV,'S')],['√(2k<sub>n</sub>I<sub>D</sub>)',si(Math.sqrt(2*kn*ID),'S')],['r<sub>o</sub>',si(ro,'Ω')],['μ = g<sub>m</sub>r<sub>o</sub>',(gm*ro).toFixed(0)],['V<sub>A</sub> = 1/λ',(1/lam).toFixed(0)+' V']]);}
  upd();
})();
},
quiz:[
{q:'NMOS עם V<sub>T</sub>=1V, V<sub>GS</sub>=3V, V<sub>DS</sub>=1.5V. באיזה תחום הוא?',o:['קטעון','טריודה','רוויה','לא ניתן לדעת'],a:1,e:'V<sub>OV</sub> = 3−1 = 2V. V<sub>DS</sub> = 1.5 &lt; V<sub>OV</sub>, ולכן טריודה.'},
{q:'NMOS ברוויה עם k\'<sub>n</sub>(W/L) = 2mA/V² ו-V<sub>OV</sub> = 0.5V (λ=0). מה I<sub>D</sub>?',o:['0.5mA','0.25mA','1mA','2mA'],a:1,e:'I<sub>D</sub> = ½·2m·0.5² = 0.25mA.'},
{q:'באותה נקודה (I<sub>D</sub>=0.25mA, V<sub>OV</sub>=0.5V), מה g<sub>m</sub>?',o:['0.5mA/V','1mA/V','2mA/V','0.25mA/V'],a:1,e:'g<sub>m</sub> = 2I<sub>D</sub>/V<sub>OV</sub> = 0.5m/0.5 = 1mA/V. שקול ל-k<sub>n</sub>V<sub>OV</sub> = 2m·0.5.'},
{q:'מה קורה פיזיקלית בתעלה כש-V<sub>DS</sub> = V<sub>GS</sub> − V<sub>T</sub>?',o:['התעלה נעלמת לגמרי','התעלה נצבטת בצד ה-Drain (pinch-off)','התעלה מתעבה בצד ה-Drain','השער מתחיל להוליך'],a:1,e:'המתח בין השער לתעלה בצד ה-Drain יורד ל-V<sub>T</sub>, והתעלה נעלמת שם. זה גבול הרוויה.'},
{q:'לטרנזיסטור NMOS מסוג Depletion יש:',o:['V<sub>T</sub> &gt; 0 ואין תעלה מובנית','V<sub>T</sub> &lt; 0 ויש זרם גם ב-V<sub>GS</sub>=0','זרם שער שונה מאפס','אופיין אקספוננציאלי'],a:1,e:'ב-Depletion יש תעלה מובנית, ולכן V<sub>T</sub> שלילי וזורם I<sub>DSS</sub> ב-V<sub>GS</sub>=0.'},
{q:'λ = 0.02 V⁻¹ ו-I<sub>D</sub> = 1mA. מהי r<sub>o</sub>?',o:['20kΩ','50kΩ','500Ω','5kΩ'],a:1,e:'r<sub>o</sub> = 1/(λI<sub>D</sub>) = 1/(0.02·1m) = 50kΩ. בנוסף V<sub>A</sub> = 1/λ = 50V.'},
{q:'מה ההשפעה של V<sub>SB</sub> חיובי על NMOS?',o:['V<sub>T</sub> יורד','V<sub>T</sub> עולה','k\'<sub>n</sub> גדל','אין השפעה'],a:1,e:'אפקט המצע: V<sub>T</sub> = V<sub>T0</sub> + γ(√(0.6+V<sub>SB</sub>) − √0.6), כלומר V<sub>T</sub> עולה.'}
],
formulas:[
['מתח יתר','V<sub>OV</sub> = V<sub>GS</sub> − V<sub>T</sub>'],
['פרמטרים','k\'<sub>n</sub> = μ<sub>n</sub>C<sub>ox</sub> · K\'<sub>n</sub> = ½k\'<sub>n</sub>(W/L)'],

['CLM','I<sub>D</sub> = ½k\'<sub>n</sub>(W/L)V<sub>OV</sub>²(1+λV<sub>DS</sub>) · V<sub>A</sub> = 1/λ'],
['PMOS רוויה','I<sub>D</sub> = ½k\'<sub>p</sub>(W/L)(V<sub>SG</sub>−|V<sub>T</sub>|)²'],
['אפקט מצע','V<sub>T</sub> = V<sub>T0</sub> + γ(√(0.6+V<sub>SB</sub>) − √0.6)'],
['טרנסמוליכות','g<sub>m</sub> = k\'<sub>n</sub>(W/L)V<sub>OV</sub> = √(2k\'<sub>n</sub>(W/L)I<sub>D</sub>) = 2I<sub>D</sub>/V<sub>OV</sub>'],
['התנגדות מוצא','r<sub>o</sub> = 1/(λI<sub>D</sub>) = V<sub>A</sub>/I<sub>D</sub>'],
['הגבר עצמי','μ = g<sub>m</sub>r<sub>o</sub>']
]};

LESSONS[4]={title:'תצורות חיבור עם MOSFET',sub:'מודל כללי של מגבר, CS, CG, CD: הגבר, R<sub>in</sub> ו-R<sub>out</sub>',topics:'3 הדמיות',
intro:'כל מגבר מתואר בשלושה מספרים: התנגדות כניסה, התנגדות מוצא והגבר. כאן תראה איך המקור והעומס "גונבים" הגבר, ותשווה בין שלוש תצורות ה-MOSFET עם אות חי שזורם במעגל.',
build(root){
section(root,{id:'l4-model',tag:'מודל כללי',title:'המגבר כקופסה: איפה הולך ההגבר?',short:'מודל מגבר',
lead:'מקור <span class="m">v<sub>sig</sub></span> עם <span class="m">R<sub>sig</sub></span> מזין מגבר מתח (<span class="m">R<sub>in</sub></span>, <span class="m">A<sub>vo</sub></span>, <span class="m">R<sub>o</sub></span>) שמזין עומס <span class="m">R<sub>L</sub></span>. בכניסה ובמוצא יש מחלקי מתח, ולכן ההגבר הכולל תמיד קטן מ-<span class="m">A<sub>vo</sub></span>.',
body:'<div class="lab"><div class="controls"><div class="sliders" id="am-ctl"></div></div><div class="scopes">'+circ('cx-am',lg('t1','זרם','dot'))+'<div class="note"><h3>שרשרת ההגבר</h3><div id="am-chain"></div></div></div></div><div class="readouts" id="r-am"></div>'+
'<div class="tbl"><table><thead><tr><th>סוג מגבר</th><th>פרמטר הגבר</th><th>R<sub>i</sub> אידיאלי</th><th>R<sub>o</sub> אידיאלי</th></tr></thead><tbody><tr><td>מתח</td><td class="n">A<sub>vo</sub> = v<sub>o</sub>/v<sub>i</sub> [V/V]</td><td>∞</td><td>0</td></tr><tr><td>זרם</td><td class="n">A<sub>is</sub> = i<sub>o</sub>/i<sub>i</sub> [A/A]</td><td>0</td><td>∞</td></tr><tr><td>טרנס-מוליכות</td><td class="n">G<sub>m</sub> = i<sub>o</sub>/v<sub>i</sub> [A/V]</td><td>∞</td><td>∞</td></tr><tr><td>טרנס-התנגדות</td><td class="n">R<sub>m</sub> = v<sub>o</sub>/i<sub>i</sub> [V/A]</td><td>0</td><td>0</td></tr></tbody></table></div>'+
notes('<h3>ההיגיון</h3><ul><li>מגבר מתח טוב "מקשיב" בלי להעמיס (<span class="m">R<sub>in</sub> ≫ R<sub>sig</sub></span>) ו"מדבר" בלי ליפול (<span class="m">R<sub>o</sub> ≪ R<sub>L</sub></span>).</li><li>הקטן את <span class="m">R<sub>in</sub></span> עד שיהיה בערך <span class="m">R<sub>sig</sub></span> וראה חצי מהאות הולך לאיבוד כבר בכניסה.</li><li>זו הסיבה שמשרשרים דרגות: CD (חוצץ) לפני עומס נמוך, או CG כשהמקור הוא מקור זרם.</li></ul>',
'<h3>נוסחאות</h3>'+F('','G<sub>v</sub> = v<sub>o</sub>/v<sub>sig</sub> = R<sub>in</sub>/(R<sub>in</sub>+R<sub>sig</sub>) · A<sub>vo</sub> · R<sub>L</sub>/(R<sub>L</sub>+R<sub>o</sub>)')+F('','A<sub>v</sub> = A<sub>vo</sub>·R<sub>L</sub>/(R<sub>L</sub>+R<sub>o</sub>)')+F('שקילות:','A<sub>vo</sub> = G<sub>m</sub>R<sub>o</sub>'))});
(function(){
  const C=Circuit('cx-am',440,200);
  C.V([30,160],[30,90],'v_{sig}',{kind:'ac',side:1,off:28});C.w([30,90],[30,50],[50,50]);C.R([50,50],[120,50],'R_{sig}',{side:-1});C.w([120,50],[160,50]);C.nd(160,50);
  C.R([160,50],[160,160],'R_{in}',{side:1});C.T(150,105,'v_i','val2','end');
  C.dep([260,160],[260,50],'A_{vo}v_i',{kind:'v',side:-1,off:34});C.w([260,50],[285,50]);C.R([285,50],[355,50],'R_o',{side:-1});C.w([355,50],[400,50]);C.nd(400,50);
  C.R([400,50],[400,160],'R_L',{side:-1});C.w([30,160],[30,175],[400,175]);C.w([160,160],[160,175]);C.w([260,160],[260,175]);C.w([400,160],[400,175]);
  mk('rect',{x:140,y:30,width:180,height:150,rx:8,fill:'none',stroke:'var(--scope-axis)','stroke-dasharray':'5 4'},C.svg);C.T(230,22,'מגבר','he','middle');
  C.flow('in',[[30,90],[30,50],[160,50],[160,175],[30,175],[30,160]]);C.flow('out',[[260,50],[400,50],[400,175],[260,175],[260,160]]);
  const st=sliders('am-ctl',[
    {key:'Rs',id:'am-rs',label:'R<sub>sig</sub>',min:0,max:40,step:0.5,value:10,map:v=>Math.pow(10,v/10)*10,fmt:v=>si(v,'Ω')},
    {key:'Ri',id:'am-ri',label:'R<sub>in</sub>',min:10,max:60,step:0.5,value:50,map:v=>Math.pow(10,v/10),fmt:v=>si(v,'Ω')},
    {key:'A',id:'am-a',label:'A<sub>vo</sub>',min:1,max:500,step:1,value:100,fmt:v=>v+' V/V'},
    {key:'Ro',id:'am-ro',label:'R<sub>o</sub>',min:0,max:40,step:0.5,value:20,map:v=>Math.pow(10,v/10),fmt:v=>si(v,'Ω')},
    {key:'RL',id:'am-rl',label:'R<sub>L</sub>',min:10,max:50,step:0.5,value:30,map:v=>Math.pow(10,v/10),fmt:v=>si(v,'Ω')}],upd);
  function upd(){const {Rs,Ri,A,Ro,RL}=st,ki=Ri/(Ri+Rs),ko=RL/(RL+Ro),Gv=ki*A*ko;
    C.I('in',0.35);C.I('out',clamp(Gv/200,0.2,1));
    const bar=(lbl,v,c)=>'<div style="display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-top:8px"><span>'+lbl+'</span><span class="m">'+v+'</span></div><div class="bar2"><span style="width:'+c+'%;background:var(--accent)"></span></div>';
    document.getElementById('am-chain').innerHTML=bar('מחלק כניסה R<sub>in</sub>/(R<sub>in</sub>+R<sub>sig</sub>)',ki.toFixed(3),ki*100)+bar('הגבר עצמי A<sub>vo</sub>',A.toFixed(0),100)+bar('מחלק מוצא R<sub>L</sub>/(R<sub>L</sub>+R<sub>o</sub>)',ko.toFixed(3),ko*100)+bar('G<sub>v</sub> מתוך A<sub>vo</sub>',(Gv/A*100).toFixed(1)+'%',Gv/A*100);
    readouts('r-am',[['G<sub>v</sub> = v<sub>o</sub>/v<sub>sig</sub>',Gv.toFixed(2)+' V/V'],['G<sub>v</sub> [dB]',db(Gv).toFixed(1)+' dB'],['A<sub>v</sub> (מ-v<sub>i</sub>)',(A*ko).toFixed(2)],['אובדן בכניסה',((1-ki)*100).toFixed(1)+'%'],['אובדן במוצא',((1-ko)*100).toFixed(1)+'%']]);}
  upd();
})();

section(root,{id:'l4-cfg',tag:'תצורות',title:'CS, CG ו-CD עם אות חי',short:'CS/CG/CD',
lead:'בכל תצורה הדק אחד משותף לכניסה ולמוצא. האות (10mV) זורם במעגל. שים לב לכיוון זרם האות בעומס ביחס לכניסה (היפוך פאזה), ולגודל ההגבר. הנוסחאות הן הכלליות מהסיכום, כולל <span class="m">r<sub>o</sub></span>.',
body:'<div class="lab"><div class="controls"><div class="seg" id="cf4-sel"><button type="button" data-v="cs" aria-pressed="true">CS</button><button type="button" data-v="cg" aria-pressed="false">CG</button><button type="button" data-v="cd" aria-pressed="false">CD</button></div><div class="sliders" id="cf4-ctl"></div></div>'+
'<div class="scopes"><div>'+circ('cx-cs',lg('t1','זרם האות','dot'),true)+circ('cx-cg',lg('t1','זרם האות','dot'),true)+circ('cx-cd',lg('t1','זרם האות','dot'),true)+'</div>'+scope('c-cf4','short',lg('t2','v<sub>i</sub>(t) [mV]')+lg('t1','v<sub>o</sub>(t) [mV]'),'כניסה ומוצא')+'</div></div><div class="readouts" id="r-cf4"></div>'+
'<div class="tbl"><table><thead><tr><th>תצורה</th><th>R<sub>in</sub></th><th>R<sub>out</sub></th><th>A<sub>v</sub> (r<sub>o</sub>→∞)</th><th>אופי</th></tr></thead><tbody id="cf4-tb"></tbody></table></div>'+
notes('<h3>מה לראות</h3><ul><li><b>CS</b>: הגבר גבוה והופך. <span class="m">R<sub>S</sub></span> לא מעוקף מקטין את ההגבר פי <span class="m">(1+g<sub>m</sub>R<sub>S</sub>)</span> אבל מגדיל את <span class="m">R<sub>o</sub></span>.</li><li><b>CG</b>: אותו גודל הגבר כמו CS (בלי R<sub>S</sub>), אבל לא הופך. <span class="m">R<sub>in</sub> ≈ 1/g<sub>m</sub></span> נמוכה.</li><li><b>CD</b> (עוקב מקור): <span class="m">A<sub>v</sub> ≈ 1</span>, <span class="m">R<sub>in</sub> → ∞</span>, <span class="m">R<sub>out</sub> ≈ 1/g<sub>m</sub></span>. חוצץ מתח.</li></ul>',
'<h3>נוסחאות כלליות</h3>'+F('CS:','A<sub>v</sub> = −g<sub>m</sub>(R<sub>L</sub>‖R<sub>D</sub>)/((1+g<sub>m</sub>R<sub>S</sub>) + (R<sub>S</sub>+R<sub>L</sub>‖R<sub>D</sub>)/r<sub>o</sub>)')+F('CS:','R<sub>o</sub> = (g<sub>m</sub>R<sub>S</sub>+1)r<sub>o</sub> + R<sub>S</sub>')+F('CG:','A<sub>v</sub> = (1+g<sub>m</sub>r<sub>o</sub>)(R<sub>L</sub>‖R<sub>D</sub>)/(r<sub>o</sub>+R<sub>L</sub>‖R<sub>D</sub>)')+F('CG:','R<sub>in</sub> = (1+R<sub>L</sub>‖R<sub>D</sub>/r<sub>o</sub>)/(1/r<sub>o</sub>+g<sub>m</sub>)')+F('CD:','A<sub>v</sub> = g<sub>m</sub>(r<sub>o</sub>‖R<sub>L</sub>‖R<sub>S</sub>)/(1+g<sub>m</sub>(r<sub>o</sub>‖R<sub>L</sub>‖R<sub>S</sub>))')+F('CD:','R<sub>out</sub> = (r<sub>o</sub>‖R<sub>S</sub>)/(1+g<sub>m</sub>(r<sub>o</sub>‖R<sub>S</sub>))'))});

    {key:'Rsig',id:'cf4-rsig',label:'R<sub>sig</sub> (ב-CG)',min:0,max:10,step:0.1,value:0.5,map:v=>v*1000,fmt:v=>si(v,'Ω')}],upd);
  let R=null;
  function calc(){const {gm,ro,RD,RS,RL,Rsig}=st,RLD=par(RL,RD),out={};
    const CSro=isFinite(ro)?ro:1e15,RSs=RS;
    out.cs={Rin:Infinity,Ro:isFinite(ro)?(gm*RSs+1)*ro+RSs:Infinity,Av:-gm*RLD/((1+gm*RSs)+(RSs+RLD)/CSro)};out.cs.Rout=par(out.cs.Ro,RD);
    const RSg=RS>0?RS:Infinity;
    out.cg={Rin:(1+RLD/CSro)/(1/CSro+gm),Ro:isFinite(ro)?(gm*ro+1)*par(Rsig||1e-9,RSg)+ro:Infinity,Av:(1+gm*CSro)*RLD/(CSro+RLD)};out.cg.Rout=par(out.cg.Ro,RD);
    const RSd=RS>0?RS:Infinity,x=par(par(CSro,RL),RSd),y=par(CSro,RSd);
    out.cd={Rin:Infinity,Ro:isFinite(y)?y/(1+gm*y):1/gm,Av:isFinite(x)?gm*x/(1+gm*x):1};out.cd.Rout=out.cd.Ro;
    return out;}
  const vin=10;
  function tick(k,t){const r=R[k],ph=(t*0.35)%2,s=Math.sin(2*Math.PI*ph),cc=Cs[k];
    const vi=vin*s,vo=r.Av*vi,id=k==='cd'?st.gm*vi/(1+st.gm*par(st.RS||Infinity,st.RL)):st.gm*vi;
    cc.I('d',Math.abs(s)*0.9,Math.sign(k==='cg'?-s:s)||1);cc.I('l',Math.abs(s)*0.9,Math.sign(vo)||1);
    const P1=[],P2=[];for(let i=0;i<=200;i++){const tt=2*i/200;P1.push([tt,vin*Math.sin(2*Math.PI*tt)]);P2.push([tt,r.Av*vin*Math.sin(2*Math.PI*tt)]);}
    const y=Math.max(Math.abs(r.Av)*vin,vin)*1.2;draw(cv,{x0:0,x1:2,y0:-y,y1:y,xl:'t / T',yl:'[mV]',cursor:ph,series:[{c:'t2',w:2,pts:P1},{c:'t1',w:2.6,pts:P2}]});}
  ['cs','cg','cd'].forEach(k=>{Cs[k].tick=t=>{if(getT()===k)tick(k,t);};});
  function upd(){R=calc();const k=getT(),r=R[k];Cs.cs.st('rs',st.RS>0?null:'dim');
    readouts('r-cf4',[['A<sub>v</sub>',r.Av.toFixed(2)+' V/V'],['|A<sub>v</sub>| [dB]',db(r.Av).toFixed(1)+' dB'],['R<sub>in</sub>',si(r.Rin,'Ω')],['R<sub>o</sub> (לתוך הטרנזיסטור)',si(r.Ro,'Ω')],['R<sub>out</sub>',si(r.Rout,'Ω')],['פאזה',r.Av<0?pill('הופך 180°','warn'):pill('לא הופך','ok'),'html']]);
    const nm={cs:'CS · מקור משותף',cg:'CG · שער משותף',cd:'CD · עוקב מקור'},ch={cs:'הגבר מתח גבוה, הופך',cg:'R<sub>in</sub> נמוכה, לא הופך, תדרים גבוהים',cd:'חוצץ: A<sub>v</sub>≈1, R<sub>out</sub> נמוכה'};
    document.getElementById('cf4-tb').innerHTML=['cs','cg','cd'].map(q=>'<tr'+(q===k?' class="on"':'')+'><td>'+nm[q]+'</td><td class="n">'+si(R[q].Rin,'Ω')+'</td><td class="n">'+si(R[q].Rout,'Ω')+'</td><td class="n">'+R[q].Av.toFixed(2)+'</td><td>'+ch[q]+'</td></tr>').join('');
    tick(k,Cs[k].t);}
  show();upd();
})();
},
quiz:[
{q:'מקור עם R<sub>sig</sub>=10kΩ מחובר למגבר עם R<sub>in</sub>=10kΩ. איזה חלק מ-v<sub>sig</sub> מגיע לכניסת המגבר?',o:['100%','50%','10%','0%'],a:1,e:'מחלק מתח: R<sub>in</sub>/(R<sub>in</sub>+R<sub>sig</sub>) = 10k/20k = 0.5.'},
{q:'מגבר מתח אידיאלי מאופיין ב:',o:['R<sub>in</sub>=0, R<sub>o</sub>=∞','R<sub>in</sub>=∞, R<sub>o</sub>=0','R<sub>in</sub>=∞, R<sub>o</sub>=∞','R<sub>in</sub>=0, R<sub>o</sub>=0'],a:1,e:'כדי לא להעמיס את המקור ולא לאבד מתח על העומס: R<sub>in</sub>→∞ ו-R<sub>o</sub>→0.'},

LESSONS[5]={title:'טרנזיסטור BJT',sub:'מבנה, מצבי פעולה, קו עבודה, היבריד-π, מגברי CE/CC/CB',topics:'5 הדמיות',
intro:'ה-BJT בנוי משתי דיודות גב אל גב. זרם בסיס קטן שולט בזרם קולט גדול פי β. תראה את האלקטרונים חוצים את הבסיס הדק, את נקודת העבודה זזה על קו העבודה עד לרוויה, ואת הרגע שבו "אות קטן" כבר לא קטן.',
build(root){
const bjt={mode:'act',IC:1e-3,IB:1e-5,IE:1.01e-3,beta:100,flow:0.5,back:0};
section(root,{id:'l5-modes',tag:'מצבי פעולה',title:'NPN חי: זרמים, צמתים וקו עבודה',short:'מצבי פעולה',
lead:'<span class="m">V<sub>BB</sub></span> ← <span class="m">R<sub>B</sub></span> ← בסיס. <span class="m">V<sub>CC</sub></span> ← <span class="m">R<sub>C</sub></span> ← קולט. פולט דרך <span class="m">R<sub>E</sub></span> לאדמה. מצב הפעולה נקבע לפי הממתח של כל צומת (BE ו-BC).',
body:'<div class="lab"><div class="controls"><div class="presets"><button type="button" data-preset="bj-a">דוגמה סעיף א (0.8V)</button><button type="button" data-preset="bj-b">סעיף ב (1V, רוויה)</button><button type="button" data-preset="bj-c">קטעון</button><button type="button" data-preset="bj-d">דוגמה עם R<sub>E</sub></button></div><div class="sliders" id="bj-ctl"></div></div>'+
'<div class="scopes">'+circ('cx-bj',lg('t1','זרם','dot')+'<span>עובי הזרם ∝ log I</span>')+scope('c-bj','',lg('scope-axis','I<sub>C</sub>(V<sub>CE</sub>) לזרמי בסיס שונים')+lg('t1','I<sub>B</sub> הנוכחי')+lg('t2','קו עבודה')+lg('t3','Q','dot'),'אופייני מוצא')+scope('c-bj2','wide',lg('t2','אלקטרונים מהפולט','dot')+lg('t3','התאחדות בבסיס (I<sub>B</sub>)','dot')+lg('t5','הזרקה מהקולט (רוויה)','dot'),'זרימת אלקטרונים')+'</div></div><div class="readouts" id="r-bj"></div>'+
'<div class="note" style="margin-top:14px"><h3>מצב הצמתים</h3><div class="junc" id="bj-junc"></div><div class="tbl"><table><thead><tr><th>מצב</th><th>BE</th><th>BC</th><th>תנאים</th><th>נוסחאות</th></tr></thead><tbody>'+
'<tr data-mode="cut"><td>קטעון</td><td>אחורי</td><td>אחורי</td><td class="n">V<sub>BE</sub> &lt; 0.7V</td><td class="n">I<sub>C</sub>=I<sub>B</sub>=0, V<sub>CE</sub>=V<sub>CC</sub></td></tr><tr data-mode="act"><td>פעיל קדמי</td><td>קדמי</td><td>אחורי</td><td class="n">V<sub>BE</sub>=0.7, V<sub>CE</sub>&gt;V<sub>BE</sub></td><td class="n">I<sub>C</sub>=βI<sub>B</sub>=αI<sub>E</sub></td></tr><tr data-mode="sat"><td>רוויה</td><td>קדמי</td><td>קדמי</td><td class="n">V<sub>CE</sub>=V<sub>CE,sat</sub>≈0.2V</td><td class="n">I<sub>C</sub> &lt; βI<sub>B</sub></td></tr></tbody></table></div></div>'+
notes('<h3>מה לראות</h3><ul><li>בפעיל קדמי העקומות אופקיות: <span class="m">I<sub>C</sub></span> נקבע על ידי <span class="m">I<sub>B</sub></span> ולא על ידי <span class="m">V<sub>CE</sub></span>. מקור זרם מבוקר.</li><li>הגדל את <span class="m">V<sub>BB</sub></span>: Q מטפסת על קו העבודה עד הברך. רוויה: הגדלת <span class="m">I<sub>B</sub></span> לא מגדילה את <span class="m">I<sub>C</sub></span>, ו-<span class="m">β<sub>forced</sub> &lt; β</span>.</li><li>בהדמיה: בערך אחד מכל <span class="m">β+1</span> אלקטרונים מתאחד בבסיס. המונה מודד את זה.</li><li>הקטן את <span class="m">V<sub>A</sub></span>: העקומות מקבלות שיפוע (Early), <span class="m">r<sub>o</sub> = V<sub>A</sub>/I<sub>C</sub></span>.</li></ul>',
'<h3>הפתרון</h3>'+F('KCL:','I<sub>E</sub> = I<sub>B</sub> + I<sub>C</sub> = (β+1)I<sub>B</sub>')+F('KVL בסיס:','V<sub>BB</sub> = I<sub>B</sub>R<sub>B</sub> + 0.7 + I<sub>E</sub>R<sub>E</sub>')+F('KVL קולט:','V<sub>CC</sub> = I<sub>C</sub>R<sub>C</sub> + V<sub>CE</sub> + I<sub>E</sub>R<sub>E</sub>')+F('קשרים:','α = β/(β+1) · β = α/(1−α)')+'<p>מניחים פעיל ומחשבים <span class="m">V<sub>CE</sub></span>. אם יצא <span class="m">V<sub>CE</sub> &lt; V<sub>CE,sat</sub></span>: רוויה, <span class="m">I<sub>C,sat</sub> = (V<sub>CC</sub>−V<sub>CE,sat</sub>)/R<sub>C</sub></span>.</p>')});
const stats={n:0,rec:0};
(function(){
  const cv=reg('c-bj'),VCEs=0.2;
  const C=Circuit('cx-bj',420,250);
  C.rail(300,18,'V_{CC}');C.w([300,18],[300,30]);C.R([300,30],[300,85],'R_C',{side:1});C.w([300,85],[300,95]);
  const q=C.npn(290,125,{id:'q'});C.nd(300,90);
  C.R([300,155],[300,205],'R_E',{side:1,id:'re'});C.w([300,205],[300,220]);C.G(300,220);
  C.w(q.b,[250,125]);C.R([250,125],[160,125],'R_B',{side:-1});C.w([160,125],[110,125],[110,150]);C.V([110,210],[110,150],'V_{BB}',{side:1,off:30});C.w([110,210],[110,220]);C.G(110,220);
  C.flow('c',[[300,30],[300,95],[300,155]]);C.flow('b',[[110,150],[110,125],[270,125],[285,140]]);C.flow('e',[[300,155],[300,220]]);
  C.T(318,65,'','val','start',null,'ic');C.T(200,108,'','val','middle',null,'ib');C.T(318,190,'','val','start',null,'ie');C.T(345,130,'','val2','start',null,'vce');
  const st=sliders('bj-ctl',[
    {key:'VBB',id:'bj-vbb',label:'V<sub>BB</sub>',min:0,max:3,step:0.01,value:0.8,fmt:v=>v.toFixed(2)+' V'},
    {key:'RB',id:'bj-rb',label:'R<sub>B</sub>',min:1,max:200,step:1,value:10,map:v=>v*1000,fmt:v=>si(v,'Ω')},
    {key:'RC',id:'bj-rc',label:'R<sub>C</sub>',min:0.5,max:80,step:0.5,value:15,map:v=>v*1000,fmt:v=>si(v,'Ω')},
    {key:'RE',id:'bj-re',label:'R<sub>E</sub>',min:0,max:3000,step:10,value:0,fmt:v=>si(v,'Ω')},
    {key:'VCC',id:'bj-vcc',label:'V<sub>CC</sub>',min:3,max:24,step:0.5,value:20,fmt:v=>v.toFixed(1)+' V'},
    {key:'beta',id:'bj-beta',label:'β',min:20,max:300,step:5,value:100,fmt:v=>String(v)},
    {key:'VA',id:'bj-va',label:'V<sub>A</sub>',min:20,max:310,step:10,value:310,map:v=>v>=310?Infinity:v,fmt:v=>isFinite(v)?v+' V':'∞'}],upd);
  function solve(p){const {VBB,RB,RC,RE,VCC,beta,VA}=p;
    if(VBB<=0.7)return {mode:'cut',IB:0,IC:0,IE:0,VCE:VCC,VBE:VBB};
    let IB=(VBB-0.7)/(RB+(beta+1)*RE),IC=beta*IB,VCE;
    for(let k=0;k<30;k++){VCE=VCC-IC*RC-(IC+IB)*RE;const e=isFinite(VA)?(1+Math.max(0,VCE)/VA):1;IB=(VBB-0.7)/(RB+(beta*e+1)*RE);IC=beta*IB*e;}
    VCE=VCC-IC*RC-(IC+IB)*RE;if(VCE>=VCEs)return {mode:'act',IB,IC,IE:IB+IC,VCE,VBE:0.7};
    const a11=RB+RE,a12=RE,b1=VBB-0.7,a21=RE,a22=RC+RE,b2=VCC-VCEs,det=a11*a22-a12*a21;IB=(b1*a22-a12*b2)/det;IC=(a11*b2-a21*b1)/det;
    return {mode:'sat',IB,IC,IE:IB+IC,VCE:VCEs,VBE:0.7};}
  const curveI=(IB,v,beta,VA)=>beta*IB*(1-Math.exp(-v/0.07))*(isFinite(VA)?(1+v/VA):1);
  function upd(){const p=st,s=solve(p),Rt=p.RC+p.RE,ICsat=(p.VCC-VCEs)/Rt,x1=p.VCC*1.06,y1=Math.max(ICsat,s.IC)*1e3*1.35,step=ICsat/p.beta/5,series=[];
    for(let k=1;k<=7;k++){const IB=k*step,pts=[];for(let i=0;i<=160;i++){const v=x1*i/160;pts.push([v,curveI(IB,v,p.beta,p.VA)*1e3]);}series.push({c:'axis',w:1.3,pts});}
    if(s.IB>0){const pts=[];for(let i=0;i<=200;i++){const v=x1*i/200;pts.push([v,curveI(s.IB,v,p.beta,p.VA)*1e3]);}series.push({c:'t1',w:2.6,pts});}
    series.push({c:'t2',w:2.2,pts:[[0,p.VCC/Rt*1e3],[p.VCC,0]]});
    draw(cv,{x0:0,x1,y0:0,y1,xl:'V_CE [V]',yl:'I_C [mA]',bands:[{x0:0,x1:VCEs*1.6,c:'t3',a:.12,label:'רוויה'},{y0:0,y1:y1*0.025,c:'t5',a:.25}],series,points:[{x:s.VCE,y:s.IC*1e3,c:'t3',label:'Q ('+s.VCE.toFixed(2)+'V, '+si(s.IC,'A')+')'}]});
    const Imax=Math.max(ICsat,1e-6);C.I('c',mag(s.IC,Imax));C.I('b',mag(s.IB,Imax));C.I('e',mag(s.IE,Imax));C.st('re',p.RE>0?null:'dim');
    C.st('q',s.mode==='cut'?'dim':s.mode==='sat'?'hot':'on');
    C.set('ic','I_C = '+si(s.IC,'A'));C.set('ib','I_B = '+si(s.IB,'A'));C.set('ie','I_E = '+si(s.IE,'A'));C.set('vce','V_{CE} = '+s.VCE.toFixed(2)+' V');
    const names={cut:'קטעון',act:'פעיל קדמי',sat:'רוויה'},cls={cut:'mute',act:'ok',sat:'warn'};
    readouts('r-bj',[['מצב',pill(names[s.mode],cls[s.mode]),'html'],['I<sub>B</sub>',si(s.IB,'A')],['I<sub>C</sub>',si(s.IC,'A')],['I<sub>E</sub>',si(s.IE,'A')],['V<sub>CE</sub>',fx(s.VCE,3)+' V'],['V<sub>CB</sub>',fx(s.VCE-s.VBE,3)+' V'],['I<sub>C,sat</sub>',si(ICsat,'A')],['β<sub>forced</sub>',s.IB>0?(s.IC/s.IB).toFixed(1):'—'],['α',(p.beta/(p.beta+1)).toFixed(4)],['r<sub>o</sub>',s.IC>0?si(p.VA/s.IC,'Ω'):'—'],['נקלטו בבסיס','<span class="v" id="bj-count">—</span>','html']]);
    const be=s.mode!=='cut',bc=s.mode==='sat';
    document.getElementById('bj-junc').innerHTML='<span class="term">E</span><span class="jn '+(be?'fwd':'rev')+'">BE '+(be?'קדמי':'אחורי')+'</span><span class="term">B</span><span class="jn '+(bc?'fwd':'rev')+'">BC '+(bc?'קדמי':'אחורי')+'</span><span class="term">C</span>';
    document.querySelectorAll('#l5-modes tr[data-mode]').forEach(tr=>tr.classList.toggle('on',tr.dataset.mode===s.mode));
    Object.assign(bjt,{mode:s.mode,IC:s.IC,IB:s.IB,IE:s.IE,beta:p.beta,flow:s.mode==='cut'?0:Math.min(1,Math.max(0.12,Math.sqrt(s.IC/ICsat))),back:s.mode==='sat'?Math.min(0.6,Math.max(0.15,1-s.IC/(p.beta*s.IB))):0});stats.n=0;stats.rec=0;}
  presets({'bj-a':{'bj-vbb':0.8,'bj-rb':10,'bj-rc':15,'bj-re':0,'bj-vcc':20,'bj-beta':100,'bj-va':310},'bj-b':{'bj-vbb':1,'bj-rb':10,'bj-rc':15,'bj-re':0,'bj-vcc':20,'bj-beta':100,'bj-va':310},'bj-c':{'bj-vbb':0.6},
    'bj-d':{'bj-vbb':0.8,'bj-rb':68,'bj-rc':70,'bj-re':280,'bj-vcc':15,'bj-beta':100,'bj-va':310}});
  const cvA=reg('c-bj2'),E1=0.36,B1=0.5,parts=[],holes=[];
  function stepA(dt){const s=bjt;
    if(dt>0){let sp=s.flow*1.6*dt;while(sp>0){if(Math.random()<sp&&parts.length<260)parts.push({x:0.02,y:0.12+Math.random()*0.76,v:0.0045+Math.random()*0.003,st:0,life:1,back:false});sp-=1;}
      let bs=s.back*0.9*dt;while(bs>0){if(Math.random()<bs&&parts.length<260)parts.push({x:0.97,y:0.12+Math.random()*0.76,v:-(0.004+Math.random()*0.002),st:0,life:1,back:true});bs-=1;}}
    for(let i=parts.length-1;i>=0;i--){const p=parts[i];
      if(p.st===2){p.life-=0.06*dt;if(p.life<=0)parts.splice(i,1);continue;}
      p.x+=p.v*dt;p.y=clamp(p.y+(Math.random()-.5)*0.012*dt,0.08,0.92);
      if(!p.back&&p.st===0&&p.x>E1){p.st=1;stats.n++;if(Math.random()<1/(s.beta+1))p.recAt=E1+Math.random()*(B1-E1);}
      if(!p.back&&p.recAt&&p.x>=p.recAt){p.st=2;p.life=1;stats.rec++;holes.push({x:p.x,y:0.98,ty:p.y,life:1});}
      if(p.back&&p.x<B1-0.04-Math.random()*0.08){p.st=2;p.life=1;}
      if(p.x>1.01||p.x<-0.01)parts.splice(i,1);}
    for(let i=holes.length-1;i>=0;i--){const h=holes[i];h.y+=(h.ty-h.y)*0.15*dt;h.life-=0.03*dt;if(h.life<=0)holes.splice(i,1);}
    const el=document.getElementById('bj-count');if(el)el.textContent=stats.n>0?stats.rec+' / '+stats.n+' (≈1/'+(stats.rec?Math.round(stats.n/stats.rec):'∞')+', צפוי 1/'+(s.beta+1)+')':'—';}
  function drawA(){const c=prep(cvA);if(!c)return;const {g,W,H}=c,P=pal(),s=bjt;
    g.fillStyle=P.nreg;g.fillRect(0,0,E1*W,H);g.fillStyle=P.preg;g.fillRect(E1*W,0,(B1-E1)*W,H);g.fillStyle=P.nreg;g.fillRect(B1*W,0,(1-B1)*W,H);
    g.globalAlpha=.35;g.fillStyle=P.dep;const beW=s.mode==='cut'?0.03:0.008,bcW=s.mode==='sat'?0.008:0.035;g.fillRect((E1-beW/2)*W,0,beW*W,H);g.fillRect((B1-bcW/3)*W,0,bcW*W,H);g.globalAlpha=1;
    g.fillStyle=P.hi;g.font='700 14px Rubik, sans-serif';g.textBaseline='top';g.textAlign='center';g.fillText('E · N⁺ פולט',E1*W/2,8);g.fillText('B · P',(E1+B1)/2*W,8);g.fillText('C · N קולט',(B1+1)/2*W,8);
    holes.forEach(h=>{g.globalAlpha=Math.max(0,h.life);g.strokeStyle=P.t3;g.lineWidth=1.8;g.beginPath();g.arc(h.x*W,h.y*H,3.6,0,7);g.stroke();});g.lineWidth=1;
    parts.forEach(p=>{g.globalAlpha=p.st===2?Math.max(0,p.life):1;if(p.st===2&&!p.back){g.fillStyle=P.t3;g.beginPath();g.arc(p.x*W,p.y*H,5*(1.4-p.life),0,7);g.fill();}else{g.fillStyle=p.back?P.t5:P.t2;g.beginPath();g.arc(p.x*W,p.y*H,2.8,0,7);g.fill();}});
    g.globalAlpha=1;g.font='600 11.5px "JetBrains Mono", monospace';g.fillStyle=P.t4;g.textBaseline='bottom';g.textAlign='left';g.fillText('I_E '+si(s.IE,'A'),8,H-6);g.textAlign='right';g.fillText('I_C '+si(s.IC,'A'),W-8,H-6);
    g.textAlign='center';g.fillStyle=P.t3;g.fillText('I_B '+si(s.IB,'A'),(E1+B1)/2*W,H-14);
    if(s.mode==='cut'){g.fillStyle=P.hi;g.font='600 14px Assistant, sans-serif';g.textBaseline='middle';g.fillText('קטעון: BE בממתח אחורי, אין הזרקה',W/2,H/2);}}
  animator(cvA,drawA,stepA);upd();
})();

section(root,{id:'l5-ce',tag:'אות קטן',title:'מגבר פולט משותף: היכן נגמר "האות הקטן"',short:'מגבר CE',
lead:'הטרנזיסטור מוטה ב-<span class="m">I<sub>C</sub></span>, המוצא מצומד לעומס כך ש-<span class="m">R\'<sub>L</sub> = R<sub>C</sub>‖R<sub>L</sub></span>, ו-<span class="m">R<sub>E</sub></span> לא מעוקף. הסקופ מראה את התגובה המדויקת (<span class="m">i<sub>c</sub> = I<sub>C</sub>e<sup>v<sub>be</sub>/V<sub>T</sub></sup></span>, עם קטימה) מול קירוב האות הקטן.',
body:'<div class="lab"><div class="controls"><div class="sliders" id="ce-ctl"></div></div><div class="scopes">'+scope('c-ce','',lg('t1','v<sub>out</sub> מדויק')+lg('t3','A<sub>v</sub>·v<sub>in</sub>','dash')+lg('t5','גבולות רוויה/קטעון','dash'),'מוצא CE')+scope('c-ce2','short',lg('t2','v<sub>in</sub> [mV]'),'כניסה')+'</div></div><div class="readouts" id="r-ce"></div>'+
notes('<h3>מה לראות</h3><ul><li>עם <span class="m">R<sub>E</sub>=0</span> ו-1–2mV העקומות כמעט חופפות. ב-5mV כבר רואים ~10% אי-סימטריה, וב-20mV עיוות חזק: <span class="m">v<sub>be</sub></span> לא קטן ביחס ל-<span class="m">V<sub>T</sub></span>.</li><li>הוסף <span class="m">R<sub>E</sub></span> של 100–200Ω: ההגבר יורד ל-<span class="m">≈ −R\'<sub>L</sub>/R<sub>E</sub></span> והצורה חוזרת לסינוס. משוב שלילי מקומי.</li><li>הגדל <span class="m">R<sub>C</sub></span>: <span class="m">V<sub>CE,Q</sub></span> יורד והקטימה ברוויה מתחילה מוקדם.</li></ul>',
'<h3>היבריד-π</h3>'+F('','g<sub>m</sub> = I<sub>C</sub>/V<sub>T</sub> · r<sub>π</sub> = β/g<sub>m</sub> · r<sub>e</sub> = α/g<sub>m</sub>')+F('','A<sub>v</sub> = −βR\'<sub>L</sub>/(r<sub>π</sub>+(β+1)R<sub>E</sub>)')+F('R<sub>E</sub>→0:','A<sub>v</sub> = −g<sub>m</sub>R\'<sub>L</sub>')+F('','R<sub>in</sub> = r<sub>π</sub>+(β+1)R<sub>E</sub>'))});
(function(){
  const cv=reg('c-ce'),cv2=reg('c-ce2');
  const st=sliders('ce-ctl',[
    {key:'vin',id:'ce-vin',label:'v<sub>in</sub> (שיא)',min:1,max:100,step:1,value:2,map:v=>v/1000,fmt:v=>si(v,'V')},
    {key:'IC',id:'ce-ic',label:'I<sub>C</sub>',min:0.1,max:5,step:0.05,value:1,map:v=>v/1000,fmt:v=>si(v,'A')},
    {key:'RC',id:'ce-rc',label:'R<sub>C</sub>',min:0.5,max:15,step:0.1,value:4.7,map:v=>v*1000,fmt:v=>si(v,'Ω')},
    {key:'RL',id:'ce-rl',label:'R<sub>L</sub>',min:1,max:100,step:1,value:10,map:v=>v*1000,fmt:v=>si(v,'Ω')},
    {key:'RE',id:'ce-re',label:'R<sub>E</sub>',min:0,max:1000,step:10,value:0,fmt:v=>si(v,'Ω')},
    {key:'beta',id:'ce-beta',label:'β',min:20,max:300,step:5,value:100,fmt:v=>String(v)},
    {key:'VCC',id:'ce-vcc',label:'V<sub>CC</sub>',min:5,max:24,step:0.5,value:12,fmt:v=>v.toFixed(1)+' V'}],upd);
  function upd(){const {vin,IC,RC,RL,RE,beta,VCC}=st,alpha=beta/(beta+1),gm=IC/VT,rpi=beta/gm,re=alpha/gm,RLp=RC*RL/(RC+RL),Av=-beta*RLp/(rpi+(beta+1)*RE),VCEQ=VCC-IC*RC,upL=IC*RLp,loL=-(VCEQ-0.2);
    const act=[],ideal=[],vi=[];let mx=-1e9,mn=1e9;
    for(let i=0;i<=400;i++){const t=2*i/400,v=vin*Math.sin(2*Math.PI*t);const vbe=RE>0?bisect(x=>x+RE*IC*(Math.exp(x/VT)-1)/alpha-v,-2,0.6):v;
      let vo=-IC*(Math.exp(Math.min(vbe,0.6)/VT)-1)*RLp;vo=clamp(vo,loL,upL);act.push([t,vo]);ideal.push([t,Av*v]);vi.push([t,v*1e3]);mx=Math.max(mx,vo);mn=Math.min(mn,vo);}
    const lim=Math.max(0.5,Math.min(Math.max(Math.abs(Av*vin),upL,Math.abs(loL))*1.12,Math.max(Math.abs(Av*vin),Math.abs(mx),Math.abs(mn))*1.35));
    draw(cv,{x0:0,x1:2,y0:-lim,y1:lim,xl:'t / T',yl:'v_out [V]',series:[{c:'t5',w:1.3,dash:[4,4],pts:[[0,upL],[2,upL]]},{c:'t5',w:1.3,dash:[4,4],pts:[[0,loL],[2,loL]]},{c:'t3',w:1.8,dash:[6,4],pts:ideal},{c:'t1',w:2.6,pts:act}]});
    draw(cv2,{x0:0,x1:2,y0:-vin*1250,y1:vin*1250,xl:'t / T',yl:'v_in [mV]',series:[{c:'t2',w:2.2,pts:vi}]});
    const Avm=(mx-mn)/(2*vin),asym=(mx+mn)/Math.max(1e-9,mx-mn)*100;let q;
    if(VCEQ<=0.2)q=pill('ברוויה ב-DC','bad');else if(mx>=upL-1e-6||mn<=loL+1e-6)q=pill('קטימה ('+(mn<=loL+1e-6?'רוויה':'קטעון')+')','bad');else if(Math.abs(asym)>6)q=pill('עיוות '+Math.abs(asym).toFixed(0)+'%','warn');else q=pill('ליניארי','ok');
    readouts('r-ce',[['מצב האות',q,'html'],['g<sub>m</sub>',si(gm,'S')],['r<sub>π</sub>',si(rpi,'Ω')],['r<sub>e</sub>',si(re,'Ω')],["R'<sub>L</sub>",si(RLp,'Ω')],['A<sub>v</sub> נוסחה / נמדד',Av.toFixed(1)+' / '+(-Avm).toFixed(1)],['R<sub>in</sub>',si(rpi+(beta+1)*RE,'Ω')],['V<sub>CE,Q</sub>',fx(VCEQ,2)+' V']]);}
  upd();
})();

section(root,{id:'l5-cfg',tag:'תצורות',title:'CE, CC, CB זה לצד זה',short:'CE/CC/CB',
lead:'אותו טרנזיסטור, אותה נקודת עבודה, שלוש תצורות. החישוב לפי המקרים הפרטיים בסיכום (<span class="m">r<sub>o</sub> → ∞</span>).',
body:'<div class="lab"><div class="controls"><div class="sliders" id="cf5-ctl"></div></div><div class="scopes"><div class="tbl" style="margin-top:0"><table id="cf5-tbl"><thead><tr><th></th><th>CE</th><th>CC (עוקב פולט)</th><th>CB</th></tr></thead><tbody></tbody></table></div>'+
'<div class="note"><h3>איך לזכור</h3><ul><li><b>CE</b>: הגבר מתח וזרם גבוהים, הופך.</li><li><b>CC</b>: A<sub>v</sub>≈1, R<sub>in</sub> גבוהה, R<sub>out</sub> נמוכה, הגבר זרם β+1. חוצץ.</li><li><b>CB</b>: הגבר מתח כמו CE בלי היפוך, R<sub>in</sub>=r<sub>e</sub> נמוכה, A<sub>i</sub>=α. תדרים גבוהים וקסקודה.</li></ul></div></div></div>'});
(function(){
  const st=sliders('cf5-ctl',[
    {key:'IC',id:'cf5-ic',label:'I<sub>C</sub>',min:0.1,max:5,step:0.05,value:1,map:v=>v/1000,fmt:v=>si(v,'A')},
    {key:'beta',id:'cf5-beta',label:'β',min:20,max:300,step:5,value:100,fmt:v=>String(v)},
    {key:'RL',id:'cf5-rl',label:"R'<sub>L</sub>",min:0.1,max:20,step:0.1,value:2,map:v=>v*1000,fmt:v=>si(v,'Ω')},
    {key:'RE',id:'cf5-re',label:'R<sub>E</sub> ב-CE',min:0,max:1000,step:10,value:0,fmt:v=>si(v,'Ω')},
    {key:'RB',id:'cf5-rb',label:'R<sub>B</sub> ב-CC',min:0,max:100,step:1,value:10,map:v=>v*1000,fmt:v=>si(v,'Ω')}],upd);
  function upd(){const {IC,beta,RL,RE,RB}=st,a=beta/(beta+1),gm=IC/VT,rpi=beta/gm,re=a/gm;
    const ce={Rin:rpi+(beta+1)*RE,Ro:Infinity,Av:-beta*RL/(rpi+(beta+1)*RE),Ai:-beta},cc={Rin:rpi+(beta+1)*RL,Ro:(RB+rpi)/(beta+1),Av:(beta+1)*RL/(rpi+(beta+1)*RL),Ai:beta+1},cb={Rin:re,Ro:Infinity,Av:gm*RL,Ai:a};
    const row=(k,f)=>'<tr><td>'+k+'</td>'+[ce,cc,cb].map(o=>'<td class="n">'+f(o)+'</td>').join('')+'</tr>';
    document.querySelector('#cf5-tbl tbody').innerHTML=row('R<sub>in</sub>',o=>si(o.Rin,'Ω'))+row('R<sub>out</sub>',o=>isFinite(o.Ro)?si(o.Ro,'Ω'):'∞')+row('A<sub>v</sub>',o=>o.Av.toFixed(o.Av>0&&o.Av<2?3:1))+row('A<sub>i</sub>',o=>o.Ai.toFixed(Math.abs(o.Ai)<2?3:0))+
      '<tr><td>פאזה</td><td>הופך</td><td>לא הופך</td><td>לא הופך</td></tr><tr><td>A<sub>v</sub></td><td class="n">−βR\'<sub>L</sub>/(r<sub>π</sub>+(β+1)R<sub>E</sub>)</td><td class="n">R\'<sub>L</sub>/(R\'<sub>L</sub>+r<sub>e</sub>)</td><td class="n">g<sub>m</sub>R\'<sub>L</sub></td></tr>';}
  upd();
})();
},
quiz:[
{q:'β = 100. מהו α?',o:['0.99','0.9901','1.01','0.999'],a:1,e:'α = β/(β+1) = 100/101 ≈ 0.9901.'},
{q:'בדוגמה מהסיכום (V<sub>BIAS</sub>=0.8V, R<sub>B</sub>=10k, R<sub>C</sub>=15k, V<sub>CC</sub>=20V, β=100). מה V<sub>CE</sub>?',o:['0.2V','5V','15V','20V'],a:1,e:'I<sub>B</sub> = (0.8−0.7)/10k = 10µA, I<sub>C</sub> = 1mA, V<sub>CE</sub> = 20 − 1m·15k = 5V. פעיל קדמי.'},

{q:'בממתח רוויה, מצב הצמתים הוא:',o:['BE אחורי, BC אחורי','BE קדמי, BC אחורי','BE קדמי, BC קדמי','BE אחורי, BC קדמי'],a:2,e:'ברוויה שני הצמתים בממתח קדמי. בפעיל קדמי רק BE קדמי.'},
{q:'איזו תצורה נקראת "עוקב פולט" ומשמשת חוצץ?',o:['CE','CB','CC','קסקודה'],a:2,e:'בקולט משותף (CC) המוצא נלקח מהפולט ועוקב אחרי הבסיס: A<sub>v</sub> ≈ 1, R<sub>in</sub> גבוהה, R<sub>out</sub> נמוכה.'},
{q:'מה קורה להגבר CE כשמוסיפים R<sub>E</sub> לא מעוקף?',o:['גדל','קטן ומתקרב ל-−R\'<sub>L</sub>/R<sub>E</sub>, והמגבר ליניארי יותר','לא משתנה','הופך סימן'],a:1,e:'A<sub>v</sub> = −βR\'<sub>L</sub>/(r<sub>π</sub>+(β+1)R<sub>E</sub>) ≈ −R\'<sub>L</sub>/R<sub>E</sub> כש-(β+1)R<sub>E</sub> ≫ r<sub>π</sub>. זה משוב שלילי מקומי.'}
],
formulas:[

['פעיל קדמי','I<sub>C</sub> = βI<sub>B</sub> = αI<sub>E</sub>'],['α ו-β','α = β/(β+1) · β = α/(1−α)'],
['רוויה','V<sub>CE,sat</sub> ≈ 0.2V · I<sub>C,sat</sub> = (V<sub>CC</sub>−V<sub>CE,sat</sub>)/R<sub>C</sub> &lt; βI<sub>B</sub>'],

['מודל T','r<sub>e</sub> = α/g<sub>m</sub> = V<sub>T</sub>/I<sub>E</sub>'],['Early','r<sub>o</sub> = V<sub>A</sub>/I<sub>C</sub>'],
['CE','A<sub>v</sub> = −βR\'<sub>L</sub>/(r<sub>π</sub>+(β+1)R<sub>E</sub>) · R<sub>in</sub> = r<sub>π</sub>+(β+1)R<sub>E</sub> · A<sub>i</sub> = −β'],
['CC','A<sub>v</sub> = R\'<sub>L</sub>/(R\'<sub>L</sub>+r<sub>e</sub>) · R<sub>in</sub> = (β+1)(r<sub>e</sub>+R\'<sub>L</sub>) · R<sub>o</sub> = (R<sub>B</sub>+r<sub>π</sub>)/(β+1)'],

]};
